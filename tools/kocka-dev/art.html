<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kočka – art sheet (dev)</title>
<style>
body{margin:0;padding:16px;font:14px system-ui,sans-serif;background:#ddd;color:#222}
h2{margin:24px 0 8px;font-size:18px}
.grid{display:grid;gap:8px}
.cell{border-radius:10px;padding:4px;text-align:center;font-size:12px}
.cell .box{aspect-ratio:1;position:relative}
.paper{background:#f4ebdf;color:#2b1a0e}
.cottage{background:#3b2a1e;color:#fff3e3}
.room{aspect-ratio:2/3;position:relative;border-radius:10px;overflow:hidden}
.room .cat{position:absolute;left:15%;bottom:6%;width:70%;aspect-ratio:1}
.reg path{fill-opacity:.35;stroke:#000;stroke-width:.6}
.still *{animation-play-state:paused!important}
.frame .kx-drops path{animation-delay:-.6s!important;animation-play-state:paused!important}
.frame2 .kx-achoo{animation-delay:-.22s!important;animation-play-state:paused!important}
</style>
</head>
<body>
<p>Dev sheet for <code>src/art.js</code>. Add <code>?still</code> to pause the animations.</p>
<div id="out"></div>
<script src="src/art.js"></script>
<script>
const A = KockaArt();
document.head.appendChild(Object.assign(document.createElement('style'), { textContent: A.css }));
if (/still/.test(location.search)) document.body.classList.add('still');
const MOODS = ['happy', 'calm', 'grumpy', 'sad'];
const out = document.getElementById('out');
const cell = (svg, label, cls = 'paper') => `<div class="cell ${cls}"><div class="box">${svg}</div>${label}</div>`;
let h = '';
const COL = { nose: '#f0f', ears: '#e33', chin: '#f90', paws: '#3a3', head: '#36f', tail: '#a3f', tailBase: '#fd0', belly: '#f3c', back: '#0cc' };
const regOv = (rg, only, pts = []) => `<svg viewBox="0 0 200 200" class="reg" style="position:absolute;inset:0;overflow:visible">${rg.slice().reverse().filter(r => !only || only.includes(r.id)).map(r => `<path d="${r.path}" fill="${COL[r.id]}"/>`).join('')}${pts.filter(Boolean).map(([x, y, c]) => `<circle cx="${x}" cy="${y}" r="3.5" fill="${c}" stroke="#fff" stroke-width="1"/>`).join('')}</svg>`;
// Škádlení (SPEC §13.2): the new poses and options; "Přehrát" draws the sheet again, so the one-time animations replay
const centroid = d => { const n = (d.match(/-?\d*\.?\d+/g) || []).map(Number); let x = 0, y = 0, k = 0; for (let i = 0; i + 1 < n.length; i += 2) { x += n[i]; y += n[i + 1]; k++; } return [x / k, y / k]; };
const tbC = (p, o) => { const r = A.regions(p, o).find(g => g.id === 'tailBase'); return r ? centroid(r.path) : null; };
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]).toFixed(1);
function teasing() {
  const big = (svg, label, cls = 'paper') => `<div class="cell ${cls}" style="width:200px"><div class="box">${svg}</div>${label}</div>`;
  const hp = (p, o) => { const q = A.headPoint(p, o); return q ? [[q.x, q.y, '#36f'], q.nose && [q.nose.x, q.nose.y, '#f0f']] : []; };
  const tR = tbC('rearUp', 'happy'), tL = tbC('loaf', 'calm'), tS = tbC('sit', 'calm');
  let s = '<h2 id="teasing">Škádlení <button id="replay">Přehrát</button> <button id="flick">kx-flick on the sleepers</button></h2>';
  s += `<p>tailBase centroid: rearUp (${tR.map(v => v.toFixed(1))}) – loaf (${tL.map(v => v.toFixed(1))}) = <b>${dist(tR, tL)}</b> (must be ≤ 15), – sit (${tS.map(v => v.toFixed(1))}) = ${dist(tR, tS)}. Blue dot = headPoint, magenta = its nose.</p>`;
  s += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
  s += big(A.cat('rearUp', { mood: 'happy', purring: true }), 'rearUp happy purring') + big(A.cat('rearUp', 'happy') + regOv(A.regions('rearUp', 'happy'), null, [[...tR, '#000'], [...tL, '#f00']]), 'rearUp regions (black: its tailBase, red: loaf’s)');
  s += big(A.cat('shake', 'grumpy'), 'shake dry') + big(A.cat('shake', { mood: 'grumpy', wet: true }), 'shake wet') + big(`<div class="frame">${A.cat('shake', { mood: 'grumpy', wet: true })}</div>`, 'shake wet, a frame of the drops', 'cottage');
  s += big(A.cat('belly', { mood: 'happy', grab: true }), 'belly grab') + big(A.cat('lapBelly', { mood: 'happy', grab: true }), 'lapBelly grab') + big(A.cat('belly', { mood: 'happy', grab: true }) + regOv(A.regions('belly', { grab: true })), 'belly grab regions');
  s += big(A.cat('sit', { mood: 'calm', eyes: 'cross' }), 'sit cross') + big(A.cat('sit', { mood: 'calm', achoo: true }), 'sit achoo') + big(`<div class="frame2">${A.cat('sit', { mood: 'calm', achoo: true })}</div>`, 'sit achoo, mid frame') + big(A.cat('sit', { mood: 'calm', shakeHead: true }), 'sit shakeHead');
  s += big(A.cat('sit', { mood: 'grumpy', warn: true }), 'sit grumpy warn') + big(A.cat('loaf', { mood: 'calm', warn: true }), 'loaf warn') + '</div>';
  s += '<h2>Eyes cross / squint (sit, loaf, lapLoaf), achoo, shakeHead, warn</h2><div class="grid" style="grid-template-columns:repeat(8,1fr)">';
  for (const p of ['sit', 'loaf', 'lapLoaf']) for (const e of ['cross', 'squint']) s += cell(A.cat(p, { mood: 'calm', eyes: e }), `${p} ${e}`);
  s += cell(A.cat('sit', { mood: 'happy', eyes: 'squint', ears: 'back' }), 'sit squint ears back (tolerate)') + cell(A.cat('walk', { mood: 'calm', eyes: 'cross' }), 'walk cross');
  for (const p of ['sit', 'loaf', 'lapLoaf', 'sideLie']) s += cell(A.cat(p, { mood: 'calm', achoo: true }), `${p} achoo`);
  for (const p of ['sit', 'loaf', 'lapLoaf', 'rub']) s += cell(A.cat(p, { mood: 'calm', shakeHead: true }), `${p} shakeHead`);
  for (const p of ['sit', 'loaf', 'lapLoaf', 'walk', 'stalk', 'sideLie', 'sulk', 'inBox']) s += cell(A.cat(p, { mood: p === 'sit' ? 'grumpy' : 'calm', warn: true }), `${p} warn`);
  s += cell(A.cat('sit', { mood: 'calm', ill: 'cold' }), 'sit cold (h.sneeze loop)') + cell(A.cat('sit', { mood: 'calm', ill: 'cold', achoo: true }), 'cold + achoo') + cell(A.cat('sulk', { mood: 'grumpy', eyes: 'cross' }), 'sulk cross (ignored)') + cell(`<div class="flk">${A.cat('sleep', 'calm')}</div>`, 'sleep (kx-flick)') + cell(`<div class="flk">${A.cat('lapCurl', 'calm')}</div>`, 'lapCurl (kx-flick)');
  s += '</div><h2>Neighbours and kittens: rearUp, shake wet, belly grab, cross, warn</h2><div class="grid" style="grid-template-columns:repeat(10,1fr)">';
  for (const [id, o, bg] of [['liza', {}, 'cottage'], ['bivoj', {}, 'paper'], ['k1', { coat: 'mourek', kit: 1 }, 'paper'], ['k1', { coat: 'ciperka', kit: 1 }, 'cottage']]) {
    const nm = o.kit ? `kitten (${o.coat})` : A.neighbours[id].name, O = x => Object.assign({}, o, x);
    s += cell(A.neighbour(id, 'rearUp', O({ mood: 'happy' })), nm + ' rearUp', bg) + cell(A.neighbour(id, 'shake', O({ mood: 'grumpy', wet: true })), nm + ' shake wet', bg) + cell(A.neighbour(id, 'belly', O({ mood: 'happy', grab: true })), nm + ' grab', bg) +
      cell(A.neighbour(id, 'sit', O({ mood: 'calm', eyes: 'cross' })), nm + ' cross', bg) + cell(A.neighbour(id, 'sit', O({ mood: 'grumpy', warn: true })), nm + ' warn', bg);
  }
  s += '</div><h2>The nose region (magenta, only the nose; dots = headPoint)</h2><div class="grid" style="grid-template-columns:repeat(8,1fr)">';
  for (const [l, p, o, who] of [['sit', 'sit', 'calm'], ['loaf', 'loaf', 'calm'], ['lapLoaf', 'lapLoaf', 'calm'], ['rearUp', 'rearUp', 'happy'], ['shake', 'shake', 'calm'], ['Líza sit', 'sit', 'calm', 'liza'], ['kitten sit', 'sit', { kit: 1, mood: 'calm' }, 'k1'], ['kitten loaf', 'loaf', { kit: 1, mood: 'calm' }, 'k1']]) {
    const svg = who ? A.neighbour(who, p, Object.assign(typeof o === 'object' ? o : { mood: o }, who === 'k1' ? { coat: 'mourek' } : {})) : A.cat(p, o);
    s += cell(svg + regOv(A.regions(p, o), ['nose'], hp(p, o)), l, who === 'liza' ? 'cottage' : 'paper');
  }
  s += '</div><h2>FX splash, puff; item mug (itemSize ' + A.itemSize.mug.w + ')</h2><div class="grid" style="grid-template-columns:repeat(8,1fr)">';
  for (const f of ['splash', 'puff']) s += cell(`<div style="width:60%;margin:20% auto">${A.fx(f)}</div>`, f) + cell(`<div style="width:60%;margin:20% auto">${A.fx(f)}</div>`, f, 'cottage');
  s += cell(A.item('mug'), 'mug') + cell(A.item('mug'), 'mug', 'cottage') + cell(`<div style="transform:rotate(-70deg)">${A.item('mug')}</div>`, 'mug falling (turned by the UI)') + cell(A.itemHeld('mug'), 'mug held');
  // the mug next to her on the kitchen counter, at its natural size (cat 212 room units)
  const ct = A.rooms.kitchen.spots.counter, KCm = 212 / 200, mw = A.itemSize.mug.w;
  s += `</div><h2>Payback scene: Koxa sitting on the counter with the mug, the sneeze puff on her nose</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><div style="width:300px"><div class="room">${A.room({ id: 'kitchen', phase: 'day', season: 'summer' })}` +
    `<div style="position:absolute;left:${(ct.x - 100 * KCm) / 4}%;top:${(ct.y - 186 * KCm) / 6}%;width:${212 / 4}%;aspect-ratio:1">${A.cat('sit', 'calm')}</div><div style="position:absolute;left:${(ct.x - 70 - mw / 2) / 4}%;top:${(ct.y - 0.9 * mw) / 6}%;width:${mw / 4}%;aspect-ratio:1">${A.item('mug')}</div></div>kitchen counter</div>`;
  const q = A.headPoint('sit', { achoo: true });
  s += `<div class="cell paper" style="width:250px;position:relative"><div class="box">${A.cat('sit', { mood: 'calm', achoo: true })}<div style="position:absolute;left:${(q.nose.x - 46) / 2}%;top:${(q.nose.y - 2) / 2}%;width:16%;aspect-ratio:1">${A.fx('puff')}</div><div style="position:absolute;left:${(q.x + 20) / 2}%;top:${(q.y - 70) / 2}%;width:22%;aspect-ratio:1">${A.fx('splash')}</div></div>puff at headPoint.nose, splash near the head</div></div>`;
  return s;
}
// every pose × mood, on paper and on the dark cottage page
for (const bg of ['paper', 'cottage']) {
  h += `<h2>Poses × moods on ${bg}</h2><div class="grid" style="grid-template-columns:repeat(10,1fr)">`;
  for (const m of MOODS) for (const p of A.poses) h += cell(A.cat(p, { mood: m }), `${p} ${m}`, bg);
  h += '</div>';
}
h += '<h2>Variants</h2><div class="grid" style="grid-template-columns:repeat(8,1fr)">';
const V = [['sit', { thin: true }, 'thin'], ['sit', { chubby: true }, 'chubby'], ['sit', { ill: 'fleas' }, 'fleas'], ['sit', { ill: 'tummy', mood: 'sad' }, 'tummy'], ['sit', { ill: 'cold' }, 'cold'],
  ['sit', { ears: 'turned' }, 'ears turned'], ['sit', { ears: 'back', mood: 'happy' }, 'ears back'], ['sit', { meow: true }, 'meow'], ['loaf', { asleep: true }, 'loaf asleep'], ['loaf', { thin: true }, 'loaf thin'],
  ['loaf', { chubby: true }, 'loaf chubby'], ['sleep', { ill: 'fleas' }, 'sleep fleas'], ['belly', { mood: 'happy', purring: true }, 'belly purring'], ['carried', { thin: true }, 'carried thin'], ['eat', { chubby: true }, 'eat chubby'], ['loaf', { ill: 'cold', mood: 'sad' }, 'loaf cold']];
for (const [p, o, l] of V) h += cell(A.cat(p, o), l);
h += '</div>';
// regions
h += '<h2>Regions (hit-test order; arrow = fur direction)</h2><div class="grid" style="grid-template-columns:repeat(10,1fr)">';
for (const p of A.poses) {
  const rg = A.regions(p);
  const ov = `<svg viewBox="0 0 200 200" class="reg" style="position:absolute;inset:0;overflow:visible">${rg.slice().reverse().map(r => `<path d="${r.path}" fill="${COL[r.id]}"/>`).join('')}${rg.map((r, i) => { const x = 14 + i * 26, y = 12; return `<g><text x="${x}" y="${y - 2}" font-size="7" text-anchor="middle">${r.id}</text><path d="M${x - r.fur[0] * 9} ${y + 10 - r.fur[1] * 9}L${x + r.fur[0] * 9} ${y + 10 + r.fur[1] * 9}" stroke="${COL[r.id]}" stroke-width="2.5" marker-end="url(#ah)"/></g>`; }).join('')}<defs><marker id="ah" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L6 3L0 6Z"/></marker></defs></svg>`;
  h += `<div class="cell paper"><div class="box">${A.cat(p, 'calm')}${ov}</div>${p}</div>`;
}
h += '</div>';
// rooms
// gait and outdoor poses (animated unless ?still); the slider sets --kx-step
h += '<h2>Gait (animated): walk, trot, the four walk frames, crouch → jumpUp → jumpDown</h2><label>--kx-step <input id="step" type="range" min="0.3" max="1.4" step="0.05" value="0.8"> <span id="stepv">0.8 s</span></label><div class="grid" id="gait" style="grid-template-columns:repeat(9,1fr)">';
for (const p of ['walk', 'trot', 'walk1', 'walk2', 'walk3', 'walk4', 'crouch', 'jumpUp', 'jumpDown']) h += cell(A.cat(p, 'calm'), p);
h += '</div><h2>Outdoor poses and the wet coat</h2><div class="grid" style="grid-template-columns:repeat(8,1fr)">';
for (const [p, o, l] of [['climb', 'calm', 'climb'], ['onBranch', 'happy', 'onBranch'], ['stalk', 'calm', 'stalk'], ['shakePaw', 'grumpy', 'shakePaw (snow)'], ['shakePaw', { mood: 'grumpy', wet: true }, 'shakePaw wet'], ['sit', { mood: 'grumpy', wet: true }, 'sit wet'], ['walk', { mood: 'sad', wet: true }, 'walk wet'], ['loaf', { mood: 'grumpy', wet: true }, 'loaf wet']])
  h += cell(A.cat(p, o), l) ;
h += '</div>';
// the four places × day phases, the garden by season and weather
const placeCell = (o, l) => `<div><div class="room">${A.room(o)}</div>${l}</div>`;
h += '<h2>Places × day phases (Obývák, Kuchyně, Předsíň, Zahrada)</h2><div class="grid" style="grid-template-columns:repeat(4,1fr)">';
for (const id of Object.keys(A.rooms)) for (const ph of ['morning', 'day', 'evening', 'night']) h += placeCell({ id, phase: ph, season: 'autumn', sunX: 0.6 }, `${A.rooms[id].name} – ${ph}`);
h += '</div><h2>Zahrada: seasons, weather, summer night, holidays</h2><div class="grid" style="grid-template-columns:repeat(4,1fr)">';
for (const [o, l] of [[{ season: 'spring', phase: 'morning', sunX: 0.1 }, 'spring morning'], [{ season: 'summer', phase: 'day', sunX: 0.5 }, 'summer day'], [{ season: 'autumn', phase: 'day', weather: 'rain' }, 'autumn rain'], [{ season: 'winter', phase: 'day', weather: 'snow' }, 'winter snow'],
  [{ season: 'summer', phase: 'night' }, 'summer night (fireflies)'], [{ season: 'winter', phase: 'evening' }, 'winter evening'], [{ id: 'hall', season: 'winter', phase: 'day', flap: true, holiday: 'vanoce', weather: 'snow' }, 'Předsíň: flap, Vánoce, snow'], [{ id: 'kitchen', season: 'spring', phase: 'day', weather: 'rain' }, 'Kuchyně: rain']])
  h += placeCell(Object.assign({ id: 'garden' }, o), l);
h += '</div>';
// spots of every place with their names
h += '<h2>Spots of the places (red dots)</h2><div class="grid" style="grid-template-columns:repeat(4,1fr)">';
for (const id of Object.keys(A.rooms)) h += `<div><div class="room">${A.room({ id, phase: 'day', season: 'summer' })}<svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%">${Object.entries(A.rooms[id].spots).map(([k, p]) => `<circle cx="${p.x}" cy="${p.y}" r="5" fill="red"/><text x="${p.x + 7}" y="${p.y - 4}" font-size="13" fill="#000" stroke="#fff" stroke-width="3" paint-order="stroke">${k}</text>`).join('')}</svg></div>${A.rooms[id].name}</div>`;
h += '</div>';
// lap close-ups
const onLap = (o, pose, mo) => { const L = A.lapSpot, k = L.size / 200; return `<div><div class="room">${A.lap(o)}<div style="position:absolute;left:${(L.x - 100 * k) / 4}%;top:${(L.y - 186 * k) / 6}%;width:${L.size / 4}%;aspect-ratio:1">${A.cat(pose, mo)}</div></div>${pose} ${JSON.stringify(o)}</div>`; };
h += '<h2>Lap: armchair and bench (lapSpot)</h2><div class="grid" style="grid-template-columns:repeat(4,1fr)">' +
  onLap({ phase: 'evening', season: 'autumn' }, 'lapLoaf', { mood: 'happy', purring: true }) + onLap({ phase: 'night', season: 'winter' }, 'lapCurl', 'calm') + onLap({ phase: 'day', season: 'summer', place: 'bench' }, 'lapBelly', 'happy') + onLap({ phase: 'morning', season: 'winter', place: 'bench' }, 'lapLoaf', 'calm') + '</div>';
h += '<h2>Lap regions</h2><div class="grid" style="grid-template-columns:repeat(6,1fr)">';
for (const p of ['lapLoaf', 'lapCurl', 'lapBelly']) { const rg = A.regions(p); h += cell(A.cat(p, 'calm') + `<svg viewBox="0 0 200 200" class="reg" style="position:absolute;inset:0;overflow:visible">${rg.slice().reverse().map(r => `<path d="${r.path}" fill="${COL[r.id]}"/>`).join('')}</svg>`, p); }
h += '</div><h2>Crops (stage 0–3)</h2><div class="grid" style="grid-template-columns:repeat(12,1fr)">';
for (const n of A.crops) for (let i = 0; i < 4; i++) h += cell(A.crop(n, i), `${n} ${i}`);
h += '</div>';
// Phase 3 and 5: tricks, minigames, shop, neighbours, album
h += '<h2>Tricks and the box</h2><div class="grid" style="grid-template-columns:repeat(6,1fr)">';
for (const [p, m] of [['trickSit', 'calm'], ['trickPaw', 'happy'], ['trickSpin', 'happy'], ['trickBeg', 'calm'], ['inBox', 'happy'], ['inBox', 'grumpy']]) h += cell(A.cat(p, m), p + ' ' + m);
h += '</div><h2>Minigames: mouse hole, peeking mouse (phase 0 … 1), fish, rods, checkpoints</h2><div class="grid" style="grid-template-columns:repeat(10,1fr)">';
h += cell(A.mouseHole(), 'mouseHole') + [0.25, 0.5, 0.75, 1].map(t => cell(A.mousePeek(t), 'mousePeek ' + t)).join('') + A.fishes.map(k => cell(A.fish(k), k)).join('') + cell(A.marker(false), 'marker') +
  cell(A.marker(true), 'marker done') + ['fishingRod', 'featherWand', 'featherBunch'].map(k => cell(A.item(k) + `<svg viewBox="0 0 100 100" style="position:absolute;inset:0">${Object.values(A.itemPoints[k] || {}).filter(p => p.x != null).map(p => `<circle cx="${p.x}" cy="${p.y}" r="3" fill="red"/>`).join('')}</svg>`, k)).join('');
h += '</div><h2>Shop items (with itemSize in room units; cat tree platforms in red)</h2><div class="grid" style="grid-template-columns:repeat(8,1fr)">';
for (const k of ['pouchPack', 'chickenPack', 'tunaPack', 'treatBag', 'ballBell', 'box', 'tunnel', 'scratcher', 'catTree', 'sillCushion', 'bedDeluxe', 'rugRound', 'lamp', 'birdFeeder', 'catFlap'])
  h += cell(A.item(k) + (k === 'catTree' ? `<svg viewBox="0 0 100 100" style="position:absolute;inset:0">${A.itemPoints.catTree.platforms.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3" fill="red"/>`).join('')}</svg>` : ''), `${k} ${A.itemSize[k].w}`);
h += '</div><h2>Furniture at its natural size in the living room</h2><div style="width:320px"><div class="room">' + A.room({ id: 'living', phase: 'day', season: 'summer' }) +
  [['catTree', 70, 470], ['scratcher', 190, 470], ['box', 260, 560], ['rugRound', 150, 590], ['lamp', 30, 410], ['sillCushion', 130, 268]].map(([k, x, y]) => { const w = A.itemSize[k].w; return `<div style="position:absolute;left:${(x - w / 2) / 4}%;top:${(y - 0.9 * w) / 6}%;width:${w / 4}%;aspect-ratio:1">${A.item(k)}</div>`; }).join('') + '</div></div>';
h += '<h2>Obchůdek (shop) and the album frames</h2><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start"><div style="width:260px"><div class="room">' + A.shop() + '</div></div>' +
  `<div style="width:300px;position:relative"><div style="position:absolute;left:${A.postcardHole.x / 3}%;top:${A.postcardHole.y / 2}%;width:${A.postcardHole.w / 3}%;height:${A.postcardHole.h / 2}%;background:linear-gradient(#9fc6dc,#79ad5e)"></div>${A.postcardFrame('Byla jsem u zámku v Náchodě')}</div>` +
  `<div style="width:160px;position:relative"><div style="position:absolute;left:${A.photoHole.x / 2}%;top:${A.photoHole.y / 2.36}%;width:${A.photoHole.w / 2}%;height:${A.photoHole.h / 2.36}%;background:#3b2a1e">${A.cat('sit', 'happy')}</div>${A.photoFrame()}</div></div>`;
h += '<h2>Neighbour cats: sit, walk, loaf, onFence</h2><div class="grid" style="grid-template-columns:repeat(8,1fr)">';
for (const id of Object.keys(A.neighbours)) for (const [p, bg] of [['sit', 'paper'], ['walk', 'cottage'], ['loaf', 'paper'], ['onFence', 'cottage']]) h += cell(A.neighbour(id, p, 'calm'), `${A.neighbours[id].name} ${p}`, bg);
h += '</div>';
// two cats together: scenes on the garden lawn (1 art unit = 1 room unit; the box shows room x 10…390, y 280…520),
// each cat [who ('koxa' or a neighbour id), pose, opts, anchor x in room units, flip]; the left cat is flipped to face right
const scene = (title, cats) => {
  const W = 380, H = 240, X0 = 10, Y0 = 280, GY = 500;
  const bg = `<div style="position:absolute;left:${-X0 / W * 100}%;top:${-Y0 / H * 100}%;width:${400 / W * 100}%;height:${600 / H * 100}%">${A.room({ id: 'garden', phase: 'day', season: 'summer' })}</div>`;
  const fig = cats.map(([who, pose, o, x, flip]) => {
    const [ax, ay] = A.anchors[pose] || [100, 186], svg = who === 'koxa' ? A.cat(pose, o) : A.neighbour(who, pose, o);
    return `<div style="position:absolute;left:${(x - X0 - ax) / W * 100}%;top:${(GY - Y0 - ay) / H * 100}%;width:${200 / W * 100}%;aspect-ratio:1"><div style="width:100%;height:100%${flip ? ';transform:scaleX(-1)' : ''}">${svg}</div></div>`;
  }).join('');
  return `<div><div style="position:relative;aspect-ratio:${W}/${H};overflow:hidden;border-radius:10px">${bg}${fig}</div>${title}</div>`;
};
// d = the horizontal distance between the two anchors (art units), as recommended to the UI
const PAIR = { sniff: 172, arch: 190, lickSit: 100, lickLoaf: 80, sideLie: 152, swipe: 116, chase: 184, rubSit: 104 };
const two = (title, d, l, r) => scene(`${title} (d ${d})`, [['mourek', l[0], l[1], 200 - d / 2, true], ['koxa', r[0], r[1], 200 + d / 2, false]]);
h += '<h2>Pózy pro dva (Koxa right, Mourek left and flipped; d = distance of the anchors)</h2><div class="grid" style="grid-template-columns:repeat(3,1fr)">' +
  two('sniff ↔ sniff', PAIR.sniff, ['sniff', 'happy'], ['sniff', 'calm']) +
  two('arch ↔ arch', PAIR.arch, ['arch', { mood: 'grumpy', openMouth: true }], ['arch', 'grumpy']) +
  two('lickOther → sit', PAIR.lickSit, ['sit', 'happy'], ['lickOther', 'happy']) +
  two('lickOther → loaf', PAIR.lickLoaf, ['loaf', { mood: 'happy', purring: true }], ['lickOther', 'calm']) +
  two('sideLie + sideLie (asleep)', PAIR.sideLie, ['sideLie', { mood: 'calm', asleep: true }], ['sideLie', { mood: 'happy', asleep: true }]) +
  two('swipe ↔ belly', PAIR.swipe, ['belly', 'happy'], ['swipe', 'happy']) +
  scene(`run → run (chase, d ${PAIR.chase})`, [['koxa', 'run', 'happy', 200 - PAIR.chase / 2, false], ['mourek', 'run', 'calm', 200 + PAIR.chase / 2, false]]) +
  two('swipe ↔ swipe', 150, ['swipe', 'happy'], ['swipe', { mood: 'happy', openMouth: true }]) +
  two('arch → sulk', 170, ['sulk', 'grumpy'], ['arch', { mood: 'grumpy', openMouth: true }]) +
  two('rub → sit', PAIR.rubSit, ['sit', 'calm'], ['rub', 'happy']) +
  scene(`rub → sit from the left (Koxa flipped, d ${PAIR.rubSit})`, [['liza', 'sit', 'happy', 200 + PAIR.rubSit / 2, false], ['koxa', 'rub', 'calm', 200 - PAIR.rubSit / 2, true]]) +
  scene(`rub → Bivoj sit (jealous, d ${PAIR.rubSit})`, [['bivoj', 'sit', 'happy', 200 - PAIR.rubSit / 2, true], ['koxa', 'rub', 'grumpy', 200 + PAIR.rubSit / 2, false]]) + '</div>';
const NEWP = ['sniff', 'arch', 'lickOther', 'sideLie', 'swipe', 'run', 'rub', 'belly', 'pounce', 'climb', 'onBranch', 'drink'];
h += `<h2>Neighbours in the new poses (and belly, pounce, climb, onBranch, drink noProp)</h2><div class="grid" style="grid-template-columns:repeat(${NEWP.length},1fr)">`;
for (const id of Object.keys(A.neighbours)) for (const p of NEWP) h += cell(A.neighbour(id, p, { mood: 'calm', noProp: true, openMouth: p === 'arch' }), `${A.neighbours[id].name} ${p}`, p === 'arch' || p === 'run' ? 'cottage' : 'paper');
h += '</div><h2>rub × moods: Koxa, Mourek, Líza, Bivoj (phone size, 150 px)</h2><div style="display:flex;gap:6px;flex-wrap:wrap">';
for (const who of ['koxa', 'mourek', 'liza', 'bivoj']) for (const m of MOODS) h += `<div class="cell ${who === 'liza' ? 'cottage' : 'paper'}" style="width:150px"><div class="box">${who === 'koxa' ? A.cat('rub', m) : A.neighbour(who, 'rub', m)}</div>${who} ${m}</div>`;
h += '</div><h2>Neighbours on the garden fence</h2><div style="width:320px"><div class="room">' + A.room({ id: 'garden', phase: 'day', season: 'summer' }) +
  [['mourek', 60], ['liza', 160], ['bivoj', 360]].map(([id, x]) => { const f = A.rooms.garden.spots.fence, w = 110; return `<div style="position:absolute;left:${(x - w / 2) / 4}%;top:${(f.y - 186 / 200 * w) / 6}%;width:${w / 4}%;aspect-ratio:1">${A.neighbour(id, 'onFence', 'calm')}</div>`; }).join('') + '</div></div>';
// Koťata: neighbour('k1', pose, { coat, kit }); kit 1 ≈ 5–6 weeks, drawn A.kitScale(kit) big round the feet (100, 186)
const KITP = ['sit', 'walk', 'loaf', 'sleep', 'pounce', 'tumble', 'tailCatch'];
h += `<h2>Koťata: every coat as a kitten (kit 1; kitScale ${A.kitScale(1)})</h2><div class="grid" style="grid-template-columns:repeat(${KITP.length},1fr)">`;
for (const id of Object.keys(A.neighbours)) for (const p of KITP) h += cell(A.neighbour('k1', p, { coat: id, kit: 1, mood: p === 'tumble' || p === 'tailCatch' ? 'happy' : 'calm' }), `${A.neighbours[id].name} ${p}`, id === 'liza' || id === 'fousek' || id === 'ciperka' ? 'cottage' : 'paper');
h += '</div>';
const KITALL = ['sit', 'walk', 'trot', 'run', 'loaf', 'sleep', 'sideLie', 'belly', 'pounce', 'stalk', 'crouch', 'eat', 'climb', 'onBranch', 'drink', 'swipe', 'sniff', 'groom', 'arch', 'rub', 'tumble', 'tailCatch'];
h += `<h2>Kitten in every pose (Čiperka's coat, kit 1, noProp) with its regions</h2><div class="grid" style="grid-template-columns:repeat(11,1fr)">`;
for (const p of KITALL) {
  const o = { kit: 1, mood: 'happy', noProp: true }, rg = A.regions(p, o), m = A.mouth(p, o);
  h += cell(A.neighbour('k1', p, Object.assign({ coat: 'ciperka' }, o)), p) + cell(A.neighbour('k1', p, Object.assign({ coat: 'ciperka' }, o)) + `<svg viewBox="0 0 200 200" class="reg" style="position:absolute;inset:0;overflow:visible">${rg.slice().reverse().map(r => `<path d="${r.path}" fill="${COL[r.id]}"/>`).join('')}${m ? `<circle cx="${m.x}" cy="${m.y}" r="3" fill="red"/>` : ''}</svg>`, p + ' regions');
}
h += '</div><h2>Growing up: kit 1 → 0.66 → 0.35 → 0 (Mourek and Líza)</h2><div class="grid" style="grid-template-columns:repeat(8,1fr)">';
for (const [id, p] of [['mourek', 'sit'], ['liza', 'sit'], ['mourek', 'walk'], ['liza', 'loaf']]) for (const k of [1, 0.66, 0.35, 0]) h += cell(A.neighbour('k1', p, { coat: id, kit: k, mood: 'calm' }), `${A.neighbours[id].name} ${p} kit ${k}`, id === 'liza' ? 'cottage' : 'paper');
h += '</div>';
// recommended offsets (art units = room units at the game's 200-unit cat box; + = to the right):
// KIDS.catchSit: a kit-1 kitten in tailCatch (not flipped) right of a sitting happy Koxa, its paws in her raised tail;
// KIDS.pounceLoaf: a kit-1 kitten in pounce (not flipped) right of a loafing Koxa, its front paws on her tail root;
// KIDS.beside: a kit-1 kitten sitting beside its sitting mother (either side, drawn in front of her)
const KIDS = { catchSit: 96, beside: 64, pounceLoaf: 100 };
h += '<h2>Koťata on the lawn: Líza with three kittens, Koxa with a kitten catching her tail</h2><div class="grid" style="grid-template-columns:repeat(2,1fr)">' +
  scene(`Líza + kittens (beside ±${KIDS.beside}), a tumble and a pounce`, [['liza', 'sit', 'happy', 120, true], ['k2', 'tumble', { coat: 'liza', kit: 1, mood: 'happy' }, 236, false], ['k3', 'pounce', { coat: 'mourek', kit: 1, mood: 'happy' }, 330, true],
    ['k1', 'sit', { coat: 'ciperka', kit: 1, mood: 'happy' }, 120 + KIDS.beside, true], ['k4', 'sit', { coat: 'liza', kit: 1, mood: 'calm' }, 120 - KIDS.beside, false]]) +
  scene(`Koxa sit happy + kitten tailCatch (dx ${KIDS.catchSit})`, [['koxa', 'sit', 'happy', 140, false], ['k1', 'tailCatch', { coat: 'mourek', kit: 1, mood: 'happy' }, 140 + KIDS.catchSit, false], ['k2', 'loaf', { coat: 'liza', kit: 1, mood: 'calm' }, 50, true]]) +
  scene(`Koxa loaf + kitten pounce at her tail root (dx ${KIDS.pounceLoaf})`, [['koxa', 'loaf', 'calm', 150, false], ['k1', 'pounce', { coat: 'pacicka', kit: 1, mood: 'happy' }, 150 + KIDS.pounceLoaf, false]]) +
  scene(`Koxa sit grumpy + kitten tailCatch (dx ${KIDS.catchSit})`, [['koxa', 'sit', 'grumpy', 150, false], ['k1', 'tailCatch', { coat: 'bivoj', kit: 1, mood: 'happy' }, 150 + KIDS.catchSit, false]]) +
  scene('kit 0.35 young cats with Koxa', [['koxa', 'sit', 'calm', 120, false], ['k1', 'sit', { coat: 'bivoj', kit: 0.35, mood: 'happy' }, 220, true], ['k2', 'walk', { coat: 'pacicka', kit: 0.66, mood: 'calm' }, 320, false]]) +
  scene('kittens sleeping and playing', [['k1', 'sleep', { coat: 'rambo', kit: 1 }, 90, false], ['k2', 'sideLie', { coat: 'sedivka', kit: 1, asleep: true }, 170, false], ['k3', 'swipe', { coat: 'fousek', kit: 1, mood: 'happy' }, 250, true], ['k4', 'belly', { coat: 'mourek', kit: 1, mood: 'happy' }, 330, false]]) + '</div>';
h += '<h2>Kittens big (phone size, 250 px)</h2><div style="display:flex;gap:8px;flex-wrap:wrap">';
for (const [id, p, bg] of [['mourek', 'sit', 'paper'], ['liza', 'tailCatch', 'cottage'], ['ciperka', 'tumble', 'paper'], ['pacicka', 'walk', 'paper'], ['rambo', 'loaf', 'paper'], ['fousek', 'pounce', 'cottage']])
  h += `<div class="cell ${bg}" style="width:250px">${A.neighbour('k1', p, { coat: id, kit: 1, mood: 'happy' })}</div>`;
h += '</div>';
h += '<h2>Room: phase × season</h2><div class="grid" style="grid-template-columns:repeat(4,1fr)">';
const SEAS = ['spring', 'summer', 'autumn', 'winter'], PH = ['morning', 'day', 'evening', 'night'];
for (const se of SEAS) for (const ph of PH) h += `<div><div class="room">${A.room({ phase: ph, season: se, sunX: (PH.indexOf(ph) + SEAS.indexOf(se)) / 6 })}<div class="cat">${A.cat(ph === 'night' ? 'sleep' : ['sit', 'loaf', 'window', 'sit'][PH.indexOf(ph)], 'happy')}</div></div>${ph} ${se}</div>`;
h += '</div><h2>Holidays</h2><div class="grid" style="grid-template-columns:repeat(5,1fr)">';
const HOL = [['advent', 'winter', 'day'], ['mikulas', 'winter', 'evening'], ['vanoce', 'winter', 'evening'], ['silvestr', 'winter', 'night'], ['masopust', 'winter', 'day'], ['velikonoce', 'spring', 'morning'], ['carodejnice', 'spring', 'evening'], ['dusicky', 'autumn', 'evening'], ['narozeniny', 'summer', 'day'], [null, 'summer', 'day', true]];
for (const [hol, se, ph, flap] of HOL) h += `<div><div class="room">${A.room({ phase: ph, season: se, holiday: hol, flap })}</div>${hol || 'flap'} (${ph})</div>`;
h += '</div>';
// spots: the items at their spots as the game sizes them (cat 212 room units, items bowl 58, water 52, litter 104, bed 150),
// Koxa eating / drinking where the game puts her, and the sun patch at sunX 0, .5, 1 with its middle (sunPatch) marked
const ITEMW = { bowl: 58, water: 52, litter: 104, bed: 150 }, KC = 212 / 200;
const at = (k, it) => { const p = A.spots[k], b = ITEMW[k]; return `<div style="position:absolute;left:${(p.x - b / 2) / 4}%;top:${(p.y - 0.9 * b) / 6}%;width:${b / 4}%;aspect-ratio:1">${A.item(it)}</div>`; };
const catAt = (pose, fx, fy, ax, ay, o) => `<div style="position:absolute;left:${(fx - ax * KC) / 4}%;top:${(fy - ay * KC) / 6}%;width:${212 / 4}%;aspect-ratio:1">${A.cat(pose, o)}</div>`;
const spotRoom = (sunX, cats) => `<div style="width:300px"><div class="room">${A.room({ phase: 'day', season: 'autumn', sunX })}${at('bowl', 'bowlFull')}${at('water', 'waterBowl')}${at('litter', 'litterDirty')}${at('bed', 'bed')}` +
  `<div style="position:absolute;left:${A.sunPatch(sunX).x / 4}%;top:${A.sunPatch(sunX).y / 6}%;width:8px;height:8px;margin:-4px;border-radius:50%;background:red"></div>${cats || ''}</div>sunX ${sunX}</div>`;
h += '<h2>Spots: eating, drinking, sun patch</h2><div style="display:flex;gap:8px;flex-wrap:wrap">' +
  spotRoom(0, catAt('eat', A.spots.bowl.x, A.spots.bowl.y, 58, 188, { noProp: true }) + catAt('drink', A.spots.water.x, A.spots.water.y, 47, 188, { noProp: true })) +
  spotRoom(0.5) + spotRoom(1, catAt('loaf', A.sunPatch(1).x, A.sunPatch(1).y + 26, 115, 186, 'happy')) + '</div>';
h += '<h2>Bowls: empty and full</h2><div class="grid" style="grid-template-columns:repeat(8,1fr)">' + ['bowl', 'bowlEmpty', 'bowlFull', 'waterBowlEmpty', 'waterBowl'].map(it => cell(A.item(it), it)).join('') + '</div>';
h += '<h2>Items</h2><div class="grid" style="grid-template-columns:repeat(8,1fr)">';
for (const it of A.items) h += cell(A.item(it), it);
h += '</div><h2>Faces</h2><div class="grid" style="grid-template-columns:repeat(8,1fr)">';
for (const m of MOODS) h += cell(A.face(m), m) + cell(A.face(m), m, 'cottage');
h += '</div><h2>Items held (itemHeld)</h2><div class="grid" style="grid-template-columns:repeat(8,1fr)">';
for (const it of ['foodBag', 'jug', 'pouch', 'chicken', 'tuna', 'scoop', 'brush', 'pill']) h += cell(A.itemHeld(it), it);
h += '</div><h2>Icons (24 px and 20 px, currentColor)</h2><div style="display:flex;flex-wrap:wrap;gap:6px">';
for (const ic of A.icons) h += `<div class="cell paper" style="width:84px">${A.icon(ic)} <span style="display:inline-block;width:20px;height:20px">${A.icon(ic).replace('kx-icon', 'kx-icon" style="width:20px;height:20px')}</span><br>${ic}</div><div class="cell cottage" style="width:44px">${A.icon(ic)}</div>`;
h += '</div><h2>FX</h2><div class="grid" style="grid-template-columns:repeat(10,1fr)">';
for (const f of A.fxs) h += cell(`<div style="width:60%;margin:20% auto">${A.fx(f)}</div>`, f) + cell(`<div style="width:60%;margin:20% auto">${A.fx(f)}</div>`, f, 'cottage');
h += '</div><h2>Vet (vetSpots.table) and mouth points (red dot)</h2><div style="display:flex;gap:8px;flex-wrap:wrap">';
const onTable = (pose, o) => { const t = A.vetSpots.table, m = A.mouth(pose, o); // cat ground y≈186 of 200 placed on the table top; box 60 % of the room width
  const w = 60, left = t.x / 4 - w / 2, top = (t.y / 600) * 100 - (186 / 200) * w * (400 / 600);
  return `<div style="width:260px"><div class="room">${A.vet()}<div style="position:absolute;left:${left}%;top:${top}%;width:${w}%;aspect-ratio:1">${A.cat(pose, o)}${m ? `<svg viewBox="0 0 200 200" style="position:absolute;inset:0;overflow:visible"><circle cx="${m.x}" cy="${m.y}" r="4" fill="red"/></svg>` : ''}</div></div>${pose} ${JSON.stringify(o)}</div>`; };
h += onTable('sit', { mood: 'sad', ill: 'cold', openMouth: true }) + onTable('wriggle', { mood: 'grumpy', openMouth: true }) + onTable('sit', { mood: 'grumpy', ill: 'tummy' });
h += '</div><h2>Mouth points per pose</h2><div class="grid" style="grid-template-columns:repeat(8,1fr)">';
for (const p of A.poses) { const m = A.mouth(p, { openMouth: true }); h += cell(A.cat(p, { openMouth: true }) + (m ? `<svg viewBox="0 0 200 200" style="position:absolute;inset:0;overflow:visible"><circle cx="${m.x}" cy="${m.y}" r="4" fill="red"/></svg>` : ''), p); }
h += '</div><h2>Big (phone size, 250 px)</h2><div style="display:flex;gap:8px;flex-wrap:wrap">';
for (const [p, m, bg] of [['sit', 'happy', 'cottage'], ['sit', 'calm', 'paper'], ['loaf', 'calm', 'cottage'], ['sleep', 'calm', 'paper']]) h += `<div class="cell ${bg}" style="width:250px">${A.cat(p, m)}</div>`;
h += '</div>';
out.innerHTML = '<div id="tease"></div>' + h;
const tease = document.getElementById('tease');
const drawTease = () => {
  tease.innerHTML = teasing();
  document.getElementById('replay').onclick = drawTease;
  document.getElementById('flick').onclick = () => { for (const el of tease.querySelectorAll('.flk')) { el.classList.remove('kx-flick'); void el.offsetWidth; el.classList.add('kx-flick'); setTimeout(() => el.classList.remove('kx-flick'), 450); } };
};
drawTease();
const st = document.getElementById('step'); st.oninput = () => { document.getElementById('gait').style.setProperty('--kx-step', st.value + 's'); document.getElementById('stepv').textContent = st.value + ' s'; };
</script>
</body>
</html>
