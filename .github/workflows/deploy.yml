# Puts a released version on GitHub Pages. Only a tag vX.Y.Z made by tools/release.js deploys:
# a plain push to master deploys nothing (see "Deployment" in CLAUDE.md).
# "Run workflow" by hand on an older tag (Actions tab → Deploy → Use workflow from: Tags) brings that version back.
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a running one is never cancelled halfway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          fetch-depth: 0 # the whole history: --verify checks that the tag is on master

      - name: Only a tag made by tools/release.js
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then echo "Deploy only a release tag (vX.Y.Z), not a branch."; exit 1; fi
          node tools/release.js --verify "$GITHUB_REF_NAME"

      - name: Check the games
        run: node tools/check.js

      # only what the players need: no tools, agent files, docs or the game template
      - name: Assemble the site
        run: |
          rsync -a ./ _site/ \
            --exclude '.git*' --exclude '.github/' --exclude '.claude/' --exclude '.playwright-mcp/' --exclude '.idea/' --exclude '.mcp.json' \
            --exclude 'tools/' --exclude 'docs/' --exclude 'games/_template/' --exclude '*.md' --exclude '_site/'
          echo "Files: $(find _site -type f | wc -l)"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0 (2026-03-25)

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 (2026-04-10)
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 (2026-09-01)
