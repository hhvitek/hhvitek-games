<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'unknown platform'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(truncated)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Unknown error').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Test error (?testError)'); });
})();
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#f4ebdf;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#2b1a0e;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 28px)}
/* Header: today's day and date (a calendar on the wall, not a title) */
header{margin:4px 4px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:38px;line-height:1.1;color:#5a3214}
.date{font-size:22px;line-height:1.25;color:#6f5a48;margin-top:2px}
/* The app icon on the right, as tall as the weekday and the date together (42 + 2 + 28 px) */
.logo{flex:none;width:72px;height:72px;border-radius:18px;display:block}
header .when{flex:1;min-width:0}
/* The language: a small flag between the date and the app icon, about as tall as the date line (only when there is a choice) */
.flagBtn{flex:none;width:46px;height:32px;padding:0;border:2px solid #e6d8c6;border-radius:9px;background:#fff;overflow:hidden;cursor:pointer;display:block}
.flagBtn svg{width:100%;height:100%;display:block}
.flagBtn:active{transform:scale(.94)}
/* with the flag there is less room: the weekday and the date shrink a little on narrow phones */
header.with-lang h1{font-size:min(38px,9.6vw)}
header.with-lang .date{font-size:min(22px,5.6vw)}
/* Games: one column of rows (icon, name, description), two columns on wide screens */
.list{display:grid;gap:10px}
/* a hidden element stays hidden whatever display its class sets (the empty Koxa box of 2026-11-12) */
[hidden]{display:none!important}
/* Koxa's line under the header (the cross-game link with Kočka, off by default) */
.cat{display:flex;align-items:center;gap:12px;margin:-6px 4px 14px;padding:8px 14px 8px 8px;border-radius:16px;background:#fff;border:2px solid #e6d8c6;color:#2b1a0e;text-decoration:none;font-size:19px;line-height:1.3}
.cat img{flex:none;width:44px;height:44px;border-radius:12px}
.cat b{font-weight:800}
@media (min-width:760px){.wrap{max-width:900px}.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.game{display:flex;align-items:center;gap:14px;min-height:80px;padding:10px;border-radius:18px;background:#fff;border:2px solid #e6d8c6;text-decoration:none;color:inherit;transition:transform .08s}
.game:active{transform:scale(.98);border-color:#7a4520;background:#fbf5ec}
.icon{flex:none;width:62px;height:62px;border-radius:15px;overflow:hidden;display:grid;place-items:center;background:#7a4520;color:#fff;font:800 32px Georgia,serif}
.icon img{width:100%;height:100%;display:block}
.text{flex:1;min-width:0;overflow-wrap:anywhere} /* a word too long for the row (another language) breaks instead of widening the page */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px}
.name{font-size:22px;font-weight:800;line-height:1.2}
.badge{font-size:18px;font-weight:800;line-height:1.3;padding:1px 10px;border-radius:12px;background:#e8a317;color:#2b1a0e}
.desc{display:block;font-size:18px;line-height:1.3;color:#6f5a48;margin-top:2px}
.plays{font-size:18px;font-weight:700;color:#6f5a48;font-variant-numeric:tabular-nums}
/* a game's progress ("Úroveň 12", "Vyřešeno 8 z 36"): a quiet outlined tag, unlike the orange Rozehráno */
.prog{font-size:18px;font-weight:700;line-height:1.3;padding:0 9px;border-radius:12px;border:2px solid #e6d8c6;color:#6f5a48;font-variant-numeric:tabular-nums}
.chev{flex:none;width:24px;height:24px;fill:none;stroke:#b39b84;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.empty{text-align:center;font-size:20px;color:#6f5a48;padding:40px 0}
/* "Nainstalovat do zařízení" below the games, above Nastavení: only where the browser can install it (beforeinstallprompt) and only until it is installed */
/* the same size as the Nastavení button below it, only filled */
.install{display:flex;align-items:center;justify-content:center;gap:10px;margin:26px auto 0;height:56px;padding:0 26px;font:inherit;font-size:20px;font-weight:700;color:#fff;background:#7a4520;border:2px solid #7a4520;border-radius:18px;cursor:pointer;transition:transform .08s}
.install[hidden]{display:none}
.install:not([hidden])+.toSettings{margin-top:16px}
.install:active{transform:scale(.97)}
.install svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* The way to the settings: a calm secondary button below the games, so the main page stays only for the games */
.toSettings{display:flex;align-items:center;justify-content:center;gap:10px;margin:26px auto 0;height:56px;padding:0 26px;font:inherit;font-size:20px;font-weight:700;color:#5a3214;background:#fff;border:2px solid #e6d8c6;border-radius:18px;cursor:pointer;transition:transform .08s}
.toSettings:active{transform:scale(.97);border-color:#c9a48a}
.toSettings svg{width:26px;height:26px;fill:currentColor}
/* Settings: the same light look as Settings in every game (copied from games/_template) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen[hidden]{display:none}
.screen-in{max-width:560px;margin:0 auto}
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0;color:#5a3214}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.screen button{font-family:inherit;border:0;cursor:pointer} /* only the family: sizes come from .back and .big */
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.back:active,.big:active{transform:translateY(3px)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0}
.card h3{font-size:23px;margin-bottom:6px;color:#5a3214}
.card p{font-size:19px;line-height:1.45}
.fnote{font-size:18px;color:var(--psoft);margin-top:10px;line-height:1.4}
.field{margin-top:12px;padding-top:14px;border-top:2px solid var(--pline)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.flabel{font-size:20px;font-weight:700;line-height:1.3}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:22px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);margin-top:16px}
.big.danger{background:var(--psw);color:#a3261b;box-shadow:0 4px 0 #b9a68f}
.big[hidden]{display:none}
.big.soft{background:var(--popt);color:var(--pbtn);border:2px solid var(--pline);box-shadow:0 4px 0 var(--pline)}
/* Version of the app: the number, then rows with a label and the date below it */
.ver{font-size:24px;font-weight:800;line-height:1.3}
.diag{margin-top:8px;font:18px/1.45 ui-monospace,"Roboto Mono",monospace;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.vrow{margin-top:8px;padding-top:8px;border-top:2px solid var(--pline)}
.vrow span{display:block;font-size:18px;color:var(--psoft);line-height:1.35}
.vrow b{display:block;font-size:20px;line-height:1.35}
.contact{display:block;margin-top:12px;padding:14px 16px;border-radius:14px;background:var(--popt);border:2px solid var(--pline);font-size:18px;font-weight:700;color:var(--pbtn);overflow-wrap:anywhere;text-align:center}
/* the web address with a small copy button below it (user's wish 2026-11-09) */
.screen .copy{display:flex;align-items:center;gap:8px;margin:10px auto 0;height:48px;padding:0 18px;border-radius:24px;background:var(--pbtn);color:var(--pbtn-ink);font-size:18px;font-weight:800;box-shadow:0 3px 0 var(--pbtn-sh)}
.copy svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.mcard{width:100%;max-width:380px;background:#f4ebdf;border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mcard h2{font-size:28px;margin-bottom:10px;color:#5a3214}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:16px}
.mbtns{display:flex;flex-direction:column;gap:14px}
.btn{height:62px;border-radius:18px;border:0;font:inherit;font-size:22px;font-weight:800;cursor:pointer}
.btn:active{transform:translateY(3px)}
.btn.keep{background:#7a4520;color:#fff;box-shadow:0 4px 0 #3f220e}
.btn.danger{background:#e7d9c6;color:#a3261b;box-shadow:0 4px 0 #b9a68f}
/* "Co je nového": every release, newest first; the long list scrolls inside the dialog */
.modal.wide{padding:12px max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left))}
.mcard.wide{max-width:640px;padding:20px 14px 16px}
/* an always visible, thick scrollbar (Android hides the thin overlay one until the list moves) */
.changes{text-align:left;max-height:calc(100dvh - 200px);overflow-y:auto;overscroll-behavior:contain;margin-bottom:16px;padding-right:10px}
.changes::-webkit-scrollbar{width:10px}
.changes::-webkit-scrollbar-track{background:#e6d8c6;border-radius:5px}
.changes::-webkit-scrollbar-thumb{background:#7a4520;border-radius:5px}
@supports not selector(::-webkit-scrollbar){.changes{scrollbar-color:#7a4520 #e6d8c6}}
.changes h3{font-size:20px;line-height:1.3;color:#5a3214;margin:14px 0 6px}
.changes h3:first-child{margin-top:0}
.changes ul{padding-left:24px}
.changes li{font-size:19px;line-height:1.4;margin-bottom:6px}
.errors-table{width:100%;border-collapse:collapse;table-layout:fixed}
.errors-table th,.errors-table td{padding:10px 6px;border-bottom:2px solid var(--pline);text-align:left;vertical-align:top;font-size:18px;line-height:1.35;overflow-wrap:anywhere}
.errors-table th{color:var(--psoft)}
.errors-table th:first-child,.errors-table td:first-child{width:34%}
.errors-table strong{font-weight:800}
/* the languages (the dialog of the flag and the card in Nastavení): flag, own name, a tick at the current one */
.langs{display:grid;gap:10px;margin-top:10px;text-align:left}
.mcard .langs{margin:0 0 16px}
button.lang{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:8px 16px;border-radius:16px;background:#fcf8f2;border:2px solid #e6d8c6;font:inherit;font-size:20px;font-weight:700;color:#2b1a0e;cursor:pointer;text-align:left}
button.lang[aria-pressed="true"]{background:#f6e9d7;border-color:#7a4520}
button.lang svg{flex:none;width:39px;height:26px;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
button.lang .lcheck{margin-left:auto;font-weight:800;color:#7a4520}
</style>

  <!-- texts: data-t (text), data-t-aria (aria-label), data-t-html; I18N.apply() fills them (again after a change of language) -->

<script>
(() => {
'use strict';
const grid = document.getElementById('grid');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Texts: t() plain text, th() HTML with escaped params (i18n/launcher.js, i18n/common.js, i18n/games.js)
const t = I18N.t, th = I18N.th;
// dates and times written by the browser (the error list and report) in the player's language
const LOCALES = { cs: 'cs-CZ', en: 'en-GB', pseudo: 'cs-CZ' };
const locale = () => LOCALES[I18N.lang] || I18N.lang;
// a date in words ("17. listopadu 2026", "17 November 2026"): own month names, not the browser's locale data
const fmtDate = (d, m, y) => t('launcher.date', { day: String(d), month: t(`launcher.month.${m}`), year: String(y) });
// The source code (GitHub), shown in the "O aplikaci" section; keep in sync with README.md
const CONTACT_URL = 'https://github.com/hhvitek/hhvitek-games';
// The games on the web (GitHub Pages), shown in "O aplikaci" so it can be passed on; keep in sync with README.md
const SITE_URL = 'https://hhvitek.github.io/hhvitek-games/';
// an address may wrap only after a slash, never in the middle of a word
const showUrl = (a, url) => {
  a.href = url;
  a.innerHTML = '<span>' + url.replace(/^https?:\/\//, '').replace(/\/$/, '').split('/').map(p => `<span style="white-space:nowrap">${esc(p)}</span>`).join('/<wbr>') + '</span>';
};
const contact = document.getElementById('contact');
showUrl(contact, CONTACT_URL);

// Kopírovat: the clipboard API, else the old way through a hidden text field; the button says how it went
const copyTxt = document.getElementById('copyTxt');
let copyT = 0;
document.getElementById('btnCopySite').addEventListener('click', async () => {
  let ok = false;
  try { await navigator.clipboard.writeText(SITE_URL); ok = true; } catch (e) {}
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = SITE_URL; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  remove(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

// One-time migration of the old Czech keys: hry.<id>.rozehrano -> games.<id>.inProgress
// (some game folders were renamed to match the game names)
try {
  const renamed = { skladaniKostek: 'skladani-kostek', solitaire: 'soliter', pyramid: 'pyramida', spider: 'pavouk' };
  for (const k of Object.keys(localStorage)) {
    const m = /^hry\.(.+)\.rozehrano$/.exec(k);
    if (!m) continue;
    const id = renamed[m[1]] || m[1];
    if (store.get(`games.${id}.inProgress`) === null) store.set(`games.${id}.inProgress`, store.get(k));
    store.remove(k);
  }
} catch (e) {}

// Launcher contract: a game sets 'games.<id>.inProgress' = '1' while it has an unfinished game.
const inProgress = id => store.get(`games.${id}.inProgress`) === '1';
// A game with levels sets 'games.<id>.progress' (contract 3a) to JSON { k, n, of? } shown on its row in the player's
// language: k = 'level' ("Úroveň 12") or 'solved' ("Vyřešeno 8 z 36"). An older plain text (not JSON) is shown as it
// is; anything else is ignored.
const PROGRESS_KEYS = { level: 'launcher.progress.level', solved: 'launcher.progress.solved' };
const progress = id => {
  const v = store.get(`games.${id}.progress`);
  if (typeof v !== 'string' || !v) return '';
  if (v[0] !== '{') { // an older save: the game's own Czech text; the two known ones are shown in the player's language
    let m = /^Úroveň (\d+)$/.exec(v); // i18n-ignore: the old stored text, not shown as it is
    if (m) return t(PROGRESS_KEYS.level, { n: +m[1] });
    m = /^Vyřešeno (\d+) z (\d+)$/.exec(v); // i18n-ignore: the old stored text
    if (m) return t(PROGRESS_KEYS.solved, { n: +m[1], of: +m[2] });
    return v.length <= 30 ? v : '';
  }
  try {
    const p = JSON.parse(v), key = p && PROGRESS_KEYS[p.k], n = p && Number(p.n), of = p && Number(p.of);
    if (!key || !Number.isInteger(n) || n < 0 || (p.k === 'solved' && !(Number.isInteger(of) && of > 0))) return '';
    return t(key, { n, of });
  } catch (e) { return ''; }
};
// The launcher counts how many times each game was started; tiles are sorted by it.
const plays = id => parseInt(store.get(`games.${id}.plays`), 10) || 0;
// A game moves ahead of the registry.js order only after it was opened at least this many times
// (so one curious tap doesn't reshuffle the launcher).
const MIN_PLAYS_TO_RISE = 5;
const rank = g => g.plays >= MIN_PLAYS_TO_RISE ? g.plays : 0;

// The launcher's own settings (the play count on each row is off by default); invalid data = defaults
const LAUNCHER_KEY = 'games.launcher.settings';
const LDEFAULTS = { showPlays: false, catLink: false }; // catLink: the cross-game link with Kočka (user's decision: off by default)
function loadLauncher() {
  const s = { ...LDEFAULTS };
  try { const v = JSON.parse(store.get(LAUNCHER_KEY)); if (v && typeof v === 'object') for (const k of Object.keys(LDEFAULTS)) if (typeof v[k] === typeof LDEFAULTS[k]) s[k] = v[k]; } catch (e) {}
  return s;
}
let L = loadLauncher();
const swPlays = document.getElementById('swPlays');
const swCat = document.getElementById('swCat');
const hasCat = () => (globalThis.GAMES || []).some(g => g.id === 'kocka');
function renderSwitch() {
  swPlays.setAttribute('aria-pressed', String(L.showPlays)); swPlays.textContent = t(L.showPlays ? 'common.on' : 'common.off');
  document.getElementById('rowCat').hidden = document.getElementById('noteCat').hidden = !hasCat();
  swCat.setAttribute('aria-pressed', String(L.catLink)); swCat.textContent = t(L.catLink ? 'common.on' : 'common.off');
}
swPlays.addEventListener('click', () => {
  L.showPlays = !L.showPlays;
  store.set(LAUNCHER_KEY, JSON.stringify(L));
  renderSwitch(); render(); // applies at once, behind the settings screen
});
swCat.addEventListener('click', () => {
  L.catLink = !L.catLink;
  store.set(LAUNCHER_KEY, JSON.stringify(L));
  renderSwitch(); render();
});

/* ---------- Kočka link (off by default) ---------- */
// When it is on, every other game started from here leaves Koxa one treat in games.kocka.treats = { n, day, taken }
// (n waiting, taken = already moved into the game today; at most CAT_TREATS a day), and the line under the header
// shows how she is from games.kocka.mood = { name, mood, wants, ill, ahead } (written by the game on every save).
const CAT_TREATS = 5;
const catDay = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
function giveCatTreat() {
  let T = null;
  try { T = JSON.parse(store.get('games.kocka.treats')); } catch (e) {}
  const today = catDay();
  if (!T || typeof T !== 'object' || T.day !== today) T = { n: 0, day: today, taken: 0 };
  const n = Math.max(0, Number(T.n) || 0), taken = Math.max(0, Number(T.taken) || 0);
  if (n + taken >= CAT_TREATS) return;
  store.set('games.kocka.treats', JSON.stringify({ n: n + 1, day: today, taken }));
}
// what she wants and how she is: each one a whole sentence with her name, launcher.cat.<code> in i18n/launcher.js
const CAT_WANTS = ['food', 'water', 'litter', 'coat', 'love', 'fun'];
const CAT_MOODS = ['happy', 'calm', 'grumpy', 'sad'];
// How she is now: the state at Kočka's last save, moved on by its forecast (ahead = [[time, mood, wants, ill], …],
// written when Kočka is left: her needs go on while the game is closed). null = no valid data.
function catNow() {
  let M = null;
  try { M = JSON.parse(store.get('games.kocka.mood')); } catch (e) {}
  if (!M || typeof M !== 'object') return null;
  const c = { name: M.name, mood: M.mood, wants: M.wants, ill: M.ill }, now = Date.now();
  if (Array.isArray(M.ahead)) for (const a of M.ahead) {
    if (!Array.isArray(a) || a.length !== 4 || !Number.isFinite(a[0])) continue;
    if (a[0] > now) break;
    [c.mood, c.wants, c.ill] = a.slice(1);
  }
  return c;
}
// Kočka's badge ("Rozehráno" while she wants something or is ill) follows her forecast, not only her last save
const hasBadge = (id, cat) => id === 'kocka' && cat ? !!(cat.wants || cat.ill) : inProgress(id);
// The launcher shown again (left open in the background): Kočka's badge moves on with her line, the rows stay in place
function syncCatBadge() {
  const top = grid.querySelector('.game[data-id="kocka"] .top'); if (!top) return;
  const on = hasBadge('kocka', catNow()), el = top.querySelector('.badge');
  if (on && !el) top.querySelector('.name').insertAdjacentHTML('afterend', `<span class="badge">${th('launcher.inProgress')}</span>`);
  else if (!on && el) el.remove();
}
function renderCat() {
  const el = document.getElementById('catLine'), M = catNow();
  if (!L.catLink || !hasCat() || !M) { el.hidden = true; return; }
  const name = typeof M.name === 'string' && M.name.trim() ? M.name.trim().slice(0, 20) : t('launcher.cat.name');
  const what = M.ill ? 'ill' : CAT_WANTS.includes(M.wants) ? M.wants : CAT_MOODS.includes(M.mood) ? M.mood : 'home';
  el.innerHTML = `<img src="games/kocka/icon.svg" alt=""><span>${th(`launcher.cat.${what}`, { name })}</span>`;
  el.href = 'games/kocka/index.html?menu' + langQuery();
  el.hidden = false;
}
document.getElementById('catLine').addEventListener('click', () => store.set('games.kocka.plays', String(plays('kocka') + 1)));

/* ---------- Error reports ---------- */
const ERROR_KEY = 'games.errors';
const errorsCount = document.getElementById('errorsCount'), btnErrors = document.getElementById('btnErrors');
const screenErrors = document.getElementById('screenErrors'), errorsEmpty = document.getElementById('errorsEmpty');
const errorsTable = document.getElementById('errorsTable'), errorsRows = document.getElementById('errorsRows');
const btnSendErrors = document.getElementById('btnSendErrors'), btnClearErrors = document.getElementById('btnClearErrors');
const btnSaveErrors = document.getElementById('btnSaveErrors');
let errorDeviceModel = '';
if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) navigator.userAgentData.getHighEntropyValues(['model']).then(v => { errorDeviceModel = v.model || ''; }).catch(() => {});
function readErrors() {
  try { const v = JSON.parse(localStorage.getItem(ERROR_KEY) || '[]'); return Array.isArray(v) ? v.filter(e => e && typeof e === 'object' && !Array.isArray(e)) : []; } catch (e) { return []; }
}
function renderErrors() {
  const errors = readErrors(), count = errors.reduce((n, e) => { const repeated = Number(e.n); return n + (Number.isFinite(repeated) && repeated > 1 ? repeated : 1); }, 0);
  errorsCount.textContent = count ? t('launcher.errors.count', { n: count }) : t('launcher.errors.none');
  btnErrors.hidden = !count;
  errorsEmpty.hidden = !!count;
  errorsTable.hidden = !count;
  btnSendErrors.hidden = !count;
  btnSaveErrors.hidden = !count;
  btnClearErrors.hidden = !count;
  const ids = new Set((globalThis.GAMES || []).map(g => g.id));
  errorsRows.innerHTML = errors.slice().reverse().map(e => {
    const date = new Date(e.t || ''), when = Number.isNaN(date.getTime()) ? '–' : date.toLocaleString(locale());
    const id = String(e.game || ''), game = ids.has(id) ? t(`game.${id}.name`) : id || t('launcher.errors.unknownGame');
    const what = th(e.type === 'unhandledrejection' ? 'launcher.errors.rejection' : 'launcher.errors.error', { msg: e.msg || t('launcher.errors.unknown') });
    return `<tr><td>${esc(when)}${e.n > 1 ? `<br>${th('launcher.errors.repeated', { n: Number(e.n) })}` : ''}</td><td>${esc(game)}</td><td><strong>${what}</strong><br>${esc(e.where || '')}</td></tr>`;
  }).join('');
}
// the whole report as text, in the player's language (the error messages and stacks stay as the browser wrote them)
function buildErrorReport() {
  const errors = readErrors();
  const device = [errorDeviceModel, navigator.userAgent].filter(Boolean).join(' · ');
  const unknownVersion = t('launcher.report.unknownVersion'), unknownDevice = t('launcher.report.unknownDevice');
  const lines = [
    t('launcher.report.title'),
    t('launcher.report.version', { v: APP ? APP.version : install.version || unknownVersion }),
    t('launcher.report.device', { d: device || unknownDevice }),
    t('launcher.report.screen', { w: String(screen.width), h: String(screen.height) }),
    t('launcher.report.created', { when: new Date().toLocaleString(locale()) }),
    t('launcher.report.entries', { n: String(errors.length) }),
    ''
  ];
  errors.forEach((e, i) => {
    const time = e.t || t('launcher.report.unknownTime'), game = e.game || t('launcher.report.unknownGame'), type = e.type || t('launcher.report.unknownType');
    lines.push(e.n > 1 ? t('launcher.report.entryRepeated', { i: String(i + 1), time, game, type, n: String(e.n) }) : `${i + 1}. ${time} | ${game} | ${type}`);
    lines.push(t('launcher.report.entryVersion', { v: e.v || unknownVersion, d: e.device || unknownDevice }));
    lines.push(t('launcher.report.error', { msg: e.msg || t('launcher.errors.unknown') }));
    lines.push(t('launcher.report.where', { where: e.where || t('launcher.report.unknownPlace') }));
    if (e.stack) lines.push(t('launcher.report.stack', { stack: e.stack }));
    if (e.state) lines.push(t('launcher.report.state', { state: e.state }));
    lines.push('');
  });
  return lines.join('\n');
}
btnErrors.addEventListener('click', () => { renderErrors(); screenErrors.hidden = false; screenErrors.scrollTop = 0; });
screenErrors.addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) screenErrors.hidden = true; });
const errorFileName = () => t('launcher.report.file', { date: new Date().toISOString().slice(0, 10) });
// Send: the whole report as a .txt attachment (a mail body or a chat message would cut it),
// else as shared text, else a mailto: link, which cannot carry an attachment and has to be shortened
btnSendErrors.addEventListener('click', async () => {
  const subject = t('launcher.report.title'), text = buildErrorReport();
  const note = t('launcher.report.note');
  let file = null;
  try { file = new File([text], errorFileName(), { type: 'text/plain' }); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ title: subject, text: note, files: [file] }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (navigator.share) {
    try { await navigator.share({ title: subject, text }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const MAX = 1800, cut = '\n' + t('launcher.report.cut');
  const body = text.length > MAX ? text.slice(0, MAX - cut.length) + cut : text;
  location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
});
// Save the report as a .txt file: the browser's save dialog where it has one, otherwise a normal download
btnSaveErrors.addEventListener('click', async () => {
  const name = errorFileName();
  const blob = new Blob([buildErrorReport()], { type: 'text/plain;charset=utf-8' });
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: t('launcher.report.fileType'), accept: { 'text/plain': ['.txt'] } }] });
      const w = await handle.createWritable(); await w.write(blob); await w.close(); return;
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
btnClearErrors.addEventListener('click', () => showModal(
  th('launcher.errors.clearConfirm'),
  [{ text: th('launcher.keep'), cls: 'keep' }, { text: th('launcher.yesDelete'), cls: 'danger', fn: () => { store.remove(ERROR_KEY); renderErrors(); } }]));

// Header: today's weekday and date (own names in i18n/launcher.js, so it does not depend on the browser's locale data)
function renderDate() {
  const d = new Date();
  document.getElementById('day').textContent = t(`launcher.day.${d.getDay()}`);
  document.getElementById('date').textContent = fmtDate(d.getDate(), d.getMonth(), d.getFullYear());
}

/* ---------- Version of the app (Nastavení → Verze aplikace) ---------- */
// version.js is written by tools/release.js; without it (an unreleased copy) the card says the version is unknown
const APP = globalThis.APP_VERSION && typeof globalThis.APP_VERSION.version === 'string' ? globalThis.APP_VERSION : null;
const isDay = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmtDay = s => { if (!isDay(s)) return '–'; const [y, m, d] = s.split('-').map(Number); return fmtDate(d, m - 1, y); };
// When this version first ran on this device, and when the app ran here for the first time. Not game data:
// "Smazat uložená data" keeps it (ownKey below does not list it). Invalid data starts a new record.
const INSTALL_KEY = 'games.launcher.install';
const install = (() => {
  let v = null;
  try { v = JSON.parse(store.get(INSTALL_KEY)); } catch (e) {}
  const ok = v && typeof v === 'object' && typeof v.version === 'string' && isDay(v.updated) && isDay(v.first);
  const today = dayKey(new Date()), version = APP ? APP.version : '';
  const rec = ok ? { version: v.version, updated: v.updated, first: v.first } : { version, updated: today, first: today };
  if (rec.version !== version) { rec.version = version; rec.updated = today; }
  if (!ok || rec.updated === today) store.set(INSTALL_KEY, JSON.stringify(rec));
  return rec;
})();
function renderVersion() {
  document.getElementById('verName').textContent = APP ? t('launcher.ver.name', { v: APP.version }) : t('launcher.ver.unknown');
  if (APP) document.getElementById('verDate').textContent = fmtDay(APP.date);
  document.getElementById('verUpdated').textContent = fmtDay(install.updated);
  document.getElementById('verFirst').textContent = fmtDay(install.first);
}
// "Co je nového": every release from CHANGELOG.md, newest first (tools/release.js copies them into version.js);
// the history is in Czech only for now, so another language says so above it
const CHANGES = (Array.isArray(globalThis.APP_CHANGES) ? globalThis.APP_CHANGES : [])
  .filter(c => c && typeof c.version === 'string' && Array.isArray(c.items));
const btnChanges = document.getElementById('btnChanges');
btnChanges.hidden = !CHANGES.length;
btnChanges.addEventListener('click', () => showModal(`<h2>${th('launcher.ver.changes')}</h2>` +
  (I18N.lang !== I18N.source ? `<p>${th('launcher.lang.onlyCs')}</p>` : '') + '<div class="changes">' + CHANGES.map(c =>
  `<h3>${th('launcher.ver.changesHead', { v: c.version, date: fmtDay(c.date) })}</h3><ul>${c.items.map(it => `<li>${esc(it)}</li>`).join('')}</ul>`).join('') + '</div>',
  [{ text: th('launcher.close'), cls: 'keep' }], true));
// "Zkontrolovat aktualizace": asks for a new version at once. sw.js downloads it whole and takes over;
// this page still shows the old one until it is loaded again ("Načíst novou verzi").
const canUpdate = /^https?:$/.test(location.protocol) && 'serviceWorker' in navigator;
const btnUpdate = document.getElementById('btnUpdate'), btnReload = document.getElementById('btnReload');
const updState = document.getElementById('updState');
btnUpdate.hidden = !canUpdate;
const say = msg => { updState.textContent = msg; };
// the version the service worker serves now (newer than this page after an update in the background)
async function servedVersion() {
  const res = await fetch('version.js', { cache: 'no-store' });
  const m = /version: '(\d+\.\d+\.\d+)'/.exec(await res.text());
  return m ? m[1] : null;
}
async function compareVersions(silent) {
  const v = await servedVersion();
  if (APP && v && v !== APP.version) { say(t('launcher.ver.downloaded', { v })); btnReload.hidden = false; return; }
  if (!silent) say(APP ? t('launcher.ver.latest', { v: APP.version }) : t('launcher.ver.latestNoNumber'));
}
// waits until a new worker found by update() has finished: 'activated', 'redundant' (its download failed) or 'timeout'
function settled(reg, ms) {
  const w = reg.installing || reg.waiting;
  if (!w) return Promise.resolve('none');
  return new Promise(resolve => {
    const timer = setTimeout(() => { w.removeEventListener('statechange', on); resolve('timeout'); }, ms);
    function on() { if (w.state === 'activated' || w.state === 'redundant') { clearTimeout(timer); w.removeEventListener('statechange', on); resolve(w.state); } }
    w.addEventListener('statechange', on); on();
  });
}
let checking = false;
btnUpdate.addEventListener('click', async () => {
  if (checking) { say(t('launcher.ver.busy')); return; }
  checking = true; btnReload.hidden = true; say(t('launcher.ver.looking'));
  try {
    if (navigator.onLine === false) throw new Error('offline'); // update() does not always fail without a network
    const reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
    await reg.update();
    const state = await settled(reg, 60000);
    if (state === 'timeout') say(t('launcher.ver.stillLoading'));
    else if (state === 'redundant') say(t('launcher.ver.failed'));
    else await compareVersions(false);
  } catch (e) { say(t('launcher.ver.offline')); }
  checking = false;
});
btnReload.addEventListener('click', () => location.reload());

function render() {
  renderDate(); renderCat();
  const games = (globalThis.GAMES || []).map((g, i) => ({ ...g, order: i, plays: plays(g.id) }));
  if (!games.length) { grid.outerHTML = `<p class="empty">${th('launcher.empty')}</p>`; return; }
  const cat = catNow(), badge = id => hasBadge(id, cat);
  // Most played first (counting only games opened MIN_PLAYS_TO_RISE+ times); ties keep the order from registry.js
  games.sort((a, b) => rank(b) - rank(a) || a.order - b.order);
  // the name and the description of each game are texts (i18n/games.js), in the player's language
  grid.innerHTML = games.map(g => { const name = t(`game.${g.id}.name`), desc = I18N.has(`game.${g.id}.desc`) ? t(`game.${g.id}.desc`) : ''; return `
    <a class="game" href="games/${encodeURIComponent(g.id)}/index.html?menu${langQuery()}" data-id="${esc(g.id)}">
      <span class="icon"><img src="games/${encodeURIComponent(g.id)}/icon.svg" alt="" onerror="this.replaceWith(document.createTextNode('${esc(name).charAt(0)}'))"></span>
      <span class="text">
        <span class="top"><span class="name">${esc(name)}</span>${badge(g.id) ? `<span class="badge">${th('launcher.inProgress')}</span>` : ''}${progress(g.id) ? `<span class="prog">${esc(progress(g.id))}</span>` : ''}${L.showPlays && g.plays ? `<span class="plays">${th('launcher.plays', { n: g.plays })}</span>` : ''}</span>
        ${desc ? `<span class="desc">${esc(desc)}</span>` : ''}
      </span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
    </a>`; }).join('');
}
// Count a start; the order changes only on the next visit, so rows never jump under the finger
grid.addEventListener('click', e => {
  const a = e.target.closest('a.game');
  if (a) store.set(`games.${a.dataset.id}.plays`, String(plays(a.dataset.id) + 1));
  if (a && L.catLink && a.dataset.id !== 'kocka' && hasCat()) giveCatTreat();
});
// Reset: deletes everything these games saved in the browser (games in progress, settings,
// records, play counts) after a confirmation. Cached files for offline mode stay.
// Only our own keys: GitHub Pages serves all projects of one user from the same origin
// (and file:// is shared too), so localStorage.clear() would wipe other projects' data.
// Exactly our keys, for each game of the registry: games.<id>.state / .inProgress / .progress / .plays (and Kočka's .mood / .treats), the old Czech
// badge hry.<id>.rozehrano and the older per-game key '<id>.v1' (still read once by the games, see OLD_KEY).
// The player's language (games.lang) is not game data: it stays.
// Older keys whose name differs from the game id:
const OTHER_KEY_NAMES = ['solitaire', 'pyramid', 'spider', 'skladaniKostek'];
const ownKey = k => {
  if (k === LAUNCHER_KEY) return true;
  const ids = (globalThis.GAMES || []).map(g => g.id);
  return ids.some(id => [`games.${id}.state`, `games.${id}.inProgress`, `games.${id}.progress`, `games.${id}.plays`, `games.${id}.mood`, `games.${id}.treats`, `hry.${id}.rozehrano`, `${id}.v1`].includes(k)) // i18n-ignore: storage keys
    || OTHER_KEY_NAMES.some(n => k === `${n}.v1` || k === `hry.${n}.rozehrano`); // i18n-ignore: storage keys
};
// Settings screen: opened by the button below the tiles, closed by Zpět (or the phone's Back)
const settings = document.getElementById('screenSettings');
document.getElementById('btnSettings').addEventListener('click', () => {
  renderErrors(); settings.hidden = false; settings.scrollTop = 0;
  renderDiag();
  // a version downloaded in the background since this page loaded: say so at once, with "Načíst novou verzi"
  if (canUpdate && !checking && navigator.serviceWorker.controller) compareVersions(true).catch(() => {});
});
// a new version that takes over while Settings is open says so too
if (canUpdate) navigator.serviceWorker.addEventListener('controllerchange', () => {
  if (!settings.hidden && !checking) compareVersions(true).catch(() => {});
});
settings.addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) settings.hidden = true; });
const modal = document.getElementById('modal'), card = document.getElementById('modalCard');
function showModal(html, buttons, wide) {
  modal.classList.toggle('wide', !!wide); card.classList.toggle('wide', !!wide);
  card.innerHTML = html + '<div class="mbtns">' + buttons.map((b, i) => `<button class="btn ${b.cls}" data-i="${i}">${b.text}</button>`).join('') + '</div>';
  card.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    modal.hidden = true;
    const fn = buttons[+b.dataset.i].fn; if (fn) fn();
  };
  modal.hidden = false;
}
document.getElementById('btnReset').addEventListener('click', () => showModal(
  th('launcher.data.confirm'),
  [{ text: th('launcher.keep'), cls: 'keep' }, { text: th('launcher.yesDelete'), cls: 'danger', fn: resetAll }]));
function resetAll() {
  try { for (const k of Object.keys(localStorage)) if (ownKey(k)) store.remove(k); } catch (e) {}
  L = loadLauncher(); renderSwitch();
  render();
  showModal(th('launcher.data.done'), [{ text: th('launcher.close'), cls: 'keep' }]);
}

/* ---------- Language (the flag in the header, the card "Jazyk / Language" in Nastavení) ---------- */
// The switch shows only when there is a choice: more than one language ready (I18N.langs; a language is ready
// once everything is translated, i18n/languages.js). To try a language that is not ready yet, the address may
// carry ?lang=<code> (I18N.js then shows that language without saving it): the switch shows too and lists every
// language of LANGS. A choice there is never saved (I18N.setLang would refuse a language that is not ready anyway),
// lasts while this page is open, and the games opened from here get the same ?lang=. A real choice is saved in games.lang
// (not game data: "Smazat uložená data" keeps it) and the launcher is drawn again at once, without a reload.
const ALL_LANGS = (Array.isArray(globalThis.LANGS) ? globalThis.LANGS : []).filter(l => l && typeof l.code === 'string');
const testLang = /[?&]lang=[\w-]+/.test(location.search);
const langChoice = () => testLang ? ALL_LANGS : I18N.langs;
const langShown = () => ALL_LANGS.length > 1 && (I18N.langs.length > 1 || testLang);
const langQuery = () => testLang ? '&lang=' + encodeURIComponent(I18N.lang) : '';
// a flag of i18n/flags.js; its ids get a number, so the same flag can be on the page more than once
let flagCount = 0;
const flag = code => { const svg = String((globalThis.FLAGS || {})[code] || ''), n = ++flagCount; return svg.replace(/flag-[\w-]+/g, m => `${m}-${n}`); };
const langButtons = () => langChoice().map(l => `<button class="lang" data-lang="${esc(l.code)}" aria-pressed="${l.code === I18N.lang}">${flag(l.code)}<span>${esc(l.name)}</span>${l.code === I18N.lang ? '<span class="lcheck" aria-hidden="true">✓</span>' : ''}</button>`).join('');
const btnLang = document.getElementById('btnLang'), cardLang = document.getElementById('cardLang'), langList = document.getElementById('langList');
function renderLang() {
  const on = langShown();
  btnLang.hidden = cardLang.hidden = !on;
  document.getElementById('head').classList.toggle('with-lang', on);
  if (!on) return;
  btnLang.innerHTML = flag(I18N.lang) || flag(I18N.source);
  langList.innerHTML = langButtons();
}
// everything that shows a text, drawn again in the current language
function renderTexts() {
  I18N.apply(); // the static texts (data-t*), <title> and <html lang>
  renderLang(); renderSwitch(); renderVersion(); renderErrors(); render();
  clearTimeout(copyT); copyTxt.textContent = t('launcher.about.copy');
  say('');
  if (!settings.hidden) renderDiag();
}
function chooseLang(code) {
  if (code === I18N.lang || !ALL_LANGS.some(l => l.code === code)) return;
  if (testLang) I18N.lang = code; // ?lang= test mode: any language of LANGS, only for this page, never saved
  else if (!I18N.setLang(code)) return; // saved in games.lang; a language that is not ready is refused
  renderTexts();
}
btnLang.addEventListener('click', () => showModal(`<h2>${th('launcher.lang.title')}</h2><div class="langs">${langButtons()}</div>`, [{ text: th('launcher.close'), cls: 'keep' }]));
card.addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (!b) return; modal.hidden = true; chooseLang(b.dataset.lang); });
langList.addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (b) chooseLang(b.dataset.lang); });
// the language chosen meanwhile in another page of the launcher (this one kept in memory or in the background)
function rereadLang() {
  if (testLang) return false;
  const s = store.get('games.lang');
  return !!s && s !== I18N.lang && I18N.setLang(s);
}

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenErrors', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

renderTexts();
// Coming back from a game with the browser Back button when the page was kept in memory
// (back-forward cache): refresh badges and order, and the language if it was changed meanwhile.
// A normal load has already rendered above.
window.addEventListener('pageshow', e => { if (rereadLang()) renderTexts(); else if (e.persisted) render(); });
// The launcher left open overnight: the date is right again when it is shown
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (rereadLang()) { renderTexts(); return; }
  renderDate(); renderCat(); syncCatBadge();
});

// Hosted version: install to home screen and offline mode for all games
if (/^https?:$/.test(location.protocol)) {
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
  // updateViaCache 'none': the browser asks the server for sw.js and version.js on every opening, so a release
  // is noticed at once (never an older copy from the HTTP cache); the answer is tiny when nothing changed
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
}

// TEMPORARY (2026-11-08): what the browser reports about the screen, shown in Nastavení → "Údaje o obrazovce".
// The app installed by Brave on a Samsung S25 lays the games out taller than the visible area; this finds
// which value matches the visible height. Remove with its section in Nastavení after the fix.
async function renderDiag() {
  const out = document.getElementById('diag'); if (!out) return;
  const frame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const probe = h => { const d = document.createElement('div'); d.style.cssText = `position:absolute;left:-50px;top:0;width:1px;height:${h}`; document.body.appendChild(d); const v = d.getBoundingClientRect().height; d.remove(); return Math.round(v); };
  const insets = () => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;left:-50px;top:0;width:1px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)'; document.body.appendChild(d); const s = getComputedStyle(d), v = [s.paddingTop, s.paddingBottom, s.paddingLeft, s.paddingRight].map(x => Math.round(parseFloat(x))); d.remove(); return t('launcher.diag.insets', { v: v.join(' ') }); };
  const mode = ['fullscreen', 'standalone', 'minimal-ui', 'browser'].find(m => matchMedia(`(display-mode: ${m})`).matches) || '?';
  const vv = window.visualViewport;
  // every number as a string: the values are copied as the browser reports them (no "2,75" for a dpr of 2.75)
  const lines = () => [
    t('launcher.diag.mode', { v: mode + (navigator.brave ? ', Brave' : '') }),
    t('launcher.diag.browser', { v: (navigator.userAgent.match(/(Chrome|Firefox|Version)\/[\d.]+/) || ['?'])[0] }),
    t('launcher.diag.screen', { w: String(screen.width), h: String(screen.height), aw: String(screen.availWidth), ah: String(screen.availHeight), dpr: String(devicePixelRatio) }),
    t('launcher.diag.inner', { v: `${innerWidth} × ${innerHeight}` }),
    t('launcher.diag.outer', { v: `${outerWidth} × ${outerHeight}` }),
    vv ? t('launcher.diag.vv', { w: String(Math.round(vv.width)), h: String(Math.round(vv.height)), top: String(Math.round(vv.offsetTop)) }) : 'visualViewport: –',
    `clientHeight: ${document.documentElement.clientHeight}`,
    `100vh ${probe('100vh')} · 100dvh ${probe('100dvh')} · 100svh ${probe('100svh')} · 100lvh ${probe('100lvh')}`,
  ];
  const a = lines(); a.push(`safe-area: ${insets()}`);
  // the same insets with "cover" in the viewport meta for a moment (the games no longer use it)
  const meta = document.querySelector('meta[name=viewport]'), was = meta.content;
  meta.content = was + ', viewport-fit' + '=cover'; await frame(); // split: tools/check.js rejects it in the meta
  a.push(t('launcher.diag.coverSafe', { v: insets() }), t('launcher.diag.coverInner', { v: `${innerWidth} × ${innerHeight}`, dvh: String(probe('100dvh')) }));
  meta.content = was; await frame();
  // the last game opened: what it measured 2 s after loading (written by its "Visible height" block)
  try { const g = JSON.parse(localStorage.getItem('games.launcher.diag') || 'null');
    if (g) a.push(t('launcher.diag.game', { page: String(g.page), vv: String(g.vv), inner: String(g.inner), client: String(g.client), dvh: String(g.dvh), sb: String(g.sb), appH: String(g.appH), app: String(g.app) })); } catch (e) {}
  out.textContent = a.join('\n');
}

// "Nainstalovat do zařízení": Chrome offers installing on its own only sometimes (and never again once dismissed),
// so the launcher shows its own button whenever the browser says it can install (Chrome, Edge, Samsung Internet).
// Other browsers never fire beforeinstallprompt: the button stays hidden there, and so does it in the installed app.
const btnInstall = document.getElementById('btnInstall');
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); // our button instead of the browser's own mini bar
  installPrompt = e;
  btnInstall.hidden = false;
});
btnInstall.addEventListener('click', async () => {
  const p = installPrompt;
  if (!p) { btnInstall.hidden = true; return; }
  installPrompt = null; // a prompt can be shown only once; the browser fires a new event when it may ask again
  btnInstall.hidden = true;
  try { await p.prompt(); await p.userChoice; } catch (e) {}
});
// appinstalled only means the browser accepted the install, not that the launcher placed the icon: MIUI / HyperOS
// (Xiaomi, Redmi, POCO) silently drops it while the browser lacks its "Home screen shortcuts" permission, so the
// message does not promise the icon and says what to do when it is missing.
window.addEventListener('appinstalled', () => {
  installPrompt = null; btnInstall.hidden = true;
  showModal(th('launcher.installed'), [{ text: th('launcher.gotIt'), cls: 'keep' }]);
});

// Persistent storage: the browser then won't delete saved settings and games on its own.
// Applies to the whole origin, so to all games in games/ too.
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
})();
</script>
