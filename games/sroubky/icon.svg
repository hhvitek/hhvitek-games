  <!-- background: the "Ocel" theme -->
  <rect width="512" height="512" fill="#26313c"/>

  <!-- base plate -->
  <rect x="40" y="438" width="432" height="40" rx="12" fill="#465664"/>
  <rect x="40" y="438" width="432" height="5" rx="2" fill="#fff" fill-opacity=".2"/>

  <!-- the threaded rod with its rounded tip -->
  <path d="M232 440V134a24 24 0 0 1 48 0V440z" fill="url(#rod)" stroke="#16181b" stroke-opacity=".6" stroke-width="3"/>
  <g stroke="#000" stroke-opacity=".3" stroke-width="3">
    <path d="M233 128l46-8M233 142l46-8M233 156l46-8"/>
  </g>

  <!-- the hex head and three nuts on the bolt, bottom first -->
  <use href="#steel" transform="translate(141 412) scale(2.3 .7)"/>
  <use href="#blue" transform="translate(146 326) scale(2.2)"/>
  <use href="#yellow" transform="translate(146 238) scale(2.2)"/>
  <use href="#blue" transform="translate(146 150) scale(2.2)"/>

  <!-- one nut lifted above the tip, as when a bolt is chosen -->
  <g transform="rotate(-6 256 60)">
    <ellipse cx="256" cy="104" rx="96" ry="7" fill="#000" fill-opacity=".25"/>
    <use href="#red" transform="translate(146 16) scale(2.2)"/>
  </g>
