<!doctype html>
<html lang="cs" data-theme="paper">
<head>
<meta charset="utf-8">
<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4ebdf">
<meta name="mobile-web-app-capable" content="yes">

<title>Šroubky</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2327323d'/%3E%3Crect x='28' y='8' width='8' height='46' rx='4' fill='%23c9d0d6'/%3E%3Crect x='14' y='40' width='36' height='12' rx='2' fill='%231f5fd6'/%3E%3Crect x='14' y='27' width='36' height='12' rx='2' fill='%23ffd31a'/%3E%3C/svg%3E">
<style>
/* ---------- Themes: a solid colour; everything below reads these variables (rule) ---------- */
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.08);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--accent:#c0561a;--chip:rgba(122,69,32,.08);--chip-line:rgba(122,69,32,.24);--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--undo-bg:rgba(122,69,32,.12);--plate:#cdb79b;--plate-hi:rgba(255,255,255,.45);--plate-lo:rgba(90,50,20,.3)}
[data-theme="workshop"]{--page:#3b2718;--bar:rgba(0,0,0,.25);--line:rgba(255,255,255,.08);--ink:#f7ecdc;--soft:#dcc6a8;--accent:#ffb347;--chip:rgba(255,255,255,.1);--chip-line:rgba(255,255,255,.2);--btn:#ffb347;--btn-ink:#2a1600;--btn-sh:#a0661a;--undo-bg:rgba(0,0,0,.25);--plate:#6a4a30;--plate-hi:rgba(255,255,255,.18);--plate-lo:rgba(0,0,0,.35)}
[data-theme="steel"]{--page:#26313c;--bar:rgba(0,0,0,.22);--line:rgba(255,255,255,.08);--ink:#eef3f7;--soft:#b9c7d3;--accent:#7cc4ff;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--btn:#e9eef2;--btn-ink:#1f262c;--btn-sh:#8c979f;--undo-bg:rgba(0,0,0,.26);--plate:#465664;--plate-hi:rgba(255,255,255,.2);--plate-lo:rgba(0,0,0,.35)}
[data-theme="white"]{--page:#ffffff;--bar:rgba(0,0,0,.04);--line:rgba(0,0,0,.1);--ink:#101418;--soft:#4b5560;--accent:#1f5fd6;--chip:rgba(0,0,0,.06);--chip-line:rgba(0,0,0,.25);--btn:#1f5fd6;--btn-ink:#fff;--btn-sh:#123a85;--undo-bg:rgba(0,0,0,.07);--plate:#d3d8dd;--plate-hi:rgba(255,255,255,.7);--plate-lo:rgba(0,0,0,.2)}

/* ---------- Base ---------- */
:root{--gut:12px;--w:60px;--h:24px} /* --gut: one side margin; top-bar buttons, the bolts and the bottom buttons line up */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
/* rule: 100dvh + safe areas, the board is sized from the room that is left (see layout()) */
#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Top bar (rule: home, Nová hra, <h1> name, ?, settings) ---------- */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;color:var(--ink);white-space:normal;overflow-wrap:normal;word-break:normal} /* a long name wraps to two lines between words, never inside a word and never cut (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);text-decoration:none}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:8px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:20px}
/* narrow phones (360 px): less room between the bar buttons, so the name fits whole; the outer margin stays */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill{padding:0 8px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px;letter-spacing:0}
  .act{font-size:16px}
}

/* ---------- Score row (rule: info goes on its own row, not in place of the name) ---------- */
.info{flex:none;text-align:center;font-size:19px;font-weight:700;color:var(--soft);padding:6px var(--gut) 0;line-height:26px}
.info b{color:var(--ink)}

/* ---------- Board: rows of bolts on base plates ---------- */
.board{flex:1;min-height:0;display:flex;overflow:hidden;padding:12px 0} /* 12 px from the score row and the tray; layout() sizes the bolts inside this padding and inside --gut */
.rows{margin:auto;display:flex;flex-direction:column;align-items:center;gap:var(--rg,10px)}
.brow{position:relative;display:flex;justify-content:center}
.plate{position:absolute;left:calc(var(--w)*.05);right:calc(var(--w)*.05);bottom:0;height:var(--pl);border-radius:calc(var(--w)*.07);background:var(--plate);box-shadow:inset 0 2px 0 var(--plate-hi),inset 0 -3px 0 var(--plate-lo)}
/* A bolt: the button is the whole column (tap area), drawn from the bottom up: washer (hex head), threaded rod, nuts */
.bolt{position:relative;display:block;flex:none;width:var(--bw);height:var(--bh);padding:0}
.bolt::before{content:"";position:absolute;inset:0 calc(var(--w)*.03) calc(var(--pl)*.2);border-radius:calc(var(--w)*.18);pointer-events:none}
.bolt.sel::before{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.bolt.dst::before{background:color-mix(in srgb,var(--accent) 16%,transparent);outline:3px dashed var(--accent);outline-offset:-3px}
.washer{position:absolute;left:50%;bottom:var(--y0);width:calc(var(--w)*1.02);height:var(--wa);margin-left:calc(var(--w)*-.51)}
.rod{position:absolute;left:50%;bottom:var(--nb);width:calc(var(--w)*.22);height:var(--rod);margin-left:calc(var(--w)*-.11);border-radius:calc(var(--w)*.11) calc(var(--w)*.11) 0 0;
  background:repeating-linear-gradient(162deg,rgba(0,0,0,.28) 0 1.5px,transparent 1.5px 4.5px),linear-gradient(90deg,#5f676e,#dfe4e8 38%,#b4bcc3 58%,#6a737a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.nut{position:absolute;left:50%;bottom:calc(var(--nb) + var(--k) * var(--h));width:var(--w);height:var(--h);margin-left:calc(var(--w)/-2);overflow:visible;transition:bottom .16s ease-out}
.nut.up{filter:drop-shadow(0 calc(var(--h)*.18) calc(var(--h)*.14) rgba(0,0,0,.35))}
.nut .sym{display:none}
.show-syms .nut .sym{display:inline}
.acorn{position:absolute;left:50%;bottom:calc(var(--nb) + var(--k) * var(--h) - var(--h)*.05);width:calc(var(--w)*.9);height:calc(var(--w)*.45);margin-left:calc(var(--w)*-.45);overflow:visible}
.acorn.pop{animation:screw .6s ease-out}
@keyframes screw{0%{transform:translateY(-140%) scaleX(.55);opacity:0}35%{transform:translateY(-35%) scaleX(1);opacity:1}55%{transform:translateY(-18%) scaleX(.6)}75%{transform:translateY(-6%) scaleX(1)}88%{transform:scaleX(.8)}100%{transform:none}}
.arrow{position:absolute;left:50%;bottom:calc(var(--nb) + var(--rod) + var(--h)*.4);width:calc(var(--w)*.5);height:calc(var(--w)*.34);margin-left:calc(var(--w)*-.25);fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(25%)}}
.won .bolt{animation:hop .55s ease-in-out 2}
@keyframes hop{50%{transform:translateY(calc(var(--h)*-.6))}}

/* ---------- Bottom tray ---------- */
.tray{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px var(--gut) 12px;background:var(--bar);border-top:1px solid var(--line)}
/* always two lines high: a longer hint wraps instead of being cut, and the board keeps its size when the text changes */
.hint{display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;font-weight:600;line-height:24px;height:48px;overflow:hidden;color:var(--ink)}
.actions{display:flex;gap:10px}
.act{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:64px;border-radius:16px;font-size:17px;font-weight:800;line-height:1.1;white-space:nowrap;color:var(--ink);background:var(--undo-bg);box-shadow:inset 0 0 0 2px var(--chip-line);transition:transform .06s}
.act svg{flex:none;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.act:active{transform:scale(.98)}
.act.main{background:var(--btn);color:var(--btn-ink);box-shadow:0 4px 0 var(--btn-sh)}
/* an unavailable action: readable text, no fill, a dashed outline (not only opacity); it explains itself when tapped */
.act.dim{background:transparent;box-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px}
.pulse{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04);box-shadow:inset 0 0 0 2px var(--chip-line),0 0 0 4px var(--accent)}}

@media (max-height:800px){
  .topbar{height:52px}
  .pill{height:44px}.round{width:44px;height:44px}
  .topbar h1{font-size:24px}
  .info{padding-top:4px}
  .tray{gap:6px;padding:6px var(--gut) 10px}
  .act{height:58px}
}
@media (prefers-reduced-motion:reduce){
  .nut,.acorn.pop,.arrow,.won .bolt,.pulse{animation:none!important;transition:none!important}
}

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
/* rule: the head with Zpět and the game name stays at the top while scrolling */
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);margin-top:16px}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{font-size:18px;color:var(--psoft);line-height:1.3}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.trow .flabel{margin:0}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{display:flex;align-items:flex-end;justify-content:center;height:96px;border-radius:10px;background:var(--page);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);overflow:hidden}
.swatch .brow{margin-bottom:6px}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.stat{width:100%;border-collapse:collapse;font-size:18px;margin-top:6px}
.stat th,.stat td{padding:10px 4px;text-align:right;border-top:2px solid var(--pline)}
.stat th:first-child,.stat td:first-child{text-align:left}
.stat thead th{border-top:0;font-size:16px;color:var(--psoft)}
.help p,.help li{font-size:20px;line-height:1.45}
.help ol{padding-left:26px}
.help li{margin:10px 0}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;line-height:1.35;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
</style>
</head>
<body>
<div id="rotate" class="paper" role="status"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="6" width="20" height="36" rx="4"/><path d="M29 36h6"/><path d="M12 46a22 22 0 0 0 40 0"/><path d="m52 46-1.5 7M52 46l-7 2"/></svg><b>Otoč telefon na výšku</b><span>Hra počká, nic se neztratí.</span></div>
<!-- the nut drawings, one per colour, filled in by the script (drawDefs) and used by every nut through <use> -->
<svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>
<div id="app">
  <header class="topbar">
    <!-- contract: the home button is hidden and shown only when opened from the launcher (?menu) -->
    <a id="btnHome" class="round" href="../../index.html" aria-label="Zpět na výběr her" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2V20a1 1 0 0 1-1 1H15v-5.5H9V21H4.5a1 1 0 0 1-1-1z"/></svg></a>
    <button id="btnNew" class="pill">Nová hra</button>
    <h1>Šroubky</h1>

// what the solver says about the current position: 'ok' (with the next move of a solution), 'lost' (proved),

  const W = board.clientWidth - 2 * gut, H = board.clientHeight - parseFloat(bs.paddingTop) - parseFloat(bs.paddingBottom);

    <section class="card help"><ol>
      <li>Na šroubech jsou našroubované barevné matky. Přesouvej je tak, aby na každém šroubu byla <b>jen jedna barva</b>.</li>
      <li>Ťukni na šroub – horní matky jedné barvy se zvednou nad něj. Potom ťukni na šroub, kam je chceš dát. Když si to rozmyslíš, ťukni znovu na stejný šroub nebo vedle a matky se vrátí.</li>
      <li>Matky jdou jen na <b>prázdný</b> šroub, nebo na matku <b>stejné barvy</b>. Přesunou se najednou všechny stejné matky shora, kolik se jich vejde; zbytek zůstane. Ťukneš-li na šroub, kam nejdou, zvednou se místo nich matky z něj.</li>
      <li>Na šroub se vejdou 4 matky (Lehká a Střední), nebo 5 (Těžká a Mistr).</li>
      <li>Plný šroub jedné barvy dostane navrch kloboučkovou matku. Ten je hotový a už se nemění.</li>
      <li><b>Zpět</b> vrátí poslední tah, klidně i víckrát. <b>Od začátku</b> rozehraje stejnou hru znovu.</li>
      <li><b>Poradit</b> zvedne matky a označí šroub, kam s nimi – stačí na něj ťuknout.</li>
      <li>Když už se z pozice vyřešit nedá, hra to hned řekne. Pak vrať pár tahů Zpět.</li>
      <li>Obtížnost se mění v Nastavení: Lehká má 4 barvy, Střední 6, Těžká 8 a Mistr 10, vždy se dvěma prázdnými šrouby navíc. Každá hra jde vyřešit, hra to před začátkem ověří.</li>
      <li>Statistika v Nastavení ukazuje pro každou obtížnost, kolik her bylo dohráno a vyřešeno, a rekord: nejmenší počet tahů. Počítají se jen dohrané hry bez Poradit.</li>
      <li><b>Značky na matkách</b> v Nastavení přidají na každou barvu jiný tvar, když se barvy špatně rozlišují.</li>
    </ol></section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
}
function openHelp() { hideToast(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; }
$('#helpIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenHelp').hidden = true; });
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
// rule: ask for persistent storage so the browser does not delete the saved game by itself
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
drawDefs();
const saved = load();
const savedSettings = saved && typeof saved === 'object' && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
if (saved && typeof saved === 'object' && saved.bests && typeof saved.bests === 'object') for (const l of LEVELS) if (okStat(saved.bests[l.id])) bests[l.id] = saved.bests[l.id];
// rule: a difficulty chosen just before the app was closed (Settings still open) is applied now, as closing Settings would
if (saved && typeof saved === 'object' && validGame(saved.game)) { G = saved.game; if (S.level !== G.level && isFresh()) newGame(); else render(true); }
else { applyLook(); $('#hint').textContent = 'Připravuji hru…'; newGame(); } // the saved theme shows while the first game is prepared

window.addEventListener('resize', () => layout(false));
if (window.visualViewport) visualViewport.addEventListener('resize', () => layout(false));
document.addEventListener('contextmenu', e => e.preventDefault());

// contract: opened from the launcher (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) { $('#btnHome').hidden = false; layout(false); }

// For testing
window.Sroubky = { LEVELS, prng, solve, usefulMoves, applyMove, moveError, isWon, isDone, randomDeal, scrambleDeal, generate, validGame, stateKey, analyse: () => analyse(), get state() { return { S, G, bests, sel, hint }; } };
})();
</script>
