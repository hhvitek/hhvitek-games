<!doctype html>
<html lang="cs" data-theme="paper">
<head>
<meta charset="utf-8">
<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4ebdf">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dáma">
<title>Dáma</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b98d62'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%232b1a0e'/%3E%3Ccircle cx='32' cy='32' r='12' fill='none' stroke='%23f4ebdf' stroke-width='3'/%3E%3C/svg%3E">
<style>
/* ---------- Themes: a solid colour; everything below reads these variables (rule) ----------
   --light/--dark: the squares, --pw/--pb: white and black pieces with their rims and crowns, --sel: the chosen piece and
   where it can go, --last: the opponent's last move, --hint: the advice */
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.06);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--accent:#7a4520;--accent-ink:#fff;--chip:#fff;--chip-line:#e6d8c6;--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--undo-bg:rgba(122,69,32,.1);
  --frame:#7a4520;--light:#fbf6ee;--dark:#c19a72;--pw:#fffdf8;--pw-rim:#8a7058;--pw-crown:#7a4520;--pb:#2b1a0e;--pb-rim:#000;--pb-crown:#f2c46d;--sel:#1f7a4a;--last:#c0392b;--hint:#1f5fbf}
[data-theme="wood"]{--page:#4a2f1b;--bar:rgba(0,0,0,.22);--line:rgba(255,255,255,.1);--ink:#fbefd9;--soft:#e2cfb0;--accent:#f0b45c;--accent-ink:#2a1a08;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.22);--btn:#f0b45c;--btn-ink:#2a1a08;--btn-sh:#a06b22;--undo-bg:rgba(0,0,0,.25);
  --frame:#2a190d;--light:#ecd1a4;--dark:#9b6436;--pw:#fff6e4;--pw-rim:#8c6a44;--pw-crown:#9b6436;--pb:#1e130b;--pb-rim:#000;--pb-crown:#f0b45c;--sel:#2fbf6a;--last:#ff5a3c;--hint:#5ab4ff}
[data-theme="green"]{--page:#23402a;--bar:rgba(0,0,0,.22);--line:rgba(255,255,255,.1);--ink:#eef6e8;--soft:#cfe2c6;--accent:#ffd66b;--accent-ink:#2a2200;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.22);--btn:#ffd66b;--btn-ink:#2a2200;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.25);
  --frame:#13261a;--light:#eeeed2;--dark:#6f9a52;--pw:#ffffff;--pw-rim:#6b6b6b;--pw-crown:#3f6a2e;--pb:#1a1a1a;--pb-rim:#000;--pb-crown:#ffd66b;--sel:#ffd400;--last:#ff4d4d;--hint:#2fa8ff}

/* ---------- Base ---------- */
:root{--gut:12px} /* one side margin: bar buttons, board and bottom buttons line up (the safe areas are on #app) */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
/* rule: 100dvh + safe areas, the board is sized from the room that is left (see layout()) */
#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Top bar (rule: home, Nová hra, <h1> name, ?, settings) ---------- */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;color:var(--ink);white-space:normal;overflow-wrap:normal;word-break:normal} /* a long name wraps to two lines between words, never inside a word and never cut (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);text-decoration:none}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:8px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:20px}
/* narrow phones (360 px): less room between the bar buttons, so the name fits whole at 18 px; the outer margin stays */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill{padding:0 8px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px;letter-spacing:0}
}

/* ---------- The two players: a row above the board (the opponent) and below it (you) ---------- */
.side{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 var(--gut);padding:4px 10px;min-height:52px;border-radius:16px;border:3px solid transparent;background:var(--bar);--op-ava:40px;--op-ava-bg:var(--chip);--op-name:20px}
.side.on{border-color:var(--accent)}
.side .me{font-size:21px;font-weight:800}
.side .tag{flex:none;font-size:18px;font-weight:800;padding:2px 10px;border-radius:12px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.side .tag.off{background:none;color:var(--soft);font-weight:700;padding:2px 0}
.left{display:flex;align-items:center;gap:10px;min-width:0}
.cnt{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:19px;font-weight:700;color:var(--soft)}
.mini{width:20px;height:20px;border-radius:50%;flex:none}
.mini.c0{background:var(--pw);box-shadow:inset 0 0 0 2px var(--pw-rim)}
.mini.c1{background:var(--pb);box-shadow:inset 0 0 0 2px var(--pb-rim),0 0 0 2px color-mix(in srgb,var(--ink) 35%,transparent)}

/* ---------- Board ---------- */
/* the opponent's row, the board and your row stay together in the middle of the room that is left */
#mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:8px 0 0}
#board{flex:none;display:grid;place-items:center;padding:12px var(--gut)} /* rule: at least 12 px between the board and the rows above and below, on every screen */
#wrap{position:relative;padding:var(--fw);background:var(--frame);border-radius:8px}
#grid{display:grid;grid-template-columns:repeat(8,var(--cs));grid-template-rows:repeat(8,var(--cs))}
.sq{width:var(--cs);height:var(--cs);position:relative;display:grid;place-items:center}
.sq.l{background:var(--light)}
.sq.d{background:var(--dark)}
/* a piece: a flat stone with a rim; a king is two stones on each other with a crown */
.pc{width:calc(var(--cs) * .8);height:calc(var(--cs) * .8);border-radius:50%;position:relative;display:grid;place-items:center}
.pc.c0{background:var(--pw);box-shadow:inset 0 0 0 calc(var(--cs) * .05) var(--pw-rim),inset 0 0 0 calc(var(--cs) * .14) var(--pw),inset 0 0 0 calc(var(--cs) * .17) color-mix(in srgb,var(--pw-rim) 45%,var(--pw)),0 calc(var(--cs) * .05) 0 var(--pw-rim)}
.pc.c1{background:var(--pb);box-shadow:inset 0 0 0 calc(var(--cs) * .05) var(--pb-rim),inset 0 0 0 calc(var(--cs) * .14) var(--pb),inset 0 0 0 calc(var(--cs) * .17) color-mix(in srgb,#fff 22%,var(--pb)),0 calc(var(--cs) * .05) 0 var(--pb-rim)}
.pc.k{transform:translateY(calc(var(--cs) * -.05))}
.pc.k.c0{box-shadow:inset 0 0 0 calc(var(--cs) * .05) var(--pw-rim),0 calc(var(--cs) * .05) 0 var(--pw-rim),0 calc(var(--cs) * .1) 0 var(--pw),0 calc(var(--cs) * .13) 0 var(--pw-rim)}
.pc.k.c1{box-shadow:inset 0 0 0 calc(var(--cs) * .05) var(--pb-rim),inset 0 0 0 calc(var(--cs) * .07) color-mix(in srgb,#fff 25%,var(--pb)),0 calc(var(--cs) * .05) 0 var(--pb-rim),0 calc(var(--cs) * .1) 0 color-mix(in srgb,#fff 18%,var(--pb)),0 calc(var(--cs) * .13) 0 var(--pb-rim)}
.pc svg{width:62%;height:62%}
.pc.c0 svg{fill:var(--pw-crown)}
.pc.c1 svg{fill:var(--pb-crown)}
/* the chosen piece, where it can go, compulsory captures, the advice and the opponent's last move */
.sq.sel .pc{outline:calc(var(--cs) * .08) solid var(--sel);outline-offset:calc(var(--cs) * .02)}
.sq.to::after{content:"";position:absolute;width:calc(var(--cs) * .34);height:calc(var(--cs) * .34);border-radius:50%;background:var(--sel);box-shadow:0 0 0 calc(var(--cs) * .04) color-mix(in srgb,#fff 70%,var(--sel))}
.sq.must .pc{outline:calc(var(--cs) * .06) dashed var(--sel);outline-offset:calc(var(--cs) * .02)}
.sq.must.sel .pc{outline-style:solid}
.sq.hint{box-shadow:inset 0 0 0 calc(var(--cs) * .08) var(--hint)}
.sq.hint.to::after{background:var(--hint)}
.sq.lf{box-shadow:inset 0 0 0 calc(var(--cs) * .06) color-mix(in srgb,var(--last) 70%,transparent)}
.sq.lt{box-shadow:inset 0 0 0 calc(var(--cs) * .08) var(--last)}
.sq.lx::before{content:"×";position:absolute;font-size:calc(var(--cs) * .7);font-weight:900;line-height:1;color:color-mix(in srgb,var(--last) 75%,transparent)}
.sq.taken .pc{opacity:.35}
.sq.taken::before{content:"×";position:absolute;z-index:1;font-size:calc(var(--cs) * .8);font-weight:900;line-height:1;color:var(--last)}
.ghost{position:absolute;left:0;top:0;z-index:5;pointer-events:none;width:var(--cs);height:var(--cs);display:grid;place-items:center}

/* ---------- Bottom buttons ---------- */
.tray{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px var(--gut) 12px;margin-top:8px;background:var(--bar);border-top:1px solid var(--line)}
#hint{text-align:center;font-size:19px;line-height:1.3;color:var(--soft);min-height:25px}
.row{display:flex;gap:10px}
.undo{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:8px;height:64px;border-radius:16px;font-size:21px;font-weight:800;color:var(--ink);background:var(--undo-bg);box-shadow:inset 0 0 0 2px var(--chip-line)}
.undo svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
/* rule: an unavailable action is only dimmed and explains itself when tapped */
.undo.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */
@media (max-height:800px){
  .topbar{height:56px}
  .round{width:42px;height:42px}
  .pill{height:42px}
  .side{min-height:48px;--op-ava:36px}
  #mid{padding-top:6px}
  .undo{height:56px}
  .tray{gap:6px;padding:6px var(--gut) 10px;margin-top:6px}
}

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
/* rule: the head with Zpět and the game name stays at the top while scrolling */
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);margin-top:16px}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{font-size:18px;color:var(--psoft);line-height:1.3}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{height:56px;border-radius:10px;background:var(--page);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden;padding:6px}
.swatch i{display:grid;place-items:center}
.swatch i:nth-child(odd){background:var(--light)}
.swatch i:nth-child(even){background:var(--dark)}
.swatch i b{width:70%;aspect-ratio:1;border-radius:50%}
.swatch i b.c0{background:var(--pw);box-shadow:inset 0 0 0 2px var(--pw-rim)}
.swatch i b.c1{background:var(--pb)}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.stats{font-size:20px;line-height:1.5}
.help p,.help li{font-size:20px;line-height:1.45}
.help ol,.help ul{padding-left:26px}
.help li{margin:10px 0}
.help h3 + p{margin-top:4px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;line-height:1.35;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* the toast starts at the top of the bottom buttons and grows down over them: never over the board or the player rows (toast()) */
#toast{font-size:17px;line-height:1.25;padding:9px 14px;max-width:calc(100vw - 24px)}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px Georgia,"Times New Roman",serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
</style>
</head>
<body>
<div id="rotate" class="paper" role="status"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="6" width="20" height="36" rx="4"/><path d="M29 36h6"/><path d="M12 46a22 22 0 0 0 40 0"/><path d="m52 46-1.5 7M52 46l-7 2"/></svg><b>Otoč telefon na výšku</b><span>Hra počká, nic se neztratí.</span></div>
<div id="app">
  <header class="topbar">

/* ---------- Visible height ---------- */
// The game is exactly as tall as the part of the window that is really shown (--app-h on #app). 100dvh alone is not
// enough: some browsers report it taller than what is visible (the app installed by Brave on Android counted the
// status and navigation bars too and hid the bottom buttons). visualViewport follows what is shown; it is measured
// again on every change and shortly after loading (a browser bar that hides itself may change it without an event),
// and a changed height makes the game lay itself out again through a resize event.

  const root = document.documentElement;

// the board as you see it: your pieces at the bottom (the board is turned for black)
function squareAt(R, C) {
  const r = G.you === 0 ? 7 - R : R, c = G.you === 0 ? C : 7 - C;
  return (r + c) % 2 === 0 ? r * 4 + (c >> 1) : -1;
}
function renderBoard() {
  const p = curPos(), all = p.w | p.b;

  const list = mine ? E.moves(p) : [];
  const must = mine && list.length && list[0].caps.length ? new Set(list.map(m => m.from)) : null;
  const cands = mine ? candidates() : [];

  for (const m of cands) if (m.path[steps] !== undefined) targets.add(m.path[steps]);
  const taken = new Set(view ? view.taken : sel && cands.length ? cands[0].caps.slice(0, steps) : []);
  let movingFrom = view ? view.from : sel && steps ? sel.from : -1;
  let movingAt = view ? view.at : sel && steps ? sel.steps[steps - 1] : -1;
  const movingKind = view ? view.kind : sel && steps ? ((has(p.k, sel.from) ? 'k ' : '') + 'c' + p.stm) : '';

    const s = squareAt(R, C);
    if (s < 0) { html += '<div class="sq l"></div>'; continue; }
    const cls = ['sq', 'd'];
    let piece = '';
    if (s === movingAt && movingKind) piece = pieceHTML(movingKind);
    else if (s !== movingFrom && has(all, s)) piece = pieceHTML((has(p.k, s) ? 'k ' : '') + 'c' + (has(p.w, s) ? 0 : 1));
    if (sel && s === (steps ? movingAt : sel.from)) cls.push('sel');
    if (S.show && targets.has(s)) cls.push('to');
    else if (!S.show && targets.has(s) && steps) cls.push('to'); // inside a multiple capture the next squares are always shown
    if (must && must.has(s) && (S.show || flashMust)) cls.push('must');
    if (taken.has(s)) cls.push('taken');
    if (last) { if (s === last.from) cls.push('lf'); if (s === last.path[last.path.length - 1]) cls.push('lt'); if (lastCaps.has(s) && !has(all, s)) cls.push('lx'); }

    if (hint && sel && sel.from === hint.from && s === hint.to) cls.push('to');
    html += `<button class="${cls.join(' ')}" data-s="${s}" aria-label="${sqLabel(s, p)}">${piece}</button>`;

}
const sqLabel = (s, p) => `${'abcdefgh'[E.COL[s]]}${E.ROW[s] + 1}${has(p.w, s) ? (has(p.k, s) ? ', bílá dáma' : ', bílý kámen') : has(p.b, s) ? (has(p.k, s) ? ', černá dáma' : ', černý kámen') : ''}`;
function foeMood() {

}

// rule: the board size comes from the room that is left, so it fits without scrolling
function layout() {

  const rows = $('#foeRow').offsetHeight + $('#meRow').offsetHeight + parseFloat(getComputedStyle(mid).paddingTop);

/* ---------- Controls ---------- */
// whether the man on s could capture if the king's priority did not apply (only for the message why it may not)
function manCouldCapture(p, s) {
  const mineK = (G.you ? p.b : p.w) & p.k;
  const q = E.hashOf({ w: G.you ? p.w : p.w & ~mineK, b: G.you ? p.b & ~mineK : p.b, k: p.k & ~mineK, stm: p.stm });
  return E.moves(q).some(m => m.from === s && m.caps.length);
}
let flashMust = false, flashT = 0;
function showMust() { flashMust = true; clearTimeout(flashT); flashT = setTimeout(() => { flashMust = false; renderBoard(); }, 2600); }
$('#grid').addEventListener('click', e => {
  const b = e.target.closest('.sq[data-s]'); if (!b) return;
  const s = +b.dataset.s;
  if (G.status !== 'playing') { toast(G.status === 'lost' ? 'Hra skončila. Zpět vrátí tvůj tah, nebo ťukni na Nová hra.' : 'Hra skončila. Ťukni na Nová hra.'); return; }
  if (busy()) { toast(thinking ? `Chvilku, ${nm()} přemýšlí` : `Chvilku, ${nm()} táhne`); return; }
  if (!yourTurn()) return;
  const p = curPos(), list = E.moves(p), mineHere = has(G.you ? p.b : p.w, s), theirsHere = has(G.you ? p.w : p.b, s);
  const must = list.length && list[0].caps.length > 0;
  if (sel) {
    const steps = sel.steps.length, cands = candidates();
    // the advice: its piece and its square do the advised move
    if (hintMv && sel.from === hintMv.from && s === hintMv.to && !steps) { playYours(hintMv); return; }
    const next = cands.filter(m => m.path[steps] === s);
    if (next.length) {
      sel.steps.push(s);
      let left = next;
      // go on by itself while there is only one way
      for (;;) {
        const done = left.filter(m => m.path.length === sel.steps.length);
        if (done.length === left.length) { playYours(left[0]); return; }
        const nexts = new Set(left.map(m => m.path[sel.steps.length]));
        if (nexts.size !== 1 || done.length) break;
        sel.steps.push([...nexts][0]);
        left = left.filter(m => m.path[sel.steps.length - 1] === [...nexts][0]);
      }
      buzz(8); render(); return;
    }
    // a tap straight on the final square of a single move
    const ends = cands.filter(m => m.to === s);
    if (ends.length === 1) { playYours(ends[0]); return; }
    if (ends.length > 1) { toast('Sem vede víc cest. Ťukni nejdřív na pole, kam kámen skočí.'); return; }
    if (s === sel.from) { sel = null; render(); if (steps) toast('Skok je zrušený, vyber znovu'); return; } // an unfinished capture is not a move yet
    if (steps) { toast('Dokonči skok: ťukni na označené pole, nebo zruš skok tlačítkem Zpět'); return; }
  }
  if (mineHere) {
    if (list.some(m => m.from === s)) { sel = { from: s, steps: [] }; buzz(8); render(); return; }
    sel = null;
    if (must && list[0].king && !has(p.k, s) && manCouldCapture(p, s)) { toast('Brát musí dáma: má přednost před kamenem'); showMust(); render(); return; }
    if (must) { toast('Musíš brát. Kameny, které mohou brát, jsou označené.'); showMust(); render(); return; }
    toast('Tímto kamenem teď nemůžeš táhnout'); render(); return;
  }
  if (theirsHere) { toast(`To je soupeřův kámen. Ty hraješ ${COLOR[G.you]}.`); return; }
  if (sel) { toast(S.show ? 'Sem kámen táhnout nemůže. Kam může, ukazují tečky.' : 'Sem kámen táhnout nemůže'); return; }
  toast('Nejdřív ťukni na svůj kámen');
});
// Undo: back to before your last move, with the opponent's reply (also after the end of the game)
function undoTarget() {

  return -1;
}

  const i = undoTarget();

  stopThinking();
  G.line.length = i + 1; G.quiets.length = i + 1;
  G.last = null; sel = null; hintMv = null;

$('#btnHint').addEventListener('click', () => {

  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
// rule: ask for persistent storage so the browser does not delete the saved game by itself
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const saved = load();
const savedSettings = saved && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
ST = validStats(saved && saved.stats);
// rule: a level chosen just before the app was closed (Settings still open) is applied now, as closing Settings would
if (saved && validGame(saved.game)) { G = saved.game; if (S.level !== G.level && isFresh()) closeSettings(); else { render(); cpuTurn(); } }
else newGame();

window.addEventListener('resize', layout);
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
document.addEventListener('contextmenu', e => e.preventDefault());

// contract: opened from the launcher (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;

// For testing: the engine, the moves of the current position, play one of them (an index), turn the worker off
window.Dama = {
  E, moves: () => E.moves(curPos()), play: i => { const mv = E.moves(curPos())[i]; if (mv && yourTurn() && !busy()) playYours(mv); },
  noWorker() { workerOk = false; if (worker) { try { worker.terminate(); } catch (e) {} worker = null; } },
  get busy() { return busy() || hintBusy; }, get state() { return { S, G, ST }; },
};
})();
</script>
