<!doctype html>
<html lang="cs" data-theme="paper">
<head>
<meta charset="utf-8">
<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4ebdf">
<meta name="mobile-web-app-capable" content="yes">

<title>Přelévání</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316233f'/%3E%3Crect x='12' y='26' width='14' height='28' rx='7' fill='%231f5fd6'/%3E%3Crect x='38' y='18' width='14' height='36' rx='7' fill='%23ffd31a'/%3E%3C/svg%3E">
<style>
/* ---------- Themes ---------- */
[data-theme="night"]{--page:#16233f;--bar:rgba(0,0,0,.25);--line:rgba(255,255,255,.08);--ink:#eef3fb;--soft:#b9c6dc;--accent:#ffd166;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--glass:rgba(225,236,255,.82);--glass-in:rgba(255,255,255,.07);--btn:#ffd166;--btn-ink:#2a2000;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.28)}
[data-theme="slate"]{--page:#2e363e;--bar:rgba(0,0,0,.22);--line:rgba(255,255,255,.08);--ink:#eef3f6;--soft:#c3cdd5;--accent:#7cc4ff;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--glass:rgba(235,240,245,.82);--glass-in:rgba(255,255,255,.07);--btn:#e9eef2;--btn-ink:#1f262c;--btn-sh:#8c979f;--undo-bg:rgba(0,0,0,.26)}
[data-theme="green"]{--page:#1d5236;--bar:rgba(0,0,0,.22);--line:rgba(255,255,255,.08);--ink:#eaf7ee;--soft:#cfe8d7;--accent:#ffd66b;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--glass:rgba(232,248,238,.82);--glass-in:rgba(255,255,255,.07);--btn:#ffd66b;--btn-ink:#2a2200;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.25)}
[data-theme="wine"]{--page:#4d1825;--bar:rgba(0,0,0,.25);--line:rgba(255,255,255,.08);--ink:#fbeaea;--soft:#f0c4c8;--accent:#ffcf70;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--glass:rgba(255,236,238,.82);--glass-in:rgba(255,255,255,.07);--btn:#f3c25e;--btn-ink:#3a1a00;--btn-sh:#9a6a1a;--undo-bg:rgba(0,0,0,.28)}
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.08);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--accent:#c0561a;--chip:rgba(122,69,32,.08);--chip-line:rgba(122,69,32,.24);--glass:rgba(90,50,20,.72);--glass-in:rgba(122,69,32,.05);--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--undo-bg:rgba(122,69,32,.12)}
[data-theme="white"]{--page:#ffffff;--bar:rgba(0,0,0,.04);--line:rgba(0,0,0,.1);--ink:#101418;--soft:#4b5560;--accent:#1f5fd6;--chip:rgba(0,0,0,.06);--chip-line:rgba(0,0,0,.25);--glass:rgba(20,30,40,.78);--glass-in:rgba(0,0,0,.035);--btn:#1f5fd6;--btn-ink:#fff;--btn-sh:#123a85;--undo-bg:rgba(0,0,0,.07)}

/* ---------- Base ---------- */
:root{--tw:56px;--lh:42px;--gut:12px} /* --gut: one side margin; top-bar buttons, the outermost glass and the bottom buttons line up */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}

#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* Top bar */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;letter-spacing:.02em;color:var(--ink);overflow-wrap:normal;word-break:normal;white-space:normal} /* a long name wraps to two lines between words, never inside one (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round svg{width:28px;height:28px;fill:currentColor}
a.round{text-decoration:none}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:6px}
.topbar:has(#btnHome:not([hidden])) .pill{padding:0 12px}
.topbar:has(#btnHome:not([hidden])) .top-right{gap:6px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:20px;letter-spacing:0}
/* narrow phones (360 px): less gap and a slimmer Nová hra pill, so the name keeps whole words; the outer margin stays --gut */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right,.topbar:has(#btnHome:not([hidden])) .top-right{gap:4px}
  .pill,.topbar:has(#btnHome:not([hidden])) .pill{padding:0 8px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px}
}

.info{flex:none;text-align:center;font-size:19px;font-weight:700;color:var(--soft);padding:6px 8px 0;line-height:26px}
.info b{color:var(--ink)}

/* Board */
.board{flex:1;min-height:0;display:flex;overflow:hidden;padding:12px 4px} /* 12 px from the info row and the tray; layout() sizes the tubes inside this padding */
.rows{margin:auto;display:flex;flex-direction:column;align-items:center}
.trow{display:flex;justify-content:center}

/* Tube: the button is the whole column (with gaps), the vial is the glass that lifts */
.tube{position:relative;flex:none;width:calc(var(--tw)*1.3);height:calc(var(--lh)*4 + var(--tw)*.97);padding:0}
.vial{position:absolute;left:50%;bottom:calc(var(--tw)*.125);width:var(--tw);margin-left:calc(var(--tw)/-2);height:calc(var(--lh)*4 + var(--tw)*.42);transition:transform .2s ease-out;transform-origin:50% 30%}
.rim{position:absolute;top:0;left:calc(var(--tw)*-.07);right:calc(var(--tw)*-.07);height:calc(var(--tw)*.1);min-height:4px;border-radius:4px;background:var(--glass)}
.glass{position:absolute;top:calc(var(--tw)*.06);left:0;right:0;bottom:0;border:3px solid var(--glass);border-top:0;border-radius:0 0 calc(var(--tw)/2) calc(var(--tw)/2);background:var(--glass-in);overflow:hidden}
.glass::after{content:"";position:absolute;z-index:2;top:8%;bottom:12%;left:13%;width:11%;border-radius:9px;background:rgba(255,255,255,.28);pointer-events:none}
.liq{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column-reverse}
.layer{flex:none;height:var(--lh);background:var(--c);box-shadow:var(--e,none);display:grid;place-items:center;overflow:hidden}
.layer svg{display:none;width:calc(min(var(--lh),var(--tw))*.48);height:calc(min(var(--lh),var(--tw))*.48);fill:var(--t)}
.show-syms .layer svg{display:block}
.layer.drain{animation:drain .32s ease-in forwards}
.layer.fill{animation:fill .32s ease-out}
@keyframes drain{to{height:0}}
@keyframes fill{from{height:0}}
.cork{position:absolute;z-index:3;top:0;left:9%;right:9%;height:calc(var(--tw)*.3);border-radius:0 0 4px 4px;background:linear-gradient(90deg,#9a6a38,#c99a5e 45%,#a87440);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.cork.pop{animation:cork .3s ease-out}
@keyframes cork{from{transform:translateY(-120%);opacity:0}}
.tube.sel .vial{transform:translateY(calc(var(--tw)*-.3))}
.tube.sel .glass{box-shadow:0 0 0 3px var(--accent),0 0 14px 2px var(--accent)}
.tube.sel .rim{background:var(--accent)}
.tube.sel .vial.tilt-r{transform:translateY(calc(var(--tw)*-.3)) rotate(14deg)}
.tube.sel .vial.tilt-l{transform:translateY(calc(var(--tw)*-.3)) rotate(-14deg)}
.tube.dst .glass{box-shadow:0 0 0 3px var(--accent)}
.won .vial{animation:hop .55s ease-in-out 2}
@keyframes hop{50%{transform:translateY(calc(var(--tw)*-.18))}}

/* Bottom tray */
.tray{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px var(--gut) 12px;background:var(--bar);border-top:1px solid var(--line)}
/* always two lines high: a longer hint wraps instead of being cut, and the board keeps its size when the text changes */
.hint{display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;font-weight:600;line-height:24px;height:48px;overflow:hidden;color:var(--ink)}
.actions{display:flex;gap:10px}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:64px;border-radius:18px;font-size:min(22px,5.6vw);font-weight:800;background:var(--btn);color:var(--btn-ink);box-shadow:0 4px 0 var(--btn-sh);transition:transform .06s,box-shadow .06s,opacity .2s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-sh)}
.big svg{flex:none;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round}
.actions .big{flex:1.75 1 0;min-width:0;padding:0 8px;gap:6px;white-space:nowrap;font-size:min(21px,5.2vw)}
.actions .big svg{width:22px;height:22px}
.undo.dim,.big.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */
.pulse{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04);box-shadow:0 4px 0 var(--btn-sh),0 0 0 4px var(--accent)}}
.undo{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;height:64px;border-radius:16px;font-size:min(21px,5.4vw);font-weight:800;color:var(--ink);background:var(--undo-bg);box-shadow:inset 0 0 0 2px var(--chip-line);transition:opacity .2s,transform .06s}
.undo svg{flex:none;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.undo:active{transform:scale(.98)}

@media (max-height:800px){
  .topbar{height:52px}
  .pill{height:44px}.round{width:44px;height:44px}
  .topbar h1{font-size:24px}
  .info{padding-top:4px}
  .tray{gap:6px;padding:6px var(--gut) 10px}
  .big,.undo{height:58px}
}
@media (prefers-reduced-motion:reduce){
  .vial,.layer.drain,.layer.fill,.cork,.won .vial,.pulse{animation:none!important;transition:none!important}
}

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.paper .big{background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);font-size:22px}
.paper .big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0;box-shadow:0 2px 6px rgba(20,30,50,.12)}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:10px}
.stepper{display:flex;align-items:center;gap:12px}
.sbtn{flex:none;width:60px;height:60px;border-radius:50%;background:var(--pbtn);color:var(--pbtn-ink);font-size:36px;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 3px 0 var(--pbtn-sh)}
.sbtn.dim{background:var(--psw);box-shadow:none;color:var(--psoft)}
.sval{flex:1;text-align:center;font-size:25px;font-weight:800}
.fnote{font-size:18px;color:var(--psoft);margin-top:10px;line-height:1.35}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);display:grid;place-items:center}
.dot svg{width:14px;height:14px;fill:var(--t);display:none}
.show-syms .dot svg{display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{--tw:22px;--lh:13px;height:86px;border-radius:10px;background:var(--page);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.swatch .tube{display:block}
.trow2{display:flex;align-items:center;justify-content:space-between;gap:12px}
.trow2 .flabel{margin:0}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.help p,.help li{font-size:20px;line-height:1.45}
.help ol{padding-left:26px}
.help li{margin:10px 0}

.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
.mbtns{display:flex;flex-direction:column;gap:14px;margin-top:8px}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
</style>
</head>
<body>
<div id="rotate" class="paper" role="status"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="6" width="20" height="36" rx="4"/><path d="M29 36h6"/><path d="M12 46a22 22 0 0 0 40 0"/><path d="m52 46-1.5 7M52 46l-7 2"/></svg><b>Otoč telefon na výšku</b><span>Hra počká, nic se neztratí.</span></div>
<div id="app">
  <header class="topbar">
    <a id="btnHome" class="round" href="../../index.html" aria-label="Zpět na výběr her" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2V20a1 1 0 0 1-1 1H15v-5.5H9V21H4.5a1 1 0 0 1-1-1z"/></svg></a>
    <button id="btnNew" class="pill">Nová hra</button>
    <h1>Přelévání</h1>

  { name: 'červená',       c: '#e0302a', t: '#fff' },
  { name: 'fialová',       c: '#8e3bc4', t: '#fff' },
  { name: 'zelená',        c: '#2fa84f', t: '#fff' },

  { name: 'tyrkysová',     c: '#22c3d6', t: '#003a40' },
  { name: 'růžová',        c: '#ff7eb9', t: '#4a0026' },
  { name: 'hnědá',         c: '#8b5a2b', t: '#fff' },

  'M10 2 18.5 17h-17z',
  'M3 3h14v14H3z',

  { id: 'slate', name: 'Břidlice',     meta: '#2e363e' },
  { id: 'green', name: 'Zelená plsť',  meta: '#1d5236' },

const KEY = 'games.prelevani.state', OLD_KEY = 'prelevani.v1';

/* ---------- Playing ---------- */

    applyPour(G.tubes, a, b);
    sel = null; busy = false; pouring = false;
    if (isDone(G.tubes[b])) popCork = b;
    if (isWon(G.tubes)) {
      G.status = 'won';
      if (level === G.level) level = clamp(G.level + 1, LIMITS.level);
      save(); render();
      buzz([40, 60, 40, 60, 80]);
      const wonGame = G;
      whenFree(wonGame, 1000, () => { if (!busy) showWin(); });
      return;
    }
    if (isDone(G.tubes[b])) buzz([20, 40, 20]);
    save(); render();
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) finish();
  else setTimeout(finish, 360);
}

function showWin() {
  if (G.status !== 'won') return;
  const m = G.moves || 0;
  showModal(`<h2>Výborně! 🎉</h2><p>Úroveň ${G.level} je vyřešená za <b>${m} ${plural(m, 'tah', 'tahy', 'tahů')}</b>.</p>`,
    [{ text: 'Další hra', fn: newGame }, { text: 'Prohlédnout', cls: 'alt' }]);
}

$('#board').addEventListener('click', e => {
  const t = e.target.closest('.tube');
  if (t) tapTube(+t.dataset.i);
  else if (sel !== null && !busy) select(null);
});

$('#btnUndo').addEventListener('click', () => {
  if (busy) { busyToast(); return; }
  if (G.status !== 'playing') { toast('Hotovo! Ťukni na Další hra'); return; }
  if (!G.history.length) { toast('Není co vrátit'); return; }
  G.tubes = G.history.pop();
  G.moves = Math.max(0, (G.moves || 0) - 1);
  sel = null; buzz(); save(); render();
});

$('#btnAdd').addEventListener('click', () => {
  if (busy) { busyToast(); return; }
  if (G.status === 'won') { newGame(); return; }
  if (G.extraUsed) { toast('Zkumavku jde přidat jen jednou za hru'); return; }
  G.tubes.push([]);
  G.history.forEach(h => h.push([]));
  G.extraUsed = true;
  sel = null; buzz(); save(); render();
  toast('Přibyla prázdná zkumavka');
});

$('#btnNew').addEventListener('click', () => {
  if (busy) { busyToast(); return; }
  if (inProgress()) {
    showModal('<h2>Začít novou hru?</h2><p>Rozehraná hra se ztratí.</p>',
      [{ text: 'Ano, nová hra', fn: newGame }, { text: 'Ne, hrát dál', cls: 'alt' }]);
  } else newGame();
});

function showModal(html, buttons) {
  hideToast();
  const card = $('#modalCard');
  card.innerHTML = html + '<div class="mbtns">' + buttons.map((b, i) => `<button class="big ${b.cls || ''}" data-i="${i}">${b.text}</button>`).join('') + '</div>';
  $('#modal').hidden = false;
  card.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    $('#modal').hidden = true;
    const fn = buttons[+b.dataset.i].fn; if (fn) fn();
  };
}

/* ---------- Settings ---------- */
function stepper(key, label, value, canDec, canInc, note) {
  return `<div class="field"><div class="flabel">${label}</div><div class="stepper">
    <button class="sbtn${canDec ? '' : ' dim'}" data-act="dec:${key}" aria-label="Méně">−</button>
    <div class="sval">${value}</div>
    <button class="sbtn${canInc ? '' : ' dim'}" data-act="inc:${key}" aria-label="Více">+</button>
  </div>${note || ''}</div>`;
}
function toggleRow(key, label) {
  return `<div class="field trow2"><div class="flabel">${label}</div><button class="sw" data-act="toggle:${key}" aria-pressed="${S[key]}">${S[key] ? 'Zapnuto' : 'Vypnuto'}</button></div>`;
}
const dotsHTML = n => `<div class="dots">${Array.from({ length: n }, (_, c) => `<span class="dot" style="${colorStyle(c)}" title="${COLORS[c].name}">${symSVG(c)}</span>`).join('')}</div>`;
// A new game is needed after closing the settings when the level changed,
// or when the colour limit changed the number of colours of the current level.
function needsNewGame() {
  if (!G) return false;
  const next = G.status === 'won' ? clamp(G.level + 1, LIMITS.level) : G.level;
  if (level !== next) return true;
  return G.status === 'playing' && colorsFor(G.level, S.maxColors) !== G.colors;
}

function renderSettings() {
  const c = colorsFor(level, S.maxColors);
  const pending = needsNewGame()
    ? `<div class="notice">Po návratu do hry začne <b>nová hra</b>${inProgress() ? ' a rozehraná hra se ztratí' : ''}.</div>` : '';
  const mini = (theme) => `<span class="swatch" data-theme="${theme}">${tubeHTML([0, 1, 1], 0, '', 'span')}${tubeHTML([2, 2, 2, 2], 1, '', 'span')}${tubeHTML([], 2, '', 'span')}</span>`;
  $('#settingsIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Přelévání<small>Nastavení</small></h2></div>
    <section class="card"><h3>Obtížnost</h3>
      ${stepper('level', 'Úroveň', level, level > LIMITS.level[0], level < LIMITS.level[1],
        `<div class="fnote">Na této úrovni ${plural(c, 'je', 'jsou', 'je')} ${c} ${plural(c, 'barva', 'barvy', 'barev')}. Po každé vyřešené hře se úroveň zvýší o jednu a barvy pomalu přibývají.</div>${dotsHTML(c)}`)}
      ${stepper('maxColors', 'Nejvíc barev', S.maxColors, S.maxColors > LIMITS.maxColors[0], S.maxColors < LIMITS.maxColors[1],
        '<div class="fnote">Víc barev už se nepřidá, ani na vyšších úrovních.</div>')}
      ${pending}
    </section>
    <section class="card"><h3>Vzhled</h3>
      <div class="tiles">${THEMES.map(t => `<button class="tile" data-act="theme:${t.id}" aria-pressed="${S.theme === t.id}">${mini(t.id)}${t.name}</button>`).join('')}</div>
      ${toggleRow('syms', 'Značky na barvách')}
      <div class="fnote" style="margin-top:-6px">Pomůže, když se barvy špatně rozlišují.</div>
      ${toggleRow('vibrate', 'Vibrace')}
    </section>
    <button class="big" data-act="close">Zpět ke hře</button>
    <button class="link" data-act="reset">Obnovit výchozí nastavení</button>`;
}

$('#settingsIn').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, arg] = b.dataset.act.split(':');
  if (act === 'inc' || act === 'dec') {
    const d = act === 'inc' ? 1 : -1;
    if (arg === 'level') {
      const v = level + d;
      if (v < LIMITS.level[0]) { toast('Nižší úroveň už není'); return; }
      if (v > LIMITS.level[1]) { toast('Vyšší úroveň už není'); return; }
      level = v;
    } else {
      const v = S.maxColors + d;
      if (v < LIMITS.maxColors[0]) { toast(`Nejméně ${LIMITS.maxColors[0]} barvy`); return; }
      if (v > LIMITS.maxColors[1]) { toast(`Víc než ${LIMITS.maxColors[1]} barev nejde`); return; }
      S.maxColors = v;
    }
  } else if (act === 'theme') S.theme = arg;
  else if (act === 'toggle') S[arg] = !S[arg];
  else if (act === 'reset') { S = normalize(Object.assign({}, DEFAULTS)); toast('Nastavení je zase výchozí'); }
  else if (act === 'close') { closeSettings(); return; }
  buzz(8);
  applyLook(); save(); renderSettings();
});

function openSettings() {
  if (busy) { busyToast(); return; }
  hideToast();
  renderSettings(); $('#screenSettings').hidden = false; $('#screenSettings').scrollTop = 0;
}
// Settings apply right away; a change of the level (or of the colour count) starts a new game here.
function closeSettings() {
  $('#screenSettings').hidden = true;
  const need = needsNewGame(), had = inProgress();
  if (need) {
    const sameLevel = level === (G.status === 'won' ? clamp(G.level + 1, LIMITS.level) : G.level);
    newGame(!had ? `Úroveň ${level}` : sameLevel ? 'Začala nová hra s jiným počtem barev' : 'Začala nová hra s novou úrovní');
  } else render();
}
$('#btnSettings').addEventListener('click', openSettings);

/* ---------- Help ---------- */
function renderHelp() {
  $('#helpIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Přelévání<small>Jak hrát</small></h2></div>
    <section class="card help">
      <ol>
        <li>Ve zkumavkách jsou pomíchané barvy. Přelévej je tak, aby v každé zkumavce byla <b>jen jedna barva</b>.</li>
        <li>Ťukni na zkumavku, ze které se má přelévat – trochu se zvedne. Potom ťukni na zkumavku, kam se má přelít.</li>
        <li>Přelít jde jen do <b>prázdné</b> zkumavky, nebo na <b>stejnou barvu</b>. Do každé zkumavky se vejdou 4 díly.</li>
        <li>Přelije se najednou všechno stejné barvy, co je nahoře a co se vejde.</li>
        <li>Plná zkumavka jedné barvy se zazátkuje – ta je hotová.</li>
        <li>Chyba? Tlačítko <b>Zpět</b> vrátí poslední přelití, klidně i několikrát.</li>
        <li>Když se hra zasekne, ťukni na <b>Přidat zkumavku</b>. Přibude jedna prázdná – ale jen jednou za hru.</li>
        <li>Hra před začátkem ověří, že se dá vyřešit. Po vyřešení přijde další úroveň a barvy pomalu přibývají. <b>Nová hra</b> zamíchá stejnou úroveň znovu.</li>
      </ol>
    </section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
}
$('#helpIn').addEventListener('click', e => {
  if (e.target.closest('[data-act="close"]')) $('#screenHelp').hidden = true;
});
function openHelp() { hideToast(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; }
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
const saved = load();
// rule: only the known settings are taken over from the save
const savedSettings = saved && typeof saved === 'object' && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
S = normalize(S);
level = saved && Number.isInteger(saved.level) ? clamp(saved.level, LIMITS.level) : 1;
if (saved && validGame(saved.game)) {
  G = saved.game;
  // closed while Settings were open after a change that needs a new game: it starts now, as closing Settings would
  if (needsNewGame()) closeSettings(); else render();
}
else { applyLook(); newGame(); } // the saved theme shows while the first game is prepared

window.addEventListener('resize', () => layout(false));
if (window.visualViewport) visualViewport.addEventListener('resize', () => layout(false));
document.addEventListener('contextmenu', e => e.preventDefault());

// Launcher contract: opened from the menu (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) { $('#btnHome').hidden = false; layout(false); }

// Persistent storage: the browser won't evict settings or the saved game on its own
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

// For testing
window.Prelevani = { solve, generate, canPour, usefulMoves, isWon, colorsFor, get state() { return { S, G, level, sel }; } };
})();
</script>
