<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- glass tube: open top, round bottom -->
    <clipPath id="tubeL"><path d="M38 120h96v250a48 48 0 0 1-96 0z"/></clipPath>
    <clipPath id="tubeM"><path d="M208 120h96v250a48 48 0 0 1-96 0z"/></clipPath>
    <clipPath id="tubeR"><path d="M378 120h96v250a48 48 0 0 1-96 0z"/></clipPath>
  </defs>

  <!-- background: the "Noc" theme -->
  <rect width="512" height="512" fill="#16233f"/>

  <!-- left tube: mixed colours, lifted and tilted as if pouring -->
  <g transform="translate(0 -40) rotate(14 86 250)">
    <g clip-path="url(#tubeL)">
      <rect x="38" y="120" width="96" height="320" fill="#fff" fill-opacity=".07"/>
      <rect x="38" y="338" width="96" height="80" fill="#e0302a"/>
      <rect x="38" y="258" width="96" height="80" fill="#1f5fd6"/>
      <rect x="38" y="178" width="96" height="80" fill="#ffd31a"/>
      <rect x="52" y="140" width="11" height="240" rx="5" fill="#fff" fill-opacity=".3"/>
    </g>
    <path d="M38 120v250a48 48 0 0 0 96 0V120" fill="none" stroke="#e1ecff" stroke-width="8"/>
    <rect x="30" y="108" width="112" height="14" rx="6" fill="#ffd166"/>
  </g>

  <!-- middle tube: finished, with a cork -->
  <g clip-path="url(#tubeM)">
    <rect x="208" y="120" width="96" height="320" fill="#fff" fill-opacity=".07"/>
    <rect x="208" y="156" width="96" height="270" fill="#2fa84f"/>
    <rect x="222" y="140" width="11" height="240" rx="5" fill="#fff" fill-opacity=".3"/>
  </g>
  <rect x="216" y="112" width="80" height="44" rx="5" fill="#b8854c"/>
  <rect x="216" y="148" width="80" height="8" fill="#000" fill-opacity=".22"/>
  <path d="M208 120v250a48 48 0 0 0 96 0V120" fill="none" stroke="#e1ecff" stroke-width="8"/>
  <rect x="200" y="108" width="112" height="14" rx="6" fill="#e1ecff"/>

  <!-- right tube: two layers, more coming -->
  <g clip-path="url(#tubeR)">
    <rect x="378" y="120" width="96" height="320" fill="#fff" fill-opacity=".07"/>
    <rect x="378" y="338" width="96" height="80" fill="#1f5fd6"/>
    <rect x="378" y="258" width="96" height="80" fill="#1f5fd6"/>
    <rect x="392" y="140" width="11" height="240" rx="5" fill="#fff" fill-opacity=".3"/>
  </g>
  <path d="M378 120v250a48 48 0 0 0 96 0V120" fill="none" stroke="#e1ecff" stroke-width="8"/>
  <rect x="370" y="108" width="112" height="14" rx="6" fill="#e1ecff"/>
</svg>
