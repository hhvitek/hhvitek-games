<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- background: the "Noc" theme -->
  <rect width="512" height="512" fill="#16233f"/>

  <!-- the parking lot (6×6 cells of 60), frame with the exit in the right edge of the third row -->
  <rect x="40" y="56" width="420" height="400" rx="28" fill="#0d1629"/>
  <rect x="56" y="72" width="360" height="360" rx="10" fill="#2a3a5c"/>
  <g stroke="#ffffff" stroke-opacity=".1" stroke-width="3">
    <path d="M116 72v360M176 72v360M236 72v360M296 72v360M356 72v360"/>
    <path d="M56 132h360M56 192h360M56 252h360M56 312h360M56 372h360"/>
  </g>
  <rect x="414" y="192" width="46" height="60" fill="#2a3a5c"/>
  <path d="M470 196l34 26-34 26z" fill="#ffd166"/>

  <!-- the red car on its way out -->
  <g>
    <rect x="300" y="198" width="132" height="48" rx="15" fill="#e0302a" stroke="#000" stroke-opacity=".3" stroke-width="4"/>
    <rect x="390" y="206" width="14" height="32" rx="4" fill="#1d2a38" opacity=".85"/>
    <rect x="314" y="208" width="10" height="28" rx="3" fill="#1d2a38" opacity=".75"/>
    <rect x="330" y="207" width="54" height="30" rx="5" fill="#fff" opacity=".2"/>
    <rect x="422" y="204" width="5" height="9" rx="2" fill="#fff6c2"/>
    <rect x="422" y="231" width="5" height="9" rx="2" fill="#fff6c2"/>
  </g>

  <!-- a blue truck standing up -->
  <g>
    <rect x="122" y="80" width="48" height="104" rx="6" fill="#2f6fdb" stroke="#000" stroke-opacity=".3" stroke-width="4"/>
    <rect x="122" y="80" width="48" height="104" rx="6" fill="#fff" opacity=".22"/>
    <rect x="124" y="186" width="44" height="54" rx="12" fill="#2f6fdb" stroke="#000" stroke-opacity=".3" stroke-width="4"/>
    <rect x="130" y="214" width="32" height="12" rx="4" fill="#1d2a38" opacity=".85"/>
  </g>

  <!-- a yellow car across the top -->
  <g>
    <rect x="182" y="78" width="108" height="48" rx="15" fill="#f2c230" stroke="#000" stroke-opacity=".3" stroke-width="4"/>
    <rect x="248" y="86" width="14" height="32" rx="4" fill="#1d2a38" opacity=".85"/>
    <rect x="196" y="88" width="10" height="28" rx="3" fill="#1d2a38" opacity=".75"/>
  </g>

  <!-- a green car standing up -->
  <g>
    <rect x="302" y="258" width="48" height="108" rx="15" fill="#2fa36b" stroke="#000" stroke-opacity=".3" stroke-width="4"/>
    <rect x="310" y="324" width="32" height="14" rx="4" fill="#1d2a38" opacity=".85"/>
    <rect x="312" y="272" width="28" height="10" rx="3" fill="#1d2a38" opacity=".75"/>
  </g>

  <!-- a white car at the bottom -->
  <g>
    <rect x="62" y="378" width="108" height="48" rx="15" fill="#ecebe6" stroke="#000" stroke-opacity=".3" stroke-width="4"/>
    <rect x="128" y="386" width="14" height="32" rx="4" fill="#1d2a38" opacity=".85"/>
    <rect x="76" y="388" width="10" height="28" rx="3" fill="#1d2a38" opacity=".75"/>
  </g>
</svg>
