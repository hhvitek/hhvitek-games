<meta charset="utf-8">
<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>

<style>
/* ---------- Themes: a solid colour; everything below reads these variables (rule) ---------- */
[data-theme="night"]{--page:#16233f;--bar:rgba(0,0,0,.25);--line:rgba(255,255,255,.08);--ink:#eef3fb;--soft:#b9c6dc;--accent:#ffd166;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--btn:#ffd166;--btn-ink:#2a2000;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.28);--frame:#0d1629;--lot:#2a3a5c;--grid:rgba(255,255,255,.1);--blk:#8fa6cf;--target:#e0302a}
[data-theme="slate"]{--page:#2e363e;--bar:rgba(0,0,0,.22);--line:rgba(255,255,255,.08);--ink:#eef3f6;--soft:#c3cdd5;--accent:#7cc4ff;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--btn:#e9eef2;--btn-ink:#1f262c;--btn-sh:#8c979f;--undo-bg:rgba(0,0,0,.26);--frame:#1b2025;--lot:#47525c;--grid:rgba(255,255,255,.11);--blk:#b9c5cf;--target:#e0302a}
[data-theme="green"]{--page:#1d5236;--bar:rgba(0,0,0,.22);--line:rgba(255,255,255,.08);--ink:#eaf7ee;--soft:#cfe8d7;--accent:#ffd66b;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--btn:#ffd66b;--btn-ink:#2a2200;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.25);--frame:#0f321e;--lot:#2f6b4a;--grid:rgba(255,255,255,.11);--blk:#d9c88f;--target:#e0302a}
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.08);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--accent:#c0561a;--chip:rgba(122,69,32,.08);--chip-line:rgba(122,69,32,.24);--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--undo-bg:rgba(122,69,32,.1);--frame:#7a4520;--lot:#e7d9c6;--grid:rgba(122,69,32,.16);--blk:#a8784a;--target:#d8312a}
[data-theme="white"]{--page:#ffffff;--bar:rgba(0,0,0,.04);--line:rgba(0,0,0,.1);--ink:#101418;--soft:#4b5560;--accent:#1f5fd6;--chip:rgba(0,0,0,.06);--chip-line:rgba(0,0,0,.25);--btn:#1f5fd6;--btn-ink:#fff;--btn-sh:#123a85;--undo-bg:rgba(0,0,0,.07);--frame:#5d6873;--lot:#e6eaef;--grid:rgba(0,0,0,.11);--blk:#5f86c4;--target:#d8312a}

/* ---------- Base ---------- */
:root{--gut:12px} /* one side margin: top-bar buttons, the lot and the bottom buttons line up */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
/* rule: 100dvh + safe areas, the board is sized from the room that is left (see layout()) */
#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Top bar (rule: home, Nová hra, <h1> name, ?, settings) ---------- */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;color:var(--ink);overflow-wrap:normal;word-break:normal;white-space:normal} /* a long name wraps to two lines between words, never inside one (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);text-decoration:none}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:8px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:20px}
/* narrow phones (360 px): less gap and a slimmer Nová hra pill, so the name keeps whole words; the outer margin stays --gut */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill{padding:0 8px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px}
}

/* ---------- Score row (rule: info goes on its own row, not in place of the name) ---------- */
.stats{flex:none;text-align:center;padding:8px 8px 0;font-size:20px;font-weight:700;line-height:1.3;color:var(--soft)}
.stats b{color:var(--ink)}

/* ---------- GAME: the parking lot ---------- */
#board{flex:1;min-height:0;display:grid;place-items:center;padding:12px var(--gut)} /* 12 px from the score row and the tray too; layout() sizes the lot inside this padding */
#lot{position:relative;background:var(--frame);border-radius:calc(var(--cs)*.22);overflow:hidden;touch-action:none;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.cells{position:absolute;background-color:var(--lot);border-radius:calc(var(--cs)*.08);
  background-image:linear-gradient(to right,var(--grid) 2px,transparent 2px),linear-gradient(to bottom,var(--grid) 2px,transparent 2px);
  background-size:var(--cs) var(--cs);background-position:-1px -1px}
.exit{position:absolute;background:var(--lot);display:grid;place-items:center}
.exit svg{width:70%;height:50%;fill:var(--accent)}
.pc{position:absolute;left:0;top:0;border-radius:calc(var(--cs)*.2);transition:transform .2s ease-out}
.pc .car{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pc.blocks{background:var(--blk);box-shadow:inset 0 calc(var(--cs)*-.07) 0 rgba(0,0,0,.22),inset 0 calc(var(--cs)*.05) 0 rgba(255,255,255,.25)}
.pc.blocks.target{background:var(--target)}
.pc .ar{display:none;position:absolute;left:50%;top:50%;width:calc(var(--cs)*.52);height:calc(var(--cs)*.26);transform:translate(-50%,-50%)}
.pc.v .ar{transform:translate(-50%,-50%) rotate(90deg)}
.pc .ar path{fill:rgba(255,255,255,.92);stroke:rgba(0,0,0,.5);stroke-width:1.6;stroke-linejoin:round}
.show-arrows .pc .ar{display:block}
.pc.sel{outline:4px solid var(--accent);outline-offset:2px;z-index:2}
.pc.hinted{outline:4px solid var(--accent);outline-offset:2px;animation:blink 1.1s ease-in-out infinite;z-index:2}
@keyframes blink{50%{outline-color:transparent}}
.pc.dragging{transition:none;z-index:3}
.pc.out{transition:transform .9s ease-in}
.dot{position:absolute;width:calc(var(--cs)*.3);height:calc(var(--cs)*.3);margin:calc(var(--cs)*-.15) 0 0 calc(var(--cs)*-.15);border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,.3);pointer-events:none}
.ghost{position:absolute;border:4px dashed var(--accent);border-radius:calc(var(--cs)*.2);pointer-events:none}
.won-glow #lot{box-shadow:0 0 0 4px var(--accent),0 6px 18px rgba(0,0,0,.28)}

/* ---------- Bottom buttons ---------- */
.tray{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px var(--gut) 12px;background:var(--bar);border-top:1px solid var(--line)}
#hint{text-align:center;font-size:19px;font-weight:600;line-height:1.3;color:var(--ink);min-height:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:10px}
.undo{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;height:64px;border-radius:16px;font-size:21px;font-weight:800;color:var(--ink);background:var(--undo-bg);box-shadow:inset 0 0 0 2px var(--chip-line)}
.undo svg{flex:none;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.go{flex:1.4 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;height:64px;border-radius:16px;font-size:21px;font-weight:800;background:var(--btn);color:var(--btn-ink);box-shadow:0 4px 0 var(--btn-sh);white-space:nowrap}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-sh)}
.go svg{flex:none;width:26px;height:26px;fill:currentColor}
/* rule: an unavailable action is only dimmed and explains itself when tapped */
.undo.dim,.go.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */

@media (max-height:800px){
  .topbar{height:54px}
  .stats{padding-top:6px}
  .tray{gap:6px;padding:6px var(--gut) 10px}
  .undo,.go{height:58px}
}
@media (prefers-reduced-motion:reduce){
  .pc,.pc.out,.pc.hinted{transition:none!important;animation:none!important}
}

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
/* rule: the head with Zpět and the game name stays at the top while scrolling */
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);margin-top:16px}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.stepper{display:flex;align-items:center;gap:12px}
.sbtn{flex:none;width:60px;height:60px;border-radius:50%;background:var(--pbtn);color:var(--pbtn-ink);font-size:36px;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 3px 0 var(--pbtn-sh)}
.sbtn.dim{background:var(--psw);box-shadow:none;color:var(--psoft)}
.sval{flex:1;text-align:center;font-size:25px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
/* a small parking lot in the theme / look tiles */
.mini{--cs:26px;position:relative;display:block;height:68px;border-radius:10px;background:var(--frame);overflow:hidden}
.mini .cells{left:8px;top:8px;right:8px;bottom:8px}
.mini .ar{width:16px;height:8px}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.help p,.help li{font-size:20px;line-height:1.45}
.help ol{padding-left:26px}
.help li{margin:10px 0}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;line-height:1.35;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px Georgia,"Times New Roman",serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
</style>
</head>

<div id="app">
  <header class="topbar">
    <!-- contract: the home button is hidden and shown only when opened from the launcher (?menu) -->
    <a id="btnHome" class="round" href="../../index.html" aria-label="Zpět na výběr her" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2V20a1 1 0 0 1-1 1H15v-5.5H9V21H4.5a1 1 0 0 1-1-1z"/></svg></a>
    <button id="btnNew" class="pill">Nová hra</button>
    <h1>Cesta ven</h1>

      <button id="btnHelp" class="round" aria-label="Jak hrát">?</button>

    </div>
  </header>
  <div class="stats" id="stats">&nbsp;</div>
  <main id="board"><div id="lot"></div></main>
  <footer class="tray">
    <div id="hint"></div>
    <div class="row">
      <button id="btnUndo" class="undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Zpět</button>
      <button id="btnGo" class="go"></button>
    </div>
  </footer>
</div>
<!-- Every layer is shown and hidden only through its hidden attribute; every screen has a [data-act="close"] button (Back button contract) -->
<div id="screenSettings" class="screen paper" hidden><div class="screen-in" id="settingsIn"></div></div>
<div id="screenHelp" class="screen paper" hidden><div class="screen-in" id="helpIn"></div></div>
<div id="modal" class="modal paper" hidden><div class="mcard" id="modalCard"></div></div>
<div id="toast" class="hide"></div>
<script>
/* ---------- Visible height ---------- */
// The game is exactly as tall as the part of the window that is really shown (--app-h on #app). 100dvh alone is not
// enough: some browsers report it taller than what is visible (the app installed by Brave on Android counted the
// status and navigation bars too and hid the bottom buttons). visualViewport follows what is shown; it is measured
// again on every change and shortly after loading (a browser bar that hides itself may change it without an event),

function pieceXY(i, v) {
  const p = G.pieces[i], { cs, pad, gp } = geo;
  const c = p.h ? v : p.f, r = p.h ? p.f : v;
  return [pad + c * cs + gp, pad + r * cs + gp];
}
const xf = ([x, y]) => `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
const pieceEl = i => $('#lot').querySelector(`.pc[data-i="${i}"]`);
function posOnLot(i) { return i === 0 && G.status === 'won' ? N + 1 : G.pos[i]; }

function build() {
  const { cs, pad, padr, gp } = geo, lot = $('#lot');
  lot.style.width = (N * cs + pad + padr) + 'px';
  lot.style.height = (N * cs + 2 * pad) + 'px';
  let html = `<div class="cells" style="left:${pad}px;top:${pad}px;width:${N * cs}px;height:${N * cs}px"></div>`
    + `<div class="exit" style="left:${pad + N * cs - 2}px;top:${pad + EXIT_ROW * cs}px;width:${padr + 2}px;height:${cs}px"><svg viewBox="0 0 10 16" aria-hidden="true"><path d="M1 1l8 7-8 7z"/></svg></div>`
    + '<div id="marks"></div>';
  G.pieces.forEach((p, i) => {
    html += `<div class="pc ${S.look}${i === 0 ? ' target' : ''}${p.h ? '' : ' v'}" data-i="${i}" role="img" aria-label="${pieceLabel(p, i)}"`
      + ` style="width:${p.h ? p.len * cs - 2 * gp : cs - 2 * gp}px;height:${p.h ? cs - 2 * gp : p.len * cs - 2 * gp}px;transform:${xf(pieceXY(i, posOnLot(i)))}">${pieceInner(p, i, S.look)}</div>`;
  });
  lot.innerHTML = html;
  built = { pieces: G.pieces, look: S.look, cs, padr };
}
// moves the pieces where they belong (with a short slide) and draws the selection dots and the hint
function place() {
  const { cs, pad } = geo;
  G.pieces.forEach((p, i) => {
    const el = pieceEl(i);
    el.classList.toggle('out', i === 0 && G.status === 'won');
    el.classList.remove('dragging');
    el.style.transform = xf(pieceXY(i, posOnLot(i)));
    el.classList.toggle('sel', i === sel);
    el.classList.toggle('hinted', !!hint && hint.i === i);
  });
  let marks = '';
  if (sel !== null) for (const c of reachable(sel)) {
    marks += `<span class="dot" style="left:${pad + (c % N + .5) * cs}px;top:${pad + ((c / N | 0) + .5) * cs}px"></span>`;
  }
  if (hint) {
    const p = G.pieces[hint.i], [x, y] = pieceXY(hint.i, hint.to), gp = geo.gp;
    marks += `<span class="ghost" style="left:${x}px;top:${y}px;width:${p.h ? p.len * cs - 2 * gp : cs - 2 * gp}px;height:${p.h ? cs - 2 * gp : p.len * cs - 2 * gp}px"></span>`;
  }
  $('#marks').innerHTML = marks;
}
function renderHint() {
  const w = S && W();
  $('#hint').textContent = busy || !G ? 'Připravuji hru…'
    : G.status === 'won' ? 'Vyřešeno! 🎉 Cesta je volná.'
    : hint && (sel === null || sel === hint.i) ? `Posuň ${w.hinted}`
    : sel !== null ? `Ťukni na tečku, kam ${S.look === 'cars' ? 'má jet' : 'se má posunout'}`
    : `Dostaň ${w.red} ven vpravo`;
}
function render() {
  applyLook();
  renderHint();
  if (!G) return;
  const won = G.status === 'won';
  $('#stats').innerHTML = `Úroveň <b>${G.level}</b> · Tahy: <b>${G.history.length}</b>${G.min ? ` · Nejméně: <b>${G.min}</b>` : ''}`;
  $('#btnUndo').classList.toggle('dim', busy || won || !G.history.length);
  $('#btnGo').innerHTML = won ? nextLabel()
    : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2zm-3 18h6v1a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1z"/></svg>Poradit';
  $('#btnGo').classList.toggle('dim', busy);
  layout();
}
// rule: the lot size comes from the room that is left, so it fits without scrolling
function layout() {
  if (!G) return;
  const b = $('#board'), bs = getComputedStyle(b);
  const w = b.clientWidth - parseFloat(bs.paddingLeft) - parseFloat(bs.paddingRight);    // without the side margin (--gut)
  const h = b.clientHeight - parseFloat(bs.paddingTop) - parseFloat(bs.paddingBottom) - 2;   // 12 px above and below; 2 px for rounding the frame
  const room = Math.min(w, h * (N + PAD + PADR) / (N + 2 * PAD));
  // at least 45 px (0.8 cm) on every phone, comfortable to tap; only a very short window (desktop) shrinks it further rather than overflow
  const cs = Math.max(24, Math.min(110, Math.floor(room / (N + PAD + PADR))));
  const pad = Math.round(cs * PAD);
  let padr = Math.round(cs * PADR);
  if (room >= w) padr = Math.max(padr, Math.floor(w - N * cs - pad));   // the width decides: the exit side takes the rest, so the lot fills the width up to the margin
  geo = { cs, pad, padr, gp: Math.max(2, Math.round(cs * 0.05)) };
  root.style.setProperty('--cs', cs + 'px');
  if (!built || built.pieces !== G.pieces || built.look !== S.look || built.cs !== cs || built.padr !== geo.padr) build();
  place();
}

/* ---------- Playing ---------- */
// free cells piece i can reach (dots when it is selected)
function reachable(i) {
  const p = G.pieces[i], [lo, hi] = range(G.pieces, G.pos, i), out = [];
  for (let v = lo; v < G.pos[i]; v++) out.push(cellOf(p, v));
  for (let v = G.pos[i] + p.len; v < hi + p.len; v++) out.push(cellOf(p, v));
  return out;
}
function doMove(i, v) {
  if (v === G.pos[i]) { render(); return; }
  G.history.push(G.pos.slice());
  G.pos[i] = v; sel = null; hint = null;
  if (G.pos[0] === GOAL) {
    G.status = 'won';
    level = clampLevel(G.level + 1);
    hideToast();   // e.g. "1 move left" from the hint
    save(); render();
    buzz([40, 60, 40, 60, 80]);
    // rule: an end dialog only for the game that ended (not over a new game started meanwhile)
    const g0 = G;
    whenFree(g0, reducedMotion() ? 400 : 1300, () => { if (!busy) showWin(); });
    return;
  }
  buzz(); save(); render();
}
function showWin() {
  const m = G.history.length, best = G.min && m <= G.min;
  showModal(`<h2>Výborně! 🎉</h2><p>Úroveň ${G.level} je vyřešená za <b>${movesWord(m)}</b>.</p>`
    + (best ? '<p>Rychleji to nejde!</p>' : G.min ? `<p>Nejméně to jde za ${movesWord(G.min)}.</p>` : ''),
    [{ text: nextLabel(), fn: () => newGame() }, { text: 'Prohlédnout', cls: 'alt' }]);
}
// after a win: the next level, or at the hardest level another puzzle of it
const nextLabel = () => G.level < MAX_LEVEL ? 'Další úroveň' : 'Další úloha';
const wonToast = () => toast(`Vyřešeno – ťukni na ${nextLabel()}`);

function tapPiece(i) {
  if (hint && hint.i === i) { doMove(i, hint.to); return; }     // a tap on the hinted piece does the hinted move
  if (sel === i) { sel = null; buzz(8); render(); return; }
  const [lo, hi] = range(G.pieces, G.pos, i);
  if (lo === hi) {
    sel = null; render();
    toast(`${i === 0 ? (S.look === 'cars' ? 'Červené auto' : 'Červená kostka') : W().this} se teď nemůže pohnout`);
    return;
  }
  sel = i; buzz(8); render();
}
function tapCell(c) {
  if (hint && (sel === null || sel === hint.i)) {   // a tap on the dashed place does the hinted move too (unless another piece is selected)
    const p = G.pieces[hint.i];
    for (let j = 0; j < p.len; j++) if (cellOf(p, hint.to + j) === c) { doMove(hint.i, hint.to); return; }
  }
  if (sel === null) return;
  const p = G.pieces[sel], v0 = G.pos[sel];
  if (reachable(sel).includes(c)) {
    const t = p.h ? c % N : (c / N | 0);
    doMove(sel, t < v0 ? t : t - p.len + 1);   // slide just so far that it covers the tapped cell
  } else { sel = null; render(); }
}

// One pointer handler for dragging and tapping. A drag moves the piece only along its axis, inside its free range.
const lotXY = e => { const r = $('#lot').getBoundingClientRect(); return [e.clientX - r.left - geo.pad, e.clientY - r.top - geo.pad]; };
$('#lot').addEventListener('pointerdown', e => {
  if (drag || e.button > 0 || !G) return;
  if (busy) { busyToast(); return; }
  if (G.status !== 'playing') { wonToast(); return; }
  const el = e.target.closest('.pc'), [x, y] = lotXY(e);
  const i = el ? +el.dataset.i : -1;
  drag = { pid: e.pointerId, x0: e.clientX, y0: e.clientY, i, moved: false, off: 0, x, y,
    range: i >= 0 ? range(G.pieces, G.pos, i) : null };
  try { $('#lot').setPointerCapture(e.pointerId); } catch (err) {}
});
$('#lot').addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid || drag.i < 0) return;
  const p = G.pieces[drag.i], v = G.pos[drag.i], cs = geo.cs;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 10) return;
    if (drag.range[0] === drag.range[1]) return;   // a piece that cannot move: a tap message on release
    drag.moved = true;
    if (sel !== null && sel !== drag.i) { sel = null; place(); }
    pieceEl(drag.i).classList.add('dragging');
  }
  const d = p.h ? e.clientX - drag.x0 : e.clientY - drag.y0;
  drag.off = Math.max((drag.range[0] - v) * cs, Math.min((drag.range[1] - v) * cs, d));
  const [x, y] = pieceXY(drag.i, v);
  pieceEl(drag.i).style.transform = xf(p.h ? [x + drag.off, y] : [x, y + drag.off]);
});
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag; drag = null;
  if (cancel) { render(); return; }
  if (d.moved) {
    doMove(d.i, G.pos[d.i] + Math.round(d.off / geo.cs));
  } else if (d.i >= 0) tapPiece(d.i);
  else {
    const c = Math.floor(d.x / geo.cs), r = Math.floor(d.y / geo.cs);
    if (c >= 0 && c < N && r >= 0 && r < N) tapCell(r * N + c);
    else if (sel !== null) { sel = null; render(); }
  }
}
$('#lot').addEventListener('pointerup', e => endDrag(e, false));
$('#lot').addEventListener('pointercancel', e => endDrag(e, true));
// a tap next to the lot drops the selection
$('#board').addEventListener('click', e => {
  if (!e.target.closest('#lot') && G && sel !== null) { sel = null; render(); }
});

// rule: Undo ("Zpět") wherever it makes sense; when unavailable it says why
$('#btnUndo').addEventListener('click', () => {
  if (busy) { busyToast(); return; }
  if (G.status !== 'playing') { wonToast(); return; }
  if (!G.history.length) { toast('Zatím není co vrátit'); return; }
  G.pos = G.history.pop(); sel = null; hint = null;
  buzz(); save(); render();
});
$('#btnGo').addEventListener('click', () => {
  if (busy) { busyToast(); return; }
  if (G.status === 'won') { newGame(); return; }
  const m = nextMove(G.pieces, G.pos);
  if (!m) { toast('Poradit se teď nepovedlo, zkus Zpět'); return; }
  hint = { i: m.i, to: m.to }; sel = null;
  buzz(8); render();
  toast(`Ven to jde ještě nejméně za ${movesWord(m.left)}`);
});
// rule: a new game in the middle of one asks first
$('#btnNew').addEventListener('click', () => {
  if (busy) return;
  if (inProgress()) {
    showModal('<h2>Začít novou hru?</h2><p>Rozehraná úloha se ztratí.</p>', [
      { text: 'Nová úloha', fn: () => newGame() },
      { text: 'Tuhle znovu od začátku', cls: 'alt', fn: restart },
      { text: 'Ne, hrát dál', cls: 'alt' }]);
  } else newGame();
});

/* ---------- Settings (rule: a separate screen, applied at once, no Save button) ---------- */
const toggleRow = (key, label) => `<div class="field trow"><div class="flabel">${label}</div><button class="sw" data-act="toggle:${key}" aria-pressed="${S[key]}">${S[key] ? 'Zapnuto' : 'Vypnuto'}</button></div>`;
// a small lot with a red piece and two others, in the given theme and look
function mini(theme, look) {
  const cs = 26, gp = 2;   // = .mini --cs; four cells wide, so it fits the narrowest tile
  const pcs = [[{ f: 0, len: 2, h: true }, 0, 0, 0], [{ f: 0, len: 3, h: true }, 1, 1, 1]];
  const html = pcs.map(([p, i, c, r]) => `<span class="pc ${look}${i === 0 ? ' target' : ''}" style="width:${p.len * cs - 2 * gp}px;height:${cs - 2 * gp}px;transform:translate(${8 + c * cs + gp}px,${8 + r * cs + gp}px);transition:none">${pieceInner(p, i, look)}</span>`).join('');
  return `<span class="mini" data-theme="${theme}"><span class="cells"></span>${html}</span>`;
}
function renderSettings() {
  const w = movesFor(level);
  $('#settingsIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Cesta ven<small>Nastavení</small></h2></div>
    <section class="card"><h3>Obtížnost</h3>
      <div class="field"><div class="flabel">Úroveň</div><div class="stepper">
        <button class="sbtn${level > 1 ? '' : ' dim'}" data-act="dec" aria-label="Nižší úroveň">−</button>
        <div class="sval">${level}</div>
        <button class="sbtn${level < MAX_LEVEL ? '' : ' dim'}" data-act="inc" aria-label="Vyšší úroveň">+</button>
      </div>
      <div class="fnote">Úloha na této úrovni jde vyřešit nejméně za ${movesWord(w)}. ${level >= MAX_LEVEL ? 'Tohle je nejtěžší úroveň, další úlohy jsou stejně těžké.' : 'Po každé vyřešené úloze se úroveň zvýší o jednu.'}</div>
      ${openLevel !== null && level !== openLevel ? `<div class="notice">Po návratu do hry začne <b>nová úloha</b> s novou úrovní${inProgress() ? ' a rozehraná úloha se ztratí' : ''}.</div>` : ''}
      </div>
    </section>
    <section class="card"><h3>Vzhled</h3>
      <div class="field"><div class="flabel">Kousky</div>
        <div class="tiles">${LOOKS.map(l => `<button class="tile" data-act="look:${l.id}" aria-pressed="${S.look === l.id}">${mini(S.theme, l.id)}${l.name}</button>`).join('')}</div>
      </div>
      <div class="field"><div class="flabel">Barvy</div>
        <div class="tiles">${THEMES.map(t => `<button class="tile" data-act="theme:${t.id}" aria-pressed="${S.theme === t.id}">${mini(t.id, S.look)}${t.name}</button>`).join('')}</div>
      </div>
      ${toggleRow('arrows', 'Šipky na kouscích')}
      <div class="fnote" style="margin-top:-6px">Ukazují, kterým směrem se dá kousek posunout.</div>
      ${toggleRow('vibrate', 'Vibrace')}
    </section>
    <button class="big" data-act="close">Zpět ke hře</button>
    <button class="link" data-act="reset">Obnovit výchozí nastavení</button>`;
}
$('#settingsIn').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, arg] = b.dataset.act.split(':');
  if (act === 'close') { closeSettings(); return; }
  if (act === 'dec' || act === 'inc') {
    const v = level + (act === 'inc' ? 1 : -1);
    if (v < 1) { toast('Nižší úroveň už není'); return; }
    if (v > MAX_LEVEL) { toast('Vyšší úroveň už není'); return; }
    level = v;
  }
  else if (act === 'look') S.look = arg;
  else if (act === 'theme') S.theme = arg;
  else if (act === 'toggle') S[arg] = !S[arg];
  else if (act === 'reset') { S = Object.assign({}, DEFAULTS); toast('Nastavení je zase výchozí'); }
  normalize(S); buzz(8); applyLook(); save();
  const y = $('#screenSettings').scrollTop; renderSettings(); $('#screenSettings').scrollTop = y;
});
function openSettings() {
  if (busy) { busyToast(); return; }
  hideToast(); openLevel = level;
  renderSettings(); $('#screenSettings').hidden = false; $('#screenSettings').scrollTop = 0;
}
// a change of the level starts a new puzzle after returning and says so (rule)
function closeSettings() {
  $('#screenSettings').hidden = true;
  const changed = openLevel !== null && level !== openLevel, had = inProgress();
  openLevel = null;
  if (changed) newGame(had ? 'Začala nová úloha s novou úrovní' : `Úroveň ${level}`);
  else render();
}
$('#btnSettings').addEventListener('click', openSettings);

/* ---------- Help (rule: only behind "?", never opens by itself) ---------- */
function renderHelp() {
  const cars = S.look === 'cars';
  $('#helpIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Cesta ven<small>Jak hrát</small></h2></div>
    <section class="card help"><ol>
      <li>${cars ? 'Na parkovišti stojí auta.' : 'Na desce leží kostky.'} Dostaň <b>${cars ? 'červené auto' : 'červenou kostku'}</b> ven otvorem vpravo.</li>
      <li>${cars ? 'Auta jezdí' : 'Kostky se posouvají'} jen po délce: vodorovné doleva a doprava, svislé nahoru a dolů.${S.arrows ? ' Ukazují to šipky.' : ''}</li>
      <li>Chyť ${cars ? 'auto' : 'kostku'} prstem a táhni. Nebo na ${cars ? 'něj' : 'ni'} ťukni a potom ťukni na tečku, kam ${cars ? 'má jet' : 'se má posunout'}.</li>
      <li>Jedno posunutí, klidně o několik políček, je jeden tah. Nahoře je vidět, za kolik tahů to jde nejméně.</li>
      <li><b>Zpět</b> vrátí poslední tah, dá se ťukat opakovaně.</li>
      <li><b>Poradit</b> ukáže, ${cars ? 'kterým autem' : 'kterou kostkou'} pohnout a kam. Ťukni na ${cars ? 'zvýrazněné auto' : 'zvýrazněnou kostku'} a posune se ${cars ? 'samo' : 'sama'}.</li>
      <li>Každá úloha jde vyřešit a nikam se nespěchá. Po vyřešení přijde další úroveň, o trochu těžší, až po nejtěžší úroveň ${MAX_LEVEL}. <b>Nová hra</b> připraví jinou úlohu stejné úrovně (po vyřešené úloze už úlohu další úrovně).</li>
    </ol></section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
}
function openHelp() { hideToast(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; }
$('#helpIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenHelp').hidden = true; });
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
// rule: ask for persistent storage so the browser does not delete the saved game by itself
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const saved = load();
const savedSettings = saved && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
level = saved && Number.isInteger(saved.level) ? clampLevel(saved.level) : 1;
// contract: opened from the launcher (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;
applyLook();
if (saved && validGame(saved.game)) {
  G = saved.game;
  // the level was changed in Settings and the page closed before returning: apply it now, as closing Settings would
  // (after a win the expected level is the next one, so only a real change in Settings starts another level)
  if (level !== (G.status === 'won' ? clampLevel(G.level + 1) : G.level)) newGame(inProgress() ? 'Začala nová úloha s novou úrovní' : `Úroveň ${level}`);
  else render();
}
else newGame();

window.addEventListener('resize', layout);
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
document.addEventListener('contextmenu', e => e.preventDefault());

// For testing
window.CestaVen = { generate, analyse, nextMove, randomBoard, movesFor, decode, encode, BANK, get state() { return { S, G, level, sel, hint }; } };
})();
</script>
</body>
</html>
