<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>

<style>
/* ---------- Themes: a solid colour (felt in a wooden frame); everything below reads these variables ---------- */
[data-theme="green"]{--page:#163d27;--bar:rgba(0,0,0,.22);--line:rgba(255,255,255,.08);--ink:#eef7f0;--soft:#c5dccb;--accent:#ffd66b;--chip:rgba(255,255,255,.1);--chip-line:rgba(255,255,255,.18);--btn:#ffd66b;--btn-ink:#2a2200;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.25);--felt:#2a7346;--wood:#c8955a;--die:#fbfaf6;--pip:#1c1c1c;--die-sh:#b9b4a6}
[data-theme="blue"]{--page:#132a45;--bar:rgba(0,0,0,.24);--line:rgba(255,255,255,.08);--ink:#eaf2fb;--soft:#c6d8ee;--accent:#ffd166;--chip:rgba(255,255,255,.1);--chip-line:rgba(255,255,255,.18);--btn:#ffd166;--btn-ink:#2a2000;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.28);--felt:#26578c;--wood:#c8955a;--die:#fbfaf6;--pip:#1c1c1c;--die-sh:#b9b4a6}
[data-theme="burgundy"]{--page:#3a1018;--bar:rgba(0,0,0,.26);--line:rgba(255,255,255,.08);--ink:#fbeaea;--soft:#f0c4c8;--accent:#ffcf70;--chip:rgba(255,255,255,.1);--chip-line:rgba(255,255,255,.18);--btn:#f3c25e;--btn-ink:#3a1a00;--btn-sh:#9a6a1a;--undo-bg:rgba(0,0,0,.3);--felt:#7a2335;--wood:#b8834c;--die:#fbfaf6;--pip:#1c1c1c;--die-sh:#b9b4a6}
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.08);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--accent:#c0561a;--chip:rgba(122,69,32,.07);--chip-line:rgba(122,69,32,.24);--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--undo-bg:rgba(122,69,32,.1);--felt:#e7d9c6;--wood:#c9a57a;--die:#fff;--pip:#2b1a0e;--die-sh:#c9b49a}
[data-theme="paper"] #table{box-shadow:inset 0 0 0 8px var(--wood),inset 0 0 0 9px rgba(63,34,14,.2),inset 0 6px 14px rgba(63,34,14,.3)} /* a lighter shadow on the light felt */
[data-theme="night"]{--page:#0e1013;--bar:rgba(0,0,0,.35);--line:rgba(255,255,255,.06);--ink:#e6e8eb;--soft:#a9b0b9;--accent:#6fb7ff;--chip:rgba(255,255,255,.08);--chip-line:rgba(255,255,255,.16);--btn:#6fb7ff;--btn-ink:#0a1a2a;--btn-sh:#2e6aa3;--undo-bg:rgba(0,0,0,.35);--felt:#1d2b3a;--wood:#4a3d31;--die:#dcd9d2;--pip:#111;--die-sh:#8d897f}

/* ---------- Base ---------- */
:root{--gut:12px;--ds:80px;--ks:44px} /* one side margin: top-bar buttons, panels, the table and the bottom buttons line up */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
#app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Top bar ---------- */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;color:var(--ink);overflow-wrap:normal;word-break:normal;white-space:normal} /* a long name wraps to two lines between words, never inside one (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);text-decoration:none}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:8px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:20px}
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill{padding:0 8px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px}
}

/* ---------- Player panels: the opponent at the top, the player at the bottom ---------- */
.pl{flex:none;margin:0 var(--gut);display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:18px;background:var(--chip);box-shadow:inset 0 0 0 2px var(--chip-line);transition:box-shadow .25s}
.pl.on{box-shadow:inset 0 0 0 3px var(--accent),0 0 14px color-mix(in srgb,var(--accent) 40%,transparent)}
#pOpp{margin-top:10px}
.ava{flex:none;width:58px;height:58px;border-radius:50%;background:var(--undo-bg);overflow:hidden;display:grid;place-items:center}
.ava svg{width:100%;height:100%}
#pMe .ava{color:var(--accent)}
.mid{flex:1;min-width:0}
.nm{font-size:20px;font-weight:800;line-height:1.2;display:flex;flex-wrap:wrap;align-items:center;column-gap:8px}
.tag{font-size:18px;font-weight:700;line-height:1.3;padding:0 9px;border-radius:12px;background:var(--accent);color:var(--page);white-space:nowrap}
.bubble{position:relative;margin:6px 0 0 8px;padding:5px 10px;border-radius:12px;background:var(--die);color:var(--pip);font-size:18px;line-height:1.25;min-height:33px}
.bubble::before{content:"";position:absolute;left:-8px;top:9px;border:8px solid transparent;border-left:0;border-right-color:var(--die)}
.sub{font-size:18px;color:var(--soft);line-height:1.3;margin-top:2px}
.sc{flex:none;min-width:88px;text-align:right}
.sc b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.sc small{display:block;font-size:18px;color:var(--soft);line-height:1.2}
.bar{display:block;height:8px;border-radius:4px;background:var(--undo-bg);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}

/* ---------- Table: felt in a wooden frame; set-aside strips at each player's side, the rolled dice in the middle ---------- */
#table{flex:1;min-height:0;margin:12px var(--gut);border-radius:20px;background:var(--felt);padding:14px 16px;
  box-shadow:inset 0 0 0 8px var(--wood),inset 0 0 0 9px rgba(0,0,0,.25),inset 0 6px 18px rgba(0,0,0,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.strip{flex:none;width:100%;height:calc(var(--ks) + 10px);display:flex;align-items:center;justify-content:center;gap:calc(var(--ks)*.18)}
.center{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#roll{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:calc(var(--ds)*.22)}
#turnLine{flex:none;font-size:20px;font-weight:700;line-height:1.3;color:var(--ink);text-align:center;min-height:26px}
#turnLine b{font-size:22px}
.die{--d:var(--ds);flex:none;position:relative;width:var(--d);height:var(--d);border-radius:18%;background:var(--die);padding:calc(var(--d)*.1);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  box-shadow:inset 0 calc(var(--d)*-.06) 0 rgba(0,0,0,.12),0 calc(var(--d)*.06) calc(var(--d)*.12) rgba(0,0,0,.45);transition:transform .18s,opacity .2s,box-shadow .18s}
/* sizes from --d: a % padding or margin would be taken from the parent's width and shrink the pips */
.die i{margin:calc(var(--d)*.03);border-radius:50%}
.die i.on{background:var(--pip);box-shadow:inset 0 calc(var(--d)*.02) calc(var(--d)*.02) rgba(0,0,0,.45)}
.strip .die{--d:var(--ks);box-shadow:inset 0 calc(var(--d)*-.06) 0 rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.35)}
#roll .die.sel{transform:translateY(-10%);box-shadow:0 0 0 calc(var(--d)*.07) var(--accent),0 calc(var(--d)*.12) calc(var(--d)*.16) rgba(0,0,0,.5)}
#roll .die.dead{opacity:.42}
#roll .die.blank{opacity:.35}
#roll .die.blank::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font:700 calc(var(--d)*.5)/1 Georgia,"Times New Roman",serif;color:var(--pip)}
.die.rolling{animation:tumble .16s ease-in-out infinite alternate}
.die.rolling:nth-child(2n){animation-delay:-.08s}
@keyframes tumble{from{transform:rotate(-16deg) translateY(-8%)}to{transform:rotate(18deg) translateY(6%)}}

/* ---------- Bottom buttons ---------- */
#pMe{margin-bottom:10px}
.tray{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px var(--gut) 12px;background:var(--bar);border-top:1px solid var(--line)}
#hint{text-align:center;font-size:19px;line-height:1.3;color:var(--soft);min-height:25px}
.row{display:flex;gap:10px}
.undo{flex:.8 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;height:64px;border-radius:16px;font-size:20px;font-weight:800;color:var(--ink);background:var(--undo-bg);box-shadow:inset 0 0 0 2px var(--chip-line)}
.undo svg{flex:none;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.go{flex:1.1 1 0;min-width:0;height:64px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;background:var(--btn);color:var(--btn-ink);box-shadow:0 4px 0 var(--btn-sh);transition:transform .06s,box-shadow .06s}
.go span{font-size:22px;font-weight:800}
.go small{font-size:18px;font-weight:700}
.go.bank{background:var(--die);color:var(--pip);box-shadow:0 4px 0 var(--die-sh)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-sh)}
/* an unavailable action is only dimmed and explains itself when tapped */
.undo.dim,.go.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */
@media (max-width:380px){ .undo svg{display:none} }

/* short screens (about 393×760 and less): smaller panels, so the dice keep their size */
@media (max-height:800px){
  .pl{padding:6px 10px}
  #pOpp{margin-top:8px}
  #table{margin:10px var(--gut);padding:12px 14px}
  .ava{width:48px;height:48px}
  .sc b{font-size:26px}
  .sc small{font-size:16px}
  .bubble{margin-top:4px;padding:4px 9px;min-height:31px}
  .round{width:42px;height:42px}
  .pill{height:42px}
}

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);margin-top:16px}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{font-size:18px;color:var(--psoft);line-height:1.3}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{height:60px;border-radius:10px;background:var(--felt);box-shadow:inset 0 0 0 7px var(--wood),inset 0 0 0 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:8px}
.swatch .mdie{width:30px;height:30px;border-radius:6px;background:var(--die);display:grid;place-items:center}
.swatch .mdie::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--pip)}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.srow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:20px}
.srow b{font-size:22px}
.help p,.help li{font-size:20px;line-height:1.45}
.help ol{padding-left:26px}
.help li{margin:10px 0}
.pts{width:100%;border-collapse:collapse;font-size:20px;margin-top:4px}
.pts td{padding:8px 4px;border-top:2px solid var(--pline);vertical-align:top}
.pts td:last-child{text-align:right;font-weight:800;white-space:nowrap}
.pts tr:first-child td{border-top:0}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 200px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;line-height:1.35;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px Georgia,"Times New Roman",serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
</style>

<script src="../_opponents/opponents.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;

/* ---------- Settings and storage ---------- */
const ID = 'kostky';
const KEY = `games.${ID}.state`, BADGE = `games.${ID}.inProgress`; // contract: storage key and the "Rozehráno" badge
const THEMES = [
  { id: 'green',    name: 'Zelené sukno', meta: '#163d27' },
  { id: 'blue',     name: 'Modré sukno',  meta: '#132a45' },
  { id: 'burgundy', name: 'Vínové sukno', meta: '#3a1018' },
  { id: 'paper',    name: 'Papír',        meta: '#f4ebdf' },
  { id: 'night',    name: 'Noc',          meta: '#0e1013' },
];
const TARGETS = [3000, 5000, 10000];
const SPEEDS = { slow: 1700, normal: 1150, fast: 650 }; // one step of the opponent in ms
// How well the opponent plays (levels 0, 1, 2); shown as stars next to its name (games/_opponents/opponents.js)
const O = OPPONENTS;
const LEVELS = [
  { title: 'Začátečník', desc: 'Hraje, jak ho napadne. Často riskuje, i když nemá.' },
  { title: 'Zkušený hráč', desc: 'Ví, kdy přestat. Občas to ale stejně zkusí.' },
  { title: 'Mistr', desc: 'Počítá šance. Riskuje, jen když se to vyplatí.' },
];
const lvName = i => O.levelName(LEVELS, i);
// Every game the opponent gets another name and face (user's wish), whatever its level: O.create(rnd, [previous name])
const DEFAULTS = { level: 1, target: 5000, speed: 'normal', hints: false, theme: 'paper', vibrate: true };
const MIN_BANK = 350; // the turn total needed to write the points down

/* ---------- Game logic: scoring (the user's rules: variant 2 of "Pravidla her v kostky", without three pairs) ---------- */
const rnd = n => { try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); } };
const pick = a => a[rnd(a.length)];
// The dice and the opponent's choices come from G.seed (saved after every step), so a reload continues exactly there
function rand01(g) {
  g.seed = (g.seed + 0x6D2B79F5) | 0;
  let t = g.seed; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const counts = vals => { const c = [0, 0, 0, 0, 0, 0, 0]; for (const v of vals) c[v]++; return c; };
const isStraight = vals => vals.length === 6 && counts(vals).every((x, f) => !f || x === 1);
// Points of a set of dice counts: three or more of a kind = face × 100 (1s: 1 000), doubled for every die over three;
// single 1 = 100, single 5 = 50. 0 when some die does not score (e.g. two 2s).
function scoreCounts(c) {
  let p = 0;
  for (let f = 1; f <= 6; f++) {
    const k = c[f]; if (!k) continue;
    if (k >= 3) p += (f === 1 ? 1000 : f * 100) * 2 ** (k - 3);
    else if (f === 1) p += 100 * k;
    else if (f === 5) p += 50 * k;
    else return 0;
  }
  return p;
}
const score = vals => !vals.length ? 0 : isStraight(vals) ? 1500 : scoreCounts(counts(vals));
const hasScore = vals => { const c = counts(vals); return c[1] > 0 || c[5] > 0 || c.some(x => x >= 3); };
// Every set of dice that may be set aside from a roll: { k: counts, pts, used }
function keepOptions(c, n) {
  const out = [], k = [0, 0, 0, 0, 0, 0, 0];
  (function rec(f) {
    if (f > 6) { const used = k.reduce((s, x) => s + x, 0); if (used) out.push({ k: k.slice(), pts: scoreCounts(k), used }); return; }
    for (let x = 0; x <= c[f]; x++) { if (x && x < 3 && f !== 1 && f !== 5) continue; k[f] = x; rec(f + 1); }
    k[f] = 0;
  })(1);
  if (n === 6 && c.every((x, f) => !f || x === 1)) out.push({ k: [0, 1, 1, 1, 1, 1, 1], pts: 1500, used: 6 });
  return out;
}
// The same for a roll, with the indices of the dice
function keepsOf(dice) {
  return keepOptions(counts(dice), dice.length).map(o => {
    const left = o.k.slice(), idx = [];
    dice.forEach((v, i) => { if (left[v] > 0) { left[v]--; idx.push(i); } });
    return { idx, pts: o.pts, used: o.used };
  });
}

/* ---------- Game logic: the opponent ---------- */
// "Mistr" knows the expected value of every situation of a turn: R[n][t/50] = the points a turn is worth on average
// when n dice are about to be rolled with t points already at stake, played as well as possible from there.
const CAP = 12000; // above any turn of a 10 000 game, so the table never guesses
let OUT = null, R = null;
function solve() {
  if (R) return;
  OUT = [null];
  const fact = [1, 1, 2, 6, 24, 120, 720];
  for (let n = 1; n <= 6; n++) {
    const list = [], c = [0, 0, 0, 0, 0, 0, 0];
    (function rec(f, left) {
      if (f === 6) {
        c[6] = left;
        let p = fact[n]; for (let i = 1; i <= 6; i++) p /= fact[c[i]];
        const best = new Array(n + 1).fill(0);
        for (const o of keepOptions(c, n)) if (o.pts > best[o.used]) best[o.used] = o.pts;
        if (best.some(x => x)) list.push({ p: p / 6 ** n, best });
        return;
      }
      for (let x = 0; x <= left; x++) { c[f] = x; rec(f + 1, left - x); }
      c[f] = 0;
    })(1, n);
    OUT.push(list);
  }
  R = Array.from({ length: 7 }, () => new Float64Array(CAP / 50 + 1));
  for (let ti = CAP / 50 - 1; ti >= 0; ti--) {
    for (let n = 1; n <= 6; n++) {
      let ev = 0;
      for (const o of OUT[n]) {
        let b = 0;
        for (let u = 1; u <= n; u++) if (o.best[u]) b = Math.max(b, after(n - u, ti * 50 + o.best[u]));
        ev += o.p * b;
      }
      R[n][ti] = ev;
    }
  }
}
// The value of having t points with `left` dice left: write them down or roll on, whichever is better
// (no dice left = all six scored: they must be rolled again; under MIN_BANK the turn must go on)
function after(left, t) {
  if (t >= CAP) return t;
  const hot = left === 0, r = R[hot ? 6 : left][t / 50];
  return hot || t < MIN_BANK ? r : Math.max(t, r);
}
// The "Zkušená" rule of thumb: triples always, single 1s and 5s only as few as needed while many dice stay
function expertKeep(dice, ks) {
  const all = ks.filter(k => k.used === dice.length);
  if (all.length) return all.reduce((a, b) => b.pts > a.pts ? b : a);
  const c = counts(dice), want = [0, 0, 0, 0, 0, 0, 0];
  for (let f = 1; f <= 6; f++) if (c[f] >= 3) want[f] = c[f];
  const singles = [];
  if (c[1] < 3) for (let i = 0; i < c[1]; i++) singles.push(1);
  if (c[5] < 3) for (let i = 0; i < c[5]; i++) singles.push(5);
  const base = want.reduce((s, x) => s + x, 0);
  if (!base) { want[singles[0]]++; if (dice.length - 1 <= 2) for (const v of singles.slice(1)) want[v]++; }
  else if (dice.length - base <= 2) for (const v of singles) want[v]++;
  return ks.find(k => counts(k.idx.map(i => dice[i])).every((x, f) => x === want[f])) || ks[0];
}
// One decision of the opponent: which dice to set aside, then roll on or write the points down.
// c = { dice, turnPts, my, opp, target, last (this is the last turn of the game) }; rng() gives 0..1.
// "bold" = it rolls although it would rather not (a human decision: "risknu to").
function aiDecide(level, c, rng) {
  const ks = keepsOf(c.dice);
  let k, plan, bold = false;
  const left = k0 => c.dice.length - k0.used, total = k0 => c.turnPts + k0.pts;
  if (level === 0) {
    k = ks[Math.floor(rng() * ks.length)];
  } else if (level === 1) {
    k = expertKeep(c.dice, ks);
  } else {
    solve();
    let best = -1;
    for (const k0 of ks) {
      const t = total(k0), l = left(k0);
      let v = after(l, t);
      if (l && t >= MIN_BANK && (c.last ? c.my + t > c.opp : c.my + t >= c.target)) v = 1e6 + t; // enough to win: take it
      if (v > best) { best = v; k = k0; }
    }
  }
  // A win in hand is never missed: the weaker levels choose their dice by a rule of thumb (one 1 instead of 1 1),
  // so when some dice win the game now (the target, or more than the player on the last turn), they take those
  const wins = k0 => left(k0) && total(k0) >= MIN_BANK && (c.last ? c.my + total(k0) > c.opp : c.my + total(k0) >= c.target);
  if (level < 2 && !wins(k)) for (const k0 of ks) if (wins(k0) && (!wins(k) || k0.pts > k.pts)) k = k0;
  const t = total(k), l = left(k), mustRoll = l === 0 || t < MIN_BANK;
  if (mustRoll) plan = 'roll';
  else if (c.last) plan = c.my + t > c.opp ? 'bank' : 'roll';       // the last turn: roll on until ahead (even Pepík)
  else if (c.my + t >= c.target) plan = 'bank';                     // the target reached: even Pepík writes it down
  else if (level === 0) { plan = rng() < 0.5 ? 'bank' : 'roll'; bold = plan === 'roll' && t >= 600; }
  else if (level === 1) {
    let thr = [0, 350, 350, 400, 700, 1500][l];
    if (c.target - c.opp <= 600 && c.opp > c.my + t) thr *= 1.6;      // behind and the opponent is about to win: risk more
    plan = t >= thr ? 'bank' : 'roll';
    if (t >= thr * 0.75 && t <= thr * 1.4 && rng() < 0.18) { plan = plan === 'bank' ? 'roll' : 'bank'; bold = plan === 'roll'; }
  } else {
    let risk = 1;
    if (c.target - c.opp <= 700 && c.opp > c.my + t) risk = 1.35;     // behind and the opponent is close: risk more
    else if (c.my + t - c.opp >= 1500) risk = 0.92;                   // far ahead: a little careful
    const rollV = t >= CAP ? t : R[l][t / 50];
    const d = (rollV * risk - t) / Math.max(t, 300);
    const p = 1 / (1 + Math.exp(-d / 0.05));                          // close calls sometimes go the other way
    plan = rng() < p ? 'roll' : 'bank';
    bold = plan === 'roll' && p < 0.5;
  }
  // Writing the points down: every level first sets aside all it can (6 6 6 1 1 = 800, not only the sixes for 600).
  // Fewer dice are kept only to roll more of them on; when banking that would just throw points away.
  // At least one die stays (all six scoring must be rolled again), so the plan stays 'bank'.
  if (plan === 'bank') for (const k0 of ks) if (left(k0) && k0.pts > k.pts) k = k0;
  return { idx: k.idx, pts: k.pts, plan, bold };
}
// AI against AI without the screen (for testing the levels): wins of level a, of level b, draws
function simulate(a, b, games = 1000, target = 5000) {
  const g = { seed: 987654321 }, rng = () => rand01(g), res = { a: 0, b: 0, draw: 0 };
  for (let gi = 0; gi < games; gi++) {
    const lv = [a, b], sc = [0, 0], starter = gi % 2;
    let p = starter, final = false;
    for (let turns = 0; turns < 2000; turns++) {
      let t = 0, n = 6;
      for (;;) {
        const dice = Array.from({ length: n }, () => 1 + Math.floor(rng() * 6));
        if (!hasScore(dice)) { t = 0; break; }
        const d = aiDecide(lv[p], { dice, turnPts: t, my: sc[p], opp: sc[1 - p], target, last: final }, rng);
        t += d.pts; n = dice.length - d.idx.length || 6;
        if (d.plan === 'bank') break;
      }
      sc[p] += t;
      if (final || (p !== starter && sc[p] >= target)) break;
      if (p === starter && sc[p] >= target) final = true;
      p = 1 - p;
    }
    if (sc[0] > sc[1]) res.a++; else if (sc[1] > sc[0]) res.b++; else res.draw++;
  }
  return res;
}

/* ---------- State ---------- */
// G: rules {level, target}; scores [player, opponent]; turn 0 = the player, 1 = the opponent; starter; final = the
// starter reached the target and the other one plays the last turn; dice = the rolled dice on the table; kept = dice
// set aside in this turn; sel = selected dice (indices); selUndo = earlier selections (Zpět); turnPts = points set aside;
// phase start | pick | chosen (the opponent has chosen) | bust | over; plan = the opponent's decision; say/mood = its bubble
let S, G, stats = {}, busy = false, rollTimer = 0;
const rulesKey = r => `${r.target}-${r.level}`;
const isFresh = () => G.rolls === 0;
const inProgress = () => G && G.status === 'playing' && !isFresh();
const foe = (g = G) => g.foe;
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ settings: S, game: G, stats }));
    if (G.status === 'playing' && !isFresh()) localStorage.setItem(BADGE, '1'); else localStorage.removeItem(BADGE);
  } catch (e) {} // storage may be full or blocked; the game goes on
}
const statusOf = g => g.phase !== 'over' ? 'playing' : g.scores[0] > g.scores[1] ? 'won' : g.scores[0] < g.scores[1] ? 'lost' : 'draw';
const isPts = x => Number.isInteger(x) && x >= 0 && x % 50 === 0;
const isDie = v => Number.isInteger(v) && v >= 1 && v <= 6;
const validSel = (s, n) => Array.isArray(s) && new Set(s).size === s.length && s.every(i => Number.isInteger(i) && i >= 0 && i < n);
// lost games are not stored: every played game is won, lost or a draw
const losses = s => s.played - s.won - s.draw;
const validStat = s => !!s && typeof s === 'object' && ['played', 'won', 'draw'].every(k => Number.isInteger(s[k]) && s[k] >= 0) && s.won + s.draw <= s.played;
// Corrupted data never crashes the game; the end is derived from the scores, not trusted from the save
function validGame(g) {
  try {
    if (!g || !g.rules || !TARGETS.includes(g.rules.target) || ![0, 1, 2].includes(g.rules.level)) return false;
    if (!Array.isArray(g.scores) || g.scores.length !== 2 || !g.scores.every(isPts)) return false;
    if (![0, 1].includes(g.turn) || ![0, 1].includes(g.starter) || typeof g.final !== 'boolean') return false;
    if (!Array.isArray(g.dice) || !g.dice.every(isDie) || !Array.isArray(g.kept) || !g.kept.every(isDie) || g.dice.length + g.kept.length > 6) return false;
    if (!isPts(g.turnPts) || !Number.isInteger(g.rolls) || g.rolls < 0) return false;
    if (!['start', 'pick', 'chosen', 'bust', 'over'].includes(g.phase)) return false;
    if (['pick', 'chosen', 'bust'].includes(g.phase) && !g.dice.length) return false;
    if (g.phase === 'pick' && !hasScore(g.dice)) return false;
    if (g.phase === 'bust' && hasScore(g.dice)) return false;
    if (g.phase === 'over' && Math.max(...g.scores) < g.rules.target) return false;
    if (g.phase === 'chosen' && (g.turn !== 1 || !['roll', 'bank'].includes(g.plan) || !validSel(g.sel, g.dice.length) || !score(g.sel.map(i => g.dice[i])))) return false;
    if (!Number.isInteger(g.seed)) g.seed = rnd(2 ** 31);
    if (g.phase !== 'chosen' && (g.phase !== 'pick' || !validSel(g.sel, g.dice.length))) g.sel = [];
    if (!Array.isArray(g.selUndo) || !g.selUndo.every(s => validSel(s, g.dice.length))) g.selUndo = [];
    if (g.phase !== 'pick') g.selUndo = [];
    g.lost = isPts(g.lost) ? g.lost : 0;
    g.say = typeof g.say === 'string' ? g.say.slice(0, 120) : '';
    g.mood = ['calm', 'happy', 'sad', 'think'].includes(g.mood) ? g.mood : 'calm';
    g.counted = g.counted === true;
    if (!O.valid(g.foe)) g.foe = O.create(rnd);
    g.status = statusOf(g);
    if (g.status !== 'playing') g.counted = true;
    return true;
  } catch (e) { return false; }
}
function normalize(s) {
  s.level = [0, 1, 2].includes(+s.level) ? +s.level : DEFAULTS.level;
  s.target = TARGETS.includes(+s.target) ? +s.target : DEFAULTS.target;
  if (!(s.speed in SPEEDS)) s.speed = DEFAULTS.speed;
  s.hints = !!s.hints; s.vibrate = !!s.vibrate;
  if (!THEMES.some(t => t.id === s.theme)) s.theme = DEFAULTS.theme;
}
function newGame(msg) {
  stopRolling();
  const starter = G ? 1 - G.starter : 0; // the player starts the first game, then it alternates
  const foeNew = O.create(rnd, G && G.foe ? [G.foe.name] : []);
  G = { rules: { level: S.level, target: S.target }, scores: [0, 0], turn: starter, starter, final: false,
        foe: foeNew, dice: [], kept: [], sel: [], selUndo: [], turnPts: 0, lost: 0, phase: 'start', plan: null, rolls: 0,
        seed: rnd(2 ** 31), say: '', mood: 'calm', status: 'playing', counted: false };
  G.say = starter ? pick(['Začínám já.', 'Tak já začnu.']) : pick(['Začínáš ty. Hodně štěstí!', 'Ty začínáš.']);
  save(); render();
  if (msg) toast(msg);
  advance();
}
// A finished game goes into the statistics of its variant once (its first end)
function recordEnd() {
  if (G.counted) return;
  G.counted = true;
  const k = rulesKey(G.rules), st = stats[k] ? { ...stats[k] } : { played: 0, won: 0, draw: 0 };
  st.played++;
  if (G.status === 'won') st.won++; else if (G.status === 'draw') st.draw++;
  stats[k] = st;
}

/* ---------- Helpers ---------- */
function buzz(ms = 12) {
  // Chrome refuses vibration (with a console error) before the first real tap
  if (!S.vibrate || !navigator.vibrate || (navigator.userActivation && !navigator.userActivation.hasBeenActive)) return;
  try { navigator.vibrate(ms); } catch (e) {}
}
let toastT;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hide');
  // above the player's panel, so the scores stay visible
  const me = $('#pMe').getBoundingClientRect();
  if (me.height) t.style.bottom = Math.round(innerHeight - me.top + 10) + 'px';
  clearTimeout(toastT); toastT = setTimeout(hideToast, ms);
}
function hideToast() { $('#toast').classList.add('hide'); }
// rule: an end dialog belongs to the game that ended and never opens over Settings, Help or another dialog:
// whenFree waits until they are closed, then runs fn - if the game is still the same (not a new one meanwhile)
const nothingOpen = () => ['#modal', '#screenSettings', '#screenHelp', '#screenCredits'].every(s => { const el = document.querySelector(s); return !el || el.hidden; });
function whenFree(g0, ms, fn) {
  setTimeout(function wait() {
    if (G !== g0) return;
    if (nothingOpen()) fn(); else setTimeout(wait, 400);

        ${opt('speed:normal', S.speed === 'normal', 'Normálně', '')}
        ${opt('speed:fast', S.speed === 'fast', 'Rychle', '')}
      </div>
    </section>
    <section class="card"><h3>Nápověda</h3>
      ${toggleRow('hints', 'Ukazovat bodované kostky')}
      <div class="fnote" style="margin-top:-6px">Kostky, které nic nedávají, jsou ztmavené.</div>
    </section>
    <section class="card"><h3>Vzhled</h3>
      <div class="tiles">${THEMES.map(t => `<button class="tile" data-act="theme:${t.id}" aria-pressed="${S.theme === t.id}"><span class="swatch" data-theme="${t.id}"><span class="mdie"></span><span class="mdie"></span></span>${t.name}</button>`).join('')}</div>
      ${toggleRow('vibrate', 'Vibrace')}
    </section>
    <section class="card"><h3>Statistika</h3>
      <div class="fnote" style="margin:0 0 6px">Soupeř ${lvName(S.level).toLowerCase()}, hra do ${fmt(S.target)} bodů</div>
      <div class="srow"><span>Odehrané hry</span><b>${st ? st.played : 0}</b></div>
      <div class="srow"><span>Výhry</span><b>${st ? st.won : 0}</b></div>
      <div class="srow"><span>Prohry</span><b>${st ? losses(st) : 0}</b></div>
      <div class="srow"><span>Remízy</span><b>${st ? st.draw : 0}</b></div>
      <button class="link" data-act="clearStats">Smazat statistiku</button>
    </section>
    <button class="big" data-act="close">Zpět ke hře</button>
    <button class="link" data-act="reset">Obnovit výchozí nastavení</button>`;
}
$('#settingsIn').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, arg] = b.dataset.act.split(':');
  if (act === 'close') { closeSettings(); return; }
  if (act === 'clearStats') {
    showModal('<h2>Smazat statistiku?</h2><p>Smažou se výsledky proti všem soupeřům.</p>', [
      { text: 'Ano, smazat', fn: () => { stats = {}; save(); renderSettings(); toast('Statistika je smazaná'); } },
      { text: 'Ne, nechat', cls: 'alt' }]);
    return;
  }
  if (act === 'level') S.level = +arg;
  else if (act === 'target') S.target = +arg;
  else if (act === 'speed') S.speed = arg;
  else if (act === 'theme') S.theme = arg;
  else if (act === 'toggle') S[arg] = !S[arg];
  else if (act === 'reset') { S = Object.assign({}, DEFAULTS); toast('Nastavení je zase výchozí'); }
  normalize(S); buzz(8); applyLook(); save();
  const y = $('#screenSettings').scrollTop; renderSettings(); $('#screenSettings').scrollTop = y;
});
function openSettings() { hideToast(); renderSettings(); $('#screenSettings').hidden = false; $('#screenSettings').scrollTop = 0; }
// A new opponent or target: a game in progress is played to the end, otherwise a new game starts (and says so)
function closeSettings() {
  $('#screenSettings').hidden = true;
  const changed = S.level !== G.rules.level || S.target !== G.rules.target;
  if (changed && !inProgress()) newGame(!isFresh() ? 'Začala nová hra s novým nastavením' : '');
  else { render(); advance(); }
}
$('#btnSettings').addEventListener('click', openSettings);

/* ---------- Help (only behind "?", never opens by itself) ---------- */
function renderHelp() {
  const f = foe();
  $('#helpIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Kostky<small>Jak hrát</small></h2></div>
    <section class="card help"><ol>
      <li>Hraješ proti soupeři (teď ${f.name} ${O.stars(G.rules.level, LEVELS.length)}). Střídáte se. Kdo první dosáhne <b>${fmt(G.rules.target)} bodů</b>, vyhrává. Když tam první dojde ten, kdo začínal, druhý má ještě <b>poslední pokus</b>.</li>
      <li>Ťukni na <b>Hodit</b> (nebo rovnou na kostky). Pak ťukni na kostky, které bodují. Tři stejné se vyberou jedním ťuknutím.</li>
      <li>Potom se rozhodni: <b>Hodit znovu</b> zbylými kostkami, nebo body z tahu <b>Zapsat</b>. Zapsat jde až od <b>${MIN_BANK} bodů</b> v tahu.</li>
      <li>Když v hodu nepadne nic, co boduje, <b>body z celého tahu propadnou</b> a hraje soupeř. Proto je dobré vědět, kdy přestat.</li>
      <li>Když bodují <b>všechny kostky</b>, hází se znovu všemi šesti a body se sčítají dál. Zapsat je hned nejde, musí se hodit.</li>
      <li>Body platí jen z jednoho hodu: trojice musí padnout najednou.</li>
      <li><b>Zpět</b> zruší výběr kostek v tomto hodu. Hozené kostky vrátit nejde.</li>
      <li>Soupeř hraje sám. Když otevřeš Nastavení nebo tuto nápovědu, počká. Nikam se nespěchá.</li>
    </ol></section>
    <section class="card help"><h3>Kolik co dává</h3>
      <table class="pts">
        <tr><td>Jednička</td><td>100</td></tr>
        <tr><td>Pětka</td><td>50</td></tr>
        <tr><td>Tři jedničky</td><td>1 000</td></tr>
        <tr><td>Tři stejné (dvojky až šestky)</td><td>číslo × 100</td></tr>
        <tr><td>Čtyři stejné</td><td>2× víc než tři</td></tr>
        <tr><td>Pět stejných</td><td>4× víc než tři</td></tr>
        <tr><td>Šest stejných</td><td>8× víc než tři</td></tr>
        <tr><td>Postupka 1 2 3 4 5 6</td><td>1 500</td></tr>
      </table>
      <p class="fnote">Příklad: tři šestky = 600, čtyři šestky = 1 200, čtyři jedničky = 2 000. Tři dvojice se nepočítají.</p>
    </section>
    <section class="card help"><h3>Soupeři</h3>
      ${LEVELS.map((x, i) => `<p><b>${lvName(i)}:</b> ${x.desc}</p>`).join('')}
      <p>Soupeř má v každé hře jiné jméno. Jak dobře hraje, ukazují hvězdičky u jména a volí se v Nastavení.</p>
    </section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
}
function openHelp() { hideToast(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; }
$('#helpIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenHelp').hidden = true; });
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
// ask for persistent storage so the browser does not delete the saved game by itself
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const saved = load();
const savedSettings = saved && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
if (saved && saved.stats && typeof saved.stats === 'object') {
  for (const [k, v] of Object.entries(saved.stats)) if (/^(3000|5000|10000)-[012]$/.test(k) && validStat(v)) stats[k] = { played: v.played, won: v.won, draw: v.draw };
}
if (saved && validGame(saved.game)) {
  G = saved.game;
  // a new opponent or target chosen just before the app was closed: applied now, as closing Settings would
  if ((S.level !== G.rules.level || S.target !== G.rules.target) && !inProgress()) newGame(!isFresh() ? 'Začala nová hra s novým nastavením' : '');
  else { render(); advance(); }
}
else newGame();

window.addEventListener('resize', layout);
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
document.addEventListener('contextmenu', e => e.preventDefault());

// contract: opened from the launcher (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;

// For testing
window.Kostky = { score, keepsOf, aiDecide, simulate, solve, get R() { solve(); return R; }, get state() { return { S, G, stats }; } };
})();
</script>
