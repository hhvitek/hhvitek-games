<!doctype html>
<html lang="cs" data-table="paper" data-back="nachod" data-face="white">
<head>
<meta charset="utf-8">
<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4ebdf">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prší">
<title>Prší</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231e7135'/%3E%3Crect x='9' y='16' width='26' height='38' rx='4' fill='%23fff' transform='rotate(-12 22 35)'/%3E%3Crect x='29' y='16' width='26' height='38' rx='4' fill='%23fff' transform='rotate(12 42 35)'/%3E%3Cpath d='M42 45c-7-5-11-9-11-14 0-3 2-5 5-5 2 0 4 1 6 3 2-2 4-3 6-3 3 0 5 2 5 5 0 5-4 9-11 14z' fill='%23d0101c'/%3E%3Cpath d='M14 4q3 5 0 7-3-2 0-7zM30 2q3 5 0 7-3-2 0-7zM48 5q3 5 0 7-3-2 0-7z' fill='%239fd3ff'/%3E%3C/svg%3E">
<style>

/* ---------- Base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--tex),var(--grain,none),var(--tbl)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}

#app{--gut:12px;height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;line-height:1.05;font-weight:800;font-size:28px;color:var(--ink)} /* no nowrap/overflow: a long title wraps between words, never gets cut */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--btn);font-size:18px;font-weight:700;color:var(--btn-ink);box-shadow:inset 0 0 0 2px var(--line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--btn);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--btn-ink);box-shadow:inset 0 0 0 2px var(--line)}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
a.round{text-decoration:none}
.topbar:has(#btnHome:not([hidden])){gap:8px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:clamp(18px,4.9vw,24px)}

/* ---------- The win tally: one row under the top bar (who won how many games while the game is open) ---------- */
/* a scoreboard, not buttons: one panel like the opponents' boxes, cells divided by lines, no fill or shadow of their own */
#score{flex:none;display:grid;grid-template-columns:auto repeat(var(--n,3),minmax(0,1fr));margin:10px var(--gut) 0;border-radius:14px;background:var(--bar);border:2px solid var(--line);color:var(--ink);overflow:hidden}
#score > span{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:4px 6px;white-space:nowrap}
#score > span + span{border-left:2px solid var(--line)}
#score .lbl{padding:0 12px;font-size:19px;font-weight:800}
#score .who{font-size:18px;font-weight:600;line-height:1.2}
#score .who.me{font-weight:800}
#score .who b{font-size:26px;font-weight:900;line-height:1.05;color:var(--accent)}
[data-table="sand"] #score .who b{color:var(--ink)}

/* ---------- Opponents ---------- */
#opps{flex:none;display:flex;gap:10px;padding:10px var(--gut) 0}
.opp{flex:1 1 0;min-width:0;border-radius:14px;padding:6px 10px 6px;background:var(--bar);box-shadow:inset 0 0 0 2px var(--line);color:var(--ink);display:flex;flex-direction:column;--op-ava:36px;--op-name:21px;--op-ava-bg:var(--btn)}
.opp.on{box-shadow:inset 0 0 0 3px var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--bar))}
.opp.win{box-shadow:inset 0 0 0 3px var(--accent),0 0 14px var(--accent)}
/* the head (avatar, name, play style) comes from games/_opponents/opponents.js; the card count sits next to the backs */
.frow{display:flex;align-items:center;gap:8px;margin:auto 0 4px;padding-top:4px} /* at the bottom, so both boxes line up when a name wraps */
.ocnt{flex:none;font-size:18px;font-weight:700;white-space:nowrap}
.fan{position:relative;flex:1;min-width:0;height:36px;--cw:26px;--ch:36px}
.fan .cd{transition:none;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.ost{font-size:18px;line-height:1.3;min-height:23px;font-weight:600;white-space:nowrap;overflow:hidden}
.ost svg,.isym{display:inline-block;width:20px;height:20px;vertical-align:-3px}

/* ---------- Table: deck, pile, info and your hand ---------- */
#mid{position:relative;flex:1;min-height:0;overflow:hidden}
.stack{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch)}
.stack .cd{transition:none}
#deck{cursor:pointer}
#deck .slot{position:absolute;inset:0;border-radius:calc(var(--cw)*.1);border:2px dashed var(--slot);background:var(--slot-bg)}
#deck .cnt{position:absolute;right:-8px;bottom:-8px;z-index:5;min-width:36px;height:36px;padding:0 6px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:19px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 5px rgba(0,0,0,.35)}
#deck.can .cd:last-of-type{box-shadow:0 0 0 3px var(--accent),0 3px 8px rgba(0,0,0,.4)}
#info{position:absolute;left:0;top:0;display:flex;flex-direction:column;justify-content:center;gap:8px;color:var(--ink)}
#info .turn{font-size:20px;font-weight:800;line-height:1.2}
.badge{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-radius:12px;padding:6px 10px;font-size:18px;font-weight:700;line-height:1.2;background:var(--bar);box-shadow:inset 0 0 0 2px var(--line)}
.badge svg{flex:none;width:30px;height:30px}
.badge.pen{background:var(--accent);color:var(--accent-ink);box-shadow:none;font-size:20px;font-weight:800}
#hand{position:absolute;inset:0;pointer-events:none}
#hand .cd{pointer-events:auto;transition:transform .2s ease;cursor:pointer}
#hand .cd.ok{box-shadow:0 0 0 3px var(--accent),0 4px 10px rgba(0,0,0,.45)}
#hand .cd.new{animation:deal .35s ease-out both}
@keyframes deal{from{opacity:0;margin-top:-30px}}
#hand .cd.no{animation:shake .36s}
@keyframes shake{20%{margin-left:-7px}40%{margin-left:7px}60%{margin-left:-5px}80%{margin-left:4px}}
.flyer{position:fixed;left:0;top:0;z-index:15;pointer-events:none;transform-origin:0 0;transition:transform .32s ease}
.flyer .cd{transition:none}
#mid.won #hand .cd{animation:hop .6s ease-in-out infinite alternate}
@keyframes hop{to{margin-top:-8px}}

/* ---------- Mariáš cards: drawn by games/_cards/marias.js (the frame, faces and backs come from games/_cards/cards.js) ---------- */

/* Bottom buttons */
.tray{flex:none;display:flex;flex-direction:column;gap:6px;padding:6px var(--gut) 10px;background:var(--bar);border-top:1px solid var(--line)}
#hint{text-align:center;font-size:19px;line-height:1.3;min-height:50px;display:flex;align-items:center;justify-content:center;font-weight:600}
.row{display:flex;gap:10px}
.act{flex:1 1 0;min-width:0;height:64px;border-radius:14px;background:var(--btn);color:var(--btn-ink);display:flex;align-items:center;justify-content:center;gap:8px;font-size:21px;font-weight:800;box-shadow:inset 0 0 0 1px var(--line);transition:transform .06s;white-space:nowrap}
.act:active{transform:scale(.97)}
.act svg{flex:none;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.act.go{flex-grow:1.6;background:var(--accent);color:var(--accent-ink);box-shadow:none}
.act.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);transition:transform .06s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pbtn-sh)}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0;box-shadow:0 2px 6px rgba(60,30,10,.12)}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.fnote a{color:inherit;text-decoration:underline}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{font-size:18px;color:var(--psoft);line-height:1.3}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.trow .flabel{margin:0;flex:1;min-width:0}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{height:96px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--tex),var(--grain,none),var(--tbl);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.mini{--cw:46px;--ch:64px;display:flex;gap:5px;justify-content:center}
.mini .cd{position:relative;transform:none;flex:none;transition:none}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.stats{font-size:20px;line-height:1.5}

.help p,.help li{font-size:20px;line-height:1.45}
.help ol{padding-left:26px}
.help li{margin:10px 0}
.demo-felt{background:var(--tex),var(--grain,none),var(--tbl);border-radius:14px;padding:12px;margin:10px 0}
.vals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px}
.val{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font-size:18px;font-weight:700;text-align:center;line-height:1.2}
.val .mini{--cw:54px;--ch:76px}
.legend{display:flex;align-items:center;gap:14px;margin:12px 0;font-size:20px;line-height:1.3}
.legend .ico{flex:none;width:46px;height:46px;border-radius:12px;background:var(--psw);display:grid;place-items:center}
.legend .ico svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
.mbtns{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.suits{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 16px}
.suitb{height:112px;border-radius:16px;border:3px solid var(--pline);background:var(--popt);color:var(--pink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:20px;font-weight:800;line-height:1.15}
.suitb svg{width:44px;height:44px}
.suitb small{font-size:18px;font-weight:600;color:var(--psoft)}
.suitb.most{border-color:var(--pbtn);background:var(--popt-on)}

@media (max-height:800px){
  .topbar{height:52px}
  .pill{height:42px}.round{width:42px;height:42px}
  .topbar h1{font-size:25px}
  #opps{padding-top:8px}
  #score{margin-top:6px}
  #score > span{padding:2px 6px}
  #score .who{font-size:16px}
  #score .who b{font-size:22px}
  .opp{padding:4px 10px}
  .opp{--op-ava:32px;--op-name:20px}
  .frow{margin-bottom:2px;padding-top:2px}
  .fan{height:30px;--cw:22px;--ch:30px}
  .act{height:56px}
  #hint{min-height:46px;font-size:18px}
  .tray{padding:4px var(--gut) 8px;gap:4px}
}
/* Narrow phones (360 px wide): smaller gaps and a slimmer "Nová hra", so the title fits next to the home button (the 12 px outer margin stays) */
@media (max-width:380px){
  #score .lbl{padding:0 8px}
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill{padding:0 10px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px}
}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;width:max-content;max-width:92vw;background:color-mix(in srgb,var(--ink) 94%,var(--tbl));color:var(--tbl);font-size:19px;font-weight:600;line-height:1.35;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--tbl) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
/* the opponent's badge (stars, play style) in the ink colour on the light sand table, where the orange accent is too faint */
[data-table="sand"]{--op-accent:var(--ink)}
</style>
</head>
<body>
<div id="rotate" class="paper" role="status"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="6" width="20" height="36" rx="4"/><path d="M29 36h6"/><path d="M12 46a22 22 0 0 0 40 0"/><path d="m52 46-1.5 7M52 46l-7 2"/></svg><b>Otoč telefon na výšku</b><span>Hra počká, nic se neztratí.</span></div>
<div id="app">
  <header class="topbar">
    <a id="btnHome" class="round" href="../../index.html" aria-label="Zpět na výběr her" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2V20a1 1 0 0 1-1 1H15v-5.5H9V21H4.5a1 1 0 0 1-1-1z"/></svg></a>
    <button id="btnNew" class="pill">Nová hra</button>
    <h1>Prší</h1>

        ${opt('speed:fast', S.speed === 'fast', 'Rychle', '')}
        <div class="fnote">Na tebe se nikdy nespěchá, hraješ, až chceš.</div>
      </div>
      ${toggleRow('show', 'Ukazovat, co můžeš zahrát', 'Karty, které jdou zahrát, jsou povytažené a orámované.')}
    </section>
    <section class="card"><h3>Stůl</h3>
      <div class="tiles">${TABLES.map(t => tile('table:' + t.id, S.table === t.id, `<span class="swatch" data-table="${t.id}">${minis(SAMPLE.slice(0, 2), true)}</span>`, t.name)).join('')}</div>
    </section>
    <section class="card"><h3>Rub karet</h3>
      <div class="tiles">${BACKS.map(b => tile('back:' + b.id, S.back === b.id, `<span class="swatch" data-back="${b.id}"><span class="mini">${cardHTML(0, false)}${cardHTML(0, false)}</span></span>`, b.name)).join('')}</div>
      ${CASTLE || COAT ? `<div class="fnote">${[CASTLE && credit('Fotka zámku Náchod', CASTLE), COAT && credit('Erb Náchoda', COAT)].filter(Boolean).join('<br>')}<br>Obrázky jsou z Wikimedia Commons.</div>` : ''}
    </section>
    <section class="card"><h3>Barva líce</h3>
      <div class="tiles">${FACES.map(f => tile('face:' + f.id, S.face === f.id, `<span class="swatch" data-face="${f.id}">${minis(SAMPLE)}</span>`, f.name)).join('')}</div>
      ${toggleRow('vibrate', 'Vibrace')}
    </section>
    <section class="card"><h3>Statistika</h3>
      <p class="stats">${Object.keys(OPPS).map(k => `${OPP_TXT[k][0]}: vyhráno <b>${ST[k].won}</b> z ${nGames(ST[k].played)}`).join('<br>')}</p>
    </section>
    <button class="big" data-act="close">Zpět ke hře</button>
    <button class="link" data-act="reset">Obnovit výchozí nastavení</button>`;
}
$('#settingsIn').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, arg] = b.dataset.act.split(':');
  if (act === 'close') { closeSettings(); return; }
  if (['opp', 'speed', 'table', 'back', 'face'].includes(act)) S[act] = arg;
  else if (act === 'toggle') S[arg] = !S[arg];
  else if (act === 'reset') { S = Object.assign({}, DEFAULTS); toast('Nastavení je zase výchozí'); }
  normalize(S); buzz(8); CARDS.applyLook(S); save();
  const y = $('#screenSettings').scrollTop; renderSettings(); $('#screenSettings').scrollTop = y;
});
function openSettings() { hideToast(); renderSettings(); $('#screenSettings').hidden = false; $('#screenSettings').scrollTop = 0; }
// other opponents need a new game: it starts after returning, and says so when a game was played (rule)
function closeSettings() {
  $('#screenSettings').hidden = true;
  if (S.opp !== G.opp) newGame(!isFresh() ? 'Začala nová hra s novými soupeři, výhry se počítají od nuly' : '');
  else render();
}
$('#btnSettings').addEventListener('click', openSettings);

/* ---------- Help (rule: only behind "?", never opens by itself) ---------- */
function renderHelp() {
  const ico = id => `<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]}</svg></span>`;
  const vals = [0, 1, 2, 3, 4, 5, 6, 7].map(r => `<div class="val"><span class="mini">${cardHTML(r + 16, true)}</span>${RNAME[r]}</div>`).join('');
  const suits = [0, 1, 2, 3].map(s => `<div class="val"><span class="mini">${cardHTML(s * 8 + 7, true)}</span>${SNAME[s]}</div>`).join('');
  $('#helpIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Prší<small>Jak hrát</small></h2></div>
    <section class="card help">
      <ol>
        <li><b>Cíl:</b> zbavit se všech karet dřív než soupeři. Kdo první nemá žádnou kartu, vyhrává.</li>
        <li>Každý dostane 4 karty. Ty začínáš. Na vrchní kartu uprostřed zahraj kartu <b>stejné barvy</b>, nebo <b>stejné hodnoty</b> (třeba osmu na osmu). Stačí na ni ťuknout.${S.show ? ' Karty, které jdou zahrát, jsou povytažené a orámované.' : ''}</li>
        <li>Když nemáš co zahrát, <b>lízni si</b> jednu kartu: tlačítko Líznout, nebo ťukni na balíček. Tím tah končí.</li>
        <li><b>Sedma:</b> další hráč si lízne 2 karty. Může ale zahrát svou sedmu a pak bere ten po něm 4 karty, potom 6 a 8.</li>
        <li><b>Eso:</b> další hráč stojí, tedy jedno kolo nehraje (tlačítko Stojím). Může ale zahrát svoje eso a stát musí ten po něm.</li>
        <li><b>Svršek</b> jde zahrát skoro na cokoli, jen ne na sedmu nebo eso, které právě platí. Kdo ho zahraje, vybere barvu a v té se hraje dál.</li>
        <li>Když balíček dojde, odehrané karty kromě vrchní se zamíchají a hraje se dál.</li>
        <li>Na čas se nehraje. Soupeři hrají jeden po druhém, rychlost jde změnit v nastavení ⚙.</li>
      </ol>
    </section>
    <section class="card help"><h3>Soupeři</h3>
      <p>Teď hraješ proti: ${G.foes.slice(1).map((f, i) => `<b>${f.name}</b> (${STYLES[stylesOf(G)[i + 1]].trait})`).join(' a ')}.</p>
      <p style="margin-top:10px"><b>Kdo útočí,</b> hraje sedmy a esa hned, jak to jde, a rychle se zbavuje karet.</p>
      <p style="margin-top:10px"><b>Kdo šetří karty,</b> hraje nejdřív obyčejné karty. Sedmy a esa si nechává na obranu a svrška na konec.</p>
      <p style="margin-top:10px"><b>Kdo kolikrát vyhrál,</b> je vidět nahoře pod lištou. Dokud hru nezavřeš, hraješ pořád proti stejným soupeřům; po novém otevření hry přijdou noví a počítá se od nuly.</p>
      <p class="fnote">Jestli hraješ proti jednomu, nebo dvěma, vybereš v nastavení. Jak kdo hraje, je napsané u jména; ťuknutím na soupeře si to připomeneš.</p>
    </section>
    <section class="card help"><h3>Karty</h3>
      <p>Mariášové karty, 32 kusů. Sedma až desítka mají v rohu římské číslo, spodka, svrška, krále a eso poznáš podle obrázku:</p>
      <div class="demo-felt"><div class="vals">${vals}</div></div>
      <p>Barvy jsou čtyři:</p>
      <div class="demo-felt"><div class="vals">${suits}</div></div>
    </section>
    <section class="card help"><h3>Tlačítka</h3>
      <div class="legend">${ico('undo')}<span><b>Zpět</b> vrátí tvůj poslední tah i tahy soupeřů po něm. Dá se ťukat opakovaně.</span></div>
      <div class="legend">${ico('draw')}<span><b>Líznout</b> vezme kartu z balíčku (při sedmě všechny, které platí).</span></div>
      <div class="legend">${ico('stand')}<span><b>Stojím</b> se objeví, když na tebe platí eso a nechceš nebo nemůžeš zahrát svoje eso.</span></div>
    </section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
}
function openHelp() { hideToast(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; }
$('#helpIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenHelp').hidden = true; });
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Zrušit" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
// rule: ask for persistent storage so the browser does not delete the saved game by itself
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const saved = load();
// rule: only the known settings are taken over from the save
const savedSettings = saved && typeof saved === 'object' && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
ST = validStats(saved && saved.stats);
CARDS.applyLook(S);
if (saved && saved.game && typeof saved.game === 'object' && validGame(saved.game)) {
  G = saved.game;
  // The game opened again (no tally in sessionStorage yet): new opponents come, as Settings and Help say. An
  // untouched deal is replaced at once; a game in progress is played out with its opponents first (carry).
  let reopened = false;
  try { reopened = sessionStorage.getItem(SKEY) === null; } catch (e) {}
  SER = loadSeries(G);
  if (reopened && isFresh() && G.status === 'playing') { SER = null; newGame(); }
  else {
    if (reopened) { SER.carry = true; saveSeries(); }
    render();
    if (G.status === 'playing' && G.turn !== 0) schedule(); // reloaded during the opponents' turn: they go on
  }
} else newGame();

const relayout = () => { if (G) render(); };
window.addEventListener('resize', relayout);
if (window.visualViewport) visualViewport.addEventListener('resize', relayout);
document.addEventListener('contextmenu', e => e.preventDefault());

// contract: opened from the launcher (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;

// For testing
window.Prsi = { deal, legal, canPlay, applyMove, aiChoose, statusOf, cname, cacc, render: () => render(), undo, tapCard,
  get state() { return { S, G, ST, SER, L }; } };
})();
</script>
