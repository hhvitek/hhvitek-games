<!doctype html>
<!--
  Malované křížovky (nonograms): the numbers beside every row and above every column give the runs of filled cells
  in order; filling the right cells reveals a picture, shown in colour once it is solved.
  The puzzles and the line logic are in the Engine block (no DOM there; tools/krizovky-test.js tests it in Node).
-->
<html lang="cs" data-theme="paper">
<head>
<meta charset="utf-8">
<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4ebdf">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Malované křížovky">
<title>Malované křížovky</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f4ebdf'/%3E%3Cpath d='M14 14h12v12H14zM26 26h12v12H26zM38 14h12v12H38zM14 38h12v12H14zM38 38h12v12H38z' fill='%23d0452f'/%3E%3C/svg%3E">
<style>
/* ---------- Themes: a solid colour; everything below reads these variables (rule) ---------- */
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.06);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--accent:#7a4520;--chip:#fff;--chip-line:#e6d8c6;--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--undo-bg:rgba(122,69,32,.1);--on:#7a4520;--on-ink:#fff;
  --sheet:#fffdf8;--gl:#e6d8c6;--gl5:#a98d70;--frame:#5a3214;--fill:#3a2414;--cross:#a48a72;--bad:#d23a2a;--hintc:#e0791c;--lit:rgba(224,121,28,.14);--clue:#2b1a0e;--strip:rgba(122,69,32,.07)}
[data-theme="night"]{--page:#16233f;--bar:rgba(0,0,0,.25);--line:rgba(255,255,255,.08);--ink:#eef3fb;--soft:#b9c6dc;--accent:#ffd166;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--btn:#ffd166;--btn-ink:#2a2000;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.28);--on:#ffd166;--on-ink:#2a2000;
  --sheet:#1e3054;--gl:#2f4573;--gl5:#7088b8;--frame:#a9bbdd;--fill:#eef3fb;--cross:#8095bd;--bad:#ff6b5b;--hintc:#ffd166;--lit:rgba(255,209,102,.16);--clue:#eef3fb;--strip:rgba(255,255,255,.06)}
[data-theme="slate"]{--page:#dde2e7;--bar:rgba(30,45,60,.06);--line:#c5cdd5;--ink:#1f2b37;--soft:#52606d;--accent:#2f5d7c;--chip:#f5f7f9;--chip-line:#c5cdd5;--btn:#2f5d7c;--btn-ink:#fff;--btn-sh:#1b3a50;--undo-bg:rgba(30,45,60,.08);--on:#2f5d7c;--on-ink:#fff;
  --sheet:#f8fafb;--gl:#d3dae1;--gl5:#8796a5;--frame:#34495e;--fill:#2c3e50;--cross:#8a99a8;--bad:#d23a2a;--hintc:#e0791c;--lit:rgba(47,93,124,.13);--clue:#1f2b37;--strip:rgba(30,45,60,.06)}

/* ---------- Base ---------- */
:root{--gut:12px} /* one side margin: bar buttons, board and bottom buttons line up (the safe areas are on #app) */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
/* rule: 100dvh + safe areas, the board is sized from the room that is left (see layout()) */
#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Top bar (rule: home, Nová hra, <h1> name, ?, settings) ---------- */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;color:var(--ink);white-space:normal;overflow-wrap:normal;word-break:normal} /* a long name wraps to two lines between words, never inside a word and never cut (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);text-decoration:none}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
.topbar h1{font-size:22px}
.topbar:has(#btnHome:not([hidden])){gap:6px}
.topbar:has(#btnHome:not([hidden])) .pill{padding:0 12px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:19px}
/* narrow phones (360 px): less room between the bar buttons, so the name fits whole at 18 px; the outer margin stays */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill,.topbar:has(#btnHome:not([hidden])) .pill{padding:0 8px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px;letter-spacing:0}
}

/* ---------- Info row: which puzzle (its name once solved) and the zoom button ---------- */
.info{flex:none;height:46px;display:flex;align-items:center;justify-content:center;gap:12px;padding:6px var(--gut) 0;font-size:19px;font-weight:700;color:var(--soft);white-space:nowrap}
.info b{color:var(--ink)}
.zoom{flex:none;display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:19px;background:var(--chip);box-shadow:inset 0 0 0 2px var(--chip-line);font-size:17px;font-weight:800;color:var(--ink)}
.zoom svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}

/* ---------- Board: column clues above, row clues on the left, the grid (it can be zoomed inside #view) ---------- */
#board{flex:1;min-height:0;display:grid;place-items:center;padding:12px var(--gut)} /* rule: at least 12 px between the board and the rows above and below, on every screen */
#puz{display:grid;grid-template-columns:var(--rw,40px) var(--vw,200px);grid-template-rows:var(--ch,40px) var(--vh,200px)}
#corner{display:grid;place-items:center;color:var(--fill)}
#corner svg{display:block;width:var(--mini,0px);height:var(--mini,0px);background:var(--sheet);box-shadow:0 0 0 1px var(--gl5)}
.strip{position:relative;overflow:hidden}
#cc{position:absolute;left:0;bottom:0;display:flex}
#rc{position:absolute;right:0;top:0;display:flex;flex-direction:column}
.cl{color:var(--clue);font-size:var(--cf,14px);font-weight:700;line-height:1.12;transition:opacity .3s}
.cl.c{width:var(--cz);height:var(--ch);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:calc(var(--cf,14px) * .3)}
.cl.r{height:var(--cz);width:var(--rw);display:flex;justify-content:flex-end;align-items:center;gap:calc(var(--cf,14px) * .38);padding-right:calc(var(--cf,14px) * .4)}
.cl.alt{background:var(--strip)}
.cl.ok>span{opacity:.32}
.cl.lit,.cl.hline{background:var(--lit)}
.cl.hline{color:var(--hintc)}
#view{position:relative;overflow:hidden;background:var(--sheet);box-shadow:0 0 0 2px var(--frame);touch-action:none}
#grid{position:absolute;left:0;top:0;display:grid;grid-template-columns:repeat(var(--n,5),var(--cz));grid-auto-rows:var(--cz);transform-origin:0 0}
.cell{position:relative;background-color:var(--sheet);border-right:1px solid var(--gl);border-bottom:1px solid var(--gl)}
.cell.e5r{border-right:2px solid var(--gl5)}
.cell.e5b{border-bottom:2px solid var(--gl5)}
.cell.er{border-right:0}
.cell.eb{border-bottom:0}
.cell.lit,.cell.hline{background-image:linear-gradient(var(--lit),var(--lit))}
.cell.f{background-color:var(--fill);background-image:none}
.cell.x::before,.cell.x::after{content:"";position:absolute;left:50%;top:50%;width:60%;height:max(2px,9%);border-radius:2px;background:var(--cross);transform:translate(-50%,-50%) rotate(45deg)}
.cell.x::after{transform:translate(-50%,-50%) rotate(-45deg)}
.cell.bad.f{background-color:var(--bad)}
.cell.bad.x::before,.cell.bad.x::after{background:var(--bad)}
.cell.hint{z-index:1;box-shadow:inset 0 0 0 max(3px,calc(var(--cz) * .13)) var(--hintc);animation:pulse 1.1s ease-in-out infinite alternate}
.cell.hint.f{box-shadow:inset 0 0 0 max(3px,calc(var(--cz) * .13)) var(--hintc),inset 0 0 0 calc(max(3px,calc(var(--cz) * .13)) + 2px) var(--sheet)}
@keyframes pulse{to{box-shadow:inset 0 0 0 max(2px,calc(var(--cz) * .07)) var(--hintc)}}
/* solved: the crosses and grid lines go, the cells take the picture's colours (set inline), the clues fade */
#puz.won .cell{border-color:transparent;transition:background-color .9s ease,border-color .9s ease}
#puz.won .cl{opacity:.28}
#puz.won #view{box-shadow:0 0 0 2px var(--frame),0 6px 18px rgba(0,0,0,.18)}
#bubble{position:fixed;z-index:30;left:0;top:0;min-width:44px;padding:4px 12px;border-radius:14px;background:var(--ink);color:var(--page);font-size:22px;font-weight:800;text-align:center;pointer-events:none;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s}
#bubble.show{opacity:.92}

/* ---------- Bottom buttons ---------- */
.tray{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px var(--gut) 12px;background:var(--bar);border-top:1px solid var(--line)}
#hint{text-align:center;font-size:19px;line-height:1.3;color:var(--soft);min-height:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:8px}
.undo{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;height:64px;border-radius:16px;font-size:19px;font-weight:800;color:var(--ink);background:var(--undo-bg);box-shadow:inset 0 0 0 2px var(--chip-line)}
.undo svg{flex:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
/* an unavailable action is only dimmed and explains itself when tapped */
.undo.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */
/* the mode switch: two joined buttons, the active one filled */
.modes{flex:2.1 1 0;min-width:0;display:flex;height:64px;border-radius:16px;box-shadow:inset 0 0 0 2px var(--chip-line);background:var(--undo-bg)}
.mode{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:16px;font-size:17px;font-weight:800;color:var(--ink)}
.mode[aria-pressed="true"]{background:var(--on);color:var(--on-ink);box-shadow:0 3px 0 var(--btn-sh)}
.mode i{display:block;width:18px;height:18px;position:relative}
.mode i.sq{background:currentColor;border-radius:2px}
.mode i.xx::before,.mode i.xx::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:currentColor;transform:rotate(45deg)}
.mode i.xx::after{transform:rotate(-45deg)}
#btnHint{flex:1.15 1 0}
@media (max-height:800px){
  .topbar{height:56px}
  .round{width:42px;height:42px}
  .pill{height:42px}
  .info{height:42px;padding-top:4px}
  .undo,.modes{height:56px}
  .tray{gap:6px;padding:6px var(--gut) 10px}
}
@media (max-width:380px){ .undo{font-size:17px;gap:4px} .undo svg{width:18px;height:18px} .mode{font-size:16px} #hint{font-size:17px} .info{font-size:18px} }

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
/* rule: the head with Zpět and the game name stays at the top while scrolling */
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);margin-top:16px}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{height:56px;border-radius:10px;background:var(--page);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);display:grid;place-items:center}
.swatch i{display:block;width:40px;height:22px;background:linear-gradient(90deg,var(--fill) 0 25%,var(--sheet) 25% 50%,var(--fill) 50% 75%,var(--sheet) 75%);box-shadow:0 0 0 2px var(--frame)}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.help p,.help li{font-size:20px;line-height:1.45}
.help ol{padding-left:26px}
.help li{margin:10px 0}
.ex{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:20px;font-weight:800}
.ex b{flex:none;width:44px;text-align:right}
.ex span{display:flex}
.ex i{display:block;width:26px;height:26px;border:1px solid #c9b49a;margin-left:-1px;background:#fffdf8}
.ex i.f{background:#3a2414}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;max-height:100%;overflow-y:auto;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
.wpic{width:min(200px,50vw);margin:4px auto 12px}
.wpic svg{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 0 0 2px var(--pline)}
.star{color:#b8740f;font-weight:800}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;line-height:1.35;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* the toast starts at the top of the bottom buttons and grows down over them: never over the grid or the hint line (toast()) */
#toast{font-size:17px;line-height:1.25;padding:9px 14px;max-width:calc(100vw - 24px)}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* ---------- The puzzle list (a paper screen) ---------- */
.lsub{font-size:18px;color:var(--psoft);margin-bottom:10px}
.ltiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px} /* 3 per row: the longest names (Slunečnice) fit whole */
.lt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 4px 8px;border-radius:14px;border:3px solid var(--pline);background:var(--popt);color:var(--pink);min-width:0}
.lt.cur{border-color:var(--pbtn);background:var(--popt-on)}
.lt .th{position:relative;width:100%;aspect-ratio:1;display:grid;place-items:center;border-radius:8px;overflow:hidden}
.lt .th svg{display:block;width:100%;height:100%}
.lt.todo .th{border:2px dashed var(--pline);font-size:26px;font-weight:800;color:var(--psoft)}
.lt.part .th{background:#fffdf8;box-shadow:inset 0 0 0 1px var(--pline);color:#c9b49a}
.lt.part .th b{position:absolute;font-size:24px;font-weight:800;color:var(--pink);text-shadow:0 0 4px #fff,0 0 4px #fff}
.lt.done .th{box-shadow:inset 0 0 0 1px var(--pline)}
.lt .nm{width:100%;font-size:15px;font-weight:700;line-height:1.15;text-align:center;hyphens:manual;overflow-wrap:normal;min-height:2.3em;display:flex;align-items:center;justify-content:center}
.lt .nm.soft{color:var(--psoft);font-weight:600}
.lt .th .s{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--pline);display:grid;place-items:center;font-size:16px;line-height:1;color:#b8740f}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px Georgia,"Times New Roman",serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}

<script>
/* ---------- Visible height ---------- */
// The game is exactly as tall as the part of the window that is really shown (--app-h on #app). 100dvh alone is not
// enough: some browsers report it taller than what is visible (the app installed by Brave on Android counted the
// status and navigation bars too and hid the bottom buttons). visualViewport follows what is shown; it is measured
// again on every change and shortly after loading (a browser bar that hides itself may change it without an event),
// and a changed height makes the game lay itself out again through a resize event.
(() => {
  const root = document.documentElement;
  let last = 0;
  const measure = () => {
    const vv = window.visualViewport;
    const h = Math.round(vv ? vv.height * vv.scale : innerHeight);
    if (!(h > 0) || h === last) return;
    const first = !last; last = h;
    root.style.setProperty('--app-h', h + 'px');
    if (!first) dispatchEvent(new Event('resize'));
  };
  measure();
  addEventListener('resize', measure);
  if (window.visualViewport) visualViewport.addEventListener('resize', measure);
  addEventListener('pageshow', measure);
  [100, 500, 1500].forEach(ms => setTimeout(measure, ms));
  // TEMPORARY (2026-11-08): what this page measured, shown in the launcher's Nastavení → "Údaje o obrazovce"
  setTimeout(() => { try {
    const p = document.createElement('div'); p.style.cssText = 'position:absolute;left:-50px;top:0;width:1px;height:100dvh;padding-bottom:env(safe-area-inset-bottom)';
    document.body.appendChild(p); const dvh = Math.round(p.getBoundingClientRect().height - parseFloat(getComputedStyle(p).paddingBottom)), sb = Math.round(parseFloat(getComputedStyle(p).paddingBottom)); p.remove();
    const vv = window.visualViewport;
    localStorage.setItem('games.launcher.diag', JSON.stringify({ page: location.pathname.split('/').slice(-2, -1)[0], vv: vv ? Math.round(vv.height) : null, inner: innerHeight, client: root.clientHeight, dvh, sb, appH: last, app: Math.round(document.getElementById('app').getBoundingClientRect().height) }));
  } catch (e) {} }, 2000);
})();
</script>

// rule: the board size comes from the room that is left, so it fits without scrolling
function layout() {
  if (!G || !P) return;
  const b = $('#board'), { cl } = info(P);
  const W = b.clientWidth - 2 * GUT, H = b.clientHeight - 24; // inside #board's padding (GUT at the sides, 12 px above and below)
  // room for the clue numbers at font size f (a digit is about .6 of the font size wide)
  const rowW = f => Math.max(...cl.rows.map(x => { const t = x.length ? x : [0]; return t.reduce((s, n) => s + String(n).length * .6 * f, 0) + (t.length - 1) * .38 * f; })) + .9 * f;
  const colH = f => Math.max(...cl.cols.map(x => Math.max(1, x.length))) * 1.12 * f + .4 * f;
  let c = Math.min(W / P.w, H / P.h), f = 14;
  for (let k = 0; k < 6; k++) {
    f = Math.max(11, Math.min(22, Math.round(c * .58)));
    c = Math.max(8, Math.min(64, Math.floor(Math.min((W - rowW(f)) / P.w, (H - colH(f)) / P.h))));
  }
  if (c !== cs) { cs = c; zoom = 1; tx = 0; ty = 0; }
  const rw = Math.ceil(rowW(f)), ch = Math.ceil(colH(f)), st = $('#puz').style;
  st.setProperty('--cf', f + 'px'); st.setProperty('--rw', rw + 'px'); st.setProperty('--ch', ch + 'px');
  st.setProperty('--vw', P.w * cs + 'px'); st.setProperty('--vh', P.h * cs + 'px');
  const mini = Math.min(rw, ch) - 10;
  st.setProperty('--mini', (mini >= 22 ? Math.min(mini, 90) : 0) + 'px');
  applyZoom();
}

/* ---------- Zoom: the Zvětšit button or two fingers; two fingers also move a zoomed grid ---------- */
let zoom = 1, tx = 0, ty = 0;
function clampPan() {
  const vw = P.w * cs, vh = P.h * cs;

}
function applyZoom() {
  clampPan();

  $('#cc').style.transform = `translateX(${tx}px)`;

// zoom so that the board point (bx, by) in unzoomed pixels sits at (vx, vy) in the view
function zoomTo(z, bx, by, vx, vy) { zoom = Math.min(3, Math.max(1, z)); tx = vx - bx * zoom; ty = vy - by * zoom; applyZoom(); }

  const cz = cs * zoom, x = (i % P.w + .5) * cz + tx, y = (Math.floor(i / P.w) + .5) * cz + ty, vw = P.w * cs, vh = P.h * cs;
  if (x < cz || y < cz || x > vw - cz || y > vh - cz) zoomTo(zoom, (i % P.w + .5) * cs, (Math.floor(i / P.w) + .5) * cs, vw / 2, vh / 2);
}
$('#btnZoom').addEventListener('click', () => {
  if (zoom > 1) { zoom = 1; tx = 0; ty = 0; applyZoom(); }
  else {
    // around the last change, or the middle of the grid
    const last = G.history.length ? G.history[G.history.length - 1][0][0] : Math.floor(P.h / 2) * P.w + Math.floor(P.w / 2);
    zoomTo(2, (last % P.w + .5) * cs, (Math.floor(last / P.w) + .5) * cs, P.w * cs / 2, P.h * cs / 2);
  }
  buzz(8); render();
});

/* ---------- Drawing: a tap or a drag along a row or a column; one stroke = one Zpět step ---------- */

  if (clamp) { c = Math.max(0, Math.min(P.w - 1, c)); rr = Math.max(0, Math.min(P.h - 1, rr)); }

}

      { text: 'Další křížovka', fn: () => openPuzzle(next) },

(() => {

  const { cl, sol } = info(P);
  const wrong = G.cells.findIndex((v, i) => (v === 1 && !sol[i]) || (v === 2 && sol[i]));
  // the first hint of a puzzle that could still get its ★ says once that it no longer can (rule: no star with Poradit)
  let first = false;
  if (!hint || (hint.wrong && wrong !== hint.i) || (!hint.wrong && G.cells[hint.i])) {

      <li><b>Poradit</b> ukáže chybu, nebo políčko, které jde z čísel jednoho řádku či sloupce poznat. Ťuknutím na něj ho rovnou vyplníš.</li>
      <li>V Nastavení jde zapnout <b>Upozorňovat na chyby</b> (špatné značky zčervenají) a <b>Doplňovat křížky</b>.</li>
      <li>Velké křížovky přiblížíš tlačítkem <b>Zvětšit</b> nebo roztažením dvěma prsty; dvěma prsty pak mřížkou i posouváš. Jedním prstem se kreslí.</li>
      <li><b>Nová hra</b> otevře seznam křížovek. Rozpracované křížovky zůstanou tak, jak jsou, takže můžeš přecházet mezi nimi.</li>
      <li>Vyřešená křížovka se ukáže v barvách. Když ji vyřešíš bez Poradit a bez upozorňování na chyby, dostane v seznamu <b>★</b>. Rada platí i po Zpět a po začátku znovu.</li>
    </ol></section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
}
function openHelp() { hideToast(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; }
$('#helpIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenHelp').hidden = true; });
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings', '#screenList']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
// rule: ask for persistent storage so the browser does not delete the saved game by itself
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const saved = load();
const savedSettings = saved && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
if (saved && typeof saved === 'object') D = { prog: validProg(saved.prog), done: validDone(saved.done) };
if (saved && validGame(saved.game)) {
  G = saved.game;
  delete D.prog[G.id];
  if (G.status === 'won' && !G.counted) { G.counted = true; D.done[G.id] = { clean: (G.hints === 0 && !G.warned) || !!(D.done[G.id] && D.done[G.id].clean) }; }
  if (S.mistakes && G.status === 'playing') G.warned = true;
  buildBoard(); render(); save();
}
else openPuzzle(firstOpen());

window.addEventListener('resize', layout);
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
document.addEventListener('contextmenu', e => e.preventDefault());

// contract: opened from the launcher (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;

// For testing: solve() fills the drawing as one stroke (a win), open(id) opens a puzzle
window.Krizovky = {
  E,
  solve() { if (G.status !== 'playing') return; const snap = G.cells.slice(); info(P).sol.forEach((v, i) => { G.cells[i] = v ? 1 : (G.cells[i] === 2 ? 2 : 0); }); commit(snap, []); },
  open(id) { if (BYID.has(id)) openPuzzle(id); },
  get state() { return { S, G, D, hint }; },
};
})();
</script>
