<!--
  TEMPLATE for a new game (not listed in games/registry.js, so the launcher does not show it).
  Copy this folder to games/<id>/ (the game's Czech name without diacritics, kebab-case), then:
    1. replace ID, the names and the GAME LOGIC sections; keep everything marked "contract" or "rule",
    2. add { id, name, description } to games/registry.js and a row to README.md,
    3. run `node tools/check.js` and test it with Playwright (see CLAUDE.md).
  The little game here is "Rozsviť": a tap switches a light and its neighbours; light them all.
-->

<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>

<style>
/* ---------- Themes: a solid colour; everything below reads these variables (rule) ---------- */
[data-theme="night"]{--page:#16233f;--bar:rgba(0,0,0,.25);--line:rgba(255,255,255,.08);--ink:#eef3fb;--soft:#b9c6dc;--accent:#ffd166;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--btn:#ffd166;--btn-ink:#2a2000;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.28);--off:#2a3a5e;--on:#ffd166}
[data-theme="green"]{--page:#1d5236;--bar:rgba(0,0,0,.22);--line:rgba(255,255,255,.08);--ink:#eaf7ee;--soft:#cfe8d7;--accent:#ffd66b;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--btn:#ffd66b;--btn-ink:#2a2200;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.25);--off:#2d6a49;--on:#ffd66b}
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.06);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--accent:#7a4520;--chip:#fff;--chip-line:#e6d8c6;--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--undo-bg:rgba(122,69,32,.1);--off:#e7d9c6;--on:#7a4520}

/* ---------- Base ---------- */
:root{--gut:12px} /* one side margin: bar buttons, board and bottom buttons line up (the safe areas are on #app) */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
/* rule: 100dvh + safe areas, the board is sized from the room that is left (see layout()) */
#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Top bar (rule: home, Nová hra, <h1> name, ?, settings) ---------- */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;color:var(--ink);white-space:normal;overflow-wrap:normal;word-break:normal} /* a long name wraps to two lines between words, never inside a word and never cut (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);text-decoration:none}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:8px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:20px}
/* narrow phones (360 px): less room between the bar buttons, so the name fits whole at 18 px; the outer margin stays */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}

}

/* ---------- Score row (rule: info goes on its own row, not in place of the name) ---------- */
.stats{flex:none;text-align:center;padding:8px var(--gut) 0;font-size:20px;font-weight:700;color:var(--soft)}
.stats b{color:var(--ink)}

/* ---------- GAME: board ---------- */
#board{flex:1;min-height:0;display:grid;place-items:center;padding:12px var(--gut)} /* rule: at least 12 px between the board and the rows above and below, on every screen */
#grid{display:grid;grid-template-columns:repeat(var(--n),var(--cs));gap:var(--gap)}
.cell{width:var(--cs);height:var(--cs);border-radius:16%;background:var(--off);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);transition:background .15s}
.cell.on{background:var(--on);box-shadow:0 0 16px var(--on),inset 0 -4px 0 rgba(0,0,0,.15)}

/* ---------- Bottom buttons ---------- */
.tray{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px var(--gut) 12px;background:var(--bar);border-top:1px solid var(--line)}
#hint{text-align:center;font-size:19px;line-height:1.3;color:var(--soft);min-height:25px}

.undo{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:8px;height:64px;border-radius:16px;font-size:21px;font-weight:800;color:var(--ink);background:var(--undo-bg);box-shadow:inset 0 0 0 2px var(--chip-line)}
.undo svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
/* an unavailable action: dimmed, explains itself when tapped (the old senior look, kept as the default) */

.help p,.help li{font-size:20px;line-height:1.45}

.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}

@supports (color: rgb(from red r g b)){

}

<script>
/* ---------- Visible height ---------- */
// The game is exactly as tall as the part of the window that is really shown (--app-h on #app). 100dvh alone is not
// enough: some browsers report it taller than what is visible (the app installed by Brave on Android counted the
// status and navigation bars too and hid the bottom buttons). visualViewport follows what is shown; it is measured
// again on every change and shortly after loading (a browser bar that hides itself may change it without an event),
// and a changed height makes the game lay itself out again through a resize event.
(() => {
  const root = document.documentElement;
  let last = 0;
  const measure = () => {
    const vv = window.visualViewport;
    const h = Math.round(vv ? vv.height * vv.scale : innerHeight);
    if (!(h > 0) || h === last) return;
    const first = !last; last = h;
    root.style.setProperty('--app-h', h + 'px');
    if (!first) dispatchEvent(new Event('resize'));
  };
  measure();
  addEventListener('resize', measure);
  if (window.visualViewport) visualViewport.addEventListener('resize', measure);
  addEventListener('pageshow', measure);
  [100, 500, 1500].forEach(ms => setTimeout(measure, ms));
  // TEMPORARY (2026-11-08): what this page measured, shown in the launcher's Nastavení → "Údaje o obrazovce"
  setTimeout(() => { try {
    const p = document.createElement('div'); p.style.cssText = 'position:absolute;left:-50px;top:0;width:1px;height:100dvh;padding-bottom:env(safe-area-inset-bottom)';
    document.body.appendChild(p); const dvh = Math.round(p.getBoundingClientRect().height - parseFloat(getComputedStyle(p).paddingBottom)), sb = Math.round(parseFloat(getComputedStyle(p).paddingBottom)); p.remove();
    const vv = window.visualViewport;
    localStorage.setItem('games.launcher.diag', JSON.stringify({ page: location.pathname.split('/').slice(-2, -1)[0], vv: vv ? Math.round(vv.height) : null, inner: innerHeight, client: root.clientHeight, dvh, sb, appH: last, app: Math.round(document.getElementById('app').getBoundingClientRect().height) }));
  } catch (e) {} }, 2000);
})();

(() => {
'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;
const GUT = 12; // side margin in px, the same as --gut in the CSS

/* ---------- Settings and storage ---------- */
const ID = '_template';                                   // = the folder name
const KEY = `games.${ID}.state`, BADGE = `games.${ID}.inProgress`; // contract: storage key and the "Rozehráno" badge
const THEMES = [
  { id: 'night', name: 'Noc',    meta: '#16233f' },
  { id: 'green', name: 'Zelená', meta: '#1d5236' },
  { id: 'paper', name: 'Papír', meta: '#f4ebdf' },
];
const SIZES = [3, 4, 5];
const DEFAULTS = { size: 4, theme: 'night', vibrate: true };

/* ---------- GAME LOGIC (replace) ---------- */
const rnd = n => { try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); } };
// a tap switches the light and its four neighbours
function press(lights, n, i) {
  const r = (i / n) | 0, c = i % n;
  for (const [dr, dc] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const rr = r + dr, cc = c + dc;
    if (rr >= 0 && rr < n && cc >= 0 && cc < n) lights[rr * n + cc] ^= 1;
  }
}
// start from all lit and press random lights, so the puzzle can always be solved
function makeLights(n) {
  const l = new Array(n * n).fill(1);
  for (let k = 0; k < n * n; k++) press(l, n, rnd(n * n));
  if (l.every(v => v)) press(l, n, rnd(n * n));
  return l;
}
const won = g => g.lights.every(v => v === 1);

/* ---------- State ---------- */
let S, G;
const isFresh = () => G.history.length === 0;
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ settings: S, game: G }));
    if (G.status === 'playing' && !isFresh()) localStorage.setItem(BADGE, '1'); else localStorage.removeItem(BADGE);
  } catch (e) {} // rule: storage may be full or blocked; the game goes on
}
// rule: corrupted data never crashes the game; a broken history only loses Undo
function validGame(g) {
  try {
    if (!g || !SIZES.includes(g.n) || !Array.isArray(g.lights) || g.lights.length !== g.n * g.n || !g.lights.every(v => v === 0 || v === 1)) return false;
    if (!Array.isArray(g.history) || !g.history.every(i => Number.isInteger(i) && i >= 0 && i < g.n * g.n)) g.history = [];
    g.status = won(g) ? 'won' : 'playing'; // rule: the end comes from the board, the saved status is never trusted
    return true;
  } catch (e) { return false; }
}
function normalize(s) {
  if (!SIZES.includes(+s.size)) s.size = DEFAULTS.size; else s.size = +s.size;
  if (s.theme === 'cream') s.theme = 'paper'; // renamed
  if (!THEMES.some(t => t.id === s.theme)) s.theme = DEFAULTS.theme;
  s.vibrate = !!s.vibrate;
}
function newGame(msg) {
  G = { n: S.size, lights: makeLights(S.size), history: [], status: 'playing' };
  save(); render();
  if (msg) toast(msg);
}

/* ---------- Helpers ---------- */
function buzz(ms = 12) {
  // Chrome refuses vibration (with a console error) before the first real tap
  if (!S.vibrate || !navigator.vibrate || (navigator.userActivation && !navigator.userActivation.hasBeenActive)) return;
  try { navigator.vibrate(ms); } catch (e) {}
}
let toastT;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hide');
  clearTimeout(toastT); toastT = setTimeout(hideToast, ms);
}
function hideToast() { $('#toast').classList.add('hide'); }
// rule: an end dialog belongs to the game that ended and never opens over Settings, Help or another dialog:
// whenFree waits until they are closed, then runs fn - if the game is still the same (not a new one meanwhile)
const nothingOpen = () => ['#modal', '#screenSettings', '#screenHelp', '#screenCredits'].every(s => { const el = document.querySelector(s); return !el || el.hidden; });
function whenFree(g0, ms, fn) {
  setTimeout(function wait() {
    if (G !== g0) return;
    if (nothingOpen()) fn(); else setTimeout(wait, 400);
  }, ms);
}
function showModal(html, buttons) {
  hideToast();
  const card = $('#modalCard');
  card.innerHTML = html + buttons.map((b, i) => `<button class="big ${b.cls || ''}" data-i="${i}">${b.text}</button>`).join('');
  card.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    $('#modal').hidden = true;
    const fn = buttons[+b.dataset.i].fn; if (fn) fn();
  };
  $('#modal').hidden = false;
}

/* ---------- Rendering ---------- */
function applyLook() {
  root.dataset.theme = S.theme;
  document.querySelector('meta[name="theme-color"]').content = THEMES.find(t => t.id === S.theme).meta;
}
function render() {
  applyLook();
  const grid = $('#grid');
  grid.style.setProperty('--n', G.n);
  grid.innerHTML = G.lights.map((v, i) => `<button class="cell${v ? ' on' : ''}" data-i="${i}" aria-label="${v ? 'Svítí' : 'Nesvítí'}"></button>`).join('');
  $('#moves').textContent = G.history.length;
  $('#hint').textContent = G.status === 'won' ? 'Všechno svítí!' : 'Ťukni na světlo, přepne se i se sousedy';
  $('#btnUndo').classList.toggle('dim', !G.history.length || G.status !== 'playing');
  layout();
}
// rule: the board size comes from the room that is left, so it fits without scrolling
function layout() {
  if (!G) return;
  const b = $('#board'), n = G.n, gap = n >= 5 ? 8 : 10;
  const room = Math.min(b.clientWidth - 2 * GUT, b.clientHeight - 24); // inside #board's padding (GUT at the sides, 12 px above and below): a short window shrinks the board
  const cs = Math.max(45, Math.min(110, Math.floor((room - gap * (n - 1)) / n))); // comfortable to tap
  root.style.setProperty('--cs', cs + 'px'); root.style.setProperty('--gap', gap + 'px');
}

/* ---------- Controls ---------- */
$('#grid').addEventListener('click', e => {
  const c = e.target.closest('.cell'); if (!c) return;
  if (G.status !== 'playing') { toast('Všechno už svítí – ťukni na Nová hra'); return; }
  const i = +c.dataset.i;
  press(G.lights, G.n, i); G.history.push(i);
  // rule: an end dialog only for the game that ended, never over Settings or Help (whenFree)
  if (won(G)) { G.status = 'won'; whenFree(G, 300, () => showModal(`<h2>Výborně! 🎉</h2><p>Všechno svítí. Tahy: <b>${G.history.length}</b></p>`, [{ text: 'Nová hra', fn: () => newGame() }, { text: 'Prohlédnout', cls: 'alt' }])); }
  buzz(); save(); render();
});
// Undo ("Zpět"): optional; when unavailable it says why.
// Here Undo ends with the win (the puzzle is solved). Games with a score usually keep Undo after the end
// ("Vrátit tah" in the end dialog) - decide per game.
$('#btnUndo').addEventListener('click', () => {
  if (G.status !== 'playing') { toast('Hra skončila – ťukni na Nová hra'); return; }
  if (!G.history.length) { toast('Zatím není co vrátit'); return; }
  press(G.lights, G.n, G.history.pop());
  buzz(); save(); render();
});
// rule: a new game in the middle of one asks first
$('#btnNew').addEventListener('click', () => {
  if (G.status === 'playing' && !isFresh()) {
    showModal('<h2>Začít novou hru?</h2><p>Rozehraná hra se ztratí.</p>', [{ text: 'Ano, nová hra', fn: () => newGame() }, { text: 'Ne, hrát dál', cls: 'alt' }]);
  } else newGame();
});

/* ---------- Settings (rule: a separate screen, applied at once, no Save button) ---------- */
const opt = (act, on, title, desc) => `<button class="opt" data-act="${act}" aria-pressed="${on}"><span class="radio"></span><span><b>${title}</b>${desc ? `<span class="d">${desc}</span>` : ''}</span></button>`;
const toggleRow = (key, label) => `<div class="field trow"><div class="flabel">${label}</div><button class="sw" data-act="toggle:${key}" aria-pressed="${S[key]}">${S[key] ? 'Zapnuto' : 'Vypnuto'}</button></div>`;
function renderSettings() {
  $('#settingsIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Rozsviť<small>Nastavení</small></h2></div>
    <section class="card"><h3>Hra</h3>
      <div class="field"><div class="flabel">Velikost</div>
        ${SIZES.map(n => opt('size:' + n, S.size === n, `${n} × ${n}`, n === 3 ? 'Snadné, velká světla.' : n === 5 ? 'Těžší, víc světel.' : '')).join('')}
        ${G && S.size !== G.n ? '<div class="notice">Po návratu do hry začne <b>nová hra</b> s novou velikostí.</div>' : ''}
      </div>
    </section>
    <section class="card"><h3>Vzhled</h3>
      <div class="tiles">${THEMES.map(t => `<button class="tile" data-act="theme:${t.id}" aria-pressed="${S.theme === t.id}"><span class="swatch" data-theme="${t.id}"></span>${t.name}</button>`).join('')}</div>
      ${toggleRow('vibrate', 'Vibrace')}
    </section>
    <button class="big" data-act="close">Zpět ke hře</button>
    <button class="link" data-act="reset">Obnovit výchozí nastavení</button>`;
}
$('#settingsIn').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, arg] = b.dataset.act.split(':');
  if (act === 'close') { closeSettings(); return; }
  if (act === 'size') S.size = +arg;
  else if (act === 'theme') S.theme = arg;
  else if (act === 'toggle') S[arg] = !S[arg];
  else if (act === 'reset') { S = Object.assign({}, DEFAULTS); toast('Nastavení je zase výchozí'); }
  normalize(S); buzz(8); applyLook(); save();
  const y = $('#screenSettings').scrollTop; renderSettings(); $('#screenSettings').scrollTop = y;
});
function openSettings() { hideToast(); renderSettings(); $('#screenSettings').hidden = false; $('#screenSettings').scrollTop = 0; }
// a change that needs a new game starts it after returning and says so (rule)
function closeSettings() {
  $('#screenSettings').hidden = true;
  if (S.size !== G.n) newGame(isFresh() ? '' : 'Začala nová hra s novou velikostí');
  else render();
}
$('#btnSettings').addEventListener('click', openSettings);

/* ---------- Help (rule: only behind "?", never opens by itself) ---------- */
function renderHelp() {
  $('#helpIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Rozsviť<small>Jak hrát</small></h2></div>
    <section class="card help"><ol>
      <li>Ťukni na světlo. Přepne se ono i sousední světla nahoře, dole, vlevo a vpravo.</li>
      <li>Rozsviť všechna světla. Každá hra jde vyřešit a nikam se nespěchá.</li>
      <li><b>Zpět</b> vrátí poslední tah. Dá se ťukat opakovaně.</li>
    </ol></section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
}
function openHelp() { hideToast(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; }
$('#helpIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenHelp').hidden = true; });
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
// rule: ask for persistent storage so the browser does not delete the saved game by itself
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const saved = load();
const savedSettings = saved && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
// rule: a size chosen just before the app was closed (Settings still open) is applied now, as closing Settings would
if (saved && validGame(saved.game)) { G = saved.game; if (S.size !== G.n) closeSettings(); else render(); }
else newGame();

window.addEventListener('resize', layout);
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
document.addEventListener('contextmenu', e => e.preventDefault());

// contract: opened from the launcher (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;

// For testing
window.Template = { press, makeLights, get state() { return { S, G }; } };
})();
</script>
</body>
</html>
