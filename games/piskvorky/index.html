<!doctype html>
<html lang="cs" data-theme="paper">
<head>
<meta charset="utf-8">
<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4ebdf">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Piškvorky">
<title>Piškvorky</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f4ebdf'/%3E%3Cpath d='M14 14l16 16M30 14L14 30' stroke='%232b1a0e' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='42' cy='42' r='9' fill='none' stroke='%23b5482a' stroke-width='6'/%3E%3C/svg%3E">
<style>
/* ---------- Themes: a solid colour; everything below reads these variables (rule) ---------- */
/* --sheet the board, --grid its lines, --x and --o the marks, --last the last mark, --hint the advice, --win the five */
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.06);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--accent:#7a4520;--accent-ink:#fff;--chip:#fff;--chip-line:#e6d8c6;--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--undo-bg:rgba(122,69,32,.1);
  --sheet:#fffaf2;--grid:#dccab3;--edge:#c9b394;--x:#2b1a0e;--o:#b5482a;--last:rgba(122,69,32,.16);--hint:#2f7fd8;--win:#7a4520}
[data-theme="notebook"]{--page:#eef2f8;--bar:rgba(31,79,191,.06);--line:#d3deee;--ink:#1d2b44;--soft:#52617c;--accent:#1f4fbf;--accent-ink:#fff;--chip:#fff;--chip-line:#cfdaec;--btn:#1f4fbf;--btn-ink:#fff;--btn-sh:#123077;--undo-bg:rgba(31,79,191,.08);
  --sheet:#ffffff;--grid:#b4cbea;--edge:#8fb0dd;--x:#1f4fbf;--o:#d1342a;--last:rgba(31,79,191,.14);--hint:#18a058;--win:#d1342a}
[data-theme="board"]{--page:#23402a;--bar:rgba(0,0,0,.22);--line:rgba(255,255,255,.1);--ink:#eef6e8;--soft:#cfe2c6;--accent:#ffd66b;--accent-ink:#2a2200;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.22);--btn:#ffd66b;--btn-ink:#2a2200;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.25);
  --sheet:#2c4f35;--grid:rgba(255,255,255,.17);--edge:rgba(255,255,255,.3);--x:#ffffff;--o:#ffd66b;--last:rgba(255,255,255,.16);--hint:#6fc3ff;--win:#ff8a65}

/* ---------- Base ---------- */
:root{--gut:12px} /* one side margin: bar buttons, board and bottom buttons line up (the safe areas are on #app) */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
/* rule: 100dvh + safe areas, the board is sized from the room that is left (see layout()) */
#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Top bar (rule: home, Nová hra, <h1> name, ?, settings) ---------- */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;color:var(--ink);white-space:normal;overflow-wrap:normal;word-break:normal} /* a long name wraps to two lines between words, never inside a word and never cut (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);text-decoration:none}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:8px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:20px}
/* narrow phones (360 px): less room between the bar buttons, so the name fits whole at 18 px; the outer margin stays */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill{padding:0 8px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px;letter-spacing:0}
}

/* ---------- The two players: a row above the board (the opponent) and below it (you) ---------- */
.side{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 var(--gut);padding:4px 10px;min-height:52px;border-radius:16px;border:3px solid transparent;background:var(--bar);--op-ava:40px;--op-ava-bg:var(--chip);--op-name:20px}
.side.on{border-color:var(--accent)}
.side .me{font-size:21px;font-weight:800}
.side .tag{flex:none;font-size:18px;font-weight:800;padding:2px 10px;border-radius:12px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.side .tag.off{background:none;color:var(--soft);font-weight:700;padding:2px 0}
.left{display:flex;align-items:center;gap:10px;min-width:0}
.mk{flex:none;width:26px;height:26px}
.mk path{stroke:var(--x)}
.mk circle{stroke:var(--o)}

/* ---------- Board: squared paper drawn as one SVG; it can be zoomed and moved inside #view ---------- */
#mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:8px 0 0}
#board{flex:none;display:grid;place-items:center;padding:12px var(--gut)} /* rule: at least 12 px between the board and the rows above and below, on every screen */
#view{position:relative;overflow:hidden;background:var(--sheet);border-radius:6px;box-shadow:0 0 0 2px var(--edge);touch-action:none}
#svg{position:absolute;left:0;top:0;transform-origin:0 0;display:block}
#svg .gl{stroke:var(--grid);stroke-width:1;fill:none}
#svg .x{stroke:var(--x);stroke-width:.15;stroke-linecap:round;fill:none}
#svg .o{stroke:var(--o);stroke-width:.12;fill:none}
#svg .last{fill:var(--last)}
#svg .hint{fill:color-mix(in srgb,var(--hint) 22%,transparent);stroke:var(--hint);stroke-width:.09}
#svg .pend{opacity:.38}
#svg .pendbox{fill:none;stroke:var(--accent);stroke-width:.08;stroke-dasharray:.16 .1}
#svg .win{stroke:var(--win);stroke-width:.16;stroke-linecap:round;opacity:.85}
#svg .new{animation:pop .28s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(.3);opacity:.2}to{transform:scale(1);opacity:1}}

/* ---------- Bottom buttons ---------- */
.tray{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px var(--gut) 12px;margin-top:8px;background:var(--bar);border-top:1px solid var(--line)}
#hint{text-align:center;font-size:19px;line-height:1.3;color:var(--soft);min-height:25px}
.row{display:flex;gap:10px}
.undo{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;height:64px;border-radius:16px;font-size:20px;font-weight:800;color:var(--ink);background:var(--undo-bg);box-shadow:inset 0 0 0 2px var(--chip-line)}
.undo svg{flex:none;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
/* an unavailable action is only dimmed and explains itself when tapped */
.undo.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */
@media (max-height:800px){
  .topbar{height:56px}
  .round{width:42px;height:42px}
  .pill{height:42px}
  .side{min-height:48px;--op-ava:36px}
  #mid{padding-top:6px}
  .undo{height:56px}
  .tray{gap:6px;padding:6px var(--gut) 10px;margin-top:6px}
}
@media (max-width:380px){ .undo{font-size:18px;gap:4px} .undo svg{width:20px;height:20px} }

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
/* rule: the head with Zpět and the game name stays at the top while scrolling */
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);margin-top:16px}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{font-size:18px;color:var(--psoft);line-height:1.3}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{display:block;height:56px;border-radius:10px;background:var(--page);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);padding:6px}
.swatch svg{display:block;width:100%;height:100%;border-radius:4px;background:var(--sheet)}
.swatch .gl{stroke:var(--grid);stroke-width:1;fill:none}
.swatch .x{stroke:var(--x);stroke-width:3;stroke-linecap:round}
.swatch .o{stroke:var(--o);stroke-width:2.6;fill:none}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.stats{font-size:20px;line-height:1.5}
.stats + .stats{margin-top:10px}
.help p,.help li{font-size:20px;line-height:1.45}
.help ol,.help ul{padding-left:26px}
.help li{margin:10px 0}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;line-height:1.35;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* the toast starts at the top of the bottom buttons and grows down over them: never over the board or the player rows (toast()) */
#toast{font-size:17px;line-height:1.25;padding:9px 14px;max-width:calc(100vw - 24px)}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px Georgia,"Times New Roman",serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
</style>
</head>
<body>
<div id="rotate" class="paper" role="status"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="6" width="20" height="36" rx="4"/><path d="M29 36h6"/><path d="M12 46a22 22 0 0 0 40 0"/><path d="m52 46-1.5 7M52 46l-7 2"/></svg><b>Otoč telefon na výšku</b><span>Hra počká, nic se neztratí.</span></div>
<div id="app">
  <header class="topbar">
    <!-- contract: the home button is hidden and shown only when opened from the launcher (?menu) -->
    <a id="btnHome" class="round" href="../../index.html" aria-label="Zpět na výběr her" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2V20a1 1 0 0 1-1 1H15v-5.5H9V21H4.5a1 1 0 0 1-1-1z"/></svg></a>
    <button id="btnNew" class="pill">Nová hra</button>
    <h1>Piškvorky</h1>
    <div class="top-right">
      <button id="btnHelp" class="round" aria-label="Jak hrát">?</button>
      <button id="btnSettings" class="round" aria-label="Nastavení"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M9.79 5.57L10.31 3.06A9.1 9.1 0 0 1 13.69 3.06L14.21 5.57A6.8 6.8 0 0 1 16.46 6.87L18.9 6.07A9.1 9.1 0 0 1 20.59 8.99L18.67 10.7A6.8 6.8 0 0 1 18.67 13.3L20.59 15.01A9.1 9.1 0 0 1 18.9 17.93L16.46 17.13A6.8 6.8 0 0 1 14.21 18.43L13.69 20.94A9.1 9.1 0 0 1 10.31 20.94L9.79 18.43A6.8 6.8 0 0 1 7.54 17.13L5.1 17.93A9.1 9.1 0 0 1 3.41 15.01L5.33 13.3A6.8 6.8 0 0 1 5.33 10.7L3.41 8.99A9.1 9.1 0 0 1 5.1 6.07L7.54 6.87A6.8 6.8 0 0 1 9.79 5.57ZM12 8.9a3.1 3.1 0 1 0 0 6.2a3.1 3.1 0 1 0 0 -6.2z"/></svg></button>
    </div>
  </header>
  <div id="mid">
    <div id="foeRow" class="side"></div>
    <main id="board"><div id="view"><svg id="svg" aria-label="Hrací plocha"></svg></div></main>
    <div id="meRow" class="side"></div>
  </div>
  <footer class="tray">
    <div id="hint"></div>
    <div class="row">
      <button id="btnUndo" class="undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Zpět</button>
      <button id="btnHint" class="undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Poradit</button>
      <button id="btnZoom" class="undo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/><path id="zoomPlus" d="M10.5 7.5v6M7.5 10.5h6"/></svg><span id="zoomLabel">Zvětšit</span></button>
    </div>
  </footer>
</div>
<!-- Every layer is shown and hidden only through its hidden attribute; every screen has a [data-act="close"] button (Back button contract) -->
<div id="screenSettings" class="screen paper" hidden><div class="screen-in" id="settingsIn"></div></div>
<div id="screenHelp" class="screen paper" hidden><div class="screen-in" id="helpIn"></div></div>
<div id="modal" class="modal paper" hidden><div class="mcard" id="modalCard"></div></div>
<div id="toast" class="hide"></div>
<script src="../_opponents/opponents.js"></script>
<script>
/* ---------- Visible height ---------- */
// The game is exactly as tall as the part of the window that is really shown (--app-h on #app). 100dvh alone is not
// enough: some browsers report it taller than what is visible (the app installed by Brave on Android counted the

  side = cs * G.n;
  const v = $('#view'); v.style.width = v.style.height = side + 'px';
  const svg = $('#svg'); svg.setAttribute('width', side); svg.setAttribute('height', side);
  clampPan(); applyZoom();
}

/* ---------- Zoom: two fingers or the Zvětšit button; one finger moves a zoomed board ---------- */
let zoom = 1, tx = 0, ty = 0;
function clampPan() { tx = Math.min(0, Math.max(side - side * zoom, tx)); ty = Math.min(0, Math.max(side - side * zoom, ty)); }
function applyZoom() { $('#svg').style.transform = `translate(${tx}px,${ty}px) scale(${zoom})`; }
function resetZoom() { zoom = 1; tx = 0; ty = 0; if (side) applyZoom(); }
// zoom so that the board point (bx, by) in board pixels sits at (vx, vy) in the view
function zoomTo(z, bx, by, vx, vy) { zoom = Math.min(3.5, Math.max(1, z)); tx = vx - bx * zoom; ty = vy - by * zoom; clampPan(); applyZoom(); }
// a mark that appeared outside the zoomed view: move the view to it
function showCell(cell) {
  if (zoom <= 1) return;
  const cs = side / G.n, x = (cell % G.n + .5) * cs * zoom + tx, y = (((cell / G.n) | 0) + .5) * cs * zoom + ty, m = cs * zoom;
  if (x < m || y < m || x > side - m || y > side - m) zoomTo(zoom, (cell % G.n + .5) * cs, (((cell / G.n) | 0) + .5) * cs, side / 2, side / 2);
}
$('#btnZoom').addEventListener('click', () => {
  if (zoom > 1) resetZoom();
  else {
    // around the last mark, or the middle of the board
    const c = G.moves.length ? G.moves[G.moves.length - 1] : ((G.n >> 1) * G.n + (G.n >> 1)), cs = side / G.n;
    zoomTo(G.n >= 19 ? 2.4 : 2, (c % G.n + .5) * cs, (((c / G.n) | 0) + .5) * cs, side / 2, side / 2);
  }
  buzz(8); render();
});
(() => {
  const view = $('#view'), pts = new Map();
  let start = null, pinch = null, moved = false;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
  const midp = () => { const [a, b] = [...pts.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
  view.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return; // only the main mouse button plays (a right click is no move)
    try { view.setPointerCapture(e.pointerId); } catch (er) {}
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { start = { x: e.clientX, y: e.clientY, tx, ty }; moved = false; pinch = null; }
    else if (pts.size === 2) {
      const r = view.getBoundingClientRect(), m = midp();
      pinch = { d: dist(), z: zoom, bx: (m.x - r.left - tx) / zoom, by: (m.y - r.top - ty) / zoom };
      moved = true; // a pinch is never a tap
    }
  });
  view.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = view.getBoundingClientRect();
    if (pinch && pts.size >= 2) { const m = midp(); zoomTo(pinch.z * dist() / pinch.d, pinch.bx, pinch.by, m.x - r.left, m.y - r.top); return; }
    if (start && pts.size === 1) {
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (!moved && Math.hypot(dx, dy) > 10) moved = true;
      if (moved && zoom > 1) { tx = start.tx + dx; ty = start.ty + dy; clampPan(); applyZoom(); }
    }
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId);
    if (pinch) { if (pts.size === 0) { pinch = null; start = null; render(); } else if (pts.size === 1) { const p = [...pts.values()][0]; start = { x: p.x, y: p.y, tx, ty }; } return; }
    if (e.type === 'pointerup' && start && !moved && pts.size === 0) {
      const r = view.getBoundingClientRect(), cs = side / G.n;
      const bx = (e.clientX - r.left - tx) / zoom, by = (e.clientY - r.top - ty) / zoom;
      const c = Math.floor(bx / cs), rr = Math.floor(by / cs);
      if (c >= 0 && rr >= 0 && c < G.n && rr < G.n) onCell(rr * G.n + c);
    }
    if (pts.size === 0) start = null;
  };
  view.addEventListener('pointerup', end);
  view.addEventListener('pointercancel', end);
})();

/* ---------- Controls ---------- */
function onCell(cell) {
  if (G.status !== 'playing') { toast(G.status === 'lost' ? 'Hra skončila. Zpět vrátí tvůj tah, nebo ťukni na Nová hra.' : 'Hra skončila. Ťukni na Nová hra.'); return; }
  if (busy()) { toast(`Chvilku, ${nm()} přemýšlí`); return; }
  if (!yourTurn()) return;
  if (G.moves.includes(cell)) { if (pending >= 0) { pending = -1; render(); } toast('Tohle políčko už je zabrané'); return; }
  // the advice and a second tap on the faint mark place it; with "Potvrzovat tah" the first tap only shows it
  if (cell === hintCell || cell === pending || !S.confirm) { playYours(cell); return; }
  pending = cell; buzz(8); render();
}
// Undo: back to before your last mark, with the opponent's reply (also after the end of the game)
function undoTarget() {
  for (let i = G.moves.length - 1; i >= 0; i--) if ((i & 1) === G.you) return i;
  return -1;
}
$('#btnUndo').addEventListener('click', () => {
  if (pending >= 0 && yourTurn()) { pending = -1; buzz(); render(); return; } // first only the faint mark goes
  const i = undoTarget();
  if (i < 0) { toast('Zatím není co vrátit'); return; }
  stopThinking();
  G.moves.length = i;
  pending = -1; hintCell = -1;
  G.status = judge(G);
  $('#modal').hidden = true;
  buzz(); save(); render();
});
$('#btnHint').addEventListener('click', () => {
  if (G.status !== 'playing') { toast('Hra skončila'); return; }
  if (busy()) { toast(`Chvilku, ${nm()} přemýšlí`); return; }
  if (hintBusy) { toast('Chvilku, hledám dobrý tah'); return; }
  const g0 = G, k = G.moves.length;
  hintBusy = true; render();
  ask(engineInput('hint'), r => {
    hintBusy = false;
    if (G !== g0 || G.moves.length !== k) return;
    hintCell = Number.isInteger(r.m) && r.m >= 0 && !G.moves.includes(r.m) ? r.m : -1;
    pending = -1;
    const first = hintCell >= 0 && !G.hinted && !G.counted;
    if (hintCell >= 0) { showCell(hintCell); G.hinted = true; save(); }
    render();
    if (first) toast('S radou se tahle hra nepočítá do statistik', 3200);
  });
});
// rule: a new game in the middle of one asks first
$('#btnNew').addEventListener('click', () => {
  if (hasProgress()) {
    showModal('<h2>Začít novou hru?</h2><p>Rozehraná hra se ztratí.</p>', [{ text: 'Ano, nová hra', fn: () => newGame() }, { text: 'Ne, hrát dál', cls: 'alt' }]);
  } else newGame();
});
// rule: an end dialog only for the game that ended, never over Settings or Help (whenFree)
function endDialog() {
  const g0 = G, k = G.moves.length;
  whenFree(g0, 900, () => {
    if (G.moves.length !== k || G.status === 'playing') return;
    const head = G.status === 'won' ? 'Výhra! 🎉' : G.status === 'lost' ? `${O.past(G.foe, 'Vyhrál', 'Vyhrála')} ${nm()}` : 'Remíza';
    const why = G.status === 'won' ? 'Máš pět v řadě.' : G.status === 'lost' ? `${nm()} má pět v řadě.` : 'Plocha je plná a nikdo nemá pět v řadě.';
    const btns = [{ text: 'Nová hra', fn: () => newGame() }];
    if (G.status !== 'won') btns.push({ text: 'Vrátit tah', cls: 'alt', fn: () => $('#btnUndo').click() });
    btns.push({ text: 'Prohlédnout', cls: 'alt' });
    showModal(`<h2>${head}</h2><p>${why}</p>${G.hinted ? '<p>Hra s radou se do statistik nepočítá.</p>' : ''}`, btns);
  });
}

/* ---------- Settings (rule: a separate screen, applied at once, no Save button) ---------- */
const opt = (act, on, title, desc) => `<button class="opt" data-act="${act}" aria-pressed="${on}"><span class="radio"></span><span><b>${title}</b>${desc ? `<span class="d">${desc}</span>` : ''}</span></button>`;
const toggleRow = (key, label, note) => `<div class="field"><div class="trow"><div class="flabel">${label}</div><button class="sw" data-act="toggle:${key}" aria-pressed="${S[key]}">${S[key] ? 'Zapnuto' : 'Vypnuto'}</button></div>${note ? `<div class="fnote">${note}</div>` : ''}</div>`;
const swatch = id => `<span class="swatch" data-theme="${id}"><svg viewBox="0 0 60 30" aria-hidden="true"><path class="gl" d="M15 0V30M30 0V30M45 0V30M0 15H60"/><path class="x" d="M4 4l7 7M11 4l-7 7M34 19l7 7M41 19l-7 7"/><circle class="o" cx="22.5" cy="22.5" r="4.4"/><circle class="o" cx="52.5" cy="7.5" r="4.4"/></svg></span>`;
const plural = (n, a, b, c) => `${n} ${n === 1 ? a : n >= 2 && n <= 4 ? b : c}`;
const changed = () => G && (S.level !== G.level || S.size !== G.n);
function renderSettings() {
  $('#settingsIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Piškvorky<small>Nastavení</small></h2></div>
    <section class="card"><h3>Soupeř</h3>
      <div class="field">
        ${LEVELS.map((l, i) => opt('level:' + l.id, S.level === l.id, O.levelName(LEVELS, i), l.desc)).join('')}
        <div class="fnote">Soupeř má každou hru jiné jméno. Kdo začíná, se střídá: kdo začíná, kreslí křížky.</div>
      </div>
      <div class="field"><div class="flabel">Rychlost soupeře</div>
        ${SPEEDS.map(s => opt('speed:' + s.id, S.speed === s.id, s.name, s.desc)).join('')}
      </div>
    </section>
    <section class="card"><h3>Plocha</h3>
      <div class="field">
        ${SIZES.map(z => opt('size:' + z.n, S.size === z.n, z.name, z.desc)).join('')}
      </div>
      ${changed() && !isFresh() ? `<div class="notice">Změna platí od příští hry.${hasProgress() ? ' Rozehraná hra zůstává.' : ''}</div>` : ''}
    </section>
    <section class="card"><h3>Ovládání</h3>
      ${toggleRow('confirm', 'Potvrzovat tah', 'První ťuknutí ukáže značku jen slabě, druhé ťuknutí na stejné políčko ji položí. Chrání před překlepem na malých políčkách.')}
    </section>
    <section class="card"><h3>Vzhled</h3>
      <div class="tiles">${THEMES.map(t => `<button class="tile" data-act="theme:${t.id}" aria-pressed="${S.theme === t.id}">${swatch(t.id)}${t.name}</button>`).join('')}</div>
      ${toggleRow('vibrate', 'Vibrace')}
    </section>
    <section class="card"><h3>Statistika</h3>
      ${LEVELS.map((l, i) => {
        const rows = SIZES.filter(z => ST[l.id][z.n].played).map(z => { const st = ST[l.id][z.n]; return `${z.name} plocha: ${plural(st.played, 'hra', 'hry', 'her')}, výher ${st.won}, remíz ${st.draw}`; });
        return `<p class="stats"><b>${O.levelName(LEVELS, i)}</b><br>${rows.length ? rows.join('<br>') : 'Zatím žádná dohraná hra'}</p>`;
      }).join('')}
      <p class="fnote">Počítají se jen dohrané hry bez Poradit.</p>
    </section>
    <button class="big" data-act="close">Zpět ke hře</button>
    <button class="link" data-act="reset">Obnovit výchozí nastavení</button>`;
}
$('#settingsIn').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, arg] = b.dataset.act.split(':');
  if (act === 'close') { closeSettings(); return; }
  if (act === 'level') S.level = arg;
  else if (act === 'speed') S.speed = arg;
  else if (act === 'size') S.size = +arg;
  else if (act === 'theme') S.theme = arg;
  else if (act === 'toggle') S[arg] = !S[arg];
  else if (act === 'reset') { S = Object.assign({}, DEFAULTS); toast('Nastavení je zase výchozí'); }
  normalize(S); buzz(8); applyLook(); save();
  const y = $('#screenSettings').scrollTop; renderSettings(); $('#screenSettings').scrollTop = y;
});
function openSettings() { hideToast(); renderSettings(); $('#screenSettings').hidden = false; $('#screenSettings').scrollTop = 0; }
// a new opponent or board size applies from the next game; a game in which you have not moved yet is replaced at once
function closeSettings() {
  $('#screenSettings').hidden = true;
  if (!S.confirm) pending = -1;
  if (changed() && isFresh()) {
    stopThinking();
    const g = G, foe = S.level !== g.level ? O.create(rnd, [g.foe.name]) : g.foe;
    G = Object.assign({}, g, { n: S.size, level: S.level, foe, moves: [], status: 'playing', counted: false, hinted: false });
    pending = -1; hintCell = -1; resetZoom();
    save(); render(); cpuTurn();
    toast(S.level !== g.level ? `Hraješ proti soupeři: ${O.levelName(LEVELS, lvIdx(S.level))}` : `Nová hra na ploše ${S.size} × ${S.size}`);
  } else if (changed()) { render(); toast(`Změna platí od příští hry${hasProgress() ? '. Rozehraná hra zůstává.' : ''}`); }
  else render();
}
$('#btnSettings').addEventListener('click', openSettings);

/* ---------- Help (rule: only behind "?", never opens by itself) ---------- */
function renderHelp() {
  $('#helpIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Piškvorky<small>Jak hrát</small></h2></div>
    <section class="card help"><h3>Pravidla</h3><ul>
      <li>Ty a soupeř se střídáte a kreslíte značky do volných políček. Kdo začíná, kreslí <b>křížky</b>, druhý <b>kolečka</b>. Kdo začíná, se každou hru střídá.</li>
      <li><b>Vyhrává</b>, kdo má první <b>pět svých značek v řadě</b>: vodorovně, svisle nebo šikmo. Platí i šest a víc v řadě.</li>
      <li>Když se zaplní celá plocha a nikdo nemá pět v řadě, je to <b>remíza</b>.</li>
      <li>Tip: <b>otevřená trojka</b> (tři v řadě a volno na obou koncích) se musí zastavit hned, jinak z ní soupeř udělá čtyřku, kterou už zavřít nejde.</li>
    </ul></section>
    <section class="card help"><h3>Ovládání</h3><ol>
      <li>Ťukni na volné políčko. Když je zapnuté <b>Potvrzovat tah</b> (v Nastavení), značka se ukáže slabě a další ťuknutí na stejné políčko ji položí; ťuknutím jinam ji přesuneš.</li>
      <li>Soupeřova poslední značka má podbarvené políčko.</li>
      <li><b>Zpět</b> vrátí tvůj poslední tah i soupeřovu odpověď. Dá se ťukat opakovaně, i po konci hry.</li>
      <li><b>Poradit</b> označí dobré políčko. Ťukni na něj a tah se hned zahraje. Hra, ve které použiješ Poradit, se do statistik nepočítá; počítají se jen dohrané hry.</li>
      <li><b>Zvětšit</b> přiblíží plochu kolem poslední značky, <b>Zmenšit</b> ukáže zase celou. Přibližovat jde i roztažením dvěma prsty; přiblíženou plochou posouváš jedním prstem.</li>
    </ol></section>
    <section class="card help"><h3>Soupeř</h3>
      <p>${LEVELS.map((l, i) => `<b>${O.levelName(LEVELS, i)}</b>: ${l.desc}`).join('<br><br>')}</p>
      <p style="margin-top:12px">Soupeře a velikost plochy vybereš v Nastavení. Soupeř má každou hru jiné jméno.</p>
    </section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
}
function openHelp() { hideToast(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; }
$('#helpIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenHelp').hidden = true; });
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
// rule: ask for persistent storage so the browser does not delete the saved game by itself
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const saved = load();
const savedSettings = saved && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
ST = validStats(saved && saved.stats);
// rule: a level or size chosen just before the app was closed (Settings still open) is applied now, as closing Settings would
if (saved && validGame(saved.game)) { G = saved.game; if (changed() && isFresh()) closeSettings(); else { render(); cpuTurn(); } }
else newGame();

window.addEventListener('resize', render);
if (window.visualViewport) visualViewport.addEventListener('resize', render);
document.addEventListener('contextmenu', e => e.preventDefault());

// contract: opened from the launcher (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;

// For testing: the engine, place your mark on a cell (r * n + c), turn the worker off
window.Piskvorky = {
  E, play: cell => { if (yourTurn() && !busy() && !G.moves.includes(cell)) playYours(cell); },
  noWorker() { workerOk = false; if (worker) { try { worker.terminate(); } catch (e) {} worker = null; } },
  get busy() { return busy() || hintBusy; }, get state() { return { S, G, ST }; },
};
})();
</script>
</body>
