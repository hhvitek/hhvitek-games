<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".4" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#000" stop-opacity=".12"/>
    </linearGradient>
    <!-- jedna kostka 80×80 -->
    <g id="b"><rect width="80" height="80" rx="14"/><rect width="80" height="80" rx="14" fill="url(#g)"/><rect x="2" y="70" width="76" height="8" rx="4" fill="#000" opacity=".18"/></g>
    <rect id="e" width="80" height="80" rx="14" fill="#2a3a68"/>
  </defs>
  <!-- pozadí a deska 5×5 -->
  <rect width="512" height="512" fill="#1d2b52"/>
  <rect x="34" y="34" width="444" height="444" rx="26" fill="#111a36"/>
  <!-- prázdná políčka (krok 86) -->
  <g>
    <use href="#e" x="46" y="46"/><use href="#e" x="132" y="46"/><use href="#e" x="218" y="46"/><use href="#e" x="304" y="46"/><use href="#e" x="390" y="46"/>
    <use href="#e" x="46" y="132"/><use href="#e" x="132" y="132"/><use href="#e" x="218" y="132"/><use href="#e" x="304" y="132"/><use href="#e" x="390" y="132"/>
    <use href="#e" x="46" y="218"/><use href="#e" x="132" y="218"/><use href="#e" x="218" y="218"/><use href="#e" x="304" y="218"/><use href="#e" x="390" y="218"/>
    <use href="#e" x="46" y="304"/><use href="#e" x="132" y="304"/><use href="#e" x="218" y="304"/><use href="#e" x="304" y="304"/><use href="#e" x="390" y="304"/>
    <use href="#e" x="46" y="390"/><use href="#e" x="132" y="390"/><use href="#e" x="218" y="390"/><use href="#e" x="304" y="390"/><use href="#e" x="390" y="390"/>
  </g>
  <!-- žluté L nahoře -->
  <use href="#b" x="46" y="46" fill="#f5c518"/><use href="#b" x="46" y="132" fill="#f5c518"/><use href="#b" x="132" y="132" fill="#f5c518"/>
  <!-- tyrkysová dvojice -->
  <use href="#b" x="390" y="132" fill="#22b8cf"/><use href="#b" x="390" y="218" fill="#22b8cf"/>
  <!-- zelený čtverec -->
  <use href="#b" x="132" y="304" fill="#43b649"/><use href="#b" x="218" y="304" fill="#43b649"/>
  <!-- spodní řada: skoro plná, chybí jedno políčko -->
  <use href="#b" x="46" y="390" fill="#e8453c"/><use href="#b" x="132" y="390" fill="#43b649"/><use href="#b" x="218" y="390" fill="#43b649"/><use href="#b" x="390" y="390" fill="#9a55d4"/>
  <!-- kostka, která právě padne do mezery -->
  <rect x="300" y="386" width="88" height="88" rx="16" fill="none" stroke="#ffd34d" stroke-width="6"/>
  <use href="#b" x="304" y="304" fill="#3a78e0"/>
  <use href="#b" x="304" y="390" fill="#3a78e0" opacity=".55"/>
</svg>
