<!doctype html>
<!--
  Věžičky: stacks of hexagonal tiles are placed on a honeycomb board; neighbouring stacks with the same colour on
  top gather that colour on one of them, and 10 or more tiles of one colour on top vanish for points.
  Our own version of the "hexa sort" genre. The pure rules are the block between "Engine" and "Engine end",
  tested in Node by tools/vezicky-test.js.
-->
<html lang="cs" data-theme="paper">
<head>
<meta charset="utf-8">
<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4ebdf">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Věžičky">
<title>Věžičky</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f4ebdf'/%3E%3Cpath d='M12 40 22 34h20l10 6v6l-10 6H22l-10-6z' fill='%232f6fe0'/%3E%3Cpath d='M12 30 22 24h20l10 6v6l-10 6H22l-10-6z' fill='%23e5483d'/%3E%3Cpath d='M12 20 22 14h20l10 6-10 6H22z' fill='%23f7c52a'/%3E%3C/svg%3E">
<style>
/* ---------- Themes: a solid colour; everything below reads these variables (rule) ---------- */
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.06);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--accent:#7a4520;--chip:#fff;--chip-line:#e6d8c6;--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--undo-bg:rgba(122,69,32,.1);--slot:#e8d9c5;--slot-side:#cbb497;--slot-line:#b89d7e;--tray:#ecdfcd;--mark:#7a4520}
[data-theme="night"]{--page:#18223d;--bar:rgba(0,0,0,.25);--line:rgba(255,255,255,.08);--ink:#eef3fb;--soft:#b9c6dc;--accent:#ffd166;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--btn:#ffd166;--btn-ink:#2a2000;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.28);--slot:#2a3962;--slot-side:#111a31;--slot-line:#41538a;--tray:rgba(255,255,255,.06);--mark:#ffd166}
[data-theme="slate"]{--page:#3d4852;--bar:rgba(0,0,0,.2);--line:rgba(255,255,255,.1);--ink:#f1f4f6;--soft:#c5cdd4;--accent:#ffcf5c;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.22);--btn:#ffcf5c;--btn-ink:#2a2000;--btn-sh:#9c7b25;--undo-bg:rgba(0,0,0,.22);--slot:#515e6b;--slot-side:#262e36;--slot-line:#6c7a88;--tray:rgba(0,0,0,.16);--mark:#ffcf5c}

/* ---------- Base ---------- */
:root{--gut:12px;--tray-h:100px} /* one side margin: bar buttons, board and bottom buttons line up (the safe areas are on #app) */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
/* rule: 100dvh + safe areas, the board is sized from the room that is left (see layout()) */
#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Top bar (rule: home, Nová hra, <h1> name, ?, settings) ---------- */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;color:var(--ink);white-space:normal;overflow-wrap:normal;word-break:normal} /* a long name wraps to two lines between words, never inside a word and never cut (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);text-decoration:none}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:8px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:20px}
/* narrow phones (360 px): less room between the bar buttons, so the name fits whole at 18 px; the outer margin stays */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill{padding:0 8px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px;letter-spacing:0}
}

/* ---------- Score row: points, the colours in play, the record of this difficulty ---------- */
.score{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px var(--gut) 0;line-height:1;white-space:nowrap}
.score b{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--ink)}
.score b.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.18)}}
.score .rec{display:flex;align-items:center;gap:4px;font-size:18px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.score .rec svg{width:17px;height:17px;fill:var(--accent)}
.score .rec i{font-style:normal}
@media (max-width:380px){.score .lbl{display:none}} /* 360 px: score, 8 colours and the record fit on one row */
.cols{display:flex;gap:2px;align-items:center}
.cols i{width:10px;height:9px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.cols i.new{animation:bump .5s ease-out 2}

/* ---------- Board: one SVG as big as the room left; the honeycomb is sized and centred in it (layout()) ---------- */
.play{flex:1;min-height:0;padding:12px var(--gut);touch-action:none} /* rule: at least 12 px between the board and the rows above and below */
#bsvg{display:block;width:100%;height:100%;overflow:hidden}
.cell{fill:var(--slot);stroke:var(--slot-line);stroke-width:1}
.cell.can{stroke:var(--mark);stroke-width:2}
.cell.hint{stroke:var(--mark);stroke-width:4;stroke-dasharray:7 5}
/* an empty cell partly hidden behind a tower in front of it: its outline is drawn again over the towers */
.cell-over{fill:none;stroke:var(--mark);stroke-width:1.6;stroke-dasharray:5 4;opacity:.75;pointer-events:none}
.cell-over.hint{stroke-width:4;stroke-dasharray:7 5;opacity:1}
.sock{fill:var(--slot-side)}
.pv{opacity:.55}
.pts{font-weight:900;fill:var(--ink);stroke:var(--page);stroke-width:4px;paint-order:stroke;animation:rise 1s ease-out forwards}
@keyframes rise{to{transform:translateY(-34px);opacity:0}}

/* ---------- Tray: three stacks to place ---------- */
.tray{flex:none;height:var(--tray-h);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 var(--gut) 8px;touch-action:none}
.slot{position:relative;border-radius:18px;background:var(--tray);min-width:0;transition:box-shadow .15s}
.slot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transition:transform .15s}
.slot.sel{box-shadow:0 0 0 4px var(--mark)}
.slot.sel svg{transform:translateY(-5px)}
.slot.hint{outline:3px dashed var(--mark);outline-offset:-3px}
.slot.lifted svg{opacity:.15}

/* ---------- Bottom buttons ---------- */
.actions{flex:none;display:flex;gap:10px;padding:8px var(--gut) 12px;background:var(--bar);border-top:1px solid var(--line)}
.undo{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;height:58px;border-radius:16px;font-size:21px;font-weight:800;color:var(--ink);background:var(--undo-bg);box-shadow:inset 0 0 0 2px var(--chip-line)}
.undo svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.undo.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */
.again{flex:1.3 1 0;min-width:0;height:58px;border-radius:16px;font-size:22px;font-weight:800;background:var(--btn);color:var(--btn-ink);box-shadow:0 4px 0 var(--btn-sh)}
#ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35));will-change:transform}
#ghost svg{display:block;overflow:visible}

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
/* rule: the head with Zpět and the game name stays at the top while scrolling */
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);margin-top:16px}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{font-size:18px;color:var(--psoft);line-height:1.3}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{height:56px;border-radius:10px;background:var(--page);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);display:grid;place-items:center}
.swatch svg{height:46px;width:auto}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.help p,.help li{font-size:20px;line-height:1.45}
.help ol{padding-left:26px}
.help li{margin:10px 0}
.help .pal{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.help .pal span{display:flex;align-items:center;gap:6px;font-size:18px}
.help .pal svg{width:22px;height:22px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
.mcard .pts-big{font-size:46px;font-weight:900;margin:0}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;line-height:1.35;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* the toast starts at the top of the bottom buttons and grows down over them: never over the board or the tray (toast()) */
#toast{font-size:17px;line-height:1.25;padding:9px 14px;max-width:calc(100vw - 24px)}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px Georgia,"Times New Roman",serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
</style>
</head>
<body>
<div id="rotate" class="paper" role="status"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="6" width="20" height="36" rx="4"/><path d="M29 36h6"/><path d="M12 46a22 22 0 0 0 40 0"/><path d="m52 46-1.5 7M52 46l-7 2"/></svg><b>Otoč telefon na výšku</b><span>Hra počká, nic se neztratí.</span></div>
<div id="app">
  <header class="topbar">
    <!-- contract: the home button is hidden and shown only when opened from the launcher (?menu) -->
    <a id="btnHome" class="round" href="../../index.html" aria-label="Zpět na výběr her" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2V20a1 1 0 0 1-1 1H15v-5.5H9V21H4.5a1 1 0 0 1-1-1z"/></svg></a>
    <button id="btnNew" class="pill">Nová hra</button>
    <h1>Věžičky</h1>
    <div class="top-right">
      <button id="btnHelp" class="round" aria-label="Jak hrát">?</button>
      <button id="btnSettings" class="round" aria-label="Nastavení"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M9.79 5.57L10.31 3.06A9.1 9.1 0 0 1 13.69 3.06L14.21 5.57A6.8 6.8 0 0 1 16.46 6.87L18.9 6.07A9.1 9.1 0 0 1 20.59 8.99L18.67 10.7A6.8 6.8 0 0 1 18.67 13.3L20.59 15.01A9.1 9.1 0 0 1 18.9 17.93L16.46 17.13A6.8 6.8 0 0 1 14.21 18.43L13.69 20.94A9.1 9.1 0 0 1 10.31 20.94L9.79 18.43A6.8 6.8 0 0 1 7.54 17.13L5.1 17.93A9.1 9.1 0 0 1 3.41 15.01L5.33 13.3A6.8 6.8 0 0 1 5.33 10.7L3.41 8.99A9.1 9.1 0 0 1 5.1 6.07L7.54 6.87A6.8 6.8 0 0 1 9.79 5.57ZM12 8.9a3.1 3.1 0 1 0 0 6.2a3.1 3.1 0 1 0 0 -6.2z"/></svg></button>
    </div>
  </header>
  <div class="score" aria-live="polite"><b id="score">0</b><span class="cols" id="cols" aria-label="Barvy ve hře"></span><span class="rec"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v2h3v3a4.5 4.5 0 0 1-4.3 4.5A5 5 0 0 1 13 15.9V18h3.5v3h-9v-3H11v-2.1a5 5 0 0 1-3.7-3.4A4.5 4.5 0 0 1 3 8V5h3zm0 4H5v1a2.5 2.5 0 0 0 1.2 2.1A6 6 0 0 1 6 9zm12 0v2c0 .4 0 .8-.2 1.1A2.5 2.5 0 0 0 19 8V7z"/></svg><span class="lbl">rekord </span><i id="best">0</i></span></div>
  <main class="play" id="play"><svg id="bsvg" aria-label="Deska"><g id="gBoard"></g><g id="gFly"></g></svg></main>
  <div class="tray" id="tray"></div>
  <footer class="actions">
    <button id="btnUndo" class="undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Zpět</button>
    <button id="btnHint" class="undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>Poradit</button>
    <button id="btnAgain" class="again" hidden>Nová hra</button>
  </footer>
</div>
<!-- Every layer is shown and hidden only through its hidden attribute; every screen has a [data-act="close"] button (Back button contract) -->
<div id="screenSettings" class="screen paper" hidden><div class="screen-in" id="settingsIn"></div></div>
<div id="screenHelp" class="screen paper" hidden><div class="screen-in" id="helpIn"></div></div>

<script>
/* ---------- Visible height ---------- */
// The game is exactly as tall as the part of the window that is really shown (--app-h on #app). 100dvh alone is not
// enough: some browsers report it taller than what is visible (the app installed by Brave on Android counted the
// status and navigation bars too and hid the bottom buttons). visualViewport follows what is shown; it is measured
// again on every change and shortly after loading (a browser bar that hides itself may change it without an event),
// and a changed height makes the game lay itself out again through a resize event.
(() => {
  const root = document.documentElement;
  let last = 0;
  const measure = () => {
    const vv = window.visualViewport;
    const h = Math.round(vv ? vv.height * vv.scale : innerHeight);
    if (!(h > 0) || h === last) return;
    const first = !last; last = h;
    root.style.setProperty('--app-h', h + 'px');
    if (!first) dispatchEvent(new Event('resize'));
  };
  measure();
  addEventListener('resize', measure);
  if (window.visualViewport) visualViewport.addEventListener('resize', measure);
  addEventListener('pageshow', measure);
  [100, 500, 1500].forEach(ms => setTimeout(measure, ms));
  // TEMPORARY (2026-11-08): what this page measured, shown in the launcher's Nastavení → "Údaje o obrazovce"
  setTimeout(() => { try {
    const p = document.createElement('div'); p.style.cssText = 'position:absolute;left:-50px;top:0;width:1px;height:100dvh;padding-bottom:env(safe-area-inset-bottom)';
    document.body.appendChild(p); const dvh = Math.round(p.getBoundingClientRect().height - parseFloat(getComputedStyle(p).paddingBottom)), sb = Math.round(parseFloat(getComputedStyle(p).paddingBottom)); p.remove();
    const vv = window.visualViewport;
    localStorage.setItem('games.launcher.diag', JSON.stringify({ page: location.pathname.split('/').slice(-2, -1)[0], vv: vv ? Math.round(vv.height) : null, inner: innerHeight, client: root.clientHeight, dvh, sb, appH: last, app: Math.round(document.getElementById('app').getBoundingClientRect().height) }));
  } catch (e) {} }, 2000);
})();

(() => {
'use strict';

const ID = 'vezicky';                                     // = the folder name
const KEY = `games.${ID}.state`, BADGE = `games.${ID}.inProgress`; // contract: storage key and the "Rozehráno" badge
const THEMES = [
  { id: 'paper', name: 'Papír',    meta: '#f4ebdf' },
  { id: 'night', name: 'Noc',      meta: '#18223d' },
  { id: 'slate', name: 'Břidlice', meta: '#3d4852' },

// Difficulty = how many colours the game starts with; every STEP points one more comes (up to 8)
const DIFFS = [
  { id: 'easy',   name: 'Lehká',   start: 4, desc: 'Začíná se 4 barvami.' },
  { id: 'normal', name: 'Střední', start: 5, desc: 'Začíná se 5 barvami.' },
  { id: 'hard',   name: 'Těžká',   start: 6, desc: 'Začíná se 6 barvami.' },

// Tile colours, the easiest to tell apart first (the game adds them in this order); t = text and marks on the face
const COLORS = [
  { name: 'červená',   c: '#e5483d', t: '#fff' },
  { name: 'modrá',     c: '#2f6fe0', t: '#fff' },
  { name: 'žlutá',     c: '#f7c52a', t: '#3a2a00' },
  { name: 'zelená',    c: '#33a852', t: '#fff' },
  { name: 'fialová',   c: '#8d4fd0', t: '#fff' },
  { name: 'tyrkysová', c: '#22bfd0', t: '#003a40' },
  { name: 'oranžová',  c: '#f5832a', t: '#3a1a00' },
  { name: 'růžová',    c: '#f27bbd', t: '#4a0026' },

const SYMBOLS = [
  'M10 3a7 7 0 1 0 0 14a7 7 0 1 0 0-14z',
  'M10 2 18.5 17h-17z',
  'M3 3h14v14H3z',
  'M10 1 19 10 10 19 1 10z',
  'M10 1.5l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L1.4 7.8l6-.7z',
  'M7 2h6v5h5v6h-5v5H7v-5H2V7h5z',
  'M10 18 2.6 10.4A4.6 4.6 0 0 1 10 4.6a4.6 4.6 0 0 1 7.4 5.8z',
  'M13 2a8 8 0 1 0 5 13A7 7 0 0 1 13 2z',

const mix = (hex, p) => { const n = parseInt(hex.slice(1), 16), f = v => Math.round(v * (1 - p)); return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`; };

/* ---------- Engine ---------- */
// Pure game logic (no DOM), tested in Node by tools/vezicky-test.js. A stack is an array of colour indexes, the
// bottom tile first; the board is an array of N stacks (an empty stack = an empty cell).
function VezickyEngine() {
  // The board: a honeycomb of 24 flat-topped hexagons in 5 columns of 4, 5, 6, 5, 4 cells (the middle one highest).
  // y is counted in half rows, so the six neighbours of (c, y) are (c, y ± 2) and (c ± 1, y ± 1).
  const COLUMNS = [[4, 2], [5, 1], [6, 0], [5, 1], [4, 2]]; // [cells, y of the top one]
  const CLEAR = 10, STEP = 150, MAXC = 8;
  const CELLS = [];
  COLUMNS.forEach(([n, y0], c) => { for (let r = 0; r < n; r++) CELLS.push({ c, y: y0 + 2 * r }); });
  const N = CELLS.length;

  const NB = CELLS.map(p => [[0, -2], [1, -1], [1, 1], [0, 2], [-1, 1], [-1, -1]]
    .map(([dc, dy]) => at.get((p.c + dc) + ',' + (p.y + dy))).filter(i => i !== undefined));
  const top = s => s.length ? s[s.length - 1] : -1;
  const runLen = s => { let n = 0; const t = top(s); for (let i = s.length - 1; i >= 0 && s[i] === t; i--) n++; return n; };
  const pure = s => s.length > 0 && runLen(s) === s.length;
  const adjacent = (a, b) => NB[a].includes(b);

  // After a stack is placed: neighbouring stacks with the same top colour gather that colour on one of them
  // (the target), until no two neighbours share a top colour; then every top run of CLEAR or more tiles vanishes
  // and the colours under it may gather again. f = the stack touched last that has a neighbour with its top colour
  // (first the placed one). The target among f and those neighbours: a stack of that colour only (the colour
  // gathers there and the others show what is under it), else the longest top run, else f itself, else the lowest
  // cell number. A neighbour that does not touch the target sends its tiles over f.
  // Points: every tile of a vanished run counts 1, the second run vanishing in the same move 2, the third 3…
  // Returns the new board, the points and the events for the animation:
  // { t: 'move', from, to, n, c } (n tiles of colour c) and { t: 'clear', at, n, c, pts }.
  function settle(board, placed) {

    const events = [];
    const move = (from, to) => {
      const n = runLen(b[from]), c = top(b[from]);
      b[from].length -= n;
      for (let k = 0; k < n; k++) b[to].push(c);
      events.push({ t: 'move', from, to, n, c });
    };
    for (let guard = 0; guard < 10000; guard++) {
      let f = -1;
      for (let i = 0; i < N; i++) {
        if (!b[i].length || (f >= 0 && stamp[i] <= stamp[f])) continue;
        const c = top(b[i]);
        if (NB[i].some(j => top(b[j]) === c)) f = i;
      }
      if (f >= 0) {
        const c = top(b[f]);
        const group = [f, ...NB[f].filter(j => top(b[j]) === c)];
        const key = j => [pure(b[j]) ? 1 : 0, runLen(b[j]), j === f ? 1 : 0, -j];
        const better = (x, y) => { const a = key(x), d = key(y); for (let k = 0; k < a.length; k++) if (a[k] !== d[k]) return a[k] > d[k]; return false; };
        let t = f;
        for (const j of group) if (better(j, t)) t = j;
        const others = group.filter(j => j !== t && j !== f);
        for (const j of others) if (t !== f && !adjacent(j, t)) move(j, f);
        for (const j of others) if (t === f || adjacent(j, t)) move(j, t);
        if (t !== f) move(f, t);
        for (const j of group) if (j !== t) stamp[j] = ++clock;
        stamp[t] = ++clock;
        continue;
      }
      let any = false;
      for (let i = 0; i < N; i++) {
        const n = runLen(b[i]);
        if (n < CLEAR) continue;
        const c = top(b[i]);
        b[i].length -= n;
        clears++; cleared += n;
        const pts = n * clears;
        points += pts;
        events.push({ t: 'clear', at: i, n, c, pts });
        stamp[i] = ++clock;
        any = true;
      }
      if (!any) break;
    }
    return { board: b, events, points, clears, cleared };
  }

  // How many colours are in play: the difficulty's start, one more every STEP points, at most MAXC
  const colorsFor = (start, score) => Math.min(MAXC, start + Math.floor(score / STEP));
  // A new stack for the tray: 2–6 tiles in 1–3 runs of different colours (rnd(n) = an integer 0..n-1)
  const SIZES = [2, 3, 3, 4, 4, 4, 5, 5, 6];
  function genStack(rnd, colors) {
    const h = SIZES[rnd(SIZES.length)];
    const r = rnd(20);
    const runs = Math.min(h, r < 8 ? 1 : r < 17 ? 2 : 3);
    // cut h tiles into runs (each at least one tile)
    const cuts = [];
    while (cuts.length < runs - 1) { const x = 1 + rnd(h - 1); if (!cuts.includes(x)) cuts.push(x); }
    cuts.sort((a, b) => a - b);
    const s = [];
    let prev = 0, last = -1;
    for (const x of [...cuts, h]) {
      let c = rnd(colors);
      if (c === last) c = (c + 1 + rnd(colors - 1)) % colors;
      for (let k = prev; k < x; k++) s.push(c);
      prev = x; last = c;
    }
    return s;
  }
  const genTray = (rnd, colors) => [genStack(rnd, colors), genStack(rnd, colors), genStack(rnd, colors)];
  const empties = b => { const out = []; for (let i = 0; i < N; i++) if (!b[i].length) out.push(i); return out; };
  // a saved stack: at most max tiles, every one a colour 0..colors-1
  const okStack = (s, colors, max = 40) => Array.isArray(s) && s.length <= max && s.every(v => Number.isInteger(v) && v >= 0 && v < colors);

  // few tiles hidden under another colour. Returns { i, cell } or null.
  function advise(board, tray) {
    let best = null;
    const em = empties(board);
    tray.forEach((s, i) => {
      if (!s) return;
      for (const cell of em) {
        const b = board.slice(); b[cell] = s;
        const r = settle(b, cell);
        let v = r.points * 3 + empties(r.board).length * 4;
        for (const t of r.board) if (t.length) v -= (t.length - runLen(t)) * .5;
        if (!best || v > best.v) best = { i, cell, v };
      }
    });
    return best && { i: best.i, cell: best.cell };
  }
  return { CLEAR, STEP, MAXC, CELLS, N, NB, top, runLen, pure, settle, colorsFor, genStack, genTray, empties, okStack, advise };
}
/* ---------- Engine end ---------- */
const E = VezickyEngine();

/* ---------- Game logic ---------- */
const rnd = n => { try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); } };
// Random numbers from G.seed (saved with the game and with every Undo step): Undo and the same moves again give
// the same new stacks, so they cannot be rerolled
function seededRnd(n) {

const diffOf = id => DIFFS.find(d => d.id === id) || DIFFS[1];

/* ---------- State ---------- */
// best = the record of the running game's difficulty; bests[diff] = the records of all difficulties
let S, G, best = 0, bests = {};
let sel = null;   // the tray stack chosen by a tap (then a tap on an empty cell places it)
let hint = null;  // Poradit: { i, cell }
let drag = null, pv = null; // dragging a stack, and the cell it would land on
const isFresh = () => G.score === 0 && G.history.length === 0;
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() {
  try {
    if (G) bests[G.diff] = best;
    localStorage.setItem(KEY, JSON.stringify({ settings: S, game: G, bests }));
    if (G.status === 'playing' && !isFresh()) localStorage.setItem(BADGE, '1'); else localStorage.removeItem(BADGE);
  } catch (e) {} // rule: storage may be full or blocked; the game goes on
}
const okBoard = b => Array.isArray(b) && b.length === E.N && b.every(s => E.okStack(s, E.MAXC));
const okTray = t => Array.isArray(t) && t.length === 3 && t.every(s => s === null || (E.okStack(s, E.MAXC, 7) && s.length > 0));
const okCols = c => Number.isInteger(c) && c >= 4 && c <= E.MAXC;
const okNum = v => Number.isInteger(v) && v >= 0;
// rule: corrupted data never crashes the game; a broken history only loses Undo
function validGame(g) {
  try {
    if (!g || !DIFFS.some(d => d.id === g.diff) || !okBoard(g.board) || !okTray(g.tray) || !okNum(g.score) || !okCols(g.cols)) return false;
    if (!Number.isInteger(g.seed)) g.seed = rnd(2 ** 31);
    if (!okNum(g.bestAtStart)) g.bestAtStart = 0;
    if (!Array.isArray(g.history) || !g.history.every(h => h && okBoard(h.b) && okTray(h.t) && okNum(h.s) && okCols(h.c) && Number.isInteger(h.seed) && okNum(h.bb))) g.history = [];

  } catch (e) { return false; }
}
function normalize(s) {
  if (!DIFFS.some(d => d.id === s.diff)) s.diff = DEFAULTS.diff;
  if (!THEMES.some(t => t.id === s.theme)) s.theme = DEFAULTS.theme;
  for (const k of ['counts', 'marks', 'anim', 'vibrate']) s[k] = !!s[k];

function newGame(msg) {
  finishAnim();

/* ---------- Helpers ---------- */
function buzz(ms = 12) {

  if (!S.vibrate || !navigator.vibrate || (navigator.userActivation && !navigator.userActivation.hasBeenActive)) return;
  try { navigator.vibrate(ms); } catch (e) {}
}
let toastT;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hide');
  // its top at the top of the bottom buttons: it grows down over them, never over the board or the tray;
  // but never below the visible bottom (a long text on a short screen)
  const vh = window.visualViewport ? visualViewport.height : innerHeight;
  t.style.bottom = 'auto';
  t.style.top = Math.round(Math.max(0, Math.min($('.actions').getBoundingClientRect().top, vh - t.getBoundingClientRect().height - 8))) + 'px';
  clearTimeout(toastT); toastT = setTimeout(hideToast, ms);
}
function hideToast() { $('#toast').classList.add('hide'); }

// whenFree waits until they are closed, then runs fn - if the game is still the same (not a new one meanwhile)
const nothingOpen = () => ['#modal', '#screenSettings', '#screenHelp', '#screenCredits'].every(s => { const el = document.querySelector(s); return !el || el.hidden; });
function whenFree(g0, ms, fn) {
  setTimeout(function wait() {
    if (G !== g0) return;
    if (nothingOpen()) fn(); else setTimeout(wait, 400);
  }, ms);
}
function showModal(html, buttons) {
  hideToast();
  const card = $('#modalCard');
  card.innerHTML = html + buttons.map((b, i) => `<button class="big ${b.cls || ''}" data-i="${i}">${b.text}</button>`).join('');
  card.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    $('#modal').hidden = true;
    const fn = buttons[+b.dataset.i].fn; if (fn) fn();
  };

}
const fmt = n => n.toLocaleString('cs-CZ');

/* ---------- Drawing ---------- */
// A tile is a flat hexagon seen from the front and above: the top face is squashed to K of its height, the three
// front sides are TH * R thick. R = the corner radius of the hexagon.
const K = .72, HK = Math.sqrt(3) / 2 * K, TH = .125, DEP = .14, TOP = 1.35;
const f1 = v => Math.round(v * 10) / 10;
const hexD = (x, y, R) => { const h = HK * R; return `M${f1(x + R)} ${f1(y)}L${f1(x + R / 2)} ${f1(y + h)}H${f1(x - R / 2)}L${f1(x - R)} ${f1(y)}L${f1(x - R / 2)} ${f1(y - h)}H${f1(x + R / 2)}Z`; };
// the three front sides of a slab whose top face is centred at (x, y), t thick
function sidesD(x, y, R, t) {
  const h = HK * R;
  return [
    `M${f1(x - R)} ${f1(y)}L${f1(x - R / 2)} ${f1(y + h)}V${f1(y + h + t)}L${f1(x - R)} ${f1(y + t)}Z`,
    `M${f1(x - R / 2)} ${f1(y + h)}H${f1(x + R / 2)}V${f1(y + h + t)}H${f1(x - R / 2)}Z`,
    `M${f1(x + R / 2)} ${f1(y + h)}L${f1(x + R)} ${f1(y)}V${f1(y + t)}L${f1(x + R / 2)} ${f1(y + h + t)}Z`,
  ];
}
function slabSVG(x, y, R, t, c, top) {
  const p = PAL[c], [l, f, r] = sidesD(x, y, R, t), sw = R > 30 ? 1 : .7;
  let s = `<path d="${l}" fill="${p.l}" stroke="${p.e}" stroke-width="${sw}"/><path d="${f}" fill="${p.f}" stroke="${p.e}" stroke-width="${sw}"/><path d="${r}" fill="${p.r}" stroke="${p.e}" stroke-width="${sw}"/>`;
  if (top) s += `<path d="${hexD(x, y, R)}" fill="${p.c}" stroke="${p.e}" stroke-width="${sw}"/><path d="${hexD(x, y - R * .04, R * .8)}" fill="#fff" fill-opacity=".14"/>`;

}
const symSVG = (c, x, y, size, squash) => `<path transform="translate(${f1(x - size / 2)} ${f1(y - size * squash / 2)}) scale(${(size / 20).toFixed(3)} ${(size * squash / 20).toFixed(3)})" d="${SYMBOLS[c]}" fill="${PAL[c].t}" fill-rule="evenodd"/>`;

function stackSVG(s, x, y, R, t) {

  for (let j = 0; j < n; j++) out += slabSVG(x, y - (j + 1) * t, R, t, s[j], j === n - 1);
  if (!n) return out;

  const c = s[n - 1], ty = y - n * t, run = E.runLen(s);

    out += symSVG(c, x - R * .32, ty, R * .44, K);
    out += `<text x="${f1(x + R * .22)}" y="${f1(ty)}" font-size="${f1(fs)}" font-weight="800" fill="${PAL[c].t}" text-anchor="middle" dominant-baseline="central">${run}</text>`;
  } else if (S.marks) out += symSVG(c, x, ty, R * .52, K);
  else if (counts) out += `<text x="${f1(x)}" y="${f1(ty)}" font-size="${f1(fs)}" font-weight="800" fill="${PAL[c].t}" text-anchor="middle" dominant-baseline="central">${run}</text>`;

}

/* ---------- Layout: the honeycomb as big as the room allows ---------- */
// GEO: R and th of the board, the base centre of every cell (in the board SVG), Rt of the tray stacks
const GEO = { R: 40, th: 5, xy: [], Rt: 30 };
function layout() {
  if (!G) return;
  const play = $('#play'), tray = $('#tray');
  const W = play.clientWidth - 2 * GUT;
  // the tray and the board share the room between the score row and the buttons
  const avail = play.clientHeight + tray.offsetHeight;
  const BH = TOP + 12 * HK + DEP; // the board's height in R: the tallest tower room on top, six rows, the socket
  const trayK = .8 * (2 * HK + 6 * TH + DEP); // a tray stack of 6 tiles in R (tray stacks are 0.8 R)
  let R = Math.max(12, Math.min(W / 8, (avail - 24 - 20) / (BH + trayK), 64));
  // the tray stacks as big as the board's when there is room (what you see is what you place), at least 0.8 R
  const slotW = (W - 16) / 3, ST = 2 * HK + 6 * TH + DEP;
  const Rt = Math.max(9, Math.min(R, (slotW - 14) / 2, Math.max(R * .8, (avail - 24 - 20 - BH * R) / ST)));
  root.style.setProperty('--tray-h', Math.round(12 + Rt * ST + 8) + 'px');
  GEO.Rt = Rt;
  const box = $('#bsvg').getBoundingClientRect(), w = box.width, hgt = box.height;
  R = Math.max(10, Math.min(w / 8, hgt / BH, 64));
  // room left over goes mostly above the board, where tall towers rise

/* ---------- Animation: tiles fly between the stacks, a full tower vanishes ---------- */
// The game state is final at once (and saved); the animation replays the events on a copy of the board. Any tap

const FLY = 230, STAG = 55, GAP = 70, CLR = 430;

  finishAnim();

  let t = 0;

    if (ev.t === 'move') {

  A.raf = requestAnimationFrame(tick);

}

    // landed before this action land first, so a vanishing tower or a tile sent on finds them in place
    if (advance(A.acts[A.next].t0)) changed = true;
    const a = A.acts[A.next++], vb = A.vb;
    if (a.k === 'fly') {
      const src = vb[a.from];
      if (!src.length) continue;
      src.pop(); changed = true;
      const p0 = GEO.xy[a.from], p1 = GEO.xy[a.to], t0 = thick(a.from, src.length + 1), t1 = thick(a.to, vb[a.to].length + A.incoming[a.to] + 1);
      const y0 = p0.y - (src.length + 1) * t0, y1 = p1.y - (vb[a.to].length + A.incoming[a.to] + 1) * t1;
      A.incoming[a.to]++;
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.innerHTML = slabSVG(0, 0, R, t1, a.c, true);
      $('#gFly').appendChild(g);
      A.sprites.push({ g, a, start: a.t0, dur: FLY, x0: p0.x, y0, x1: p1.x, y1, arc: R * .6 + Math.hypot(p1.x - p0.x, p1.y - p0.y) * .25, fly: true });
    } else {

/* ---------- Moves ---------- */
function place(i, cell) {
  finishAnim();
  if (G.status !== 'playing' || !G.tray[i] || G.board[cell].length) return false;
  // bb = the record before this move: Undo puts it back, so the record cannot be inflated by playing and undoing
  G.history.push({ b: G.board.map(s => s.slice()), t: G.tray.map(s => s && s.slice()), s: G.score, c: G.cols, bb: best, seed: G.seed });
  if (G.history.length > HISTORY) G.history.shift();
  const before = G.board.map(s => s.slice());
  before[cell] = G.tray[i].slice();
  const r = E.settle(before, cell);
  G.board = r.board; G.tray[i] = null; G.score += r.points;
  if (G.score > best) best = G.score;
  let fresh = 0;
  if (G.tray.every(s => s === null)) {
    const c = Math.max(G.cols, E.colorsFor(diffOf(G.diff).start, G.score));
    if (c > G.cols) fresh = c;
    G.cols = c;
    G.tray = E.genTray(seededRnd, G.cols);
  }
  G.status = E.empties(G.board).length ? 'playing' : 'over';
  sel = null; hint = null; pv = null;
  save();
  const dur = startAnim(before, r.events, G.score - r.points, G.history[G.history.length - 1].bb);
  render();
  buzz(12);
  if (r.points && !A) bump();
  if (fresh) { toast(`Přibyla nová barva: ${COLORS[fresh - 1].name}`); const dots = $('#cols').children; if (dots[fresh - 1]) dots[fresh - 1].classList.add('new'); }

}

  best = Math.max(h.bb, G.bestAtStart || 0);

  sel = null; hint = null; pv = null;

}

    `<h2>Deska je plná</h2><p class="pts-big">${fmt(G.score)}</p><p>${rec ? '<b>Nový rekord! 🎉</b>' : `bodů · rekord ${fmt(best)}`}</p>`,
    [{ text: 'Nová hra', fn: () => newGame() }, { text: 'Vrátit tah', cls: 'alt', fn: undo }, { text: 'Prohlédnout desku', cls: 'alt' }]

/* ---------- Controls ---------- */
// board point (client coordinates) -> the nearest cell within about one radius, or -1
function cellAt(cx, cy, emptyOnly) {
  const r = $('#bsvg').getBoundingClientRect(), x = cx - r.left, y = cy - r.top;
  let bi = -1, bd = .95;
  GEO.xy.forEach((p, i) => {
    if (emptyOnly && G.board[i].length) return;
    const d = Math.hypot((x - p.x) / GEO.R, (y - p.y) / (GEO.R * K));
    if (d < bd) { bd = d; bi = i; }
  });
  return bi;
}
const overMsg = () => toast('Deska je plná – ťukni na Zpět nebo Nová hra');
function tapSlot(i) {

}
// dragging a stack from the tray (or a tap on it: a press without moving)
const ghost = $('#ghost');
$('#tray').addEventListener('pointerdown', e => {

      <li>Dole jsou tři věžičky z barevných dílků. <b>Přetáhni</b> věžičku na prázdné políčko. Nebo na ni <b>ťukni</b> a pak ťukni na políčko.</li>
      <li>Když má sousední věžička navrchu stejnou barvu, dílky té barvy se <b>sesypou na jednu z nich</b>: přednostně na věžičku jen z té jedné barvy, jinak na tu, která jich má navrchu víc, a při shodě na tu právě položenou. Pod odletěnými dílky se odkryje další barva a spojuje se dál.</li>
      <li>Jakmile má věžička navrchu <b>10 nebo víc dílků jedné barvy</b>, zmizí. Za každý dílek je bod; druhé zmizení v tomtéž tahu se počítá dvakrát, třetí třikrát…</li>
      <li>Když položíš všechny tři, přijdou nové. Každých ${E.STEP} bodů přibude další barva, nejvýš ${E.MAXC}: v řádku nahoře vidíš, kolik jich je ve hře.</li>
      <li>Hra končí, když už není kam položit. Nikam se nespěchá.</li>
      <li><b>Poradit</b> označí věžičku a políčko, kam by se hodila; ťuknutím na políčko ji tam položíš. <b>Zpět</b> vrací tahy, i po konci hry. Nové věžičky budou zase stejné.</li>
      <li>Rekord se počítá zvlášť pro každou obtížnost. Číslo na věžičce říká, kolik dílků stejné barvy je navrchu; vypnout jde v Nastavení, stejně jako zapnout <b>značky barev</b>.</li>
    </ol><div class="pal">${pal}</div></section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
}
function openHelp() { finishAnim(); hideToast(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; }
$('#helpIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenHelp').hidden = true; });
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
// rule: ask for persistent storage so the browser does not delete the saved game by itself
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const saved = load();
const savedSettings = saved && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
if (saved && saved.bests && typeof saved.bests === 'object') for (const d of DIFFS) if (okNum(saved.bests[d.id])) bests[d.id] = saved.bests[d.id];
// rule: a difficulty chosen just before the app was closed (Settings still open) is applied now, as closing Settings would
if (saved && validGame(saved.game)) {
  G = saved.game; best = Math.max(bests[G.diff] || 0, G.score);
  if (S.diff !== G.diff && isFresh()) newGame(''); else render(); // as closing Settings would
} else newGame();

addEventListener('resize', () => { finishAnim(); render(); });
document.addEventListener('contextmenu', e => e.preventDefault());

// contract: opened from the launcher (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;

// For testing: the rules, a move, and a board one stack short of full (the next move usually ends the game)
window.Vezicky = {
  E, place, undo, advise: () => E.advise(G.board, G.tray),
  get state() { return { S, G, best, bests }; },
  setBoard(b) { finishAnim(); G.board = b.map(s => s.slice()); G.status = E.empties(G.board).length ? 'playing' : 'over'; save(); render(); },
  nearEnd() {
    // every cell but one gets a stack whose top differs from all its neighbours, so nothing gathers
    const b = Array.from({ length: E.N }, () => []);
    for (let i = 1; i < E.N; i++) { let c = 0; while (E.NB[i].some(j => b[j].length && E.top(b[j]) === c)) c++; b[i] = [(c + 1) % E.MAXC, c % E.MAXC]; }
    this.setBoard(b);
  },
};
})();
</script>
</body>
