    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb0ff"/><stop offset=".55" stop-color="#1f63d6"/><stop offset="1" stop-color="#174ba6"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff38a"/><stop offset=".55" stop-color="#f7c21a"/><stop offset="1" stop-color="#e09f00"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ce79a"/><stop offset=".55" stop-color="#25a244"/><stop offset="1" stop-color="#1a7d33"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8a6ff"/><stop offset=".55" stop-color="#8c3fd0"/><stop offset="1" stop-color="#6c2aa8"/></linearGradient>
