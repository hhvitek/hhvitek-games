    <rect x="31" y="331" width="150" height="150"/><rect x="331" y="331" width="150" height="150"/>
  </g>

  <!-- the matched row of three -->
  <rect x="26" y="190" width="460" height="132" rx="30" fill="#fff" fill-opacity=".16" stroke="#ffd166" stroke-width="8"/>

  <g filter="url(#sh)">
    <use href="#s1" x="44" y="44" width="124" height="124"/>
    <use href="#s2" x="194" y="44" width="124" height="124"/>
    <use href="#s3" x="344" y="44" width="124" height="124"/>
