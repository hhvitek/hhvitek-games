    <symbol id="s0" viewBox="0 0 100 100"><circle cx="50" cy="50" r="41" fill="url(#g0)" stroke="#6e130d" stroke-width="5"/><ellipse cx="36" cy="32" rx="14" ry="8" transform="rotate(-30 36 32)" fill="#fff" opacity=".55"/></symbol>
