  <!-- board: solid slate with a subtle checkerboard -->
  <rect width="512" height="512" fill="#3a4651"/>
  <g fill="#fff" fill-opacity=".07">
    <rect x="31" y="31" width="150" height="150"/><rect x="331" y="31" width="150" height="150"/>
