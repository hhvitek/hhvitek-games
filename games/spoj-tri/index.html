<!doctype html>
<html lang="cs" data-theme="slate">
<head>
<meta charset="utf-8">
<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#232b33">
<meta name="mobile-web-app-capable" content="yes">

<title>Spoj tři</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233a4651'/%3E%3Ccircle cx='14' cy='32' r='9' fill='%23e23a2e'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23e23a2e'/%3E%3Ccircle cx='50' cy='32' r='9' fill='%23e23a2e'/%3E%3C/svg%3E">
<style>
/* ---------- Themes (solid colours) ---------- */
[data-theme="slate"]{--page:#232b33;--board:#3a4651;--ca:rgba(255,255,255,.07);--cb:rgba(0,0,0,.12);--ink:#eef3f6;--soft:#b9c4cd;--accent:#ffd166;--bar:rgba(0,0,0,.25);--chip:rgba(255,255,255,.1)}
[data-theme="navy"]{--page:#0f1f36;--board:#23466e;--ca:rgba(255,255,255,.07);--cb:rgba(0,0,0,.12);--ink:#eaf2fb;--soft:#b8cbe3;--accent:#ffd166;--bar:rgba(0,0,0,.25);--chip:rgba(255,255,255,.1)}
[data-theme="green"]{--page:#10291b;--board:#2f6b47;--ca:rgba(255,255,255,.07);--cb:rgba(0,0,0,.12);--ink:#eaf7ee;--soft:#bcdcc7;--accent:#ffd66b;--bar:rgba(0,0,0,.25);--chip:rgba(255,255,255,.1)}
[data-theme="burgundy"]{--page:#250a10;--board:#5f1f2c;--ca:rgba(255,255,255,.07);--cb:rgba(0,0,0,.14);--ink:#fbeaea;--soft:#e6bcc1;--accent:#ffcf70;--bar:rgba(0,0,0,.28);--chip:rgba(255,255,255,.1)}
[data-theme="lavender"]{--page:#2a2238;--board:#5e5080;--ca:rgba(255,255,255,.07);--cb:rgba(0,0,0,.12);--ink:#f6f2fc;--soft:#d6cbec;--accent:#ffd77a;--bar:rgba(0,0,0,.25);--chip:rgba(255,255,255,.1)}
[data-theme="paper"]{--page:#f4ebdf;--board:#e7d9c6;--ca:rgba(255,255,255,.42);--cb:rgba(122,69,32,.07);--ink:#2b1a0e;--soft:#6f5a48;--accent:#7a4520;--bar:rgba(122,69,32,.08);--chip:#fff}
[data-theme="night"]{--page:#0b0c0e;--board:#1c1f24;--ca:rgba(255,255,255,.05);--cb:rgba(0,0,0,.2);--ink:#e6e8eb;--soft:#9aa1aa;--accent:#6fb7ff;--bar:rgba(0,0,0,.35);--chip:rgba(255,255,255,.08)}

/* ---------- Base ---------- */
:root{--cell:52px;--n:7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--page);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}

#app{--gut:12px;height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* Top bar */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:27px;font-weight:800;letter-spacing:.02em;line-height:1.05;color:var(--ink)}
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14)}
.round svg{width:28px;height:28px;fill:currentColor}
a.round{text-decoration:none}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:8px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:23px}
[data-theme="paper"] .pill,[data-theme="paper"] .round{box-shadow:inset 0 0 0 2px #e6d8c6}

/* Score row */
.stats{flex:none;display:flex;gap:8px;padding:8px var(--gut) 0}
.stat{flex:1 1 0;min-width:0;text-align:center;background:var(--chip);border-radius:14px;padding:4px 4px 5px}
.stat small{display:block;font-size:18px;color:var(--soft);line-height:1.2}
.stat b{display:block;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat.bump b{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}

/* Board */
main{flex:1;min-height:0;display:grid;place-items:center;padding:12px var(--gut)} /* the board keeps 12 px from the score row and the hint line */
#boardWrap{padding:6px;border-radius:18px;background:var(--board);box-shadow:0 4px 14px rgba(0,0,0,.35)}
[data-theme="paper"] #boardWrap{box-shadow:0 0 0 2px #d8c6ad,0 3px 10px rgba(60,30,10,.18)}
[data-theme="paper"] .stat{box-shadow:inset 0 0 0 2px #e6d8c6}
#tiles{position:relative;width:calc(var(--cell) * var(--n));height:calc(var(--cell) * var(--n));touch-action:none;border-radius:12px;
  background:repeating-conic-gradient(var(--ca) 0 25%, var(--cb) 0 50%) 0 0 / calc(var(--cell) * 2) calc(var(--cell) * 2)}
#fx{position:absolute;inset:0;pointer-events:none}
.tile{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);
  transform:translate(calc(var(--x) * 100%), calc(var(--y) * 100%));
  transition:transform 200ms cubic-bezier(.4,0,.5,1)}
.noanim .tile{transition:none!important}
.gem{position:absolute;inset:7%;display:block;transition:transform .26s ease-in, opacity .26s ease-in}
.gem .shape{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.photo{position:absolute;inset:0;border-radius:20%;background:#fff center/cover no-repeat;border:calc(var(--cell) * .085) solid var(--c);box-shadow:0 2px 3px rgba(0,0,0,.45)}
.photo.coat,.photo.drawing{background-size:82% 82%;background-color:#fff}
.badge{position:absolute;right:-6%;bottom:-6%;width:40%;height:40%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.arrow{position:absolute;inset:6%;width:88%;height:88%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.gem.special .shape,.gem.special .photo{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.rainbow{position:absolute;inset:5%;border-radius:50%;
  background:conic-gradient(#e23a2e,#f57c10,#f5b800,#25a244,#1f63d6,#8c3fd0,#f0509b,#e23a2e);
  box-shadow:0 0 0 3px #fff,0 0 0 5px rgba(0,0,0,.45),0 3px 6px rgba(0,0,0,.5)}
.rainbow::after{content:"";position:absolute;inset:31%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff 0,#f2f2f2 55%,#bdbdbd 100%);box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.tile.pop .gem{transform:scale(.15);opacity:0}
.tile.born .gem{animation:born .4s ease-out}
@keyframes born{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.tile.sel::before,.tile.hinted::before{content:"";position:absolute;inset:3%;border-radius:20%;background:rgba(255,255,255,.2);box-shadow:0 0 0 3px var(--accent),0 0 12px 2px var(--accent)}
.tile.sel .gem{animation:pulse 1.1s ease-in-out infinite}
.tile.hinted .gem{animation:nudge 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes nudge{25%{transform:rotate(-9deg) scale(1.06)}75%{transform:rotate(9deg) scale(1.06)}}
.float{position:absolute;transform:translate(-50%,-50%);font-size:27px;font-weight:900;color:#fff;white-space:nowrap;
  text-shadow:0 0 3px #000,0 2px 4px #000;animation:floatUp 1.1s ease-out forwards}
.float small{font-size:19px;color:#ffe08a}
@keyframes floatUp{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-46px}}
.beam{position:absolute;background:rgba(255,255,255,.75);border-radius:999px;box-shadow:0 0 14px 4px rgba(255,255,255,.7);animation:beam .5s ease-out forwards}
@keyframes beam{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

/* Bottom tray */
.tray{flex:none;display:flex;flex-direction:column;gap:8px;padding:6px var(--gut) 12px;background:var(--bar)}
.hint{text-align:center;font-size:19px;font-weight:600;min-height:25px;line-height:25px}
.actions{display:flex;gap:10px}
.tbtn{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:10px;height:62px;border-radius:16px;font-size:22px;font-weight:800;color:var(--ink);background:var(--chip);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);transition:opacity .2s,transform .06s}
[data-theme="paper"] .tbtn{box-shadow:inset 0 0 0 2px #e6d8c6}
.tbtn svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tbtn:active{transform:scale(.97)}
.tbtn.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);transition:transform .06s, box-shadow .06s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pbtn-sh)}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0;box-shadow:0 2px 6px rgba(40,30,10,.12)}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:10px}
.stepper{display:flex;align-items:center;gap:12px}
.sbtn{flex:none;width:60px;height:60px;border-radius:50%;background:var(--pbtn);color:var(--pbtn-ink);font-size:36px;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 3px 0 var(--pbtn-sh)}
.sbtn.dim{background:var(--psw);box-shadow:none;color:var(--psoft)}
.sval{flex:1;text-align:center;font-size:25px;font-weight:800}
.fnote{font-size:18px;color:var(--psoft);margin-top:10px;line-height:1.35}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.demo{position:relative;display:inline-block;flex:none;width:var(--cell);height:var(--cell);vertical-align:middle;--cell:44px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{display:block;font-size:18px;color:var(--psoft);line-height:1.3}
.opt .prev{display:flex;gap:4px;margin-top:8px}
.opt .prev .demo{--cell:40px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.ttile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.ttile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{height:60px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:4px;background:var(--board);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.swatch .demo{--cell:40px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.trow .flabel{margin:0}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.help p,.help li{font-size:20px;line-height:1.45}
.help ol{padding-left:26px}
.help li{margin:10px 0}
.legend{display:flex;align-items:center;gap:14px;margin:12px 0;font-size:20px;line-height:1.3}
.legend .demo{--cell:50px}
.credits li{font-size:18px;line-height:1.35;margin:8px 0;word-break:break-word}
.credits a{color:inherit;text-decoration:underline}
.credits ol{padding-left:22px}

.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:popIn .25s ease-out}
@keyframes popIn{from{transform:scale(.9);opacity:0}}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
.mcard .score{font-size:44px;font-weight:900;margin:4px 0 8px}
.mbtns{display:flex;flex-direction:column;gap:14px;margin-top:8px}

/* Narrow phones (360 px wide): smaller gaps and a slimmer "Nová hra", so the title fits next to the home button (the 12 px outer margin stays) */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill{padding:0 10px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:20px}
}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}

/* Shorter screens (e.g. with the browser bar visible): slimmer bars, more room for the board */
@media (max-height:800px){
  .topbar{height:54px}
  .pill{height:44px}.round{width:44px;height:44px}
  .stats{padding-top:6px}
  .stat small{font-size:16px}.stat b{font-size:22px}
  .tray{gap:6px;padding:5px var(--gut) 10px}
  .tbtn{height:56px}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px Georgia,"Times New Roman",serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
</style>

<script>
/* ---------- Visible height ---------- */
// The game is exactly as tall as the part of the window that is really shown (--app-h on #app). 100dvh alone is not
// enough: some browsers report it taller than what is visible (the app installed by Brave on Android counted the
// status and navigation bars too and hid the bottom buttons). visualViewport follows what is shown; it is measured
// again on every change and shortly after loading (a browser bar that hides itself may change it without an event),
// and a changed height makes the game lay itself out again through a resize event.
(() => {
  const root = document.documentElement;
  let last = 0;
  const measure = () => {
    const vv = window.visualViewport;
    const h = Math.round(vv ? vv.height * vv.scale : innerHeight);
    if (!(h > 0) || h === last) return;
    const first = !last; last = h;
    root.style.setProperty('--app-h', h + 'px');
    if (!first) dispatchEvent(new Event('resize'));
  };
  measure();
  addEventListener('resize', measure);
  if (window.visualViewport) visualViewport.addEventListener('resize', measure);
  addEventListener('pageshow', measure);
  [100, 500, 1500].forEach(ms => setTimeout(measure, ms));
  // TEMPORARY (2026-11-08): what this page measured, shown in the launcher's Nastavení → "Údaje o obrazovce"
  setTimeout(() => { try {
    const p = document.createElement('div'); p.style.cssText = 'position:absolute;left:-50px;top:0;width:1px;height:100dvh;padding-bottom:env(safe-area-inset-bottom)';
    document.body.appendChild(p); const dvh = Math.round(p.getBoundingClientRect().height - parseFloat(getComputedStyle(p).paddingBottom)), sb = Math.round(parseFloat(getComputedStyle(p).paddingBottom)); p.remove();
    const vv = window.visualViewport;
    localStorage.setItem('games.launcher.diag', JSON.stringify({ page: location.pathname.split('/').slice(-2, -1)[0], vv: vv ? Math.round(vv.height) : null, inner: innerHeight, client: root.clientHeight, dvh, sb, appH: last, app: Math.round(document.getElementById('app').getBoundingClientRect().height) }));
  } catch (e) {} }, 2000);
})();

(() => {
'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;
// Shared image sets from images/sets.js (missing when the game is opened on its own)
const IMG = globalThis.IMAGE_SETS || {}, IMG_BASE = '../../images/';

/* ---------- Constants ---------- */
// Stone kinds: every colour also has its own shape (helps with weaker colour vision)
const KINDS = [
  { name: 'červený kruh', c: '#e23a2e' },
  { name: 'modrý čtverec', c: '#1f63d6' },
  { name: 'žlutý trojúhelník', c: '#f7c21a' },
  { name: 'zelený kosočtverec', c: '#25a244' },
  { name: 'fialová hvězda', c: '#8c3fd0' },
  { name: 'růžové srdce', c: '#f0509b' },
  { name: 'oranžový šestiúhelník', c: '#f57c10' },
];
const THEMES = [
  { id: 'slate',    name: 'Břidlice',   meta: '#232b33' },
  { id: 'navy',     name: 'Modrá',      meta: '#0f1f36' },
  { id: 'green',    name: 'Zelená',     meta: '#10291b' },
  { id: 'burgundy', name: 'Vínová',     meta: '#250a10' },
  { id: 'lavender', name: 'Levandule',  meta: '#2a2238' },
  { id: 'paper',    name: 'Papír',      meta: '#f4ebdf' },
  { id: 'night',    name: 'Noc',        meta: '#0b0c0e' },
];
const SYMBOLS = [
  { id: 'shapes', name: 'Barevné tvary', desc: 'Každá barva má i svůj tvar.' },
  { id: 'cats',   name: 'Kočky',         desc: 'Fotky koček v barevných rámečcích.' },
  { id: 'nachod', name: 'Náchodsko',     desc: 'Hrady a místa z Náchodska a okolí.' },
  { id: 'coats',  name: 'Znaky obcí',    desc: 'Znaky obcí z Náchodska a okolí.' },
  { id: 'mushrooms', name: 'Houby',       desc: 'Kreslené houby z našich lesů.' },
  { id: 'birds',  name: 'Ptáci',         desc: 'Kreslení ptáci ze zahrad a lesů.' },
  { id: 'produce', name: 'Ovoce a zelenina', desc: 'Kreslené ovoce a zelenina ze zahrady.' },
].filter(x => x.id === 'shapes' || (IMG[x.id] && Array.isArray(IMG[x.id].items) && pool(x.id).length >= 7));
const MOVES = [20, 30, 40, 50, 0];          // 0 = no limit
const LIMITS = { n: [6, 8], kinds: [4, 7] };
const DEFAULTS = { n: 7, kinds: 6, moves: 30, specials: true, symbols: 'shapes', theme: 'slate', vibrate: true };
// Saved state under the launcher's games.<id>.* prefix; OLD_KEY is the name used before (read once, then removed)
const KEY = 'games.spoj-tri.state', OLD_KEY = 'spoj-tri.v1', BADGE = 'games.spoj-tri.inProgress';
const UNDO_MAX = 30;
const POP_MS = 280;
const STALE = { stale: true };

// Items of an image set that can be used as stones (no grouped items: they look too alike)
function pool(setId) {
  const s = IMG[setId], out = [];
  if (s && Array.isArray(s.items)) s.items.forEach((it, i) => { if (it && it.file && !it.group) out.push(i); });
  return out;
}

/* ---------- Random ---------- */
function rnd(n) {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  catch (e) { return Math.floor(Math.random() * n); }
}
// Stones that fall in after a move come from G.seed (saved with the game and with every Undo step)
function dropKind(k) { G.seed = (G.seed + 0x6D2B79F5) | 0; let t = G.seed; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) % k; }
function shuffled(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const clamp = (v, [a, b]) => Math.max(a, Math.min(b, v));

/* ---------- Board logic ----------
   A board is an array of n*n tiles { id, k, s }:
   k = kind 0..6 (-1 for the rainbow), s = special: 0 plain, 1 rocket clearing its row, 2 rocket clearing its column, 3 rainbow. */
let uid = 0;
const tile = (k, s = 0) => ({ id: ++uid, k, s });
const same = (t, k) => !!t && t.s !== 3 && t.k === k;

// Is tile i part of a line of 3+ equal stones?
function matchAt(c, n, i) {
  const t = c[i]; if (!t || t.s === 3) return false;
  const k = t.k, r = (i / n) | 0, col = i % n;
  let a = col, b = col;
  while (a > 0 && same(c[r * n + a - 1], k)) a--;
  while (b < n - 1 && same(c[r * n + b + 1], k)) b++;
  if (b - a >= 2) return true;
  a = r; b = r;
  while (a > 0 && same(c[(a - 1) * n + col], k)) a--;
  while (b < n - 1 && same(c[(b + 1) * n + col], k)) b++;
  return b - a >= 2;
}
// All horizontal and vertical lines of 3+ equal stones
function findRuns(c, n) {
  const runs = [];
  const scan = (at, dir) => {
    for (let line = 0; line < n; line++) {
      let start = 0;
      for (let p = 1; p <= n; p++) {
        const t0 = c[at(line, start)];
        if (p < n && t0 && t0.s !== 3 && same(c[at(line, p)], t0.k)) continue;
        if (p - start >= 3 && t0 && t0.s !== 3) {
          const cells = []; for (let q = start; q < p; q++) cells.push(at(line, q));
          runs.push({ dir, cells });
        }
        start = p;
      }
    }
  };
  scan((l, p) => l * n + p, 'h');
  scan((l, p) => p * n + l, 'v');
  return runs;
}
// Lines that share a stone (L and T shapes) form one group
function groupRuns(runs) {
  const parent = runs.map((_, i) => i);
  const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  const owner = new Map();
  runs.forEach((r, ri) => r.cells.forEach(i => {
    if (owner.has(i)) parent[find(ri)] = find(owner.get(i)); else owner.set(i, ri);
  }));
  const m = new Map();
  runs.forEach((r, ri) => {
    const g = find(ri);
    if (!m.has(g)) m.set(g, { runs: [], cells: new Set() });
    const o = m.get(g); o.runs.push(r); r.cells.forEach(i => o.cells.add(i));
  });
  return [...m.values()];
}
// All possible moves as pairs [i, j] (j is the right or lower neighbour)
function findMoves(c, n) {
  const out = [];
  for (let i = 0; i < n * n; i++) {
    const col = i % n;
    for (const j of [col < n - 1 ? i + 1 : -1, i + n < n * n ? i + n : -1]) {
      if (j < 0 || !c[i] || !c[j]) continue;
      if (c[i].s === 3 || c[j].s === 3) { out.push([i, j]); continue; }
      if (c[i].k === c[j].k) continue;
      const t = c[i]; c[i] = c[j]; c[j] = t;
      if (matchAt(c, n, i) || matchAt(c, n, j)) out.push([i, j]);
      c[j] = c[i]; c[i] = t;
    }
  }
  return out;
}
// A fresh board without ready lines and with at least one possible move
function generate(n, kinds) {
  let c;
  for (let tries = 0; tries < 200; tries++) {
    c = [];
    for (let i = 0; i < n * n; i++) {
      const r = (i / n) | 0, col = i % n, bad = new Set();
      if (col >= 2 && c[i - 1].k === c[i - 2].k) bad.add(c[i - 1].k);
      if (r >= 2 && c[i - n].k === c[i - 2 * n].k) bad.add(c[i - n].k);
      const ok = []; for (let k = 0; k < kinds; k++) if (!bad.has(k)) ok.push(k);
      c.push(tile(ok[rnd(ok.length)]));
    }
    if (findMoves(c, n).length) break;
  }
  return c;
}
// Same stones in new places (keeps ids, so they visibly move)
function reshuffle(c, n, kinds) {
  for (let tries = 0; tries < 300; tries++) {
    const d = c.slice(); for (let i = d.length - 1; i > 0; i--) { const j = G && Number.isInteger(G.seed) ? dropKind(i + 1) : rnd(i + 1); [d[i], d[j]] = [d[j], d[i]]; }
    if (!findRuns(d, n).length && findMoves(d, n).length) return d;
  }
  return generate(n, kinds);
}
function commonKind(c) {
  const cnt = {}; let best = -1, bc = 0;
  for (const t of c) if (t && t.s !== 3) { cnt[t.k] = (cnt[t.k] || 0) + 1; if (cnt[t.k] > bc) { bc = cnt[t.k]; best = t.k; } }
  return best;
}
// Saved form of a tile: one small number
const enc = t => t.s === 3 ? 31 : t.s * 8 + t.k;
function dec(v, kinds) {
  if (!Number.isInteger(v) || v < 0 || v > 31) return null;
  const s = v >> 3, k = v & 7;
  if (s === 3) return v === 31 ? tile(-1, 3) : null;
  if (k >= kinds) return null;
  return tile(k, s);
}

/* ---------- State and saving ---------- */
let S, G, R = {}, sel = null, hintPair = null, busy = false, token = 0;

function load() {
  try {
    let v = localStorage.getItem(KEY);
    // move the state from the older key at once
    if (v === null && (v = localStorage.getItem(OLD_KEY)) !== null) { localStorage.setItem(KEY, v); localStorage.removeItem(OLD_KEY); }
    return JSON.parse(v);
  } catch (e) { return null; }
}
function save() {
  try {
    const g = G && { n: G.n, kinds: G.kinds, moves: G.moves, specials: G.specials, cells: G.cells.map(enc), score: G.score,
      left: G.left, made: G.made, status: G.status, pics: G.pics, undo: G.undo, seed: G.seed, recPrev: G.recPrev };
    localStorage.setItem(KEY, JSON.stringify({ settings: S, game: g, records: R }));
    // Launcher contract: unfinished game = "in progress" badge on the tile
    if (G && G.status === 'playing' && G.made > 0) localStorage.setItem(BADGE, '1');
    else localStorage.removeItem(BADGE);
  } catch (e) {}
}
function normalize(s) {
  s.n = clamp(Math.round(+s.n) || DEFAULTS.n, LIMITS.n);
  s.kinds = clamp(Math.round(+s.kinds) || DEFAULTS.kinds, LIMITS.kinds);
  if (!MOVES.includes(s.moves)) s.moves = DEFAULTS.moves;
  s.specials = s.specials !== false;
  s.vibrate = s.vibrate !== false;
  if (!SYMBOLS.some(x => x.id === s.symbols)) s.symbols = 'shapes';
  if (s.theme === 'cream') s.theme = 'paper'; // renamed: Krémová became Papír
  if (!THEMES.some(t => t.id === s.theme)) s.theme = DEFAULTS.theme;
}
function validPics(p) {
  if (!p || typeof p !== 'object' || !IMG[p.set] || !Array.isArray(p.idx) || p.idx.length !== KINDS.length) return false;
  const ok = pool(p.set);
  return p.idx.every(i => ok.includes(i));
}
function restoreGame(g) {
  try {
    if (!g || typeof g !== 'object') return null;
    const { n, kinds } = g;
    if (!Number.isInteger(n) || n < LIMITS.n[0] || n > LIMITS.n[1] || !Number.isInteger(kinds) || kinds < LIMITS.kinds[0] || kinds > LIMITS.kinds[1]) return null;
    if (!MOVES.includes(g.moves) || !Array.isArray(g.cells) || g.cells.length !== n * n) return null;
    const cells = g.cells.map(v => dec(v, kinds));
    if (cells.some(t => !t)) return null;
    const num = v => Number.isFinite(v) && v >= 0;
    if (!num(g.score) || !num(g.left) || !num(g.made)) return null;
    // the end comes from the moves left, never from the saved status (no limit: the game never ends)
    const left = g.moves ? Math.min(g.left, g.moves) : g.left, status = g.moves && left <= 0 ? 'over' : 'playing';
    const undo = (Array.isArray(g.undo) ? g.undo : []).filter(u => u && Array.isArray(u.c) && u.c.length === n * n
      && u.c.every(v => dec(v, kinds)) && num(u.score) && num(u.left) && num(u.made)).slice(-UNDO_MAX);
    const out = { n, kinds, moves: g.moves, specials: !!g.specials, cells, score: g.score, left, made: g.made,
      status, pics: validPics(g.pics) ? g.pics : null, undo, seed: Number.isInteger(g.seed) ? g.seed : rnd(2 ** 31),
      recPrev: num(g.recPrev) ? g.recPrev : undefined };
    if (findRuns(cells, n).length || !findMoves(cells, n).length) out.cells = reshuffle(cells, n, kinds);
    return out;
  } catch (e) { return null; }
}
const recKey = g => `${g.n}-${g.kinds}-${g.moves}-${g.specials ? 1 : 0}`;
const best = () => G.moves ? (R[recKey(G)] || 0) : 0;
const rulesDiffer = () => S.n !== G.n || S.kinds !== G.kinds || S.moves !== G.moves || S.specials !== G.specials;

// Pictures for the stones of this game (random pick from the chosen set)
function ensurePics() {
  if (S.symbols === 'shapes') return;
  if (G.pics && G.pics.set === S.symbols && validPics(G.pics)) return;
  G.pics = { set: S.symbols, idx: shuffled(pool(S.symbols)).slice(0, KINDS.length) };
}
const picsNow = () => S.symbols !== 'shapes' && G && G.pics && G.pics.set === S.symbols ? G.pics : null;

function newGame() {
  token++; busy = false; sel = null; hintPair = null;
  G = { n: S.n, kinds: S.kinds, moves: S.moves, specials: S.specials, cells: generate(S.n, S.kinds),
    score: 0, left: S.moves, made: 0, status: 'playing', pics: null, undo: [], seed: rnd(2 ** 31) };
  ensurePics(); clearFx();
  save(); layout(); rebuild(); render();
}

/* ---------- Helpers ---------- */
const fmt = v => Math.round(v).toLocaleString('cs-CZ');

let toastT;
function hideToast() { clearTimeout(toastT); $('#toast').classList.add('hide'); }
// rule: an end dialog belongs to the game that ended and never opens over Settings, Help or another dialog:
// whenFree waits until they are closed, then runs fn - if the game is still the same (not a new one meanwhile)
const nothingOpen = () => ['#modal', '#screenSettings', '#screenHelp', '#screenCredits'].every(s => { const el = document.querySelector(s); return !el || el.hidden; });
function whenFree(g0, ms, fn) {
  setTimeout(function wait() {
    if (G !== g0) return;
    if (nothingOpen()) fn(); else setTimeout(wait, 400);
  }, ms);
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hide');
  // just below the score row, never over it (the CSS top is the fallback)
  const row = document.querySelector('.stats').getBoundingClientRect(); if (row.height) t.style.top = Math.round(row.bottom + 8) + 'px';
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hide'), 2600);
}
function wait(ms) {
  const t = token;
  return new Promise((res, rej) => setTimeout(() => t === token ? res() : rej(STALE), ms));
}
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

/* ---------- Drawing stones ---------- */
function gemHTML(t, pics) {
  if (t.s === 3) return '<span class="gem special"><span class="rainbow"></span></span>';
  let h;
  if (pics) {
    const set = IMG[pics.set], it = set.items[pics.idx[t.k]];
    h = `<span class="photo${set.kind === 'coat' || set.kind === 'drawing' ? ' ' + set.kind : ''}" style="--c:${KINDS[t.k].c};background-image:url('${IMG_BASE}${it.file}')"></span>`
      + `<svg class="badge" viewBox="0 0 100 100"><use href="#s${t.k}"/></svg>`;
  } else h = `<svg class="shape" viewBox="0 0 100 100"><use href="#s${t.k}"/></svg>`;
  if (t.s === 1 || t.s === 2) h += `<svg class="arrow" viewBox="0 0 100 100"><use href="#arrow"${t.s === 2 ? ' transform="rotate(90 50 50)"' : ''}/></svg>`;
  return `<span class="gem${t.s ? ' special' : ''}">${h}</span>`;
}
const demo = (k, s = 0, pics = null) => `<span class="demo">${gemHTML({ k, s }, pics)}</span>`;

const tilesEl = $('#tiles'), fxEl = $('#fx');
const els = new Map();   // tile id -> element
const sig = t => t.k + '.' + t.s;
function setPos(el, x, y) { el.dataset.x = x; el.dataset.y = y; el.style.setProperty('--x', x); el.style.setProperty('--y', y); }

// Brings the tile elements in line with G.cells; returns the longest movement time (ms).
// o.spawn: id -> starting row above the board for new stones, o.instant: no animation, o.base: slower moves.
function sync(o = {}) {
  const n = G.n, fresh = [], seen = new Set(), pics = picsNow();
  let maxDur = 0;
  if (o.instant) tilesEl.classList.add('noanim');
  G.cells.forEach((t, i) => {
    if (!t) return;
    seen.add(t.id);
    const x = i % n, y = (i / n) | 0;
    let el = els.get(t.id);
    if (!el) {
      el = document.createElement('div'); el.className = 'tile';
      el.dataset.sig = sig(t); el.innerHTML = gemHTML(t, pics);
      el.style.transition = 'none';
      setPos(el, x, o.spawn && o.spawn.has(t.id) ? o.spawn.get(t.id) : y);
      tilesEl.insertBefore(el, fxEl); els.set(t.id, el); fresh.push(el);
    } else if (el.dataset.sig !== sig(t)) {
      el.dataset.sig = sig(t); el.innerHTML = gemHTML(t, pics);
      el.classList.remove('pop'); el.classList.add('born');
      setTimeout(() => el.classList.remove('born'), 450);
    }
    el._x = x; el._y = y;
    el.classList.toggle('sel', i === sel);
    el.classList.toggle('hinted', !!hintPair && hintPair.includes(i));
  });
  for (const [id, el] of els) if (!seen.has(id)) { el.remove(); els.delete(id); }
  if (fresh.length) void tilesEl.offsetWidth;
  for (const el of fresh) el.style.transition = '';
  for (const el of els.values()) {
    const ox = +el.dataset.x, oy = +el.dataset.y;
    if (ox === el._x && oy === el._y) continue;
    const ms = o.instant ? 0 : Math.round(Math.min(600, (o.base || 110) + 75 * Math.hypot(el._x - ox, el._y - oy)));
    el.style.transitionDuration = ms + 'ms';
    maxDur = Math.max(maxDur, ms);
    setPos(el, el._x, el._y);
  }
  if (o.instant) { void tilesEl.offsetWidth; tilesEl.classList.remove('noanim'); }
  return maxDur;
}
function rebuild() { for (const el of els.values()) el.remove(); els.clear(); sync({ instant: true }); }
function clearFx() { fxEl.innerHTML = ''; }

function showFloat(cells, pts, cascade) {
  const n = G.n;
  let x = 0, y = 0; cells.forEach(i => { x += i % n; y += (i / n) | 0; });
  x /= cells.length; y /= cells.length;
  const f = document.createElement('div'); f.className = 'float';
  f.style.left = ((x + .5) / n * 100) + '%'; f.style.top = ((y + .5) / n * 100) + '%';
  f.innerHTML = `+${fmt(pts)}${cascade > 1 ? ` <small>×${cascade}</small>` : ''}`;
  fxEl.appendChild(f); setTimeout(() => f.remove(), 1200);
}
function showBeam(b) {
  const n = G.n, e = document.createElement('div'); e.className = 'beam';
  if (b.r !== undefined) Object.assign(e.style, { left: '2%', width: '96%', top: ((b.r + .35) / n * 100) + '%', height: (30 / n) + '%' });
  else Object.assign(e.style, { top: '2%', height: '96%', left: ((b.x + .35) / n * 100) + '%', width: (30 / n) + '%' });
  fxEl.appendChild(e); setTimeout(() => e.remove(), 600);
}

/* ---------- Moves ---------- */
const snapshot = () => ({ c: G.cells.map(enc), score: G.score, left: G.left, made: G.made, seed: G.seed });
const adjacent = (a, b) => { const n = G.n; return (Math.abs(a - b) === 1 && ((a / n) | 0) === ((b / n) | 0)) || Math.abs(a - b) === n; };

async function trySwap(a, b) {
  if (busy) return;
  if (G.status !== 'playing') { toast(overMsg()); return; }
  busy = true; sel = null; hintPair = null; render();
  try {
    const c = G.cells, snap = snapshot();
    [c[a], c[b]] = [c[b], c[a]];
    await wait(sync() + 30);
    let initial = null, spent = null;
    if (c[a].s === 3 || c[b].s === 3) {
      // Rainbow: removes all stones of the other stone's kind (two rainbows: the whole board)
      initial = new Set(); spent = new Set();
      if (c[a].s === 3 && c[b].s === 3) { c.forEach((t, i) => initial.add(i)); spent.add(a); spent.add(b); }
      else {
        const rb = c[a].s === 3 ? a : b, k = c[rb === a ? b : a].k;
        c.forEach((t, i) => { if (same(t, k)) initial.add(i); });
        initial.add(rb); spent.add(rb);
      }
    } else if (!findRuns(c, G.n).length) {
      [c[a], c[b]] = [c[b], c[a]];
      await wait(sync() + 30);
      busy = false; render(); buzz(30);
      toast('Tady řada tří nevznikne');
      return;
    }
    G.undo.push(snap); if (G.undo.length > UNDO_MAX) G.undo.shift();
    G.made++; if (G.moves) G.left--;
    renderStats();
    await resolve([a, b], initial, spent);
    const last = G.moves && G.left <= 0;
    if (!last) await ensureMoves(); // after the last move no shuffle: the game ends anyway
    let end = null;
    if (last) {
      G.status = 'over';
      const prev = best();
      end = { prev, record: G.score > prev && G.score > 0 };
      if (end.record) { G.recPrev = prev; R[recKey(G)] = G.score; }
    }
    busy = false; save(); render();
    if (end) { const t = token; whenFree(G, 700, () => { if (t === token && G.status === 'over') showEnd(end); }); }
  } catch (e) {
    if (e !== STALE) { busy = false; render(); throw e; }
  }
}

// Removes lines, fires special stones, drops stones and fills the gaps, repeated while new lines appear
async function resolve(swapped, initial, spent) {
  const n = G.n;
  let cascade = 0, first = true;
  spent = spent || new Set();
  for (;;) {
    const c = G.cells, runs = findRuns(c, n);
    const clear = new Set(first && initial ? initial : []);
    if (!runs.length && !clear.size) break;
    cascade++;
    const reserved = new Map(), runCells = new Set(), floats = [];
    let pts = 0;
    for (const g of groupRuns(runs)) {
      let gp = 0, longest = g.runs[0];
      for (const r of g.runs) {
        gp += r.cells.length >= 5 ? 100 : r.cells.length === 4 ? 60 : 30;
        if (r.cells.length > longest.cells.length) longest = r;
      }
      g.cells.forEach(i => { clear.add(i); runCells.add(i); });
      pts += gp * cascade; floats.push({ cells: [...g.cells], pts: gp * cascade });
      if (G.specials) {
        const s = g.cells.size >= 5 ? 3 : longest.cells.length === 4 ? (longest.dir === 'h' ? 1 : 2) : 0;
        if (s) {
          // The new special stone appears where the player moved, else at the crossing / in the middle
          const cand = [];
          if (first && swapped) swapped.forEach(i => { if (g.cells.has(i)) cand.push(i); });
          for (const i of g.cells) if (g.runs.filter(r => r.cells.includes(i)).length > 1) cand.push(i);
          cand.push(longest.cells[(longest.cells.length - 1) >> 1], ...g.cells);
          const at = cand.find(i => c[i].s === 0 && !reserved.has(i));
          if (at !== undefined) reserved.set(at, { s, k: s === 3 ? -1 : c[at].k });
        }
      }
    }
    // Special stones caught in the removal fire too (and can set off others)
    const stack = [...clear], seen = new Set(), beams = [];
    while (stack.length) {
      const i = stack.pop();
      if (seen.has(i)) continue;
      seen.add(i);
      const t = c[i];
      if (!t || !t.s || reserved.has(i) || spent.has(i)) continue;
      const hits = [];
      if (t.s === 1) { const r = (i / n) | 0; for (let x = 0; x < n; x++) hits.push(r * n + x); beams.push({ r }); }
      else if (t.s === 2) { const x = i % n; for (let r = 0; r < n; r++) hits.push(r * n + x); beams.push({ x }); }
      else { const k = commonKind(c); c.forEach((u, j) => { if (same(u, k)) hits.push(j); }); }
      for (const h of hits) if (!reserved.has(h) && !clear.has(h)) { clear.add(h); stack.push(h); }
    }
    for (const i of reserved.keys()) clear.delete(i);
    const extra = [...clear].filter(i => !runCells.has(i));
    if (extra.length) { const p = extra.length * 20 * cascade; pts += p; floats.push({ cells: extra, pts: p }); }

    G.score += pts; renderStats(true);
    beams.forEach(showBeam);
    floats.forEach(f => showFloat(f.cells, f.pts, cascade));
    for (const i of clear) { const el = els.get(c[i].id); if (el) el.classList.add('pop'); }
    buzz(reserved.size || beams.length ? [20, 40, 30] : 15);
    await wait(POP_MS);
    for (const i of clear) c[i] = null;
    for (const [i, v] of reserved) c[i] = { id: c[i].id, k: v.k, s: v.s };
    const spawn = gravity();
    spent = new Set();
    await wait(sync({ spawn }) + 40);
    first = false;
  }
  return cascade;
}
function gravity() {
  const n = G.n, c = G.cells, spawn = new Map();
  for (let x = 0; x < n; x++) {
    let w = n - 1;
    for (let y = n - 1; y >= 0; y--) {
      const t = c[y * n + x];
      if (t) { c[y * n + x] = null; c[w * n + x] = t; w--; }
    }
    const miss = w + 1;
    for (let y = w; y >= 0; y--) { const t = tile(dropKind(G.kinds)); c[y * n + x] = t; spawn.set(t.id, y - miss); }
  }
  return spawn;
}
async function ensureMoves() {
  if (findMoves(G.cells, G.n).length) return;
  toast('Žádný tah – kameny se zamíchaly');
  await wait(700);
  G.cells = reshuffle(G.cells, G.n, G.kinds);
  await wait(sync({ base: 300 }) + 40);
}

// While stones are falling (busy) taps are not lost silently: they say why nothing happens
// After the end of the game Undo still works (while there are moves to take back), so say so
const overMsg = () => G.undo.length ? 'Hra skončila – ťukni na Zpět nebo Nová hra' : 'Hra skončila – ťukni na Nová hra';
function undo() {
  if (busy) { toast('Chvilku, kameny ještě padají'); return; }
  if (!G.undo.length) { toast(G.made ? 'Starší tahy už vrátit nejdou' : 'Zatím není co vrátit'); return; }
  const u = G.undo.pop();
  if (G.status === 'over' && G.recPrev !== undefined) { if (G.recPrev > 0) R[recKey(G)] = G.recPrev; else delete R[recKey(G)]; }
  delete G.recPrev;
  if (Number.isInteger(u.seed)) G.seed = u.seed;
  G.cells = u.c.map(v => dec(v, G.kinds));
  G.score = u.score; G.left = u.left; G.made = u.made; G.status = 'playing';
  sel = null; hintPair = null; clearFx();
  buzz(); save(); rebuild(); render();
}
function showHint() {
  if (busy) { toast('Chvilku, kameny ještě padají'); return; }
  if (G.status !== 'playing') { toast(overMsg()); return; }
  const m = findMoves(G.cells, G.n);
  if (!m.length) { toast('Teď žádný tah nevidím'); return; }
  // Prefer an ordinary move, so the hint shows the basic idea
  const plain = m.filter(([i, j]) => G.cells[i].s !== 3 && G.cells[j].s !== 3);
  const pick = plain.length ? plain : m;
  hintPair = pick[rnd(pick.length)]; sel = null;
  buzz(); render();
}
function tap(i) {
  if (busy) { toast('Chvilku, kameny ještě padají'); return; }
  if (G.status !== 'playing') { toast(overMsg()); return; }
  // a tap on a hinted stone swaps the hinted pair
  if (hintPair && hintPair.includes(i)) { const [a, b] = hintPair; sel = null; hintPair = null; trySwap(a, b); return; }
  hintPair = null;
  if (sel !== null && sel !== i && adjacent(sel, i)) { const a = sel; sel = null; trySwap(a, i); return; }
  sel = sel === i ? null : i;
  buzz(8); render();
}

/* ---------- Rendering ---------- */
function applyLook() {
  root.dataset.theme = S.theme;
  const th = THEMES.find(t => t.id === S.theme);
  document.querySelector('meta[name="theme-color"]').content = th.meta;
}
let lastScore = null;
function renderStats(animate) {
  $('#stScore').textContent = fmt(G.score);
  $('#stMovesLab').textContent = G.moves ? 'Zbývá tahů' : 'Tahů';
  $('#stMoves').textContent = G.moves ? G.left : G.made;
  $('#stBestBox').hidden = !G.moves;
  $('#stBest').textContent = fmt(best());
  if (animate && lastScore !== G.score) {
    const b = $('#stScoreBox'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
  }
  lastScore = G.score;
}
function render() {
  applyLook(); renderStats();
  let h;
  if (G.status === 'over') h = G.undo.length ? 'Konec hry – ťukni na Zpět nebo Nová hra' : 'Konec hry – ťukni na Nová hra';
  else if (sel !== null) h = 'Teď ťukni na sousední kámen';
  else if (hintPair) h = 'Ťukni na jeden z kývajících se kamenů a prohodí se';
  else h = 'Prohoď dva sousední kameny';
  $('#hint').textContent = h;
  layout(); // after the hint: a longer hint leaves less room for the board
  $('#btnUndo').classList.toggle('dim', busy || !G.undo.length);
  $('#btnHint').classList.toggle('dim', busy || G.status !== 'playing');
  sync();
}
function layout() {
  if (!G) return;
  const m = $('#main'), n = G.n, cs = getComputedStyle(m);
  // inside main's padding (12 px on every side), minus the frame's 6px padding on each side
  const w = m.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 12,
    h = m.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 12;
  const cell = Math.max(30, Math.floor(Math.min(w / n, h / n, 80)));
  root.style.setProperty('--cell', cell + 'px');
  root.style.setProperty('--n', n);
  // a width-limited board fills the row exactly: the rounding rest widens the frame's side padding
  const rest = w - n * cell, bw = $('#boardWrap');
  bw.style.paddingLeft = bw.style.paddingRight = rest >= 0 && rest < n ? 6 + rest / 2 + 'px' : '';
}

/* ---------- Controls: tapping and dragging ---------- */
let ptr = null;
function cellAt(x, y) {
  const r = tilesEl.getBoundingClientRect(), n = G.n;
  const col = Math.floor((x - r.left) / (r.width / n)), row = Math.floor((y - r.top) / (r.height / n));
  return col < 0 || row < 0 || col >= n || row >= n ? -1 : row * n + col;
}
tilesEl.addEventListener('pointerdown', e => {
  if (ptr) return;
  const i = cellAt(e.clientX, e.clientY);
  if (i < 0) return;
  e.preventDefault();
  ptr = { id: e.pointerId, i, x0: e.clientX, y0: e.clientY, done: false };
});
window.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id || ptr.done) return;
  const dx = e.clientX - ptr.x0, dy = e.clientY - ptr.y0;
  const cell = tilesEl.getBoundingClientRect().width / G.n;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < cell * 0.4) return;
  ptr.done = true;
  if (busy) { toast('Chvilku, kameny ještě padají'); return; }
  if (G.status !== 'playing') { toast(overMsg()); return; }
  const n = G.n, i = ptr.i, r = (i / n) | 0, col = i % n;
  let j = -1;
  if (Math.abs(dx) > Math.abs(dy)) j = dx > 0 ? (col < n - 1 ? i + 1 : -1) : (col > 0 ? i - 1 : -1);
  else j = dy > 0 ? (r < n - 1 ? i + n : -1) : (r > 0 ? i - n : -1);
  if (j < 0) return;
  sel = null; trySwap(i, j);
});
window.addEventListener('pointerup', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const p = ptr; ptr = null;
  if (!p.done) tap(p.i);
});
window.addEventListener('pointercancel', e => { if (ptr && e.pointerId === ptr.id) ptr = null; });

$('#btnUndo').addEventListener('click', undo);
$('#btnHint').addEventListener('click', showHint);

    [{ text: 'Nová hra', fn: newGame }, ...(G.undo.length ? [{ text: 'Vrátit tah', cls: 'alt', fn: undo }] : []), { text: 'Prohlédnout desku', cls: 'alt' }]);

      ${stepper('kinds', 'Počet druhů kamenů', S.kinds, S.kinds > LIMITS.kinds[0], S.kinds < LIMITS.kinds[1], `<div class="dots">${dots}</div><div class="fnote">Méně druhů = snazší hra a víc řad samo od sebe.</div>`)}
      ${stepper('moves', 'Počet tahů', S.moves ? S.moves : 'Bez omezení', mi > 0, mi < MOVES.length - 1, `<div class="fnote">${S.moves ? `Hra skončí po ${S.moves} tazích.` : 'Hra nikdy neskončí, sbírají se jen body.'}</div>`)}
      ${toggleRow('specials', 'Zvláštní kameny')}
      <div class="fnote legend" style="margin:0 0 6px">${demo(0, 1)}<span><b>Raketa</b> ze 4 kamenů smaže celý řádek nebo sloupec.</span></div>
      <div class="fnote legend" style="margin:0 0 4px">${demo(-1, 3)}<span><b>Duha</b> z 5 kamenů smaže všechny kameny jedné barvy.</span></div>
      ${pending}
    </section>
    <section class="card"><h3>Kameny</h3>
      ${SYMBOLS.map(x => { const p = previewPics(x.id); return `<button class="opt" data-act="symbols:${x.id}" aria-pressed="${S.symbols === x.id}"><span class="radio"></span><span><b>${x.name}</b><span class="d">${x.desc}</span><span class="prev">${[0, 1, 2, 3].map(k => demo(k, 0, p)).join('')}</span></span></button>`; }).join('')}
      ${hasImages ? '<button class="link" data-act="credits">Autoři obrázků</button>' : ''}
    </section>
    <section class="card"><h3>Vzhled</h3>
      <div class="tiles">${THEMES.map(t => `<button class="ttile" data-act="theme:${t.id}" aria-pressed="${S.theme === t.id}"><span class="swatch" data-theme="${t.id}">${demo(0)}${demo(1)}${demo(3)}</span>${t.name}</button>`).join('')}</div>
      ${toggleRow('vibrate', 'Vibrace')}
    </section>
    <button class="big" data-act="close">Zpět ke hře</button>
    <button class="link" data-act="reset">Obnovit výchozí nastavení</button>`;
}
$('#settingsIn').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, arg] = b.dataset.act.split(':');
  if (act === 'inc' || act === 'dec') {
    if (b.classList.contains('dim')) {
      toast(act === 'inc' ? 'Víc už to nejde' : 'Míň už to nejde'); return;
    }
    const d = act === 'inc' ? 1 : -1;
    if (arg === 'moves') S.moves = MOVES[clamp(MOVES.indexOf(S.moves) + d, [0, MOVES.length - 1])];
    else S[arg] += d;
    normalize(S);
  } else if (act === 'symbols') {
    S.symbols = arg; ensurePics(); clearFx(); rebuild();
  } else if (act === 'theme') S.theme = arg;
  else if (act === 'toggle') S[arg] = !S[arg];
  else if (act === 'reset') {
    S = Object.assign({}, DEFAULTS); normalize(S); ensurePics(); rebuild();
    toast('Nastavení je zase výchozí');
  }
  else if (act === 'credits') { openCredits(); return; }
  else if (act === 'close') { closeSettings(); return; }
  buzz(8); applyLook(); save(); renderSettings();
});
function openSettings() { if (busy) { toast('Chvilku, kameny ještě padají'); return; } hideToast(); renderSettings(); $('#screenSettings').hidden = false; $('#screenSettings').scrollTop = 0; }
// Settings apply right after returning to the game, no Save needed; changed rules start a new game.
function closeSettings() {
  $('#screenSettings').hidden = true;
  if (rulesDiffer()) {
    const hadProgress = G.made > 0; // also after a finished game (rule)
    newGame();
    if (hadProgress) toast('Začala nová hra s novými pravidly');
    return;
  }
  render();
}
$('#btnSettings').addEventListener('click', openSettings);

// One line of the credits; the drawings are all by the same author, so they list only the name
const creditLine = ({ name: n, author: a, license: l, source: u }, drawn, pre = '') => drawn ? `<li><b>${pre}${esc(n)}</b></li>`
  : `<li><b>${pre}${esc(n)}</b>: ${esc(a)}, ${esc(l)}, <a href="${esc(u)}" target="_blank" rel="noopener">zdroj</a></li>`;
function openCredits() {
  $('#creditsIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Spoj tři<small>Autoři obrázků</small></h2></div>
    <section class="card credits"><p class="fnote" style="margin-top:0">Fotografie a znaky pocházejí z Wikimedia Commons. Obrázky jsou zmenšené a oříznuté. Licence: CC BY / CC BY-SA (creativecommons.org), CC0 nebo volné dílo. Kreslené obrázky (houby, ptáci, ovoce a zelenina) jsou nakreslené pro tyto hry a jsou volným dílem (CC0).</p></section>
    ${SYMBOLS.filter(x => x.id !== 'shapes').map(x => `<section class="card credits"><h3>${x.name}</h3><ol>${pool(x.id).map(i => creditLine(IMG[x.id].items[i], IMG[x.id].kind === 'drawing')).join('')}</ol></section>`).join('')}
    <button class="big" data-act="close">Zpět</button>`;
  $('#screenCredits').hidden = false; $('#screenCredits').scrollTop = 0;
}
$('#creditsIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenCredits').hidden = true; });

/* ---------- Help ---------- */
function renderHelp() {
  const sp = S.specials ? `
        <li><b>Zvláštní kameny:</b>
          <div class="legend">${demo(0, 1)}<span><b>Raketa</b> vznikne ze 4 kamenů v řadě. Když zmizí, smaže celý řádek (nebo sloupec – podle šipky).</span></div>
          <div class="legend">${demo(-1, 3)}<span><b>Duha</b> vznikne z 5 kamenů. Prohoď ji s libovolným sousedem a zmizí všechny kameny té barvy.</span></div>
          Každý kámen, který raketa nebo duha smaže navíc, dá 20 bodů.</li>` : '';
  $('#helpIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Spoj tři<small>Jak hrát</small></h2></div>
    <section class="card help">
      <ol>
        <li>Prohoď dva <b>sousední</b> kameny (vedle sebe nebo nad sebou) tak, aby vedle sebe byly aspoň <b>tři stejné</b> – v řádku nebo ve sloupci.
          <div class="legend">${demo(0)}${demo(0)}${demo(0)}</div></li>
        <li><b>Jak prohodit:</b> ťukni na kámen a potom na jeho souseda. Nebo kámen přetáhni prstem k sousedovi.</li>
        <li>Spojené kameny zmizí, kameny nad nimi spadnou dolů a shora přibudou nové. Když tím vznikne další řada, zmizí také a body se násobí.</li>
        <li>Body: 3 kameny = 30, 4 kameny = 60, 5 kamenů = 100.</li>${sp}
        <li>${S.moves ? `Na hru je <b>${S.moves} tahů</b>. Potom hra skončí a ukáže body. Zkus překonat svůj rekord!` : 'Tahů je <b>bez omezení</b>, hra nikdy neskončí.'}</li>
        <li><b>Zpět</b> vrátí poslední tah. <b>Poradit</b> ukáže jeden možný tah.</li>
        <li>Když už žádný tah není, kameny se samy zamíchají.</li>
      </ol>
    </section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
}
function openHelp() { hideToast(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; }
$('#helpIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenHelp').hidden = true; });
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
const saved = load();
const savedSettings = saved && typeof saved === 'object' && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
if (saved && saved.records && typeof saved.records === 'object')
  for (const [k, v] of Object.entries(saved.records)) if (/^\d-\d-\d+-[01]$/.test(k) && Number.isFinite(v) && v > 0) R[k] = v;
G = saved && typeof saved === 'object' ? restoreGame(saved.game) : null;
if (G) {
  ensurePics(); layout(); rebuild(); render(); save();
  if (rulesDiffer()) closeSettings(); // rules chosen just before the app was closed (Settings still open): applied now
}
else newGame();

window.addEventListener('resize', layout);
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
document.addEventListener('contextmenu', e => e.preventDefault());

// Launcher contract: opened from the menu (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) { $('#btnHome').hidden = false; layout(); }

// Persistent storage (also when run standalone): the browser won't evict settings or the saved game on its own
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

// For testing: set a board from codes (k + 8*s, 31 = rainbow)
window.SpojTri = {
  findRuns, findMoves, generate,
  get state() { return { S, G, busy }; },
  setBoard(codes) { G.cells = codes.map(v => dec(v, G.kinds)); G.status = 'playing'; rebuild(); render(); },
  swap: (a, b) => trySwap(a, b),
};
})();
</script>
