<!doctype html>
<!--
  Přistání: land a rocket booster on a pad in the desert or on a barge at sea (design: tools/pristani-dev/SPEC.md).
  The engine (physics, missions, score, autopilot) is the pure block between "Engine" and "Engine end", tested in Node
  by tools/pristani-test.js; the script after it is the game: canvas renderer, sound, controls, cards and screens.
-->
<html lang="cs" data-theme="night">
<head>
<meta charset="utf-8">
<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111a29">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Přistání">
<title>Přistání</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111a29'/%3E%3Cpath d='M32 44c-4 6-3 11 0 15 3-4 4-9 0-15z' fill='%23ffae42'/%3E%3Crect x='28' y='8' width='8' height='36' rx='2' fill='%23eef3fb'/%3E%3Cpath d='M28 40l-8 8M36 40l8 8' stroke='%239fb0c8' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ---------- Themes: the top bar, the HUD row, the cards and the control marks read these variables (rule); the scene
   below them is the world of the mission (its own sky and ground) ---------- */
[data-theme="night"]{--page:#111a29;--bar:rgba(0,0,0,.28);--line:rgba(255,255,255,.08);--ink:#eef3fb;--soft:#9fb0c8;--accent:#ffae42;--chip:rgba(255,255,255,.09);--chip-line:rgba(255,255,255,.16);--btn:#ffae42;--btn-ink:#2a1400;--btn-sh:#9a5a14;--card:rgba(15,23,37,.9);--card-line:rgba(255,255,255,.14);--alt:rgba(255,255,255,.1);--good:#62e08a;--bad:#ff6a5c;--warn:#ffcf5a;--zone:rgba(8,14,24,.28);--zone-line:rgba(255,255,255,.28);--zone-on:rgba(255,174,66,.34);--track:rgba(255,255,255,.14)}
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.06);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--accent:#7a4520;--chip:#fff;--chip-line:#e6d8c6;--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--card:rgba(250,244,235,.95);--card-line:#e6d8c6;--alt:#e7d9c6;--good:#2f7d3b;--bad:#b3261e;--warn:#9a6a00;--zone:rgba(63,34,14,.3);--zone-line:rgba(43,26,14,.62);--zone-on:rgba(122,69,32,.62);--track:#e6d8c6}
[data-theme="steel"]{--page:#353d46;--bar:rgba(0,0,0,.2);--line:rgba(255,255,255,.1);--ink:#f1f4f7;--soft:#c0cad4;--accent:#8fd3ff;--chip:rgba(255,255,255,.11);--chip-line:rgba(255,255,255,.2);--btn:#8fd3ff;--btn-ink:#0b2230;--btn-sh:#3c7698;--card:rgba(45,53,61,.92);--card-line:rgba(255,255,255,.16);--alt:rgba(255,255,255,.12);--good:#79eea0;--bad:#ff8574;--warn:#ffd36a;--zone:rgba(30,36,42,.3);--zone-line:rgba(255,255,255,.3);--zone-on:rgba(143,211,255,.36);--track:rgba(255,255,255,.16)}

/* ---------- Base ---------- */
:root{--gut:12px} /* one side margin: bar buttons, the HUD, the cards and the control marks line up (the safe areas are on #app) */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
/* rule: 100dvh + safe areas, the scene is sized from the room that is left (see resize()) */
#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Top bar (rule: home, Mise in place of Nová hra, <h1> name, ?, settings) ---------- */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;color:var(--ink);white-space:normal;overflow-wrap:normal;word-break:normal} /* a long name wraps to two lines between words, never inside a word and never cut (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);display:flex;align-items:center;gap:7px}
.pill svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);text-decoration:none}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:8px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:22px}
/* narrow phones (360 px): less room between the bar buttons, so the name fits whole; the outer margin stays */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill{padding:0 10px}
  .pill svg{display:none}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:20px;letter-spacing:0}
}

/* ---------- HUD row (rule: info on its own row below the bar, not in place of the name) ---------- */
#hud{flex:none;display:flex;flex-direction:column;gap:5px;padding:5px var(--gut) 7px;background:var(--bar);border-bottom:1px solid var(--line)}
.hrow1{display:flex;align-items:center;gap:10px;min-height:20px;font-size:14px;font-weight:700;color:var(--soft)}
#hMission{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hMission b{color:var(--ink)}
.hchip{flex:none;display:flex;align-items:center;gap:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hchip svg{width:16px;height:16px;fill:currentColor;transition:transform .3s}
#hIgn i{font-style:normal;color:var(--accent)}
#hIgn.flash,#hFuelBox.flash{animation:hflash .9s}
@keyframes hflash{0%,60%{color:var(--bad);transform:scale(1.08)}100%{transform:none}}
.hrow2{display:flex;gap:6px;align-items:stretch}
.g{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:3px 6px 4px;border-radius:10px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--chip-line);transition:box-shadow .2s}
.g small{font-size:11px;font-weight:700;letter-spacing:0;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g b{font-size:19px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.g.ok b{color:var(--good)}
.g.bad b{color:var(--bad)}
.g.ok{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--good) 55%,transparent)}
.g.bad{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--bad) 55%,transparent)}
.g.fuel{flex:1.15 1 0}
.fbar{display:block;height:9px;margin:5px 0 3px;border-radius:5px;background:var(--track);overflow:hidden}
.fbar i{display:block;height:100%;width:100%;border-radius:5px;background:var(--good);transform-origin:left center}
.g.fuel.low .fbar i{background:var(--warn)}
.g.fuel.empty .fbar i{background:var(--bad)}
#btnPause{flex:none;width:46px;height:30px;margin:-3px 0;border-radius:9px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--chip-line);display:grid;place-items:center;color:var(--ink)}
#btnPause svg{width:20px;height:20px;fill:currentColor}
#btnPause .iplay,#btnPause.on .ipause{display:none}
#btnPause.on .iplay{display:block}
/* the ignitions left: big round pips (filled = left, ring = used) */
#hIgn i{display:flex;gap:4px;align-items:center}
#hIgn i b{width:12px;height:12px;border-radius:50%;background:var(--accent)}
#hIgn i b.u{background:none;box-shadow:inset 0 0 0 2px var(--soft);opacity:.7}

/* ---------- The scene ---------- */
#stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;background:#0b1220}
#scene{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
/* a short message on top of the scene ("Došlo palivo") */
#msg{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:8px 14px;border-radius:12px;background:var(--card);color:var(--ink);font-size:17px;font-weight:800;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35);pointer-events:none;transition:opacity .3s}
#msg.hide{opacity:0}
#msg.bad{color:var(--bad)}

/* the control marks: Dva palce (two halves), Tlačítka (◀ ▶ and the flame), Náklon telefonu (a hint and the tilt) */
.zones{position:absolute;left:var(--gut);right:var(--gut);bottom:12px;display:flex;gap:12px;pointer-events:none}
.zone{flex:1;height:88px;border-radius:20px;background:var(--zone);box-shadow:inset 0 0 0 2px var(--zone-line);display:flex;align-items:center;justify-content:center;gap:14px;color:#fff;opacity:.9;transition:background .08s}
.zone.on{background:var(--zone-on)}
/* the pad behind a zone: only its outline and marks stay, so the pad shows through */
.zone.see{background:transparent;box-shadow:inset 0 0 0 2px var(--zone-line)}
.zone.see svg{opacity:.5}
.zone.see.on{background:color-mix(in srgb,var(--zone-on) 45%,transparent)}
.zone svg{width:34px;height:34px;fill:currentColor;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.zone .fl{width:26px;height:30px;opacity:.85}
.cbtns{position:absolute;left:var(--gut);right:var(--gut);bottom:12px;height:96px;pointer-events:none}
.cbtn{position:absolute;bottom:0;width:84px;height:84px;border-radius:50%;background:var(--zone);box-shadow:inset 0 0 0 2px var(--zone-line);display:grid;place-items:center;color:#fff}
.cbtn.on{background:var(--zone-on)}
.cbtn svg{width:36px;height:36px;fill:currentColor;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
#cL{left:0}
#cR{left:96px}
#cB{right:0;width:96px;height:96px}
#cB svg{width:44px;height:48px}
.tiltbox{position:absolute;left:var(--gut);right:var(--gut);bottom:12px;height:56px;border-radius:18px;background:var(--zone);box-shadow:inset 0 0 0 2px var(--zone-line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.tiltbox.on{background:var(--zone-on)}
.tiltbox i{position:absolute;top:8px;bottom:8px;left:50%;width:6px;margin-left:-3px;border-radius:3px;background:#fff;opacity:.85;box-shadow:0 0 6px rgba(0,0,0,.5)}

/* ---------- Cards over the scene: briefing, result, pause (the game theme, not a paper screen) ---------- */
.ccard{position:absolute;left:var(--gut);right:var(--gut);bottom:12px;max-width:460px;max-height:calc(100% - 24px);display:flex;flex-direction:column;margin:0 auto;border-radius:20px;background:var(--card);color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px var(--card-line);overflow:hidden;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ccard .in{padding:14px 16px 12px;overflow-y:auto;min-height:0}
.cfoot{flex:none}
.ccard .kick{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.ccard h2{font-size:26px;line-height:1.15;font-weight:800;margin:2px 0 6px}
.ccard p{font-size:17px;line-height:1.35;color:var(--ink)}
.ccard p.soft{color:var(--soft);font-size:16px;margin-top:6px}
.conds{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cond{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:9px;background:var(--alt);font-size:15px;font-weight:700;white-space:nowrap}
.cond svg{width:15px;height:15px;fill:currentColor}
.best{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:16px;color:var(--soft)}
.stars{color:var(--accent);letter-spacing:2px;font-size:20px}
.stars .off{color:var(--track)}
/* buttons flush with the card's edges: the card keeps the one side margin, so do they */
.cfoot{display:flex;border-top:1px solid var(--card-line)}
.cfoot button{flex:1 1 0;min-width:0;height:60px;font-size:20px;font-weight:800;color:var(--ink);background:var(--alt);border-left:1px solid var(--card-line);display:flex;align-items:center;justify-content:center;gap:6px}
.cfoot button:first-child{border-left:0}
.cfoot button.pri{background:var(--btn);color:var(--btn-ink);flex-grow:1.5}
.cfoot button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rstars{display:flex;justify-content:center;gap:6px;font-size:44px;line-height:1;margin:2px 0 4px}
.rstars span{color:var(--track);transform:scale(.4);opacity:0;animation:star .45s cubic-bezier(.3,1.6,.5,1) forwards}
.rstars span.on{color:var(--accent)}
.rstars span:nth-child(2){animation-delay:.18s}
.rstars span:nth-child(3){animation-delay:.36s}
@keyframes star{to{transform:none;opacity:1}}
#result h2{text-align:center}
#result .det{text-align:center;color:var(--soft);font-size:16px}
.rows{margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:16px}
.rows span{color:var(--soft)}
.rows b{text-align:right;font-variant-numeric:tabular-nums}
.rows .tot{font-size:20px;color:var(--ink);padding-top:5px;border-top:1px solid var(--card-line)}
.rows b.tot{color:var(--accent)}
.rec{margin-top:8px;text-align:center;font-size:16px;font-weight:800;color:var(--soft)}
.rec.new{color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.tip{margin-top:10px;padding:9px 11px;border-radius:10px;background:var(--alt);font-size:16px;line-height:1.35}
#pausecard{bottom:auto;top:50%;transform:translateY(-50%);text-align:center}
#pausecard h2{margin-bottom:2px}

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
/* rule: the head with Zpět and the game name stays at the top while scrolling */
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);margin-top:16px}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{font-size:18px;color:var(--psoft);line-height:1.3}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{height:56px;border-radius:10px;background:var(--page);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;gap:8px}
.swatch i{width:30px;height:14px;border-radius:7px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--chip-line)}
.swatch i:last-child{background:var(--btn);box-shadow:none}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.help p,.help li{font-size:19px;line-height:1.45}
.help p + p{margin-top:8px}
.help ul{padding-left:24px}
.help li{margin:7px 0}
.help b{color:var(--pink)}

.sum{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 0;font-size:19px;font-weight:700;color:var(--psoft)}

.mt .mn{font-size:15px;font-weight:800;color:var(--psoft)}
.mt b{font-size:18px;line-height:1.2}
.mt .ms{margin-top:auto;font-size:20px;letter-spacing:2px;color:var(--pbtn)}
.mt .ms .off{color:var(--psw)}
.mt .mb{position:absolute;right:10px;top:9px;font-size:15px;font-weight:700;color:var(--psoft)}
.mt.cur{border-color:var(--pbtn);background:var(--popt-on)}
.mt.lock{background:transparent;border-style:dashed;color:var(--psoft)}

.mt svg{width:22px;height:22px;fill:none;stroke:var(--psoft);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-top:auto}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 130px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;line-height:1.35;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
/* short windows: a more compact HUD and cards, so the scene keeps its room */
@media (max-height:700px){
  .ccard h2{font-size:22px}
  .ccard p{font-size:16px}
  .ccard .in{padding:10px 14px 10px}
  .cfoot button{height:52px;font-size:18px}
  .rstars{font-size:36px}
  .rows{font-size:15px;margin-top:6px}
  .tip{font-size:15px;margin-top:6px;padding:7px 10px}
  .zone{height:72px}
}

   visible above it */
@media (max-height:600px){
  #result .in{padding:8px 14px}
  #result .rstars{font-size:28px;margin:0 0 2px}

  #result .kick{font-size:12px}
  #result .cfoot button{height:44px;font-size:17px}
}

<script>
/* ---------- Visible height ---------- */
// The game is exactly as tall as the part of the window that is really shown (--app-h on #app). 100dvh alone is not
// enough: some browsers report it taller than what is visible (the app installed by Brave on Android counted the
// status and navigation bars too and hid the bottom buttons). visualViewport follows what is shown; it is measured
// again on every change and shortly after loading (a browser bar that hides itself may change it without an event),
// and a changed height makes the game lay itself out again through a resize event.
(() => {
  const root = document.documentElement;
  let last = 0;
  const measure = () => {
    const vv = window.visualViewport;
    const h = Math.round(vv ? vv.height * vv.scale : innerHeight);
    if (!(h > 0) || h === last) return;
    const first = !last; last = h;
    root.style.setProperty('--app-h', h + 'px');
    if (!first) dispatchEvent(new Event('resize'));
  };
  measure();
  addEventListener('resize', measure);
  if (window.visualViewport) visualViewport.addEventListener('resize', measure);
  addEventListener('pageshow', measure);
  [100, 500, 1500].forEach(ms => setTimeout(measure, ms));
  // TEMPORARY (2026-11-08): what this page measured, shown in the launcher's Nastavení → "Údaje o obrazovce"
  setTimeout(() => { try {
    const p = document.createElement('div'); p.style.cssText = 'position:absolute;left:-50px;top:0;width:1px;height:100dvh;padding-bottom:env(safe-area-inset-bottom)';
    document.body.appendChild(p); const dvh = Math.round(p.getBoundingClientRect().height - parseFloat(getComputedStyle(p).paddingBottom)), sb = Math.round(parseFloat(getComputedStyle(p).paddingBottom)); p.remove();
    const vv = window.visualViewport;
    localStorage.setItem('games.launcher.diag', JSON.stringify({ page: location.pathname.split('/').slice(-2, -1)[0], vv: vv ? Math.round(vv.height) : null, inner: innerHeight, client: root.clientHeight, dvh, sb, appH: last, app: Math.round(document.getElementById('app').getBoundingClientRect().height) }));
  } catch (e) {} }, 2000);
})();
</script>
<script>
/* ---------- Engine ---------- */
// Přistání: missions, flight physics, touchdown rules, score and the autopilot. Pure and deterministic: no DOM, no
// storage, no clock; a flight is a function of (mission, seed, inputs) stepped at a fixed 120 Hz. Units: metres,
// seconds, m/s; angles are radians in a flight (positive = nose to the right) and degrees in the missions.
// Tested in Node by tools/pristani-test.js; the API is described in tools/pristani-dev/SPEC.md, section 8.
function PristaniEngine() {
'use strict';
const DT = 1 / 120, DEG = Math.PI / 180, TAU = 2 * Math.PI;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------- Constants ---------- */
// the booster: the base (x, y of a flight) is the bottom of the engine in the middle; legs hinge on the body 3 m up
const ROCKET = { height: 40, radius: 1.85, hingeY: 3, footX: 8.5, footY: -2, com: 14, legTime: 0.8 };
ROCKET.legLen = Math.hypot(ROCKET.footX - ROCKET.radius, ROCKET.footY - ROCKET.hingeY);
ROCKET.legAngle = Math.atan2(ROCKET.footY - ROCKET.hingeY, ROCKET.footX - ROCKET.radius); // deployed, from +x
// what a touchdown must keep (relative to the pad or the deck)
const LIMITS = { vDown: 4, vSide: 2, tilt: 8, tipMax: 25 };
const TIP_G = 18; // the tip-over's pace (m/s², not the world's gravity: a slow topple on the Moon was only waiting)
// steering and the engine: rate-limited, damped, auto-levelling rotation; on/off throttle with a spool-up
const CTRL = { rate: 70 * DEG, level: 25 * DEG, levelGain: 4, damp: 0.12, maxTilt: 40 * DEG, spoolUp: 0.25, spoolDown: 0.1, relight: 0.3 };
// air: density = mission.air * exp(-height / scale); drag = k * density * |v rel| * v rel (the side of a long body
// catches much more air than its end)
const AIR = { scale: 6000, kAxial: 1.1e-3, kSide: 3.2e-3 };
const MASS_FUEL = 0.3;         // fuel mass / dry mass with a full tank: thrust/weight grows by 30 % as it empties
const DECK = { height: 2.5, thick: 5, drift: 60 }; // barge deck above the mean sea, its thickness, drift period (s)
const PLANETS = {
  earth: { g: 9.81, air: 1, sound: 340 },
  moon: { g: 1.62, air: 0, sound: 0 },
  mars: { g: 3.71, air: 0.1, sound: 240 },
};

/* ---------- Random numbers from a seed ---------- */
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* ---------- Missions ---------- */
// mission(o): fills in the defaults. start.alt is the height of the base above the pad (deck) surface; start.x is
// the sideways distance from the pad centre (negative = left of it).
function mission(o) {
  const planet = PLANETS[o.world || 'earth'];
  const m = {
    id: o.id, chapter: o.chapter || 0, num: o.num || 0, name: o.name, what: o.what || '',
    world: o.world || 'earth',
    g: o.g != null ? o.g : planet.g,
    air: o.air != null ? o.air : planet.air,
    sound: o.sound != null ? o.sound : planet.sound,
    twr: o.twr || 1.3,
    fuel: o.fuel || 30,
    ignitions: o.ignitions == null ? null : o.ignitions,
    wind: Object.assign({ steady: 0, gusts: 0, shear: null }, o.wind || {}),
    surface: o.surface || (o.world && o.world !== 'earth' ? o.world : 'land'), // land | sea | moon | mars
    pad: Object.assign({ kind: 'pad', x: 0, halfWidth: 30, waves: null, drift: 0 }, o.pad || {}),
    start: Object.assign({ x: 0, alt: 500, vx: 0, vy: -20, angle: 0 }, o.start || {}),
    legAlt: o.legAlt || 120,
    area: o.area || 1500,
    crater: o.crater || null,
    scene: Object.assign({ sky: 'day', clouds: null, fog: null, rain: false, lightning: false, haze: 0, terrain: 'desert' }, o.scene || {}),
    seed: o.seed || 1,
    par: o.par || 0,
  };
  if (m.pad.kind === 'barge') {
    m.surface = 'sea';
    m.pad.waves = Object.assign({ heave: 0.2, pitch: 0.3, period: 8 }, m.pad.waves || {});
    if (m.scene.terrain === 'desert') m.scene.terrain = 'sea';
  }
  return m;
}

const CHAPTERS = [
  { id: 1, name: 'Poušť', what: 'Plošina v poušti za jasného dne.' },
  { id: 2, name: 'Moře', what: 'Přistání na lodi uprostřed moře.' },

    start: { x: -150, alt: 700, vx: 8, vy: -30 }, fuel: 32, pad: { kind: 'barge', halfWidth: 14 } },
  { id: 'm06', chapter: 2, num: 2, name: 'Vlny', what: 'Vlny lodí houpají nahoru a dolů a naklánějí ji.', seed: 22,

  // 3. Vítr

/* ---------- Autopilot ---------- */

<script>

function conditions(m) {

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenMissions', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, nechat"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

requestAnimationFrame(frame);

// contract: opened from the launcher (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;

// For testing (tools/shots.js, Playwright): start a mission, let the autopilot fly, jump to an outcome, freeze
window.Pristani = {
  E, get state() { return { S, P, M, F, mode, paused }; },
  open(id) { openMission(id); },                       // the briefing of a mission ('m05', 'daily')
  start(id) { if (id) openMission(id); startFlight(true); }, // and fly it (no input until a finger or auto)
  auto(m) { auto = m || null; },                        // the autopilot flies ('safe', 'score'), null = the player
  // fly quickly with the autopilot down to `alt` metres, then keep it flying in real time
  flyTo(alt = 40, m = 'safe') {
    if (mode === 'brief') startFlight(true);
    let n = 0;
    while (F.phase === 'flying' && F.alt > alt && n++ < 20000) { pX = F.x; pY = F.y; pA = F.a; E.step(F, E.autopilot(F, m), DT); if (F.n % 12 === 0) rec.push(r1(F.x), r1(F.y), r3(F.a), r1(F.throttle)); }
    handleEvents(E.takeEvents(F)); rX = F.x; rY = F.y; rA = F.a; auto = m; camSnap = true;
  },
  // an outcome now: 'land' (autopilot to the end), 'crash' (too fast on the pad), 'miss' (beside the pad or the barge)
  outcome(kind = 'land') {
    if (mode === 'brief') startFlight(true);
    if (kind === 'land') { this.flyTo(0, 'score'); return; }
    const d = F.deck, hw = M.pad.halfWidth;
    F.x = kind === 'miss' ? d.x + hw + 45 : d.x + 2; F.y = d.y + 30; F.vx = 0; F.vy = kind === 'miss' ? -16 : -24; F.a = 0; F.w = 0;
    F.legs = 1; F.legsOut = true; auto = null; camSnap = true;
  },
  freeze(on = true) { frozen = !!on; lastT = 0; },
  skip(sec) { const n = Math.round(sec / DT); for (let i = 0; i < n; i++) stepOnce(); handleEvents(E.takeEvents(F)); rX = F.x; rY = F.y; rA = F.a; },
  tilt(v) { testTilt = v === null || v === undefined ? null : clamp(+v, -1, 1); },
  get quality() { return { dpr: DPR, step: Q.i, lowFx: Q.lowFx, ema: Q.ema }; },
  // where things are on the screen (px in the scene): the pad's top, the rocket's base, the top of the control marks
  get cam() { return { padY: Y(F.deck.y), padX: X(F.deck.x), rocketY: Y(rY), zoom, H, W, ctlTop: H - ctlH() + 14 }; },
};
})();
</script>
