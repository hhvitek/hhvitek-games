<!doctype html>
<html lang="cs" data-theme="green">
<head>
<meta charset="utf-8">
<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#163d27">

<title>Zavři čísla</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a7346'/%3E%3Crect x='14' y='14' width='36' height='36' rx='7' fill='%23fbfaf6'/%3E%3Ccircle cx='24' cy='24' r='4' fill='%23222'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23222'/%3E%3Ccircle cx='40' cy='40' r='4' fill='%23222'/%3E%3C/svg%3E">
<style>
/* ---------- Themes: a solid colour (felt in a wooden box); everything below reads these variables ---------- */
[data-theme="green"]{--page:#163d27;--bar:rgba(0,0,0,.22);--line:rgba(255,255,255,.08);--ink:#eef7f0;--soft:#c5dccb;--accent:#ffd66b;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--btn:#ffd66b;--btn-ink:#2a2200;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.25);--felt:#2a7346;--wood:#c8955a;--wood-dk:#8f6334;--tile:#f3e2bf;--tile-ink:#22170b;--tile-sh:#a8804c;--tile-down:#9c7140;--die:#fbfaf6;--pip:#1c1c1c}
[data-theme="blue"]{--page:#132a45;--bar:rgba(0,0,0,.24);--line:rgba(255,255,255,.08);--ink:#eaf2fb;--soft:#c6d8ee;--accent:#ffd166;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--btn:#ffd166;--btn-ink:#2a2000;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.28);--felt:#26578c;--wood:#c8955a;--wood-dk:#8f6334;--tile:#f3e2bf;--tile-ink:#22170b;--tile-sh:#a8804c;--tile-down:#9c7140;--die:#fbfaf6;--pip:#1c1c1c}
[data-theme="burgundy"]{--page:#3a1018;--bar:rgba(0,0,0,.26);--line:rgba(255,255,255,.08);--ink:#fbeaea;--soft:#f0c4c8;--accent:#ffcf70;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--btn:#f3c25e;--btn-ink:#3a1a00;--btn-sh:#9a6a1a;--undo-bg:rgba(0,0,0,.3);--felt:#7a2335;--wood:#b8834c;--wood-dk:#7f5428;--tile:#f3e2bf;--tile-ink:#22170b;--tile-sh:#a8804c;--tile-down:#8f6438;--die:#fbfaf6;--pip:#1c1c1c}
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.08);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--accent:#c0561a;--chip:rgba(122,69,32,.08);--chip-line:rgba(122,69,32,.24);--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--undo-bg:rgba(122,69,32,.1);--felt:#e7d9c6;--wood:#c9a57a;--wood-dk:#9c7650;--tile:#faf4eb;--tile-ink:#2b1a0e;--tile-sh:#b08a5c;--tile-down:#8a6440;--die:#fff;--pip:#2b1a0e}
[data-theme="paper"] #felt{box-shadow:inset 0 3px 10px rgba(63,34,14,.35)} /* a lighter shadow on the light felt */
[data-theme="night"]{--page:#0e1013;--bar:rgba(0,0,0,.35);--line:rgba(255,255,255,.06);--ink:#e6e8eb;--soft:#a9b0b9;--accent:#6fb7ff;--chip:rgba(255,255,255,.1);--chip-line:rgba(255,255,255,.16);--btn:#6fb7ff;--btn-ink:#0a1a2a;--btn-sh:#2e6aa3;--undo-bg:rgba(0,0,0,.35);--felt:#1d2b3a;--wood:#4a3d31;--wood-dk:#2e251d;--tile:#cfc7b8;--tile-ink:#111;--tile-sh:#7d7568;--tile-down:#3a3027;--die:#dcd9d2;--pip:#111}

/* ---------- Base ---------- */
:root{--gut:12px} /* one side margin: top-bar buttons, the wooden box and the bottom buttons line up */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Top bar ---------- */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;color:var(--ink);overflow-wrap:normal;word-break:normal;white-space:normal} /* a long name wraps to two lines between words, never inside one (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);text-decoration:none}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:8px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:20px}
/* narrow phones (360 px): less gap and a slimmer Nová hra pill, so the name keeps whole words; the outer margin stays --gut */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill{padding:0 8px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px}
}

/* ---------- Info row ---------- */
.stats{flex:none;text-align:center;padding:8px 12px 0;font-size:20px;font-weight:700;color:var(--soft);min-height:36px}
.stats b{color:var(--ink);font-size:22px}

/* ---------- Box: wooden frame, two rails of tiles, felt with the dice ---------- */
:root{--tw:60px;--th:84px;--ds:90px}
#board{flex:1;min-height:0;padding:12px var(--gut);display:flex;align-items:center} /* 12 px from the info row and the tray too; layout() sizes the box inside this padding */
#box{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:20px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 19px,rgba(255,255,255,.05) 19px 21px,transparent 21px 37px),var(--wood);
  box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.18)}
#rails{flex:none;display:flex;flex-direction:column;gap:10px}
.rail{display:flex;justify-content:center;gap:8px;padding:8px;border-radius:12px;background:var(--wood-dk);box-shadow:inset 0 3px 7px rgba(0,0,0,.45)}
.plate{flex:none;width:var(--tw);height:var(--th);border-radius:9px 9px 5px 5px;display:grid;place-items:center;background:var(--tile);color:var(--tile-ink);
  box-shadow:0 4px 0 var(--tile-sh),0 6px 8px rgba(0,0,0,.35);transform-origin:50% 100%;transition:transform .25s,opacity .2s,background .2s,box-shadow .2s}
.plate .num{font-family:Georgia,"Times New Roman",serif;font-size:calc(var(--tw)*.58);font-weight:700;line-height:1}
.plate.sel{transform:translateY(-6px);box-shadow:0 0 0 4px var(--accent),0 10px 12px rgba(0,0,0,.45)}
.plate.dim{opacity:.4}
.plate.down{transform:perspective(320px) rotateX(74deg);background:var(--tile-down);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.plate.down .num{opacity:.3}
#felt{flex:none;height:calc(var(--ds)*1.6);border-radius:12px;background:var(--felt);box-shadow:inset 0 4px 14px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;gap:calc(var(--ds)*.4)}
.die{flex:none;width:var(--ds);height:var(--ds);border-radius:18%;background:var(--die);padding:calc(var(--ds)*.1);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.12),0 7px 12px rgba(0,0,0,.45);transition:opacity .2s}
/* sizes from --ds: a % padding or margin would be taken from the felt's width and shrink the pips */
.die i{margin:calc(var(--ds)*.03);border-radius:50%}
.die i.on{background:var(--pip);box-shadow:inset 0 2px 2px rgba(0,0,0,.45)}
.die.faded{opacity:.42}
.die{position:relative}
.die.blank::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font:700 calc(var(--ds)*.55)/1 Georgia,"Times New Roman",serif;color:var(--pip)}
.die.blank.faded{opacity:.6}
.die.rolling{animation:tumble .16s ease-in-out infinite alternate}
.die.rolling + .die.rolling{animation-delay:-.08s}
@keyframes tumble{from{transform:rotate(-16deg) translateY(-8%)}to{transform:rotate(18deg) translateY(6%)}}

/* ---------- Bottom buttons ---------- */
.tray{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px var(--gut) 12px;background:var(--bar);border-top:1px solid var(--line)}
#hint{text-align:center;font-size:19px;line-height:1.3;color:var(--soft);min-height:25px}
.row{display:flex;gap:10px}
.undo{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;height:64px;border-radius:16px;font-size:21px;font-weight:800;color:var(--ink);background:var(--undo-bg);box-shadow:inset 0 0 0 2px var(--chip-line);transition:opacity .2s}
.undo svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.go{flex:1.6 1 0;min-width:0;height:64px;border-radius:18px;font-size:min(23px,6vw);font-weight:800;background:var(--btn);color:var(--btn-ink);box-shadow:0 4px 0 var(--btn-sh);transition:opacity .2s,transform .06s,box-shadow .06s}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-sh)}
/* an unavailable action is only dimmed and explains itself when tapped */
.undo.dim,.go.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);margin-top:16px}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{font-size:18px;color:var(--psoft);line-height:1.3}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{height:60px;border-radius:10px;background:var(--felt);box-shadow:inset 0 0 0 7px var(--wood),inset 0 0 0 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:8px}
.swatch .mini{width:28px;height:36px;border-radius:5px;display:grid;place-items:center;background:var(--tile);color:var(--tile-ink);box-shadow:0 2px 0 var(--tile-sh)}
.swatch .mini .num{font:700 20px Georgia,serif}
.swatch .mdie{width:30px;height:30px;border-radius:6px;background:var(--die);display:grid;place-items:center}
.swatch .mdie::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--pip)}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.srow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:20px}
.srow b{font-size:22px}
.help p,.help li{font-size:20px;line-height:1.45}
.help ol{padding-left:26px}
.help li{margin:10px 0}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;line-height:1.35;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px Georgia,"Times New Roman",serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
</style>
</head>
<body>
<div id="rotate" class="paper" role="status"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="6" width="20" height="36" rx="4"/><path d="M29 36h6"/><path d="M12 46a22 22 0 0 0 40 0"/><path d="m52 46-1.5 7M52 46l-7 2"/></svg><b>Otoč telefon na výšku</b><span>Hra počká, nic se neztratí.</span></div>
<div id="app">
  <header class="topbar">
    <a id="btnHome" class="round" href="../../index.html" aria-label="Zpět na výběr her" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2V20a1 1 0 0 1-1 1H15v-5.5H9V21H4.5a1 1 0 0 1-1-1z"/></svg></a>
    <button id="btnNew" class="pill">Nová hra</button>
    <h1>Zavři čísla</h1>

    const left = openList(G);
    html = `<h2>Konec hry</h2><p>S hodem <b>${sum(G.roll)}</b> už nejde nic zavřít.</p>
      <p>Zbylo: ${left.join(', ')}<br>Součet: <b>${remaining(G)}</b> (čím méně, tím lépe)</p>
      ${G.record ? '<p><b>Nejlepší výsledek!</b></p>' : st && st.best !== null && st.played > 1 ? `<p>Nejlepší výsledek: <b>${st.best}</b></p>` : ''}`;
  }
  if (!endCounted) html += '<p>Tahle hra už jednou skončila, do statistiky se znovu nepočítá.</p>';
  showModal(html, [{ text: 'Nová hra', fn: () => newGame() },
    ...(G.history.length ? [{ text: 'Vrátit tah', cls: 'alt', fn: undo }] : []),
    { text: 'Prohlédnout krabičku', cls: 'alt' }]);
}
// A new game in the middle of one asks first
$('#btnNew').addEventListener('click', () => {
  if (G.status === 'playing' && !isFresh()) {
    showModal('<h2>Začít novou hru?</h2><p>Rozehraná hra se ztratí.</p>', [{ text: 'Ano, nová hra', fn: () => newGame() }, { text: 'Ne, hrát dál', cls: 'alt' }]);
  } else newGame();
});

/* ---------- Settings (a separate screen, applied at once, no Save button) ---------- */
const opt = (act, on, title, desc) => `<button class="opt" data-act="${act}" aria-pressed="${on}"><span class="radio"></span><span><b>${title}</b>${desc ? `<span class="d">${desc}</span>` : ''}</span></button>`;
const toggleRow = (key, label) => `<div class="field trow"><div class="flabel">${label}</div><button class="sw" data-act="toggle:${key}" aria-pressed="${S[key]}">${S[key] ? 'Zapnuto' : 'Vypnuto'}</button></div>`;
const inProgress = () => G && G.status === 'playing' && !isFresh();
function renderSettings() {
  const st = stats[rulesKey(S)];
  const variant = `${S.tiles} destiček, ${S.oneDie ? 'na konci jedna kostka' : 'vždy dvě kostky'}`;
  $('#settingsIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Zavři čísla<small>Nastavení</small></h2></div>
    <section class="card"><h3>Pravidla</h3>
      <div class="field"><div class="flabel">Počet destiček</div>
        ${opt('tiles:9', S.tiles === 9, 'Čísla 1 až 9', 'Klasická krabička.')}
        ${opt('tiles:10', S.tiles === 10, 'Čísla 1 až 10', 'O něco těžší.')}
        ${opt('tiles:12', S.tiles === 12, 'Čísla 1 až 12', 'Nejtěžší, menší destičky.')}
        ${S.tiles !== G.rules.tiles && !isFresh() ? `<div class="notice">Po návratu do hry začne <b>nová hra</b> s ${S.tiles} destičkami.</div>` : ''}
      </div>
      ${toggleRow('oneDie', 'Na konci jen jedna kostka')}
      <div class="fnote" style="margin-top:-6px">Když jsou zavřená čísla od 7 výš, hází se jen jednou kostkou.</div>
      ${S.oneDie !== G.rules.oneDie && S.tiles === G.rules.tiles && !isFresh() ? (inProgress()
        ? '<div class="notice">Rozehraná hra se dohraje podle původního pravidla. Změna platí od příští hry.</div>'
        : '<div class="notice">Po návratu do hry začne <b>nová hra</b> s tímto pravidlem.</div>') : ''}
    </section>
    <section class="card"><h3>Ovládání</h3>
      <div class="field"><div class="flabel">Zavírání destiček</div>
        ${opt('mode:button', S.close === 'button', 'Ťuknout na Zavřít', 'Vyber destičky a potom ťukni na tlačítko Zavřít. Výběr jde ještě změnit.')}
        ${opt('mode:auto', S.close === 'auto', 'Zavřít samo', 'Destičky se zavřou, jakmile jejich součet sedí s kostkami.')}
      </div>
      ${toggleRow('hints', 'Nápověda')}
      <div class="fnote" style="margin-top:-6px">Ztmaví destičky, které se k hodu nehodí.</div>
    </section>
    <section class="card"><h3>Vzhled</h3>
      <div class="tiles">${THEMES.map(t => `<button class="tile" data-act="theme:${t.id}" aria-pressed="${S.theme === t.id}"><span class="swatch" data-theme="${t.id}"><span class="mini"><span class="num">7</span></span><span class="mdie"></span></span>${t.name}</button>`).join('')}</div>
      ${toggleRow('vibrate', 'Vibrace')}
    </section>
    <section class="card"><h3>Statistika</h3>
      <div class="fnote" style="margin:0 0 6px">${variant}</div>
      <div class="srow"><span>Odehrané hry</span><b>${st ? st.played : 0}</b></div>
      <div class="srow"><span>Zavřené krabičky</span><b>${st ? st.shut : 0}</b></div>
      <div class="srow"><span>Nejlepší výsledek</span><b>${st && st.best !== null ? st.best : '–'}</b></div>
      <div class="fnote">Výsledek je součet čísel, která zůstala otevřená. Čím méně, tím lépe; 0 = všechno zavřené.</div>
      <button class="link" data-act="clearStats">Smazat statistiku</button>
    </section>
    <button class="big" data-act="close">Zpět ke hře</button>
    <button class="link" data-act="reset">Obnovit výchozí nastavení</button>`;
}
$('#settingsIn').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, arg] = b.dataset.act.split(':');
  if (act === 'close') { closeSettings(); return; }
  if (act === 'clearStats') {
    showModal('<h2>Smazat statistiku?</h2><p>Smažou se výsledky všech variant.</p>', [
      { text: 'Ano, smazat', fn: () => { stats = {}; G.record = false; save(); renderSettings(); toast('Statistika je smazaná'); } },
      { text: 'Ne, nechat', cls: 'alt' }]);
    return;
  }
  if (act === 'tiles') S.tiles = +arg;
  else if (act === 'mode') S.close = arg;
  else if (act === 'theme') S.theme = arg;
  else if (act === 'toggle') S[arg] = !S[arg];
  else if (act === 'reset') { S = Object.assign({}, DEFAULTS); toast('Nastavení je zase výchozí'); }
  normalize(S); buzz(8); applyLook(); save();
  const y = $('#screenSettings').scrollTop; renderSettings(); $('#screenSettings').scrollTop = y;
});
function openSettings() { hideToast(); renderSettings(); $('#screenSettings').hidden = false; $('#screenSettings').scrollTop = 0; }
// A change of the rules starts a new game after returning (the tile count at once, the one-die rule only when no game is in progress)
function closeSettings() {
  $('#screenSettings').hidden = true;
  // a finished game (it can still be revived by Undo) is replaced only with a message, like one in progress
  if (S.tiles !== G.rules.tiles) newGame(!isFresh() ? `Začala nová hra s ${S.tiles} destičkami` : '');
  else if (S.oneDie !== G.rules.oneDie && !inProgress()) newGame(!isFresh() ? 'Začala nová hra s novým pravidlem' : '');
  else render();
}
$('#btnSettings').addEventListener('click', openSettings);

/* ---------- Help (only behind "?", never opens by itself) ---------- */
function renderHelp() {
  const t = G.rules.tiles;
  $('#helpIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Zavři čísla<small>Jak hrát</small></h2></div>
    <section class="card help"><ol>
      <li>V krabičce jsou destičky s čísly <b>1 až ${t}</b>. Na začátku jsou všechny otevřené.</li>
      <li>Ťukni na <b>Hodit kostkami</b>.</li>
      <li>Vyber jednu nebo více otevřených destiček, které dají dohromady <b>stejný součet jako kostky</b>. Třeba na kostkách je 8: zavři 8, nebo 5 a 3, nebo 1, 3 a 4.</li>
      <li>${S.close === 'button' ? 'Pak ťukni na <b>Zavřít</b>. Do té doby jde výběr změnit: ťukni na vybranou destičku znovu.' : 'Destičky se zavřou samy, jakmile jejich součet sedí s kostkami.'}</li>
      <li>Hoď znovu a pokračuj. Když už s hodem nejde nic zavřít, hra končí. Sečtou se čísla, která zůstala otevřená: <b>čím méně, tím lépe</b>. Když se zavřou všechna, je vyhráno.</li>
      ${G.rules.oneDie ? '<li>Když jsou zavřená čísla od 7 výš, hází se jen <b>jednou kostkou</b>.</li>' : ''}
      ${S.hints ? '<li>Destičky, které se k hodu nehodí, jsou ztmavené.</li>' : ''}
      <li><b>Zpět</b> vrátí výběr nebo poslední zavření. Kostky tím znovu hodit nejde: padnou zase stejná čísla.</li>
      <li>Do statistiky se počítá první konec každé hry. Když hru po konci vrátíš tlačítkem Zpět a dohraješ znovu, statistika se už nezmění.</li>
      <li>Nikam se nespěchá.</li>
    </ol></section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
}
function openHelp() { hideToast(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; }
$('#helpIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenHelp').hidden = true; });
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
// ask for persistent storage so the browser does not delete the saved game by itself
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const saved = load();
const savedSettings = saved && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
if (saved && saved.stats && typeof saved.stats === 'object') {
  for (const [k, v] of Object.entries(saved.stats)) if (/^(9|10|12)-[12]$/.test(k) && validStat(v)) stats[k] = { played: v.played, shut: v.shut, best: v.best };
}
if (saved && validGame(saved.game)) {
  G = saved.game;
  // a rule chosen just before the app was closed (Settings still open): applied now, as closing Settings would
  if (S.tiles !== G.rules.tiles || (S.oneDie !== G.rules.oneDie && !inProgress())) closeSettings(); else render();
}
else newGame();

window.addEventListener('resize', layout);
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
document.addEventListener('contextmenu', e => e.preventDefault());

// contract: opened from the launcher (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;

// For testing
window.ZavriCisla = { validSubsets, get state() { return { S, G, stats }; } };
})();
</script>
</body>
</html>
