<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".4"/></filter>
    <filter id="in" x="-5%" y="-5%" width="110%" height="110%"><feOffset dy="4"/><feGaussianBlur stdDeviation="5" result="b"/><feComposite in="SourceGraphic" in2="b" operator="arithmetic" k2="-1" k3="1" result="s"/><feFlood flood-color="#000" flood-opacity=".45"/><feComposite in2="s" operator="in"/><feComposite in2="SourceGraphic" operator="over"/></filter>
  </defs>

  <!-- wooden box with a subtle grain -->
  <rect width="512" height="512" fill="#c8955a"/>
  <g stroke="#000" stroke-opacity=".07" stroke-width="3">
    <line x1="20" y1="0" x2="20" y2="512"/><line x1="96" y1="0" x2="96" y2="512"/><line x1="181" y1="0" x2="181" y2="512"/>
    <line x1="270" y1="0" x2="270" y2="512"/><line x1="352" y1="0" x2="352" y2="512"/><line x1="440" y1="0" x2="440" y2="512"/>
  </g>

  <!-- two rails -->
  <rect x="32" y="32" width="448" height="120" rx="16" fill="#8f6334" filter="url(#in)"/>
  <rect x="32" y="164" width="448" height="120" rx="16" fill="#8f6334" filter="url(#in)"/>

  <!-- tiles 1–5 (2 is closed) -->
  <g filter="url(#sh)" fill="#f3e2bf">
    <rect x="46" y="44" width="76" height="98" rx="9"/>
    <rect x="218" y="44" width="76" height="98" rx="9"/>
    <rect x="304" y="44" width="76" height="98" rx="9"/>
    <rect x="390" y="44" width="76" height="98" rx="9"/>
  </g>
  <rect x="132" y="112" width="76" height="30" rx="6" fill="#9c7140"/>
  <!-- tiles 6–9 (7 is closed) -->
  <g filter="url(#sh)" fill="#f3e2bf">
    <rect x="89" y="176" width="76" height="98" rx="9"/>
    <rect x="261" y="176" width="76" height="98" rx="9"/>
    <rect x="347" y="176" width="76" height="98" rx="9"/>
  </g>
  <rect x="175" y="244" width="76" height="30" rx="6" fill="#9c7140"/>
  <g font-family="Georgia,'Times New Roman',serif" font-size="62" font-weight="700" fill="#22170b" text-anchor="middle">
    <text x="84" y="115">1</text><text x="256" y="115">3</text><text x="342" y="115">4</text><text x="428" y="115">5</text>
    <text x="127" y="247">6</text><text x="299" y="247">8</text><text x="385" y="247">9</text>
  </g>

  <!-- felt with two dice -->
  <rect x="32" y="298" width="448" height="182" rx="18" fill="#2a7346" filter="url(#in)"/>
  <g filter="url(#sh)">
    <g transform="rotate(-9 168 389)">
      <rect x="108" y="329" width="120" height="120" rx="22" fill="#fbfaf6"/>
      <g fill="#1c1c1c"><circle cx="138" cy="359" r="11"/><circle cx="198" cy="359" r="11"/><circle cx="168" cy="389" r="11"/><circle cx="138" cy="419" r="11"/><circle cx="198" cy="419" r="11"/></g>
    </g>
    <g transform="rotate(11 346 389)">
      <rect x="286" y="329" width="120" height="120" rx="22" fill="#fbfaf6"/>
      <g fill="#1c1c1c"><circle cx="316" cy="359" r="11"/><circle cx="346" cy="389" r="11"/><circle cx="376" cy="419" r="11"/></g>
    </g>
  </g>
</svg>
