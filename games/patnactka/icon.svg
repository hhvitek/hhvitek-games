  <rect x="24" y="24" width="464" height="464" rx="40" fill="#e8781e"/>
  <rect x="52" y="52" width="408" height="408" rx="18" fill="#2a211c"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle" fill="#d42a1e">
  <use href="#t" x="60" y="60"/><text x="106" y="126" font-size="60">1</text>
