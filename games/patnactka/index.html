<!doctype html>
<html lang="cs" data-theme="orange">
<head>
<meta charset="utf-8">
<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3e6d2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Patnáctka</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8781e'/%3E%3Crect x='8' y='8' width='48' height='48' rx='6' fill='%232a211c'/%3E%3Crect x='11' y='11' width='20' height='20' rx='3' fill='%23fffaf3'/%3E%3Crect x='33' y='11' width='20' height='20' rx='3' fill='%23fffaf3'/%3E%3Crect x='11' y='33' width='20' height='20' rx='3' fill='%23fffaf3'/%3E%3C/svg%3E">
<style>
/* ---------- Themes: a solid colour; everything below reads these variables (rule) ---------- */
[data-theme="orange"]{--page:#f3e6d2;--bar:rgba(120,60,10,.08);--line:rgba(0,0,0,.08);--ink:#2e1d10;--soft:#6b5340;--accent:#e8781e;--chip:rgba(120,60,10,.08);--chip-line:rgba(120,60,10,.22);--undo-bg:rgba(120,60,10,.08);--frame:#e8781e;--frame-sh:#b85a10;--well:#2a211c;--tile:#fffaf3;--tile-ink:#d42a1e;--tile-sh:rgba(0,0,0,.18);--ok:#2f9a4c;--mix:26%}
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.08);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--accent:#7a4520;--chip:rgba(122,69,32,.08);--chip-line:rgba(122,69,32,.24);--undo-bg:rgba(122,69,32,.1);--frame:#7a4520;--frame-sh:#3f220e;--well:#3f220e;--tile:#fff;--tile-ink:#d42a1e;--tile-sh:rgba(63,34,14,.22);--ok:#2f9a4c;--mix:26%}
[data-theme="wood"]{--page:#e8dcc6;--bar:rgba(90,60,20,.08);--line:rgba(0,0,0,.08);--ink:#2e2214;--soft:#6b5a45;--accent:#b0611c;--chip:rgba(80,50,10,.08);--chip-line:rgba(80,50,10,.22);--undo-bg:rgba(80,50,10,.08);--frame:#8a5a2b;--frame-sh:#5e3a18;--well:#3b2614;--tile:#f6e7c9;--tile-ink:#4a2a10;--tile-sh:rgba(80,40,0,.25);--ok:#2f8a4e;--mix:28%}
[data-theme="night"]{--page:#16233f;--bar:rgba(0,0,0,.25);--line:rgba(255,255,255,.08);--ink:#eef3fb;--soft:#b9c6dc;--accent:#ffd166;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--undo-bg:rgba(0,0,0,.28);--frame:#0d1630;--frame-sh:#070d1f;--well:#0a1024;--tile:#2d4372;--tile-ink:#f4f7ff;--tile-sh:rgba(0,0,0,.3);--ok:#8ee69c;--mix:45%}
[data-theme="forest"]{--page:#1d5236;--bar:rgba(0,0,0,.22);--line:rgba(255,255,255,.08);--ink:#eaf7ee;--soft:#cfe8d7;--accent:#ffd66b;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--undo-bg:rgba(0,0,0,.25);--frame:#12391f;--frame-sh:#0a2513;--well:#0b2416;--tile:#eef6e8;--tile-ink:#1b4a30;--tile-sh:rgba(0,0,0,.2);--ok:#2f9a4c;--mix:26%}
[data-theme="contrast"]{--page:#000;--bar:#000;--line:#555;--ink:#fff;--soft:#fff;--accent:#ffff00;--chip:#262626;--chip-line:#777;--undo-bg:#222;--frame:#555;--frame-sh:#333;--well:#000;--tile:#000;--tile-ink:#fff;--tile-sh:transparent;--ok:#ffff00;--mix:0%}

/* ---------- Base ---------- */
:root{--gut:12px} /* one side margin: top-bar buttons, the board frame and the bottom buttons line up */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
/* rule: 100dvh + safe areas, the board is sized from the room that is left (see layout()) */
#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Top bar (rule: home, Nová hra, <h1> name, ?, settings; touch targets ≥ 45 px) ---------- */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;color:var(--ink);overflow-wrap:normal;word-break:normal;white-space:normal} /* a long name wraps to two lines between words, never inside one (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);text-decoration:none}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:6px}
.topbar:has(#btnHome:not([hidden])) .pill{padding:0 12px}
.topbar:has(#btnHome:not([hidden])) .top-right{gap:6px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:19px}
/* narrow phones (360 px): less gap and a slimmer Nová hra pill, so the name keeps whole words; the outer margin stays --gut */
@media (max-width:380px){
  /* "Patnáctka" is one long word: the tightest gaps, so it never reaches under the ? button */
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:3px}
  .top-right,.topbar:has(#btnHome:not([hidden])) .top-right{gap:3px}
  .pill,.topbar:has(#btnHome:not([hidden])) .pill{padding:0 6px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px;letter-spacing:-.01em}
}

/* ---------- Score row (rule: info goes on its own row, not in place of the name) ---------- */
.stats{flex:none;text-align:center;padding:10px 12px 0;font-size:20px;font-weight:700;color:var(--soft)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- GAME: board ---------- */
#board{flex:1;min-height:0;display:grid;place-items:center;padding:12px var(--gut)} /* 12 px from the score row and the tray too; layout() sizes the frame inside this padding */
#frame{position:relative;padding:var(--fp);background:var(--frame);border-radius:calc(var(--fp) * 1.6);box-shadow:inset 0 -4px 0 var(--frame-sh),0 6px 16px rgba(0,0,0,.25)}
#well{position:relative;background:var(--well);border-radius:calc(var(--cs) * .14)}
/* a numbered tile: absolutely placed, moved with transform so it slides */
.pc{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);border-radius:12%;background:var(--tile);color:var(--tile-ink);
  font:700 calc(var(--cs) * var(--f)) Georgia,"Times New Roman",serif;line-height:1;display:grid;place-items:center;font-variant-numeric:lining-nums;
  box-shadow:inset 0 calc(var(--cs) * -.06) 0 var(--tile-sh),0 2px 3px rgba(0,0,0,.3);transition:transform .14s ease-out;will-change:transform}
.pc span{pointer-events:none}
.noanim .pc{transition:none}
/* Barevné řady: the tile is tinted by the row it belongs to */
.rows .pc{background:color-mix(in srgb,var(--rc) var(--mix),var(--tile))}
[data-theme="contrast"] .pc{box-shadow:inset 0 0 0 3px #fff}
[data-theme="contrast"] .rows .pc{background:#000;box-shadow:inset 0 0 0 max(4px,calc(var(--cs) * .08)) var(--rc)}
/* a tile on its place gets a tick in the corner */
.marks .pc.ok::after{content:"";position:absolute;right:8%;top:5%;width:11%;height:19%;border:solid var(--ok);border-width:0 max(3px,calc(var(--cs) * .055)) max(3px,calc(var(--cs) * .055)) 0;transform:rotate(45deg)}
.hole{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);border-radius:12%}
.hole.pulse{animation:pulse .45s ease-out 2}
@keyframes pulse{50%{box-shadow:inset 0 0 0 5px var(--accent)}}
.won .pc{animation:glow .7s ease-out 2}
@keyframes glow{50%{filter:brightness(1.25) drop-shadow(0 0 6px var(--accent))}}
/* "Ukázat cíl": the finished board over the game */
.goalview{position:absolute;inset:0;z-index:3;background:var(--well);border-radius:inherit}
.goalview .pc{transition:none}

/* ---------- Bottom buttons ---------- */
.tray{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px var(--gut) 12px;background:var(--bar);border-top:1px solid var(--line)}
#hint{text-align:center;font-size:19px;line-height:1.3;color:var(--soft);min-height:25px}
.row{display:flex;gap:10px}
.undo{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:8px;height:64px;border-radius:16px;font-size:21px;font-weight:800;color:var(--ink);background:var(--undo-bg);box-shadow:inset 0 0 0 2px var(--chip-line)}
.undo svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.undo[aria-pressed="true"]{background:var(--accent);color:var(--page);box-shadow:none}
/* rule: an unavailable action is only dimmed and explains itself when tapped */
.undo.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */

/* a small board for the theme swatches and the help */
.mini{--m:22px;display:inline-grid;grid-template-columns:repeat(var(--mn,3),var(--m));gap:3px;padding:3px;background:var(--well);border:4px solid var(--frame);border-radius:8px}
.mini i{width:var(--m);height:var(--m);border-radius:18%;background:var(--tile);color:var(--tile-ink);display:grid;place-items:center;font:700 calc(var(--m) * .6) Georgia,"Times New Roman",serif;font-style:normal}
.mini.rows i{background:color-mix(in srgb,var(--rc) var(--mix),var(--tile))}
[data-theme="contrast"] .mini i{box-shadow:inset 0 0 0 2px #fff}
[data-theme="contrast"] .mini.rows i{background:#000;box-shadow:inset 0 0 0 3px var(--rc)}
.mini i.e{background:none;box-shadow:none}

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
/* rule: the head with Zpět and the game name stays at the top while scrolling */
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);margin-top:16px}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{font-size:18px;color:var(--psoft);line-height:1.3}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.topt{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.topt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{height:104px;border-radius:10px;background:var(--page);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);display:grid;place-items:center}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.help p,.help li{font-size:20px;line-height:1.45}
.help ol{padding-left:26px}
.help li{margin:10px 0}
.demo{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 4px;padding:10px;border-radius:12px;background:var(--page);font-size:26px;font-weight:800;color:var(--ink)}
.demo .mini{--m:40px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;line-height:1.35;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}

/* Shorter screens (e.g. with the browser bar visible) */
@media (max-height:800px){
  .topbar{height:54px}
  .stats{padding-top:6px}
  .undo{height:58px}
  .tray{gap:6px;padding-bottom:10px}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px Georgia,"Times New Roman",serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
</style>
</head>
<body>
<div id="rotate" class="paper" role="status"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="6" width="20" height="36" rx="4"/><path d="M29 36h6"/><path d="M12 46a22 22 0 0 0 40 0"/><path d="m52 46-1.5 7M52 46l-7 2"/></svg><b>Otoč telefon na výšku</b><span>Hra počká, nic se neztratí.</span></div>
<div id="app">
  <header class="topbar">
    <!-- contract: the home button is hidden and shown only when opened from the launcher (?menu) -->
    <a id="btnHome" class="round" href="../../index.html" aria-label="Zpět na výběr her" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2V20a1 1 0 0 1-1 1H15v-5.5H9V21H4.5a1 1 0 0 1-1-1z"/></svg></a>
    <button id="btnNew" class="pill">Nová hra</button>
    <h1>Patnáctka</h1>

(() => {
'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;

/* ---------- Settings and storage ---------- */
const ID = 'patnactka';                                   // = the folder name
const KEY = `games.${ID}.state`, BADGE = `games.${ID}.inProgress`; // contract: storage key and the "Rozehráno" badge

  { id: 'orange',   name: 'Oranžová',        meta: '#f3e6d2' },
  { id: 'paper',    name: 'Papír',           meta: '#f4ebdf' },
  { id: 'wood',     name: 'Dřevo',           meta: '#e8dcc6' },
  { id: 'night',    name: 'Noc',             meta: '#16233f' },
  { id: 'forest',   name: 'Les',             meta: '#1d5236' },
  { id: 'contrast', name: 'Vysoký kontrast', meta: '#000000' },

const SIZES = [3, 4, 5];
const SIZE_INFO = { 3: ['Osmička', 'Snadná, 8 čísel.'], 4: ['Patnáctka', 'Klasická hračka, 15 čísel.'], 5: ['Čtyřiadvacítka', 'Těžší, 24 čísel.'] };
const SHUFFLES = [
  { id: 'mild',   name: 'Mírné',   desc: 'Jen pár tahů od cíle. Na rozehřátí.' },
  { id: 'medium', name: 'Střední', desc: 'Čísla jsou docela rozházená.' },
  { id: 'full',   name: 'Úplné',   desc: 'Náhodné rozložení jako u skutečné hračky.' },
];
// colour of each target row for "Barevné řady" (row 1 red, 2 yellow, 3 green, 4 blue, 5 violet)
const ROW_HUES = ['#e5483b', '#f2a51f', '#3aa95a', '#2f80d8', '#9a56cf'];
const DEFAULTS = { size: 4, shuffle: 'full', rowColors: true, markOk: true, theme: 'orange', vibrate: true };
const HISTORY = 2000;

/* ---------- GAME LOGIC ---------- */
const rnd = n => { try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); } };

const solved = b => b.every((v, i) => v === (i + 1) % b.length);
const inLine = (n, e, i) => i !== e && ((i / n | 0) === (e / n | 0) || i % n === e % n);
// slide every tile between i and the empty place e one step toward e; i becomes the empty place
function shift(b, n, e, i) {
  const step = (i / n | 0) === (e / n | 0) ? (i > e ? 1 : -1) : (i > e ? n : -n);

}
// a sliding move never changes this: odd n = even inversions; even n = inversions + row of the gap ≡ n - 1 (mod 2)
function solvable(b, n) {
  const t = b.filter(v => v);

  for (let i = 0; i < t.length; i++) for (let j = i + 1; j < t.length; j++) if (t[i] > t[j]) inv++;

}
function neighbours(n, e) {

}
function makeBoard(n, level) {

      if (!solvable(b, n)) { const t = b.map((v, i) => v ? i : -1).filter(i => i >= 0); [b[t[0]], b[t[1]]] = [b[t[1]], b[t[0]]]; }
    } else {
      // a random walk of the empty place from the solved board, never straight back

/* ---------- State ---------- */
// bests[rulesKey] = the fewest moves for that size and shuffle

    if (!ok) g.history = [];
    if (!Number.isInteger(g.moves) || g.moves < g.history.length) g.moves = g.history.length;

}
function normalize(s) {
  if (!SIZES.includes(+s.size)) s.size = DEFAULTS.size; else s.size = +s.size;
  if (!SHUFFLES.some(x => x.id === s.shuffle)) s.shuffle = DEFAULTS.shuffle;
  if (!THEMES.some(t => t.id === s.theme)) s.theme = DEFAULTS.theme;

}

/* ---------- Helpers ---------- */

}

}

/* ---------- "Ukázat cíl" ---------- */
let goalShown = false;
function fillGoal() {
  const n = G.n;

  $('#goalview').innerHTML = html;
}
function showGoal() {

}

}
$('#btnGoal').addEventListener('click', () => { buzz(8); goalShown ? hideGoal() : showGoal(); });

/* ---------- Moving ---------- */
function pulseHole() {

}
function tryMove(i) {

  if (i === e) { pulseHole(); toast('Ťukni na číslo vedle prázdného místa'); return; }
  if (!inLine(n, e, i)) { pulseHole(); toast('Posunout jde číslo ve stejném řádku nebo sloupci jako prázdné místo'); return; }

    const g0 = G;
    whenFree(g0, 900, () => {
      if (G.status !== 'won') return;

}

/* ---------- Controls ---------- */
$('#well').addEventListener('click', e => {
  if (goalShown) { hideGoal(); return; }

$('#board').addEventListener('click', e => { if (goalShown && !e.target.closest('#well')) hideGoal(); });
// while the goal is shown, Zpět only closes it (like a tap on the board), it does not take a move back too
$('#btnUndo').addEventListener('click', () => { if (goalShown) { hideGoal(); return; } undo(); });
// keyboard arrows (desktop): the tile next to the gap moves in the arrow's direction
document.addEventListener('keydown', e => {
  const d = { ArrowUp: [1, 0], ArrowDown: [-1, 0], ArrowLeft: [0, 1], ArrowRight: [0, -1] }[e.key];
  if (!d || !$('#screenSettings').hidden || !$('#screenHelp').hidden || !$('#modal').hidden) return;
  e.preventDefault();

/* ---------- Settings (rule: a separate screen, applied at once, no Save button) ---------- */
const opt = (act, on, title, desc) => `<button class="opt" data-act="${act}" aria-pressed="${on}"><span class="radio"></span><span><b>${title}</b>${desc ? `<span class="d">${desc}</span>` : ''}</span></button>`;
const toggleRow = (key, label) => `<div class="field trow"><div class="flabel">${label}</div><button class="sw" data-act="toggle:${key}" aria-pressed="${S[key]}">${S[key] ? 'Zapnuto' : 'Vypnuto'}</button></div>`;

    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Patnáctka<small>Nastavení</small></h2></div>
    <section class="card"><h3>Hra</h3>
      <div class="field"><div class="flabel">Velikost desky</div>
        ${SIZES.map(n => opt('size:' + n, S.size === n, `${n} × ${n} – ${SIZE_INFO[n][0]}`, SIZE_INFO[n][1])).join('')}
      </div>
      <div class="field"><div class="flabel">Zamíchání</div>
        ${SHUFFLES.map(s => opt('shuffle:' + s.id, S.shuffle === s.id, s.name, s.desc)).join('')}
        <div class="fnote">Každá hra jde vyřešit. Rekord se počítá zvlášť pro každou velikost a zamíchání.</div>
        ${pending}
      </div>
    </section>
    <section class="card"><h3>Pomůcky</h3>
      ${toggleRow('rowColors', 'Barevné řady')}
      <div class="fnote" style="margin-top:-6px">Barva čísla říká, do kterého řádku patří.</div>
      ${toggleRow('markOk', 'Fajfka u čísel na správném místě')}
    </section>
    <section class="card"><h3>Vzhled</h3>
      <div class="tiles">${THEMES.map(t => `<button class="topt" data-act="theme:${t.id}" aria-pressed="${S.theme === t.id}"><span class="swatch" data-theme="${t.id}">${mini(3, [1, 2, 3, 4, 5, 6, 7, 0, 8], S.rowColors)}</span>${t.name}</button>`).join('')}</div>
      ${toggleRow('vibrate', 'Vibrace')}
    </section>
    <button class="big" data-act="close">Zpět ke hře</button>
    <button class="link" data-act="reset">Obnovit výchozí nastavení</button>`;
}
$('#settingsIn').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, arg] = b.dataset.act.split(':');
  if (act === 'close') { closeSettings(); return; }
  if (act === 'size') S.size = +arg;
  else if (act === 'shuffle') S.shuffle = arg;
  else if (act === 'theme') S.theme = arg;
  else if (act === 'toggle') S[arg] = !S[arg];
  else if (act === 'reset') { S = Object.assign({}, DEFAULTS); toast('Nastavení je zase výchozí'); }
  normalize(S); buzz(8); applyLook(); save();
  const y = $('#screenSettings').scrollTop; renderSettings(); $('#screenSettings').scrollTop = y;
});
function openSettings() { hideToast(); hideGoal(); renderSettings(); $('#screenSettings').hidden = false; $('#screenSettings').scrollTop = 0; }
// a change of size or shuffle needs a new game: it starts after returning and says so (rule)
function closeSettings() {
  $('#screenSettings').hidden = true;
  if (rulesChanged()) newGame(!isFresh() ? 'Začala nová hra s novým nastavením' : '');
  else render();
}
$('#btnSettings').addEventListener('click', openSettings);

/* ---------- Help (rule: only behind "?", never opens by itself) ---------- */
function renderHelp() {
  const n = G.n, goal = Array.from({ length: n * n }, (_, i) => (i + 1) % (n * n));
  const th = S.theme, rows = S.rowColors;
  $('#helpIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Patnáctka<small>Jak hrát</small></h2></div>
    <section class="card help"><ol>
      <li>Ťukni na číslo vedle prázdného místa. Číslo se na prázdné místo posune.
        <div class="demo" data-theme="${th}">${mini(3, [1, 2, 3, 4, 0, 5, 7, 8, 6], rows)}<span>→</span>${mini(3, [1, 2, 3, 4, 5, 0, 7, 8, 6], rows)}</div>
        <p style="text-align:center">(ťuknuto na 5)</p></li>
      <li>Ťuknutí na číslo dál ve stejném řádku nebo sloupci posune naráz všechna čísla mezi ním a prázdným místem.</li>
      <li>Seřaď čísla po řádcích od 1 do ${n * n - 1}. Prázdné místo zůstane vpravo dole:
        <div class="demo" data-theme="${th}">${mini(n, goal, rows)}</div></li>
      ${S.rowColors ? '<li>Barva čísla říká, do kterého řádku patří.</li>' : ''}
      ${S.markOk ? '<li>Číslo, které už je na svém místě, má v rohu fajfku.</li>' : ''}
      <li>Rada: slož nejdřív horní řádek, potom levý sloupec. Zbytek je pak menší a snazší. Poslední dvě čísla řádku se skládají spolu.</li>
      <li><b>Zpět</b> vrátí poslední tah, dá se ťukat opakovaně. <b>Ukázat cíl</b> ukáže hotovou desku.</li>
      <li>Každá hra jde vyřešit a nikam se nespěchá.</li>
    </ol></section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
}
function openHelp() { hideToast(); hideGoal(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; }
$('#helpIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenHelp').hidden = true; });
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
// rule: ask for persistent storage so the browser does not delete the saved game by itself
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const saved = load();
const savedSettings = saved && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
if (saved && saved.bests && typeof saved.bests === 'object') {
  for (const n of SIZES) for (const s of SHUFFLES) { const k = rulesKey({ n, shuffle: s.id }); if (okRec(saved.bests[k])) bests[k] = saved.bests[k]; }
}
if (saved && validGame(saved.game)) {
  G = saved.game;
  // closed while Settings were open after a rules change: the new game starts now, as closing Settings would
  if (rulesChanged()) closeSettings(); else render();
}
else newGame();

const relayout = () => layout();
window.addEventListener('resize', relayout);
if (window.visualViewport) visualViewport.addEventListener('resize', relayout);
document.addEventListener('contextmenu', e => e.preventDefault());

// contract: opened from the launcher (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;

// For testing
window.Patnactka = {
  makeBoard, solvable, solved, tryMove, undo,
  setBoard(b) { G.board = b.slice(); G.history = []; G.moves = 0; G.status = solved(G.board) ? 'won' : 'playing'; built = null; save(); render(); },
  get state() { return { S, G, bests }; },
};
})();
</script>
