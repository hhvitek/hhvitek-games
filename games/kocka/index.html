<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>

<style>
/* ---------- Themes: a solid colour; everything below reads these variables (rule) ---------- */
[data-theme="cottage"]{--page:#3b2a1e;--bar:rgba(0,0,0,.2);--line:rgba(255,255,255,.1);--ink:#fff3e3;--soft:#e8d2b4;--accent:#ffc66b;--chip:rgba(255,255,255,.13);--chip-line:rgba(255,255,255,.24);--btn:#ffc66b;--btn-ink:#3a2410;--btn-sh:#a4782f;--undo-bg:rgba(0,0,0,.22);--frame:#24180f;--ok:#ffc66b;--low:#ff8a6b;--it:rgba(255,255,255,.08);--it-on:#ffc66b;--it-on-ink:#3a2410}
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.06);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--accent:#7a4520;--chip:#fff;--chip-line:#e6d8c6;--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--undo-bg:rgba(122,69,32,.1);--frame:#e6d8c6;--ok:#7a4520;--low:#c0392b;--it:#fff;--it-on:#7a4520;--it-on-ink:#fff}

/* ---------- Base ---------- */
:root{--gut:12px} /* one side margin: bar buttons, board and bottom buttons line up (the safe areas are on #app) */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
/* rule: 100dvh + safe areas, the board is sized from the room that is left (see layout()) */
#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Top bar (rule: home, Nová hra, <h1> name, ?, settings) ---------- */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;color:var(--ink);white-space:normal;overflow-wrap:normal;word-break:normal} /* a long name wraps to two lines between words, never inside a word and never cut (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);text-decoration:none}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:8px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:20px}
/* narrow phones (360 px): less room between the bar buttons, so the name fits whole at 18 px; the outer margin stays */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill{padding:0 8px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px;letter-spacing:0}
}

/* ---------- Needs row (rule: info goes on its own row, not in place of the name) ---------- */
#needs{flex:none;display:flex;gap:4px;padding:8px var(--gut) 0}
.need{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:3px 0 5px;border-radius:10px;color:var(--ink)}
.need .kx-icon,.need .ni svg{width:24px;height:24px}
.need .bar{width:78%;max-width:44px;height:6px;border-radius:3px;background:var(--chip);box-shadow:inset 0 0 0 1px var(--chip-line);overflow:hidden}
.need .bar i{display:block;height:100%;border-radius:3px;background:var(--ok);transition:width .4s}
.need.low .bar i{background:var(--low)}
.need.low{color:var(--low)}
.need.want{box-shadow:inset 0 0 0 2px var(--low)}

/* ---------- GAME: the scene (the room is laid out by layout(): room units → px) ---------- */
#scene{flex:1;min-height:0;position:relative;isolation:isolate;margin:12px var(--gut);border-radius:18px;overflow:hidden;touch-action:none;box-shadow:0 0 0 3px var(--frame);background:#a87442}
#scene::before{content:"";position:absolute;inset:0;background:var(--bands,#a87442);filter:var(--bandf,none)}
#world{position:absolute;inset:0}
#world.slideR{animation:kk-slideR .32s ease-out}
#world.slideL{animation:kk-slideL .32s ease-out}
@keyframes kk-slideR{0%{transform:translateX(18%);opacity:.2}100%{transform:none;opacity:1}}
@keyframes kk-slideL{0%{transform:translateX(-18%);opacity:.2}100%{transform:none;opacity:1}}
.nav{position:absolute;top:8px;z-index:35;min-height:48px;max-width:38%;display:flex;align-items:center;gap:4px;padding:6px 8px;border-radius:14px;background:rgba(43,26,14,.72);color:#fff3e3;font-size:15px;font-weight:800;line-height:1.1;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#navL{left:6px}#navR{right:6px}
.nav .ar{font-size:26px;line-height:1}
.nav .nm{writing-mode:horizontal-tb}
.nav .hf svg{display:block;width:32px;height:32px}
.bird{position:absolute;z-index:8;background:center/contain no-repeat;transition:transform 1s ease-in,opacity 1s}
.bird.away{transform:translate(60px,-160px) scale(.5);opacity:0}
.fly{position:absolute;z-index:22;width:22px;height:22px;left:30%;top:58%;animation:kk-fly 9s ease-in-out infinite}
@keyframes kk-fly{0%,100%{transform:translate(0,0) scaleX(1)}25%{transform:translate(90px,-60px) scaleX(.5)}50%{transform:translate(160px,10px) scaleX(1)}75%{transform:translate(60px,40px) scaleX(.5)}}
.ffly{position:absolute;z-index:22;width:6px;height:6px;border-radius:50%;background:#fff6a0;box-shadow:0 0 8px 3px rgba(255,240,120,.7);animation:kk-ffly 3.2s ease-in-out infinite}
@keyframes kk-ffly{0%,100%{opacity:0;transform:translate(0,0)}50%{opacity:1;transform:translate(14px,-18px)}}
.crop.ripe{filter:drop-shadow(0 0 6px rgba(255,236,140,.9))}
@media (prefers-reduced-motion:reduce){#world.slideR,#world.slideL,.fly,.ffly{animation:none}}
#roomBox{position:absolute;left:0;top:0}
#roomBox > svg{position:absolute;inset:0;width:100%;height:100%}
.spot{position:absolute;pointer-events:none}
.tgt{position:absolute;z-index:15;pointer-events:none;border-radius:50%;border:3px dashed rgba(255,247,225,.9);box-shadow:0 0 0 2px rgba(60,30,10,.35);transition:background .15s}
.tgt.hot{background:rgba(255,226,140,.35);border-style:solid}
#cat{position:absolute;left:0;top:0;z-index:20;pointer-events:none;will-change:transform;transform-origin:0 0}
#cat.gone{visibility:hidden}
#catFlip,#catArt{width:100%;height:100%}
#catFlip.flip{transform:scaleX(-1)}
.toy{position:absolute;left:0;top:0;z-index:18;pointer-events:none}
#dot{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:26;pointer-events:none}
#fx{position:absolute;inset:0;z-index:30;pointer-events:none}
#fx .kx-fx{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px}
#bubble{position:absolute;z-index:31;pointer-events:none;transform:translate(-50%,-100%);background:#fffaf0;color:#2b1a0e;border:2px solid #2e2118;border-radius:14px;padding:4px 10px;font-size:17px;font-weight:800;white-space:nowrap;transition:opacity .25s}
#bubble .kx-icon{width:24px;height:24px;vertical-align:-6px}
#bubble.hide{opacity:0}
#ghost{position:fixed;left:0;top:0;width:70px;height:70px;margin:-56px 0 0 -35px;z-index:50;pointer-events:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.35))}

/* ---------- Bottom: hint and the item tray ---------- */
.tray{flex:none;display:flex;flex-direction:column;gap:6px;padding:6px var(--gut) 10px;background:var(--bar);border-top:1px solid var(--line);touch-action:none}
.hintrow{display:flex;align-items:center;gap:8px;height:44px}
#hint{flex:1;min-width:0;text-align:center;font-size:17px;line-height:1.25;color:var(--soft);max-height:44px;overflow:hidden}
#hint b{color:var(--ink)}
#btnVet{height:42px;padding:0 14px;display:flex;align-items:center;gap:6px;background:var(--low);color:#fff;box-shadow:none;font-size:17px}
#btnVet .kx-icon{width:22px;height:22px}
.items{display:flex;gap:6px}
.it{flex:1 1 0;min-width:0;height:56px;border-radius:14px;background:var(--it);box-shadow:inset 0 0 0 2px var(--chip-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12.5px;font-weight:700;line-height:1.1;color:var(--ink);touch-action:none}
.it{position:relative}
.it[data-count]::after{content:attr(data-count);position:absolute;top:3px;right:4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:var(--btn-ink);font-size:12.5px;line-height:20px;font-weight:800}
.it .ic{width:36px;height:34px;display:grid;place-items:center}
.it .ic svg{width:100%;height:100%}
.it .ic .kx-icon,.it .ic .kx-face{width:30px;height:30px}
.it .lb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.it.lift{opacity:.35}
.it.away .ic{opacity:.3}
.it.on{background:var(--it-on);color:var(--it-on-ink);box-shadow:none}
.it.listen{background:var(--it-on);color:var(--it-on-ink);box-shadow:inset 0 0 0 calc(var(--lv,0) * 12px) rgba(255,255,255,.45)}
.pill.new::after{content:"";display:inline-block;width:10px;height:10px;margin-left:6px;border-radius:50%;background:var(--low);vertical-align:2px}
@media (max-height:700px){
  .it{height:50px}
  .it .ic{height:28px}
  #hint{font-size:16px}
}
.name{width:100%;height:52px;border-radius:14px;border:3px solid var(--pline);background:var(--popt);color:var(--pink);font:inherit;font-size:20px;padding:0 14px}

/* ---------- Help, Deníček and the vet (paper screens) ---------- */
.hrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:2px solid var(--pline)}
.card h3 + .hrow{border-top:0}
.hpic{flex:none;position:relative;width:96px;height:96px;border-radius:14px;background:#ead7b6;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.hpic > svg{width:100%;height:100%}
.hpic.two > svg{width:50%;height:60%;align-self:center}
.hpic .ov{position:absolute;inset:0;width:100%;height:100%}
.hrow p{font-size:18px;line-height:1.4}
.hrow p b{display:block;font-size:19px;margin-bottom:2px}
.nlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.nlist span{display:flex;align-items:center;gap:8px;font-size:18px}
.nlist .kx-icon{width:26px;height:26px;color:var(--pbtn)}
.stat{display:flex;align-items:center;gap:10px;font-size:19px;padding:8px 0}
.stat .kx-icon{flex:none;width:28px;height:28px;color:var(--pbtn)}
.stat b{margin-left:auto}
.prog{height:12px;border-radius:6px;background:var(--psw);overflow:hidden;margin:2px 0 6px}
.prog i{display:block;height:100%;background:var(--pbtn)}
.entries{list-style:none}
.entries li{display:flex;gap:12px;padding:12px 0;border-top:2px solid var(--pline);font-size:18px;line-height:1.4}
.entries li:first-child{border-top:0}
.entries .mk{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--pbtn);color:var(--pbtn-ink);font-weight:800}
.entries .mk .kx-icon{width:20px;height:20px}
.entries .q{color:var(--psoft)}
.entries .q .mk{background:var(--psw);color:var(--psoft)}
.entries small{display:block;color:var(--psoft);font-size:16px}
.cards{display:grid;gap:12px}
.cards figure{display:flex;gap:12px;align-items:center}
.cards .thumb{flex:none;width:110px;height:80px;background:center/cover no-repeat;border-radius:10px}
.cards b{display:block;font-size:17px}
.cards small{display:block;font-size:15px;color:var(--psoft)}
#btnCtx{height:42px;padding:0 14px;background:var(--accent);color:var(--btn-ink);box-shadow:none;font-size:17px}
.vetpic{position:relative;height:150px;border-radius:14px;overflow:hidden;margin-top:8px}
.vetpic > svg{position:absolute;inset:0;width:100%;height:100%}
.vetpic .koxa{position:absolute;left:50%;bottom:4px;width:150px;height:150px;transform:translateX(-50%)}
#pillGame{position:relative;height:min(52vh,340px);border-radius:16px;overflow:hidden;margin-top:12px;touch-action:none;background:#dcebe5}
#pillGame > svg{position:absolute;inset:0;width:100%;height:100%}
#pgCat{position:absolute;left:0;top:0;width:200px;height:200px}
#pgCat svg{width:100%;height:100%}
#pgPill{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px}
#pgTime{position:absolute;left:12px;right:12px;top:12px;height:12px;border-radius:6px;background:rgba(255,255,255,.7);overflow:hidden}
#pgTime i{display:block;height:100%;background:var(--pbtn)}
#pgMsg{position:absolute;left:12px;right:12px;top:32px;text-align:center;font-size:18px;font-weight:800;color:#2b1a0e;text-shadow:0 0 6px #fff}

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
/* rule: the head with Zpět and the game name stays at the top while scrolling */
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);margin-top:16px}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{font-size:18px;color:var(--psoft);line-height:1.3}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{height:56px;border-radius:10px;background:var(--page);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.help p,.help li{font-size:20px;line-height:1.45}
.help ol{padding-left:26px}
.help li{margin:10px 0}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
#toast{position:fixed;left:50%;top:var(--toast-t,140px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;line-height:1.35;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px Georgia,"Times New Roman",serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}

/* ---------- Phase 3 + 5 ---------- */
#btnMore .ic svg{width:26px;height:26px}
.gaming .items{display:none!important}
.gaming #btnCam,.gaming .nav{display:none!important}
.cam{position:absolute;right:8px;bottom:8px;z-index:35;width:46px;height:46px;border-radius:50%;background:rgba(43,26,14,.6);color:#fff3e3;display:grid;place-items:center}
.cam svg{width:26px;height:26px}
#flash{position:absolute;inset:0;z-index:40;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:kk-flash .45s ease-out}
@keyframes kk-flash{0%{opacity:.95}100%{opacity:0}}
#hud{position:absolute;left:8px;right:8px;top:8px;z-index:36;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:rgba(43,26,14,.72);color:#fff3e3;font-size:17px}
#hudTime{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
#hudTime i{display:block;height:100%;background:#ffc66b}
#game{position:absolute;inset:0;z-index:21;pointer-events:none}
.gobj{position:absolute}
.gobj svg{width:100%;height:100%}
.gobj.glow{filter:drop-shadow(0 0 8px rgba(255,236,120,.95))}
.gobj.jump{animation:kk-jump .9s ease-out}
@keyframes kk-jump{0%{transform:translateY(40px) scale(.6)}60%{transform:translateY(-14px)}100%{transform:none}}
.gline{position:absolute;overflow:visible}
.bobber{position:absolute;width:32px;height:32px;margin:-16px 0 0 -6px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff 0 35%,#e0473a 36%);border:3px solid #2e2118;z-index:2}
.splash{position:absolute;width:34px;height:34px;margin:-17px 0 0 -7px;border-radius:50%;border:3px solid #fff;animation:kk-splash .6s ease-out infinite}
@keyframes kk-splash{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.4);opacity:0}}
.bang{position:absolute;margin-left:-8px;font-size:34px;font-weight:900;color:#ffd04a;-webkit-text-stroke:2px #2e2118;animation:kk-bob .25s ease-in-out infinite}
.bobber.bite{animation:kk-bob .25s ease-in-out infinite}
@keyframes kk-bob{50%{transform:translateY(7px)}}
.furn{position:absolute;pointer-events:none}
.furn svg{width:100%;height:100%}
.gaming ~ * .furn{}
#visitor{position:absolute;z-index:17;pointer-events:none}
#visitor svg{width:100%;height:100%}
#btnCtx2{height:42px;padding:0 14px;box-shadow:none;font-size:17px}
.shoppic{position:relative;height:150px;border-radius:14px;overflow:hidden;margin-top:12px}
.shoppic > svg{position:absolute;inset:0;width:100%;height:100%}
.srow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px solid var(--pline)}
.card h3 + .srow{border-top:0}
.sic{flex:none;width:52px;height:52px}
.sic svg{width:100%;height:100%}
.snm{flex:1;min-width:0}
.snm b{display:block;font-size:18px}
.snm small{display:block;font-size:16px;color:var(--psoft)}
.buy{flex:none;min-width:84px;height:46px;padding:0 12px;border-radius:23px;background:var(--pbtn);color:var(--pbtn-ink);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 3px 0 var(--pbtn-sh)}
.buy .kx-icon,.own .kx-icon{width:20px;height:20px}
.buy.dim{background:transparent;color:var(--pink);box-shadow:none;outline:2px dashed var(--psoft);outline-offset:-2px}
.own{flex:none;font-size:16px;font-weight:700;color:var(--psoft);display:flex;align-items:center;gap:4px}
.srow.lock{opacity:.7}
.hearts{color:#c0392b;font-size:22px;letter-spacing:2px}
.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ph{position:relative;margin:0}
.ph > svg{position:relative;display:block;width:100%;height:auto;aspect-ratio:200/236}
.ph-in{position:absolute;left:6%;top:5.08%;width:88%;height:74.58%;overflow:hidden;background:#ead7b6}
.ph-in > svg{position:absolute;inset:0;width:100%;height:100%}
.ph-cat{position:absolute;left:18%;bottom:2%;width:64%;aspect-ratio:1}
.ph-cat.lap{left:-5%;bottom:-6%;width:110%}
.ph-vis{position:absolute;right:-4%;bottom:4%;width:42%;aspect-ratio:1}
.ph-cat svg,.ph-vis svg{width:100%;height:100%}
.ph figcaption{position:absolute;left:6%;right:6%;bottom:3%;display:flex;align-items:center;justify-content:space-between;font-size:14px;color:#6f5a48}
.del{width:34px;height:34px;border-radius:50%;background:var(--psw);color:var(--pink);font-size:16px;font-weight:800}
.pcards{display:grid;gap:14px}
.pc{position:relative;margin:0}
.pc > svg{position:relative;display:block;width:100%;height:auto;aspect-ratio:300/200}
.pc-in{position:absolute;left:4%;top:6%;width:92%;height:79%;background:center/cover no-repeat}
.pc figcaption{font-size:14px;color:var(--psoft);margin-top:4px}
</style>
</head>
<body>
<div id="rotate" class="paper" role="status"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="6" width="20" height="36" rx="4"/><path d="M29 36h6"/><path d="M12 46a22 22 0 0 0 40 0"/><path d="m52 46-1.5 7M52 46l-7 2"/></svg><b>Otoč telefon na výšku</b><span>Hra počká, nic se neztratí.</span></div>
<div id="app">
  <header class="topbar">
    <!-- contract: the home button is hidden and shown only when opened from the launcher (?menu) -->
    <a id="btnHome" class="round" href="../../index.html" aria-label="Zpět na výběr her" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2V20a1 1 0 0 1-1 1H15v-5.5H9V21H4.5a1 1 0 0 1-1-1z"/></svg></a>
    <button id="btnDiary" class="pill">Deníček</button>
    <h1>Kočka</h1>
    <div class="top-right">
      <button id="btnHelp" class="round" aria-label="Jak hrát">?</button>
      <button id="btnSettings" class="round" aria-label="Nastavení"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M9.79 5.57L10.31 3.06A9.1 9.1 0 0 1 13.69 3.06L14.21 5.57A6.8 6.8 0 0 1 16.46 6.87L18.9 6.07A9.1 9.1 0 0 1 20.59 8.99L18.67 10.7A6.8 6.8 0 0 1 18.67 13.3L20.59 15.01A9.1 9.1 0 0 1 18.9 17.93L16.46 17.13A6.8 6.8 0 0 1 14.21 18.43L13.69 20.94A9.1 9.1 0 0 1 10.31 20.94L9.79 18.43A6.8 6.8 0 0 1 7.54 17.13L5.1 17.93A9.1 9.1 0 0 1 3.41 15.01L5.33 13.3A6.8 6.8 0 0 1 5.33 10.7L3.41 8.99A9.1 9.1 0 0 1 5.1 6.07L7.54 6.87A6.8 6.8 0 0 1 9.79 5.57ZM12 8.9a3.1 3.1 0 1 0 0 6.2a3.1 3.1 0 1 0 0 -6.2z"/></svg></button>
    </div>
  </header>
  <div id="needs" data-no-gesture></div>
  <main id="scene" aria-label="Pokoj"><div id="world"><div id="roomBox"></div><div id="spots"></div><div id="life"></div><div id="toys"></div>
    <div id="cat"><div id="catFlip"><div id="catArt"></div></div></div>
    <div id="furniture"></div><div id="visitor" hidden></div><div id="game"></div><div id="dot" hidden></div><div id="fx"></div><div id="bubble" class="hide"></div></div>
    <div id="flash" hidden></div><div id="hud" hidden><b id="hudScore"></b><span id="hudTime"><i></i></span></div><button id="btnCam" class="cam" data-no-gesture aria-label="Vyfotit"></button><button class="nav" id="navL" data-no-gesture hidden></button><button class="nav" id="navR" data-no-gesture hidden></button></main>
  <footer class="tray" id="tray">
    <div class="hintrow"><div id="hint" aria-live="polite"></div><button id="btnCtx2" class="pill alt" data-no-gesture hidden></button><button id="btnCtx" class="pill" data-no-gesture hidden></button><button id="btnVet" class="pill" data-no-gesture hidden></button></div>
    <div class="items" id="care"></div>
    <div class="items" id="furn" hidden></div>
    <div class="items" id="play"></div>
  </footer>
</div>

<script>
/* ---------- Cat art ---------- */
// Kočka: all the drawing of Koxa (the user's black tortoiseshell cat), her places and the items. Pure SVG strings + CSS.
// One global factory; nothing touches the DOM. Copied into games/kocka/index.html by tools/kocka-dev/assemble.js.
//
// API of KockaArt():
//   css                      keyframes and classes (blink, ear twitch, tail sway by mood, sleep breathing, purr shiver,
//                            sneeze, wriggle, Zzz, fleas, gait, weather); prefers-reduced-motion turns it off. Inject once.
//   cat(pose, opts)          <svg class="koxa"> viewBox 0 0 200 200, the cat stands on y≈186 (centre x 100; see anchors).
//                            opts = { mood: 'happy'|'calm'|'grumpy'|'sad', thin, chubby, ill: null|'fleas'|'tummy'|'cold',
//                            ears: 'up'|'back'|'turned', purring, asleep, meow, openMouth, wet, noProp } (a mood string
//                            works as opts too). Poses (side views face left: flip the box with scaleX(-1)):
//                            sit, loaf, sleep, stretch, pounce (toys only), eat, drink, groom, sulk (back turned), belly,
//                            carried, wriggle, window (from behind), walk and trot (legs swing by CSS; the step time is
//                            the CSS variable --kx-step on any ancestor: walk .8s, trot .42s by default), walk1..walk4
//                            (still frames a quarter step apart), crouch → jumpUp → jumpDown (up to and down from the
//                            sill, chair, counter, lap), climb (on the trunk), onBranch, stalk, shakePaw, and the bigger
//                            lap poses lapLoaf, lapCurl (dozing), lapBelly.
//   poses                    the list of pose names.
//   anchors                  { pose: [x, y] } for poses that do not stand on (100, 186): put that point on the spot.
//   regions(pose, opts)      [{ id, path, fur: [dx, dy] }] in the cat's 0..200 viewBox, ids from
//                            'chin'|'tail'|'paws'|'head'|'ears'|'tailBase'|'belly'|'back' (tailBase = kořen ocasu,
//                            the back just in front of the tail root, in every pose that has 'back'). The list is in
//                            hit-test order: the first region whose path contains the point wins (chin before head, head
//                            before ears, so 'ears' is only the visible ear above the head plus a small margin). Paths
//                            may hold several subpaths (both ears, every paw): use the nonzero rule. `fur` is the unit
//                            vector of stroking along the fur (head → tail; on the head from the forehead over the top,
//                            on the chin and throat downwards). Pass the same opts as cat() (the tail follows the mood).
//   mouth(pose, opts)        {x, y} of her mouth in the cat's viewBox, or null when she faces away.
//   room(o) / room(phase, season)  <svg> viewBox 0 0 400 600, preserveAspectRatio xMidYMid slice.
//                            o = { id: 'living'|'kitchen'|'hall'|'garden', phase: 'morning'|'day'|'evening'|'night',
//                            season: 'spring'|'summer'|'autumn'|'winter', sunX: 0..1, holiday: null | id | [ids],
//                            flap: bool (cat flap in the hall door), weather: null|'rain'|'snow' }. Holiday ids: advent,
//                            mikulas, vanoce, silvestr, masopust, velikonoce, carodejnice, dusicky, narozeniny.
//   rooms                    { id: { name (Czech), spots: { name: {x, y} } } } for the four places (room coordinates,
//                            where an item or Koxa stands): living (Obývák: rug, bed, window, chair = armchair seat, sun),
//                            kitchen (Kuchyně: bowl, water, counter, window), hall (Předsíň: litter, door, shoe, mat),
//                            garden (Zahrada: door, gate, tree, branch, branch2, bench, feeder, yard, bed1..bed4).
//   spots                    the old single-room spots { bowl, water, litter, bed, window, door }, kept for old code.
//   sunPatch(sunX)           {x, y}: the middle of the living-room sun patch on the floor (x 95…235), for a sun nap.
//   lap({ phase, season, place: 'chair'|'bench' })  the lap close-up (400×600, slice); lapSpot = { x, y, size }: her
//                            box is size × size, its point (100, 186) at (x, y).
//   crop(name, stage 0..3)   a plant in a bed (viewBox 0 0 100 100, standing on y≈90); crops = names (plant, radish,
//                            carrot, strawberry, tomato, catnip); cropSlot = where a produce drawing can sit on 'plant'.
//   item(name), itemHeld(name)  <svg class="kx-item"> viewBox 0 0 100 100, standing on y≈90; items = the names.
//   icon(name), fx(name), face(mood), vet(), vetSpots  UI icons (24×24, currentColor), effects, the small head, the vet.
//   Tricks and more poses: trickSit, trickPaw (dej pac), trickSpin (turns round by CSS), trickBeg (panáček), inBox, onFence.
//   itemSize[name] = { w, h }  the item's 100 × 100 box in room units; itemPoints: rod / wand tip, cat-tree platforms.
//   mouseHole(), mousePeek(phase 0..1), fish(kind) (fishes: goldfish, carp, perch), marker(done)  minigame pieces.
//   shop(), shopSpots       Obchůdek (400×600 slice) and where goods go on the counter.
//   postcardFrame(caption), postcardHole (viewBox 300×200), photoFrame(), photoHole (200×236)  frames over a photo.
//   neighbour(id, pose, opts), neighbours = { id: { name } }  the visitors (mourek, liza, bivoj, ciperka, pacicka,
//                            rambo, sedivka, fousek) in any pose; usually sit, walk, loaf, onFence (rooms.garden.spots.fence).
function KockaArt() {
  'use strict';
  const C = {
    fur: '#1d1916', fur2: '#28211c', edge: '#54463c', ol: '#f1e2c4',
    patch: '#77441f', patch2: '#b8722f', blaze: '#c98c42',
    eye: '#c8d24a', pupil: '#0e0b09', earIn: '#6e4a40', nose: '#c47c72',
    lid: '#ecdcbf', tongue: '#e48880', bean: '#cf8a80', blush: '#e2836f',
  };
  const KOXA_C = Object.assign({}, C);
  let COAT = { pattern: 'tortie', blaze: true };   // Koxa; withCoat() swaps it for a neighbour cat
  const OLW = 5;                       // outline stroke (half of it shows outside the silhouette)
  const MOODS = ['happy', 'calm', 'grumpy', 'sad'];
  const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100;
  let uid = 0;
  // ids unique in the page even when several KockaArt() instances draw into one document
  const tag = 'kx' + Math.floor(Math.random() * 46656).toString(36) + '_';
  const nid = () => tag + (++uid).toString(36);

  /* ---------- geometry ---------- */
  // a cubic path from a flat list [x0, y0, c1x, c1y, c2x, c2y, x1, y1, …]
  function cub(p) { let d = `M${p[0]} ${p[1]}`; for (let i = 2; i + 6 <= p.length; i += 6) d += 'C' + p.slice(i, i + 6).join(' '); return d; }
  const line = (x0, y0, x1, y1) => [x0, y0, x0 + (x1 - x0) / 3, y0 + (y1 - y0) / 3, x0 + 2 * (x1 - x0) / 3, y0 + 2 * (y1 - y0) / 3, x1, y1];
  const ell = (cx, cy, rx, ry) => `M${cx - rx} ${cy}a${rx} ${ry} 0 1 0 ${2 * rx} 0a${rx} ${ry} 0 1 0 ${-2 * rx} 0Z`;
  const poly = pts => 'M' + pts.map(q => r1(q[0]) + ' ' + r1(q[1])).join('L') + 'Z';
  const unit = (dx, dy) => { const l = Math.hypot(dx, dy) || 1; return [r2(dx / l), r2(dy / l)]; };
  function sample(p, n = 6) {
    const out = [[p[0], p[1]]];
    for (let i = 2; i + 6 <= p.length; i += 6) {
      const x0 = p[i - 2], y0 = p[i - 1];
      for (let k = 1; k <= n; k++) {
        const t = k / n, u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
        out.push([a * x0 + b * p[i] + c * p[i + 2] + d * p[i + 4], a * y0 + b * p[i + 1] + c * p[i + 3] + d * p[i + 5]]);
      }
    }
    return out;
  }
  // the area of a stroke of width w along a cubic list, as a polygon (for regions)
  function ribbon(p, w) {
    const s = sample(p), L = [], R = [];
    s.forEach((q, i) => {
      const a = s[Math.max(0, i - 1)], b = s[Math.min(s.length - 1, i + 1)], [dx, dy] = unit(b[0] - a[0], b[1] - a[1]);
      L.push([q[0] - dy * w / 2, q[1] + dx * w / 2]); R.push([q[0] + dy * w / 2, q[1] - dx * w / 2]);
    });
    return poly(L.concat(R.reverse()));
  }
  function ellPoly(cx, cy, rx, ry, rot = 0) {
    const a = rot * Math.PI / 180, pts = [];
    for (let i = 0; i < 18; i++) { const t = i / 18 * 2 * Math.PI, x = Math.cos(t) * rx, y = Math.sin(t) * ry; pts.push([cx + x * Math.cos(a) - y * Math.sin(a), cy + x * Math.sin(a) + y * Math.cos(a)]); }
    return poly(pts);
  }
  // an irregular soft blob (tortie mottling), deterministic from its seed
  function blob(cx, cy, r, seed) {
    let s = (Math.round(seed) * 7919 + 13) % 233280;
    const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280, n = 9, pts = [];
    const rot = rnd() * Math.PI, ca = Math.cos(rot), sa = Math.sin(rot);
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2, rr = r * (0.5 + 0.7 * rnd()), x = Math.cos(a) * rr * 1.25, y = Math.sin(a) * rr * 0.7;
      pts.push([cx + x * ca - y * sa, cy + x * sa + y * ca]);
    }
    let d = '';
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n], z = pts[n - 1];
      if (!i) d += `M${r1((z[0] + a[0]) / 2)} ${r1((z[1] + a[1]) / 2)}`;
      d += `Q${r1(a[0])} ${r1(a[1])} ${r1((a[0] + b[0]) / 2)} ${r1((a[1] + b[1]) / 2)}`;
    }
    return d + 'Z';
  }
  // [x, y, r, kind] → tortie mottling: a dark ginger patch, kind 1 with a brighter core
  const spots = list => COAT.pattern === 'none' ? '' : COAT.pattern === 'tabby' ? tabby() : list.map(([x, y, r, c], i) => {
    const sd = i * 31 + x * 3 + y;
    return `<path d="${blob(x, y, r, sd)}" fill="${C.patch}"/>` + (c ? `<path d="${blob(x + r * 0.2, y - r * 0.15, r * 0.5, sd + 5)}" fill="${C.patch2}"/>` : '');
  }).join('');

  // tabby stripes for a neighbour's coat (in the part's own frame, clipped to it like the patches)
  function tabby() {
    const id = nid();
    return `<defs><pattern id="${id}" width="10" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(8)"><path d="M3 0Q6.5 10 3 20T3 40" stroke="${C.patch}" stroke-width="3.6" fill="none"/></pattern></defs><rect x="-400" y="-400" width="1000" height="1000" fill="url(#${id})"/>`;
  }

  /* ---------- rig ---------- */
  // Two layers: every part's cream outline first (one sticker-like outline around the whole silhouette, so the black
  // cat never vanishes on a dark page), then the fills and details. Animated groups are opened in both layers with
  // the same class, so their animations stay in step.
  function Rig(o) {
    const R = { ol: [], fi: [], top: [], defs: [], reg: [], o, wrap: null, shadow: [100, 186, 60, 5] };
    R.open = (tf, cls, ox = 0, oy = 0) => {
      const g = (tf ? `<g transform="${tf}">` : '<g>') + (cls ? `<g class="${cls}" style="transform-origin:${ox}px ${oy}px">` : '<g>');
      R.ol.push(g); R.fi.push(g);
    };

  /* ---------- gait: walk, trot, jumps (side view, facing left; flip the box with scaleX(-1) to go right) ---------- */

  function leg(R, px, py, l1, l2, w, q) {

  /* ---------- places: Obývák, Kuchyně, Předsíň, Zahrada (viewBox 0 0 400 600, preserveAspectRatio xMidYMid slice) ---------- */

    if (hr >= 5 && hr < 10 && !st.day.acted && !st.out && !st.asleep) {   // the first thing in the morning: she woke them
      st.day.acted = true;
      seenQuirk(st, 'wakesEarly', t, ev);
    }
    const sad = nm === 'sad';
    const useStock = k => { if (--st.stock[k] <= 0) delete st.stock[k]; };
    // training treats (small pieces) count half for the tummy rule and not for the weight
    const giveTreat = (stick, training) => {
      wakeUp();
      if (stick) useStock('stick'); else st.pamlsky -= 1;
      if (training) st.day.ttreats++; else st.day.treats++;
      N.food = Math.min(100, N.food + (stick ? 3 : 5)); N.love = Math.min(100, N.love + (stick ? 5 : 3));
      ev.push({ type: 'treat', stick });
      if (st.day.treats + st.day.ttreats / 2 > 12) getIll(st, 'tummy', t, ev);
    };
    const trickRec = tr => st.tricks[tr] || (st.tricks[tr] = { progress: 0, learned: 0, shown: 0, miss: 0 });
    const catnip = () => { N.fun = Math.min(100, N.fun + 60); N.energy = Math.max(0, N.energy - 10); ev.push({ type: 'catnip' }); };
    // a belly rub: welcome with her bellyOk chance, else (and always when grumpy) a playful nip
    const belly = () => {
      wakeUp();
      if (nm !== 'grumpy' && rnd(st) < st.traits.bellyOk) {
        N.love = Math.min(100, N.love + 6 * (sad ? 0.5 : 1) * lapK); ev.push({ type: 'purr', region: 'belly' }); annoy(0.5);
        if (inc(st, 'belly') >= 5) find(st, 'belly', t, ev);
      } else { N.love = Math.max(0, N.love - 1); ev.push({ type: 'bite' }); annoy(2); }
    };
    switch (action) {
      case 'feed': {
        const kind = typeof arg === 'string' && Object.prototype.hasOwnProperty.call(FOODS, arg) ? arg : 'kibble';
        if (N.food > 90) return no(`${name} je sytá.`);
        const price = CHARGE_FOOD ? FOODS[kind].price : 0;
        if (price && !(st.stock[kind] > 0) && st.pamlsky < price) return no(`Na ${FOODS[kind].acc} nemáš dost pamlsků (${price}).`);
        if (price && st.stock[kind] > 0) useStock(kind); else st.pamlsky -= price;
        wakeUp();
        const tummy = st.ill && st.ill.kind === 'tummy', amt = FOODS[kind].gain * (tummy ? 0.5 : 1);
        const gain = Math.min(amt, 100 - N.food), fav = kind === st.traits.favFood;
        N.food += gain; N.love = Math.min(100, N.love + (fav ? 7 : 2));
        ev.push({ type: 'ate', food: kind, gain: Math.round(gain), left: amt - gain > 10, fav });
        if (fav) {
          addBond(st, 1, ev); ev.push({ type: 'purr' });
          if (!tummy && inc(st, 'favFood') >= 3) find(st, 'favFood', t, ev);
        }
        break;
      }
      case 'water': {
        if (N.water >= 95) return no('Miska s vodou je plná.');
        N.water = 100;                           // the jug fills the bowl to the top
        const tap = st.traits.quirk === 'tap' && rnd(st) < 0.5;
        ev.push({ type: 'drank', tap });
        if (tap) seenQuirk(st, 'tap', t, ev);
        break;
      }
      case 'stroke': {
        const region = regionOf(a.region, 'back');
        const dir = a.along === false || a.along === 'against' ? 'against' : a.along === 'sideways' ? 'sideways' : 'along';
        const sp = typeof a.speed === 'number' ? (a.speed < 120 ? 'slow' : a.speed > 900 ? 'fast' : 'good') : ['slow', 'fast'].includes(a.speed) ? a.speed : 'good';
        if (sp === 'slow') break;                // too slow: she does not notice
        const half = sad ? 0.5 : 1;
        if (region === 'belly') { belly(); break; }
        if (st.asleep) { N.love = Math.min(100, N.love + 1); ev.push({ type: 'purr', region, sleeping: true }); seenQuirk(st, 'box', t, ev); break; }
        lapWake();
        if (sp === 'fast' || dir === 'against') { N.love = Math.max(0, N.love - 1); ev.push({ type: 'earsBack', rough: sp === 'fast' }); annoy(1); break; }
        if (dir === 'sideways') { N.love = Math.min(100, N.love + 1 * half); ev.push({ type: 'tolerate', region }); break; }
        const spot = st.traits.spots.includes(region);
        N.love = Math.min(100, N.love + (spot ? 4 : 2) * half * lapK);
        if (onLap) st.lap.pet = t;
        if (spot || nm === 'happy' || (onLap && nm !== 'sad')) ev.push({ type: 'purr', region });
        else if (nm === 'calm' || rnd(st) < 0.3) ev.push({ type: 'content', region });
        else ev.push({ type: 'tolerate', region });
        if (REGIONS[region].spot) { const c = 'spot_' + region; if (inc(st, c) >= 10 && spot) find(st, c, t, ev); }
        break;
      }
      case 'scratch': {
        const region = regionOf(a.region, 'head');
        const sec = typeof a.seconds === 'number' && Number.isFinite(a.seconds) ? clamp(a.seconds, 0, 5) : 1;
        if (region === 'belly') { belly(); break; }
        const per = REGIONS[region].scratch ? 4 : 1, half = sad || st.asleep ? 0.5 : 1;
        lapWake(); if (onLap) st.lap.pet = t;
        N.love = Math.min(100, N.love + per * sec * half * lapK);
        ev.push({ type: 'purr', region, sleeping: st.asleep });
        if (st.asleep) seenQuirk(st, 'box', t, ev);
        if (st.traits.spots.includes(region) && REGIONS[region].scratch) {
          const c = 'spot_' + region; st.cnt[c] = Math.min(CMAX, st.cnt[c] + Math.round(sec));
          if (st.cnt[c] >= 10) find(st, c, t, ev);
        }
        break;
      }
      case 'pickUp': {
        if (sleeping()) return { st, events: ev };
        if (st.held) break;
        if (moodValue(st) >= 10 && N.energy >= 20 && !(st.off && t < st.off.until && !st.off.turned) && st.scared <= t) {
          st.held = true; st.heldAt = t;
          if (t - st.pickAt >= 10 * MIN) { N.love = Math.min(100, N.love + 5); st.pickAt = t; }
          ev.push({ type: 'held' }, { type: 'purr' });
        } else ev.push({ type: 'wriggle' });
        break;
      }
      case 'putDown': {
        if (!st.held) return no(`${name} není v náruči.`);
        st.held = false; st.place = typeof arg === 'string' && arg.length <= 20 ? arg : null;
        ev.push({ type: 'put', place: st.place });
        break;
      }
      case 'play': {
        if (sleeping()) return { st, events: ev };
        const toy = typeof arg === 'string' && Object.prototype.hasOwnProperty.call(TOYS, arg) ? arg : 'mouse';
        if (TOYS[toy].shop && !st.owned[toy]) return no('Tuhle hračku nemáš. Je v obchůdku.');
        if (N.energy < 10) { ev.push({ type: 'ignore', reason: `${name} je moc unavená.` }); break; }
        if (st.scared > t) { ev.push({ type: 'ignore', reason: `${name} se schovává.` }); break; }
        if (sad && rnd(st) < 0.5) { ev.push({ type: 'ignore', reason: `${name} si teď nechce hrát.` }); break; }
        const fav = (TOYS[toy].base || toy) === st.traits.toy;
        let gain = 20 + Math.floor(rnd(st) * 21) + (fav ? 10 : 0) + (TOYS[toy].bonus || 0);
        if (dayPhase(t) === 'evening') gain = Math.round(gain * 1.25);
        N.fun = Math.min(100, N.fun + gain); N.energy = Math.max(0, N.energy - 5);
        ev.push({ type: 'played', toy, gain, fav });
        if (fav && inc(st, 'toy') >= 5) find(st, 'toy', t, ev);
        if (st.traits.quirk === 'socks' && rnd(st) < 0.3) seenQuirk(st, 'socks', t, ev);
        break;
      }
      case 'brush': {
        if (sleeping()) return { st, events: ev };
        if (N.coat >= 98 && !(st.ill && st.ill.kind === 'fleas')) return no(`${name} je krásně učesaná.`);
        const fleas = st.ill && st.ill.kind === 'fleas', gain = Math.min(fleas ? 10 : 25, 100 - N.coat);
        N.coat += gain; N.love = Math.min(100, N.love + 1);
        ev.push(fleas ? { type: 'flea' } : { type: 'brushed', gain });
        break;
      }
      case 'cleanLitter': {
        if (N.litter >= 100) return no('Kočičí záchod je čistý.');
        N.litter = 100; ev.push({ type: 'clean' });
        break;
      }
      case 'letOut': {   // toulky: a walk of 2–8 h beyond the garden gate
        if (st.lvl < WALK_BOND) return no(`Na toulky může ${name} až od přátelství ${LEVELS[WALK_BOND].name} (${LEVELS[WALK_BOND].min}).`);
        if (st.ill) return no(`${name} je nemocná, zůstane doma.`);
        if (st.yard && st.yard.tree) return no(`${name} je na stromě.`);
        if (sleeping()) return { st, events: ev };
        st.held = false; leaveYard(st, ev, null);
        st.out = { since: t, until: t + 2 * HOUR + Math.floor(rnd(st) * 6 * HOUR), walk: true, byPlayer: true };
        ev.push({ type: 'out', until: st.out.until, walk: true });
        break;
      }
      case 'goGarden': {
        if (st.yard) break;
        if (st.ill && st.ill.kind === 'cold') return no(`${name} má rýmu, zůstane doma.`);
        if (sleeping()) return { st, events: ev };
        st.held = false;
        st.yard = { since: t, snow: false, tree: null };
        ev.push({ type: 'garden', weather: weather(t, st) });
        gardenStep(st, t, 0, dayPhase(t) === 'night', ev);    // rain or snow at once
        break;
      }
      case 'goHouse': {
        if (!st.yard) return no(`${name} není na zahradě.`);
        if (st.yard.tree) return no(`${name} je na stromě – zavolej ji, nebo ji sundej.`);
        leaveYard(st, ev, 'house');
        break;
      }
      case 'fetchDown': {
        if (!st.yard || !st.yard.tree) return no(`${name} není na stromě.`);
        st.yard.tree = null; N.love = Math.min(100, N.love + 2);
        ev.push({ type: 'climbDown', by: 'fetch' }, { type: 'purr' });
        break;
      }
      case 'sow': {
        const i = a.bed, crop = a.crop;
        if (!Number.isInteger(i) || i < 0 || i >= BEDS) return no('Takový záhon tu není.');
        if (i >= bedCount(st)) return no(`Další záhony budou od přátelství ${LEVELS[3].name}.`);
        if (typeof crop !== 'string' || !Object.prototype.hasOwnProperty.call(CROPS, crop)) return no('Taková semínka nemáme.');
        if (bedSleeps(t)) return no('Záhony spí pod sněhem.');
        if (st.beds[i]) return no('Na záhonu už něco roste.');
        const sp = CHARGE_SEEDS ? CROPS[crop].seed : 0, sk = 'seed_' + crop;
        if (sp && !(st.stock[sk] > 0) && st.pamlsky < sp) return no(`Na ${CROPS[crop].acc} nemáš dost pamlsků (${sp}).`);
        if (sp && st.stock[sk] > 0) useStock(sk); else st.pamlsky -= sp;
        st.beds[i] = { crop, sown: t, days: 0, watered: 0 };
        ev.push({ type: 'sown', bed: i, crop });
        break;
      }
      case 'waterBeds': {
        if (bedSleeps(t)) return no('Záhony spí pod sněhem.');
        const k = dkey(t), todo = st.beds.filter(b => b && b.days < CROPS[b.crop].days);
        if (!todo.length) return no('Není co zalévat.');
        if (todo.every(b => b.watered === k)) return no('Dnes už je zalito.');
        for (const b of todo) b.watered = k;
        ev.push({ type: 'watered', n: todo.length });
        break;
      }
      case 'harvest': {
        const i = a.bed, b = Number.isInteger(i) && i >= 0 && i < BEDS ? st.beds[i] : null;
        if (!b) return no('Na záhonu nic neroste.');
        if (b.days < CROPS[b.crop].days) return no(CROPS[b.crop].unripe);
        st.beds[i] = null;
        const yld = CROPS[b.crop].yield;
        ev.push({ type: 'harvested', bed: i, crop: b.crop, n: yld });
        if (b.crop === 'catnip' && !st.out && !st.asleep) catnip();
        else st.pantry[b.crop] = Math.min(CMAX, (st.pantry[b.crop] || 0) + yld);
        break;
      }
      case 'catnip': {
        if (!st.pantry.catnip) return no('Nemáš žádnou šantu.');
        if (sleeping()) return { st, events: ev };
        if (--st.pantry.catnip === 0) delete st.pantry.catnip;
        catnip();
        break;
      }
      case 'lapOn': {
        if (st.lap) break;
        if (sleeping()) return { st, events: ev };
        const off = st.off && t < st.off.until, tummy = st.ill && st.ill.kind === 'tummy';
        if (off || tummy || st.scared > t || N.food < 15 || N.water < 15 || moodValue(st) < -30) { st.held = false; ev.push({ type: 'wriggle' }); break; }
        st.held = false;
        st.lap = { since: t, annoy: 0, doze: false, pet: t, dozeAt: 0 };
        ev.push({ type: 'lapOn' });
        if (nm === 'happy' || nm === 'calm') ev.push({ type: 'purr' });
        break;
      }
      case 'lapOff': {
        if (!st.lap) return no(`${name} ti nesedí na klíně.`);
        ev.push({ type: 'lapOff', dozing: st.lap.doze });
        st.lap = null;
        break;
      }
      case 'letIn': {
        if (!st.out) return no(`${name} je doma.`);
        comeBack(st, t, ev);
        break;
      }
      case 'treat': {   // a pamlsek from the hand, or arg 'stick': a kočičí tyčinka from the stock (love +5)
        const stick = arg === 'stick';
        if (stick ? !(st.stock.stick > 0) : st.pamlsky < 1) return no(stick ? 'Nemáš žádné tyčinky.' : 'Nemáš žádné pamlsky.');
        giveTreat(stick, !!st.train && t - st.train.at <= TREAT_WINDOW && t >= st.train.at);
        if (st.train) rewardTrick(st, t, ev);       // the treat right after a trick: a training success
        break;
      }
      case 'buy': {
        const id = typeof arg === 'string' ? arg : a.id, it = typeof id === 'string' && Object.prototype.hasOwnProperty.call(SHOP_BY, id) ? SHOP_BY[id] : null;
        if (!it) return no('Tohle v obchůdku nemají.');
        if (st.lvl < it.bond) return no(`Tohle bude k mání od přátelství ${LEVELS[it.bond].name}.`);
        if (!it.stock && st.owned[it.id]) return no('Tohle už máš.');
        if (st.pamlsky < it.price) return no(`${it.name} stojí ${pml(it.price)}, tolik nemáš.`);
        st.pamlsky -= it.price;
        if (it.stock) st.stock[it.stock] = Math.min(CMAX, (st.stock[it.stock] || 0) + it.n); else st.owned[it.id] = true;
        ev.push({ type: 'bought', id: it.id, kind: it.kind });
        break;
      }
      case 'place': {
        const it = typeof a.id === 'string' && Object.prototype.hasOwnProperty.call(SHOP_BY, a.id) ? SHOP_BY[a.id] : null;
        if (!it || !st.owned[it.id]) return no('Tohle nemáš.');
        if (!it.room) return no('Tohle se nikam nestaví.');
        if (!ROOMS.includes(a.room)) return no('Takové místo v domě není.');
        if (it.fixed && a.room !== it.room) return no(`${it.name}: patří ${ROOM_TO[it.room]}.`);
        const c = v => (typeof v === 'number' && Number.isFinite(v) ? clamp(v, 0, 1) : 0.5);
        st.furniture[it.id] = { room: a.room, x: c(a.x), y: c(a.y) };
        ev.push({ type: 'placed', id: it.id, room: a.room });
        break;
      }
      case 'sell': {
        const crop = typeof a.crop === 'string' && Object.prototype.hasOwnProperty.call(CROPS, a.crop) ? a.crop : null;
        if (!crop || !(st.pantry[crop] > 0)) return no('Tohle ve spíži nemáš.');
        if (!CROPS[crop].sell) return no('Šantu nikdo nekoupí, ta je pro kočku.');
        const n = Math.min(st.pantry[crop], Number.isInteger(a.n) && a.n >= 1 ? a.n : 1), got = n * CROPS[crop].sell;
        st.pantry[crop] -= n; if (!st.pantry[crop]) delete st.pantry[crop];
        st.pamlsky = Math.min(99999, st.pamlsky + got);
        ev.push({ type: 'sold', crop, n, earned: got });
        break;
      }
      case 'train': {
        const tr = typeof a.trick === 'string' && Object.prototype.hasOwnProperty.call(TRICKS, a.trick) ? a.trick : null;
        if (!tr) return no('Takový trik neznáme.');
        if (st.bond < TRICKS[tr].bond) { ev.push({ type: 'trickRefused', trick: tr, reason: `Na tenhle trik je potřeba přátelství ${TRICKS[tr].bond}.` }); break; }
        if (sleeping()) return { st, events: ev };
        const P = trickRec(tr);
        st.train = null;
        if (P.learned) { ev.push({ type: 'trickLearned', trick: tr }); break; }   // nothing to train: the UI suggests showing it
        if (a.cue !== TRICKS[tr].cue) { ev.push({ type: 'perform', trick: tr, ok: false, understood: false }); break; }
        const okp = performs(st, P);
        ev.push(okp ? { type: 'perform', trick: tr, ok: true } : { type: 'perform', trick: tr, ok: false, understood: true, reason: notNowReason(st) });
        if (!okp) break;
        st.train = { trick: tr, at: t };
        if (typeof a.treatAt === 'number' && Number.isFinite(a.treatAt)) {    // the UI tells when the treat came
          if (st.pamlsky < 1) { ev.push({ type: 'trickRefused', trick: tr, reason: 'Nemáš pamlsek na odměnu.' }); break; }
          giveTreat(false, true);
          rewardTrick(st, a.treatAt, ev);
        }
        break;
      }
      case 'feedVisitor': case 'strokeVisitor': case 'photo': case 'deletePhoto': {
        const why = socialAct(st, action, a, t, ev);
        if (why) return no(why);
        break;
      }
      case 'showTrick': {
        const tr = typeof a.trick === 'string' && Object.prototype.hasOwnProperty.call(TRICKS, a.trick) ? a.trick : null;
        if (!tr) return no('Takový trik neznáme.');
        const P = st.tricks[tr];
        if (!P || !P.learned) { ev.push({ type: 'trickRefused', trick: tr, reason: `Tenhle trik ${name} ještě neumí.` }); break; }
        if (sleeping()) return { st, events: ev };
        const okp = performs(st, P);
        ev.push(okp ? { type: 'perform', trick: tr, ok: true, shown: true } : { type: 'perform', trick: tr, ok: false, shown: true, understood: true, reason: notNowReason(st) });
        if (!okp) break;
        const today = dkey(t);
        if (P.shown < today) {   // the first successful show of this trick today: bond +3, 1 pamlsek
          P.shown = today; addBond(st, 3, ev);
          st.pamlsky = Math.min(99999, st.pamlsky + 1); ev.push({ type: 'earned', n: 1, trick: tr });
        }
        break;
      }
      case 'vetCure': {
        if (!st.ill) return no(`${name} je zdravá.`);
        const paid = Math.min(15, st.pamlsky);
        st.pamlsky -= paid;
        cure(st, 'vet', ev, { paid, short: paid < 15 });
        const tm = new Date(t); tm.setDate(tm.getDate() + 1);
        st.pill = a.won === true ? 0 : dkey(tm.getTime());
        break;
      }
      case 'pill': {
        if (!st.pill) return no(`${name} žádnou pilulku nepotřebuje.`);
        if (dkey(t) < st.pill) return no('Pilulka je až na zítra.');
        st.pill = 0; N.love = Math.max(0, N.love - 1);
        ev.push({ type: 'pill' });
        break;
      }
      case 'call': {
        if (st.out) { ev.push({ type: 'ignore', reason: `${name} je venku.` }); break; }
        if (st.asleep) { ev.push({ type: 'ignore', reason: `${name} spí.` }); break; }
        if (st.yard && st.yard.tree) {
          const T = st.yard.tree;
          if (++T.calls >= 3 || rnd(st) < 0.5) { st.yard.tree = null; ev.push({ type: 'climbDown', by: 'call' }); }
          else ev.push({ type: 'ignore', reason: `${name} se bojí slézt. Zkus to znovu.` });
          break;
        }
        if (st.off && t < st.off.until && !st.off.turned) { st.off.turned = true; ev.push({ type: 'turnBack' }); break; }
        ev.push({ type: 'come' });
        break;
      }
      case 'vacuum': {
        if (st.out) { ev.push({ type: 'curious', what: 'vacuum' }); break; }
        wakeUp();
        meet(st, 'vacuum', t, ev);
        break;
      }
    }
    // a satisfied want: bond +1, at most once an hour for each need
    if (before && needs(st)[before] >= 40 && !(t - (st.wantAt[before] || 0) < HOUR)) { st.wantAt[before] = t; addBond(st, 1, ev); }
    st.want = wants(st);
    return { st, events: ev };
  }

  const ROOM_TO = { living: 'do obýváku', kitchen: 'do kuchyně', hall: 'do předsíně', garden: 'na zahradu' };
  // the chance she performs a trick: by progress (learned 0.9), mood, energy, offence
  function performChance(st, P) {
    const m = mood(st), mk = m === 'happy' ? 1 : m === 'calm' ? 0.85 : m === 'grumpy' ? 0.5 : 0;   // sad: tricks fail (§4)
    return (P.learned ? 0.9 : 0.6 + 0.08 * P.progress) * mk * (st.needs.energy < 35 ? 0.5 : 1) * (st.off && st.t < st.off.until ? 0.5 : 1);
  }
  // why she did not perform a cue she understood: 'tired' | 'grumpy' | 'notNow' (the UI: Pochopila, ale nechce se jí)
  function notNowReason(st) {
    const m = mood(st);
    return st.needs.energy < 35 ? 'tired' : m === 'grumpy' || m === 'sad' || (st.off && st.t < st.off.until) ? 'grumpy' : 'notNow';
  }
  // does she perform a right cue? after two refusals 'just not now' the third right cue always works, so the player
  // can tell a right cue from a wrong one
  function performs(st, P) {
    const why = notNowReason(st);
    const okp = (why === 'notNow' && P.miss >= 2) || rnd(st) < performChance(st, P);
    P.miss = okp || why !== 'notNow' ? 0 : Math.min(2, P.miss + 1);
    return okp;
  }
  // a treat at time `at` within 1.5 s after she performed = a training success; 5 = learned
  function rewardTrick(st, at, ev) {
    const T = st.train;
    st.train = null;
    if (!T || at < T.at || at - T.at > TREAT_WINDOW) return false;
    const P = st.tricks[T.trick];
    if (P.learned) return true;
    P.progress = Math.min(TRICK_N, P.progress + 1);
    if (P.progress >= TRICK_N) { P.learned = at; ev.push({ type: 'learned', trick: T.trick }); }

  }
  // minigame rewards and records (§8): the UI plays the game and reports the score
  function minigameResult(st, game, score, now) {
    const ev = advance(st, now).events, t = st.t;
    const no = reason => { ev.push({ type: 'refused', reason }); return { st, events: ev }; };
    if (typeof game !== 'string' || !Object.prototype.hasOwnProperty.call(GAMES, game)) return no('Takovou hru neznáme.');
    if (st.out) return no(`${st.name} je venku.`);
    if (st.yard && st.yard.tree) return no(`${st.name} je na stromě.`);
    if (st.lap) { ev.push({ type: 'lapOff', dozing: st.lap.doze }); st.lap = null; }
    const sc = typeof score === 'number' && Number.isFinite(score) ? Math.floor(clamp(score, 0, 999)) : 0, G = GAMES[game];
    const today = dkey(t);
    if (st.earnDay.key < today) st.earnDay = { key: today, n: 0 };
    // a day already paid in the future (the clock went back): nothing more today
    const want = Math.min(G.max, Math.floor(sc / G.per)), n = st.earnDay.key > today ? 0 : Math.min(want, EARN_CAP - st.earnDay.n);
    if (n > 0) { st.pamlsky = Math.min(99999, st.pamlsky + n); st.earnDay.n += n; ev.push({ type: 'earned', n, game }); }
    if (want > n) ev.push({ type: 'capReached' });

    if (game !== 'pill') { N.fun = Math.min(100, N.fun + 30); N.energy = Math.max(0, N.energy - 10); st.asleep = false; }
    const prev = st.records[game] ? st.records[game].best : 0;
    if (sc > prev) { st.records[game] = { best: sc, t }; ev.push({ type: 'record', game, best: sc, prev }); }

  }
  // the shop for the UI: items offered at her bond level, with owned / affordable
  function shop(st) {
    return SHOP.filter(it => st.lvl >= it.bond).map(it => ({ id: it.id, kind: it.kind, name: it.name, price: it.price, room: it.room,
      owned: !it.stock && !!st.owned[it.id], have: it.stock ? st.stock[it.stock] || 0 : null, affordable: st.pamlsky >= it.price }));
  }
  // Výcvik for the UI
  function tricks(st) {
    return Object.keys(TRICKS).map(id => { const P = st.tricks[id] || { progress: 0, learned: 0 };
      return { id, name: TRICKS[id].name, cue: TRICKS[id].cue, bond: TRICKS[id].bond, available: st.bond >= TRICKS[id].bond, progress: P.progress, of: TRICK_N, learned: P.learned || null }; });
  }

  /* --- Phase 5: neighbour cats over the fence and the album (SPEC §8 Visitors, Album, §12e) --- */
  // trait: how they take a stroke and food; fem: Czech forms (dostal / dostala)
  const VISITORS = deep({
    mourek: { name: 'Mourek', trait: 'curious', fem: false }, liza: { name: 'Líza', trait: 'shy', fem: true },
    bivoj: { name: 'Bivoj', trait: 'bold', fem: false }, ciperka: { name: 'Čiperka', trait: 'playful', fem: true },
    pacicka: { name: 'Pacička', trait: 'greedy', fem: true }, rambo: { name: 'Rambo', trait: 'grumpy', fem: false },
    sedivka: { name: 'Šedivka', trait: 'old', fem: true }, fousek: { name: 'Fousek', trait: 'sleepy', fem: false },
  });
  const VISITOR_IDS = Object.keys(VISITORS);
  // per hour: a visit in the daytime (×2.5 with the miska pro návštěvy in the garden, ×1.5 with a cushion there);
  // only Bivoj comes at night; a visit lasts 20–90 min (greedy and sleepy ones +30 min when fed)
  const VISIT = deep({ day: 0.05, night: 0.03, bowl: 2.5, cushion: 1.5, stay: [20, 90], fedStay: 30, perVisit: 1 });
  // friendship (0–5 hearts, quarter steps) from a stroke / from food, by trait; at most +1 a visit from strokes
  const BY_TRAIT = deep({
    curious: [0.5, 0.5], shy: [0.25, 0.5], bold: [0.5, 0.5], playful: [0.5, 0.5],
    greedy: [0.25, 1], grumpy: [0.5, 0.5], old: [0.75, 0.5], sleepy: [0.5, 0.5],
  });
  // Koxa and the visitor: 'hiss' (Bivoj until 3 hearts, Rambo until 2), 'play' (Čiperka), 'friends' (3+ hearts), 'watch'
  const VISIT_MOOD = { hiss: -10, play: 5, friends: 5, watch: 0 };
  const ALBUM_MAX = 200;
  const PHOTO_ROOMS = ['living', 'kitchen', 'hall', 'garden', 'lap', 'walk'];
  function reaction(st, id) {
    const h = st.visitors[id] ? st.visitors[id].friend : 0;
    if (id === 'bivoj' && h < 3) return 'hiss';
    if (id === 'rambo' && h < 2) return 'hiss';
    if (id === 'ciperka') return 'play';
    return h >= 3 ? 'friends' : 'watch';
  }
  const vrec = (st, id) => st.visitors[id] || (st.visitors[id] = { friend: 0, met: 0, visits: 0, fed: 0 });
  function endVisit(st, reason, ev) {
    ev.push({ type: 'visitorLeave', id: st.visit.id, reason });
    st.visit = null;
  }
  // one step: a visitor may come (seeded), Koxa reacts, the visit ends after its time (never forever)
  function visitStep(st, t, dt, night, ev) {
    const h = dt / HOUR;
    if (st.visit) {
      if (night && st.visit.id !== 'bivoj') endVisit(st, 'night', ev);
      else if (t + dt >= st.visit.until) endVisit(st, 'time', ev);
      else if (weather(t, st) === 'rain' && st.visit.id !== 'bivoj') endVisit(st, 'rain', ev);
      else if (st.visit.id === 'ciperka' && !st.out && !st.asleep) st.needs.fun = Math.min(100, st.needs.fun + 10 * h);   // they play
      return;
    }
    if (weather(t, st) === 'rain' && !night) return;
    const F = st.furniture, cushion = (F.sillCushion && F.sillCushion.room === 'garden') || (F.bedDeluxe && F.bedDeluxe.room === 'garden');
    const rate = night ? VISIT.night : VISIT.day * (F.visitorBowl ? VISIT.bowl : 1) * (cushion ? VISIT.cushion : 1);
    if (!(rnd(st) < 1 - Math.exp(-rate * h))) return;
    const id = night ? 'bivoj' : VISITOR_IDS[Math.floor(rnd(st) * VISITOR_IDS.length)];
    const stay = VISIT.stay[0] + Math.floor(rnd(st) * (VISIT.stay[1] - VISIT.stay[0]));
    st.visit = { id, since: t, until: t + stay * MIN, gain: 0 };
    const R = vrec(st, id); R.visits = Math.min(CMAX, R.visits + 1);
    ev.push({ type: 'visitor', id, reaction: st.out ? 'away' : reaction(st, id) });
  }
  function addFriend(st, id, d, ev) {
    const R = vrec(st, id), before = Math.floor(R.friend);
    R.friend = Math.round(clamp(R.friend + d, 0, 5) * 4) / 4;
    if (Math.floor(R.friend) > before) ev.push({ type: 'visitorFriend', id, hearts: Math.floor(R.friend) });
  }
  // feedVisitor / strokeVisitor / photo / deletePhoto; returns a Czech refusal or null
  function socialAct(st, action, a, t, ev) {
    if (action === 'photo') {
      if (st.out) return `${st.name} je venku.`;
      if (st.album.length >= ALBUM_MAX) return `Album je plné (${ALBUM_MAX} fotek). Nějakou fotku smaž.`;
      const str = (v, n) => (typeof v === 'string' && v.trim() ? v.trim().slice(0, n) : null);
      const p = {
        t, pose: str(a.pose, 20) || (st.asleep ? 'sleep' : 'sit'),
        room: PHOTO_ROOMS.includes(a.room) ? a.room : st.yard ? 'garden' : st.lap ? 'lap' : 'living',
        mood: ['happy', 'calm', 'grumpy', 'sad'].includes(a.mood) ? a.mood : mood(st),
        phase: ['night', 'morning', 'day', 'evening'].includes(a.phase) ? a.phase : dayPhase(t),
        season: ['spring', 'summer', 'autumn', 'winter'].includes(a.season) ? a.season : season(t),
        note: str(a.note, 60) || '', visitor: st.visit ? st.visit.id : null,
      };
      st.album.push(p);
      ev.push({ type: 'photo', n: st.album.length });
      return null;
    }
    if (action === 'deletePhoto') {
      const i = st.album.findIndex(p => p.t === a.t);
      if (i < 0) return 'Takovou fotku v albu nemáš.';
      st.album.splice(i, 1);
      ev.push({ type: 'photoDeleted', n: st.album.length });
      return null;
    }
    const id = typeof a.id === 'string' && Object.prototype.hasOwnProperty.call(VISITORS, a.id) ? a.id : null;
    if (!id) return 'Takovou kočku neznáme.';
    const V = VISITORS[id];
    if (!st.visit || st.visit.id !== id) return `${V.name} tu teď není.`;
    const R = vrec(st, id);
    if (!R.met) R.met = t;
    const [strokeGain, foodGain] = BY_TRAIT[V.trait];
    if (action === 'feedVisitor') {
      const today = dkey(t);
      if (R.fed === today) return `${V.name} už dnes ${V.fem ? 'dostala' : 'dostal'}.`;
      R.fed = today;
      if (V.trait === 'greedy' || V.trait === 'sleepy') st.visit.until += VISIT.fedStay * MIN;   // stays longer
      ev.push({ type: 'visitorFed', id });
      addFriend(st, id, foodGain, ev);
      return null;
    }
    // strokeVisitor: shy ones may run off, grumpy ones may swipe while they do not know you
    if (V.trait === 'shy' && R.friend < 2 && rnd(st) < 0.6) { endVisit(st, 'shy', ev); return null; }
    if (V.trait === 'grumpy' && R.friend < 2 && rnd(st) < 0.5) { ev.push({ type: 'visitorHiss', id }); addFriend(st, id, -0.25, ev); return null; }
    ev.push({ type: 'visitorPurr', id });
    const g = Math.min(strokeGain, VISIT.perVisit - st.visit.gain);
    if (g > 0) { st.visit.gain += g; addFriend(st, id, g, ev); }
    return null;
  }
  function repairSocial(st, t) {
    const okT = v => typeof v === 'number' && Number.isFinite(v) && v >= T_MIN && v <= T_MAX;
    const own = (o, k) => typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k);

    st.visit = S && typeof S === 'object' && own(VISITORS, S.id) && okT(S.since) && S.since <= t && okT(S.until) && S.until > S.since &&
      S.until <= S.since + (VISIT.stay[1] + 2 * VISIT.fedStay) * MIN

    const A = Array.isArray(st.album) ? st.album : [];
    st.album = [];
    for (const p of A) {
      if (st.album.length >= ALBUM_MAX) break;
      if (!p || typeof p !== 'object' || !okT(p.t)) continue;
      const str = (v, n, def) => (typeof v === 'string' ? v.slice(0, n) : def);
      st.album.push({
        t: Math.min(p.t, t), pose: str(p.pose, 20, 'sit'), room: PHOTO_ROOMS.includes(p.room) ? p.room : 'living',
        mood: ['happy', 'calm', 'grumpy', 'sad'].includes(p.mood) ? p.mood : 'calm',
        phase: ['night', 'morning', 'day', 'evening'].includes(p.phase) ? p.phase : 'day',
        season: ['spring', 'summer', 'autumn', 'winter'].includes(p.season) ? p.season : 'spring',
        note: str(p.note, 60, ''), visitor: own(VISITORS, p.visitor) ? p.visitor : null,
      });
    }
  }
  function shiftSocial(st, d, now) {
    const today = dkey(now);
    for (const k of Object.keys(st.visitors)) { const r = st.visitors[k]; if (r.met > now) r.met = now; if (r.fed > today) r.fed = today; }
    if (st.visit) st.visit = { id: st.visit.id, since: st.visit.since + d, until: st.visit.until + d, gain: st.visit.gain };
    for (const p of st.album) if (p.t > now) p.t = now;
  }
  // the Album screen: photos (newest first), postcards, the neighbour cats met, presents
  function album(st) {
    return {
      photos: st.album.slice().reverse(), max: ALBUM_MAX,
      postcards: st.postcards.slice(),
      visitors: VISITOR_IDS.filter(id => st.visitors[id] && st.visitors[id].met).map(id => ({
        id, name: VISITORS[id].name, trait: VISITORS[id].trait, hearts: Math.floor(st.visitors[id].friend), met: st.visitors[id].met, visits: st.visitors[id].visits,
      })),
      presents: Object.assign({}, st.presents),
    };
  }

  // pamlsky from the launcher link (§10): n = the number the launcher counted
  function consumeTreats(st, n, now) {
    const ev = advance(st, now).events;
    const k = typeof n === 'number' && Number.isFinite(n) ? Math.floor(clamp(n, 0, 1000)) : 0;
    if (k > 0) { st.pamlsky = Math.min(99999, st.pamlsky + k); ev.push({ type: 'gift', n: k }); }
    return { st, events: ev };
  }

  return {
    NEEDS, FOODS, TOYS, REGIONS, FEARS, QUIRKS, ILLS, LEVELS, HOLIDAYS, ACTIONS, CROPS, PRESENTS, WEATHERS, POSTCARDS, BEDS,
    SHOP, GAMES, TRICKS, ROOMS, EARN_CAP, VISITORS, ALBUM_MAX, album,
    create, valid, repair, rename, advance, act, consumeTreats, minigameResult, shop, tricks,
    mood, moodValue, wants, needs, health, bondLevel, diary,
    dayPhase, season, holiday, easter, weather, postcardAt, bedCount,
  };
}
/* ---------- Life engine end ---------- */
</script>
<script>
/* ---------- Visible height ---------- */
// The game is exactly as tall as the part of the window that is really shown (--app-h on #app). 100dvh alone is not
// enough: some browsers report it taller than what is visible (the app installed by Brave on Android counted the
// status and navigation bars too and hid the bottom buttons). visualViewport follows what is shown; it is measured
// again on every change and shortly after loading (a browser bar that hides itself may change it without an event),
// and a changed height makes the game lay itself out again through a resize event.
(() => {
  const root = document.documentElement;
  let last = 0;
  const measure = () => {
    const vv = window.visualViewport;
    const h = Math.round(vv ? vv.height * vv.scale : innerHeight);
    if (!(h > 0) || h === last) return;
    const first = !last; last = h;
    root.style.setProperty('--app-h', h + 'px');
    if (!first) dispatchEvent(new Event('resize'));
  };
  measure();
  addEventListener('resize', measure);
  if (window.visualViewport) visualViewport.addEventListener('resize', measure);
  addEventListener('pageshow', measure);
  [100, 500, 1500].forEach(ms => setTimeout(measure, ms));
  // TEMPORARY (2026-11-08): what this page measured, shown in the launcher's Nastavení → "Údaje o obrazovce"
  setTimeout(() => { try {
    const p = document.createElement('div'); p.style.cssText = 'position:absolute;left:-50px;top:0;width:1px;height:100dvh;padding-bottom:env(safe-area-inset-bottom)';
    document.body.appendChild(p); const dvh = Math.round(p.getBoundingClientRect().height - parseFloat(getComputedStyle(p).paddingBottom)), sb = Math.round(parseFloat(getComputedStyle(p).paddingBottom)); p.remove();
    const vv = window.visualViewport;
    localStorage.setItem('games.launcher.diag', JSON.stringify({ page: location.pathname.split('/').slice(-2, -1)[0], vv: vv ? Math.round(vv.height) : null, inner: innerHeight, client: root.clientHeight, dvh, sb, appH: last, app: Math.round(document.getElementById('app').getBoundingClientRect().height) }));
  } catch (e) {} }, 2000);
})();

(() => {
'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;

/* ---------- Settings and storage ---------- */
const ID = 'kocka';                                       // = the folder name
const KEY = `games.${ID}.state`, BADGE = `games.${ID}.inProgress`, MOOD = `games.${ID}.mood`, TREATS = `games.${ID}.treats`; // contract keys
const THEMES = [
  { id: 'cottage', name: 'Chaloupka', meta: '#3b2a1e' },
  { id: 'paper', name: 'Papír', meta: '#f4ebdf' },
];
const DEFAULTS = { name: 'Koxa', theme: 'cottage', vibrate: true, sound: true, mic: false, tilt: true };
const A = KockaArt(), I = KockaInput(), E = KockaEngine();

/* ---------- State ---------- */
// S = settings, G = { st } where st is Koxa's life state from the engine (SPEC §10)
let S, G;
const now = () => (window.__kockaNow != null ? window.__kockaNow : Date.now()); // tests may move the clock (setNow)
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
// ahead: how she will be while the game is closed (see forecast), written when the page is left
function save(ahead) {
  if (!G) return;
  try {
    localStorage.setItem(KEY, JSON.stringify({ v: 1, settings: S, st: G.st, unread: G.unread || 0, view: G.view, her: G.her, seat: G.seat || null }));
    const w = E.wants(G.st), h = E.health(G.st);

    if (w || h.ill) localStorage.setItem(BADGE, '1'); else localStorage.removeItem(BADGE);
    localStorage.setItem(MOOD, JSON.stringify({ name: G.st.name, mood: E.mood(G.st), wants: w, ill: h.ill, ahead: Array.isArray(ahead) ? ahead : [] }));
  } catch (e) {} // rule: storage may be full or blocked; the game goes on
}

function forecast() {
  const out = [], t0 = G.st.t, status = st => { const h = E.health(st); return [E.mood(st), E.wants(st), h.ill]; };
  let last = JSON.stringify(status(G.st));

const nm = () => G.st.name;
// "Pohlaď Koxu" only where the accusative is safe (names ending in -a), else "Pohlaď ji" (SPEC §11)
const acc = n => /[^aeiouyáéíóúůý]a$/i.test(n) ? n.slice(0, -1) + 'u' : 'ji';

}

}

/* ---------- Places (SPEC §12c, §12e) ---------- */
// Kuchyně ⇄ Obývák ⇄ Předsíň → (the door) → Zahrada. The art gives every place its picture and spots; without
// A.rooms (an older art block) there is one room with every spot, and no arrows.
const ORDER = ['kitchen', 'living', 'hall', 'garden'];

function stopGame(quiet) {

  K.chase = false; $('#game').innerHTML = '';
