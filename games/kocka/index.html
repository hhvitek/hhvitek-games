  if (quiet) return;
  const r = E.minigameResult(G.st, g.id, g.score, now()); G.st = r.st;
  const ev = r.events, earned = ev.find(e => e.type === 'earned'), rec = ev.find(e => e.type === 'record'), cap = ev.some(e => e.type === 'capReached');
  handle(ev.filter(e => !['earned', 'record', 'capReached'].includes(e.type)));
  save(); refresh();
  whenFree(G, 350, () => showModal(`<h2>${esc(E.GAMES[g.id].name)}</h2><p>Výsledek: <b>${g.score}</b>${rec ? ' – nový rekord!' : ''}</p>` +
    `<p>${earned ? `Získáváš ${earned.n} ${plural(earned.n, 'pamlsek', 'pamlsky', 'pamlsků')}.` : 'Tentokrát bez pamlsků.'}</p>` +
    (cap ? `<p>Dnes už je pamlsků z her dost (${E.EARN_CAP || 30} denně). Hrát můžeš dál, další přibudou zítra.</p>` : ''),
  [{ text: 'Ještě jednou', fn: () => startGame(g.id) }, { text: 'Hotovo', cls: 'alt' }]));
}
function gameInput(ev) {
  const g = MODE.game; if (!g || !/^p(down|move|up)$/.test(ev.type)) return;
  const w = where(ev.x, ev.y);
  if (!w.inScene) return;
  if (perf() < g.t0) return;
  if (g.id === 'laserRun') {
    if (ev.type === 'pup') laser.finger = null; else laser.finger = { x: w.r.x, y: w.r.y };
    return;
  }
  if (g.id === 'feather') {
    if (ev.type !== 'pup') g.finger = { x: w.r.x, y: w.r.y };
    if (ev.type === 'pdown') {
      if (g.jump && perf() < g.jump) { g.score++; g.jump = 0; say('chirp'); popFx('sparkle'); buzz('tap'); }
      else if (g.cool > perf()) tip('early', 'Brzo! Počkej, až vyskočí.', 2500);
    }
    return;
  }
  if (ev.type !== 'pdown') return;
  if (g.id === 'mouse') {
    const hit = g.holes.find(h => h.ph > 0.15 && Math.abs(w.r.x - h.x) < 42 && w.r.y > 330 && w.r.y < 450);
    if (!hit && g.holes.some(h => Math.abs(w.r.x - h.x) < 42 && w.r.y > 330 && w.r.y < 450)) tip('mouseMiss', 'Schovala se!', 700);
    if (hit) {
      g.score++; hit.st = 'hide'; hit.ph = 0; say('chirp'); buzz('tap');
      busy('pounceM', { room: G.view, pose: 'pounce', fx: hit.x, fy: 450, ax: 36, flip: hit.x > curBox().bx + 100 * KC, fast: true }, 500);
    }
    return;
  }
  if (g.id === 'fishing') {
    if (g.state === 'ready') { g.state = 'wait'; g.timer = perf() + 1500 + Math.random() * 2500; say('mew'); }
    else if (g.state === 'wait') { g.state = 'ready'; tip('fishEarly', 'Moc brzo! Počkej, až splávek cukne.', 2000); }
    else if (g.state === 'bite') {
      g.state = 'caught'; g.score++; g.timer = perf() + 1100; g.fish = (A.fishes || ['goldfish'])[Math.floor(Math.random() * (A.fishes || [1]).length)];
      say('trill'); popFx('sparkle'); buzz('tap');
    }
  }
}
function stepGame(dt) {
  const g = MODE.game; if (!g) return;
  if (!nothingOpen() || document.hidden) {                        // paused: every clock of the game moves on with it
    const d = dt * 1000; g.t0 += d; g.timer += d; if (g.jump) g.jump += d; if (g.cool) g.cool += d;
    for (const h of g.holes) h.t += d;
    laser.finger = null; return;
  }
  const t = perf(), left = GAME_LEN - (t - g.t0) / 1000;
  $('#hudScore').textContent = `${E.GAMES[g.id].name}: ${g.score}`;
  $('#hudTime i').style.width = clamp(left / GAME_LEN, 0, 1) * 100 + '%';
  if (left <= 0) { stopGame(); return; }
  let s = '';
  const item = (name, rx, ry, size, cls = '') => { const p = toPx(rx, ry), z = size * V.s; return `<div class="gobj ${cls}" style="left:${(p.x - z / 2).toFixed(1)}px;top:${(p.y - 0.9 * z).toFixed(1)}px;width:${z.toFixed(1)}px;height:${z.toFixed(1)}px">${name}</div>`; };
  if (g.id === 'mouse') {
    const fast = t - g.t0 > 15000;
    if (t > g.timer && t > g.t0) { const free = g.holes.filter(h => h.st === 'hide'); if (free.length) { const h = free[Math.floor(Math.random() * free.length)]; h.st = 'up'; h.t = t; } g.timer = t + (fast ? 550 : 850) + Math.random() * 500; }
    for (const h of g.holes) {
      const a = (t - h.t) / 1000;

}
function startTrain(id) {

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenShop', '#screenVet', '#screenDiary', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();
