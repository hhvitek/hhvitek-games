<!doctype html>
<html lang="cs" data-theme="paper">
<head>
<meta charset="utf-8">
<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4ebdf">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lodě">
<title>Lodě</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c6b97'/%3E%3Crect x='9' y='26' width='40' height='12' rx='6' fill='%23e3e9ee'/%3E%3Cpath d='M47 25l8 8M55 25l-8 8' stroke='%23e8463a' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ---------- Themes: a solid colour; everything below reads these variables (rule) ----------
   --frame/--grid/--sea: the frame of a sea, its lines and its squares, --fog: the computer's sea before the battle,
   --zone: where a dragged ship may not go (next to another ship), --hull/--sunk: a ship and a sunk ship,
   --hit: the red cross of a hit (with a thin --edge so it shows on a ship too), --miss: a shot into the water, --water: water marked by itself around a sunk ship,
   --last: the computer's last shot, --hint: the advice, --ok/--bad: a dragged ship that fits / does not fit */
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.06);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--accent:#7a4520;--accent-ink:#fff;--chip:#fff;--chip-line:#e6d8c6;--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--undo-bg:rgba(122,69,32,.1);
  --frame:#cdb69a;--grid:#e6d6c0;--sea:#fffaf2;--fog:#efe3d2;--zone:#f1e2cd;--hull:#7d6a58;--sunk:#3b2a1c;--hit:#c0392b;--edge:#fffaf2;--miss:#5d4a3a;--water:#c4ae94;--last:#1f5fbf;--hint:#1f5fbf;--ok:#4f8a3c;--bad:#c0392b}
[data-theme="sea"]{--page:#0f2c44;--bar:rgba(0,0,0,.22);--line:rgba(255,255,255,.1);--ink:#e9f3fb;--soft:#b8cfe0;--accent:#ffd166;--accent-ink:#2a2000;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.22);--btn:#ffd166;--btn-ink:#2a2000;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.25);
  --frame:#0a1e30;--grid:#1f5579;--sea:#2c6b97;--fog:#1d4a6b;--zone:#245a80;--hull:#d3dce4;--sunk:#061420;--hit:#ff5a3c;--edge:#fff;--miss:#e9f3fb;--water:#86aecb;--last:#ffd166;--hint:#ffd166;--ok:#8fe08f;--bad:#ff6b5a}
[data-theme="notebook"]{--page:#fdfcf7;--bar:rgba(30,60,120,.05);--line:#d9e2ef;--ink:#1d2b4a;--soft:#5a6b8a;--accent:#2f5fb3;--accent-ink:#fff;--chip:#fff;--chip-line:#d0dbec;--btn:#2f5fb3;--btn-ink:#fff;--btn-sh:#1b3c78;--undo-bg:rgba(47,95,179,.08);
  --frame:#9fb6d8;--grid:#c4d5ee;--sea:#fff;--fog:#eef2f8;--zone:#e6eef9;--hull:#5a7fc0;--sunk:#16233f;--hit:#d63031;--edge:#fff;--miss:#1d2b4a;--water:#9aaccc;--last:#e17000;--hint:#e17000;--ok:#3c8a4f;--bad:#d63031}

/* ---------- Base ---------- */
:root{--gut:12px} /* one side margin: bar buttons, board and bottom buttons line up (the safe areas are on #app) */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
/* rule: 100dvh + safe areas, the board is sized from the room that is left (see layout()) */
#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Top bar (rule: home, Nová hra, <h1> name, ?, settings) ---------- */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;color:var(--ink);white-space:normal;overflow-wrap:normal;word-break:normal} /* a long name wraps to two lines between words, never inside a word and never cut (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);text-decoration:none}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:8px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:20px}
/* narrow phones (360 px): less room between the bar buttons, so the name fits whole at 18 px; the outer margin stays */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill{padding:0 8px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px;letter-spacing:0}
}

/* ---------- The seas: the big one above (the computer's; before the battle yours), the small one below on the left
   (yours) with the opponent's panel next to it. Sizes come from layout(). ---------- */
#mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px var(--gut)} /* rule: at least 12 px between the seas and the bars above and below */
#big{flex:none;display:grid;grid-template-columns:var(--lab) auto;grid-template-rows:var(--lab) auto}
.labc,.labr{display:grid;gap:var(--gl);font-size:var(--lf);font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums;line-height:1}
.labc{grid-template-columns:repeat(10,var(--cs));padding:0 var(--fw);align-items:end}
.labr{grid-template-rows:repeat(10,var(--cs));padding:var(--fw) 0;justify-items:end}
.labc span{text-align:center;padding-bottom:3px}
.labr span{align-self:center;padding-right:3px}
.cells{display:grid;gap:var(--g);background:var(--grid);border:var(--fw) solid var(--frame);border-radius:4px}
#grid{--s:var(--cs);--g:var(--gl);grid-template-columns:repeat(10,var(--cs));grid-auto-rows:var(--cs)}
#grid.on{border-color:var(--accent)}
#grid.place{touch-action:none}
#mini{--s:var(--co);--g:1px;grid-template-columns:repeat(10,var(--co));grid-auto-rows:var(--co)}
#low{flex:none;display:flex;align-items:center;gap:10px;margin-top:12px}
#mid.side{flex-direction:row}
#mid.side #low{flex-direction:column;align-items:flex-start;justify-content:center;margin:0 0 0 12px}
#panel{flex:none;display:flex;flex-direction:column;gap:6px;--op-ava:32px;--op-ava-bg:var(--chip);--op-name:18px}
.pl{font-size:16px;line-height:1.25;color:var(--soft)}
.pl b{color:var(--ink)}
.tag{align-self:flex-start;font-size:16px;font-weight:800;padding:2px 10px;border-radius:12px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.tag.off{background:none;color:var(--soft);font-weight:700;padding:2px 0}
/* the ships of the opponent: a bar per ship, a sunk one faded */
.ros{display:flex;flex-wrap:wrap;align-items:center;gap:5px 6px}
.ros i{display:block;height:10px;width:calc(var(--n) * 9px);border-radius:5px;background:var(--hull)}
.ros i.gone{background:transparent;box-shadow:inset 0 0 0 2px var(--hull);opacity:.5}

/* a square: the sea; ::before draws the ship (it reaches over the line to the next square of the same ship),
   ::after the mark of a shot (dot = water, small dot = water marked by itself, cross = hit) */
.c{position:relative;display:block;width:100%;height:100%;background:var(--sea)}
.c.fog{background:var(--fog)}
.c.z{background:var(--zone)}
.c.s::before,.c.gh::before{content:"";position:absolute;top:15%;bottom:15%;left:0;right:0;background:var(--hull)}
.c.v::before{top:0;bottom:0;left:15%;right:15%}
.c.h:not(.f)::before{left:calc(-1 * var(--g))}
.c.v:not(.f)::before{top:calc(-1 * var(--g))}
.c.h.f::before{left:9%;border-radius:calc(var(--s) * .35) 0 0 calc(var(--s) * .35)}
.c.h.l::before{right:9%;border-radius:0 calc(var(--s) * .35) calc(var(--s) * .35) 0}
.c.h.f.l::before{border-radius:calc(var(--s) * .35)}
.c.v.f::before{top:9%;border-radius:calc(var(--s) * .35) calc(var(--s) * .35) 0 0}
.c.v.l::before{bottom:9%;border-radius:0 0 calc(var(--s) * .35) calc(var(--s) * .35)}
.c.s.sk::before{background:var(--sunk)}
.c.s.rv::before{opacity:.45}
.c.s.dim::before{opacity:.3}
.c.gh::before{background:var(--ok);opacity:.8}
.c.gh.bad::before{background:var(--bad)}
.c::after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;border-radius:50%;transform:translate(-50%,-50%)}
.c.o::after{width:calc(var(--s) * .26);height:calc(var(--s) * .26);background:var(--miss)}
.c.w::after{width:calc(var(--s) * .14);height:calc(var(--s) * .14);background:var(--water)}
.c.x::after{width:calc(var(--s) * .7);height:calc(var(--s) * .7);border-radius:0;background:linear-gradient(45deg,transparent 33%,var(--edge) 33% 40%,var(--hit) 40% 60%,var(--edge) 60% 67%,transparent 67%),linear-gradient(-45deg,transparent 33%,var(--edge) 33% 40%,var(--hit) 40% 60%,var(--edge) 60% 67%,transparent 67%)}
.c.new::after{animation:pop .35s ease-out}
@keyframes pop{from{scale:2.4;opacity:.15}}
.c.last,.c.hint{z-index:1;outline:calc(var(--s) * .11) solid var(--last);outline-offset:calc(var(--s) * -.11)}
.c.hint{outline-color:var(--hint)}
.c.hint::after{width:calc(var(--s) * .3);height:calc(var(--s) * .3);background:var(--hint)}

/* ---------- Bottom buttons ---------- */
.tray{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px var(--gut) 12px;background:var(--bar);border-top:1px solid var(--line)}
#hint{text-align:center;font-size:18px;line-height:1.3;color:var(--soft);min-height:24px}
#hint b{color:var(--ink)}
.row{display:flex;gap:8px}
.undo{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:6px;height:60px;padding:0 8px;border-radius:16px;font-size:20px;font-weight:800;color:var(--ink);background:var(--undo-bg);box-shadow:inset 0 0 0 2px var(--chip-line);white-space:nowrap}
.undo svg{flex:none;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.undo.go{background:var(--btn);color:var(--btn-ink);box-shadow:0 4px 0 var(--btn-sh)}
/* rule: an unavailable action is only dimmed and explains itself when tapped */
.undo.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */
@media (max-height:800px){
  .topbar{height:56px}
  .round{width:42px;height:42px}
  .pill{height:42px}
  .undo{height:54px}
  .tray{gap:6px;padding:6px var(--gut) 10px}
}
@media (max-width:380px){
  .undo{font-size:18px;gap:4px;padding:0 6px}
  #hint{font-size:17px}
}

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
/* rule: the head with Zpět and the game name stays at the top while scrolling */
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);margin-top:16px}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{font-size:18px;color:var(--psoft);line-height:1.3}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
/* a theme swatch: a short row of sea with a ship, a hit and a shot into the water */
.swatch{height:56px;border-radius:10px;background:var(--page);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);display:grid;place-items:center}
.swatch .cells{--s:20px;--g:1px;grid-template-columns:repeat(5,20px);grid-auto-rows:20px;border-width:2px}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.stats{font-size:20px;line-height:1.5}
.stats + .stats{margin-top:8px}
.help p,.help li{font-size:20px;line-height:1.45}
.help ol,.help ul{padding-left:26px}
.help li{margin:10px 0}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;line-height:1.35;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* the toast starts at the top of the bottom buttons and grows down over them: never over the seas or the panel (toast()) */
#toast{font-size:17px;line-height:1.25;padding:9px 14px;max-width:calc(100vw - 24px)}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px Georgia,"Times New Roman",serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
</style>
</head>
<body>
<div id="rotate" class="paper" role="status"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="6" width="20" height="36" rx="4"/><path d="M29 36h6"/><path d="M12 46a22 22 0 0 0 40 0"/><path d="m52 46-1.5 7M52 46l-7 2"/></svg><b>Otoč telefon na výšku</b><span>Hra počká, nic se neztratí.</span></div>
<div id="app">

/* ---------- Visible height ---------- */
// The game is exactly as tall as the part of the window that is really shown (--app-h on #app). 100dvh alone is not
// enough: some browsers report it taller than what is visible (the app installed by Brave on Android counted the
// status and navigation bars too and hid the bottom buttons). visualViewport follows what is shown; it is measured
// again on every change and shortly after loading (a browser bar that hides itself may change it without an event),
// and a changed height makes the game lay itself out again through a resize event.
(() => {
  const root = document.documentElement;
  let last = 0;
  const measure = () => {
    const vv = window.visualViewport;
    const h = Math.round(vv ? vv.height * vv.scale : innerHeight);
    if (!(h > 0) || h === last) return;
    const first = !last; last = h;
    root.style.setProperty('--app-h', h + 'px');
    if (!first) dispatchEvent(new Event('resize'));
  };
  measure();
  addEventListener('resize', measure);
  if (window.visualViewport) visualViewport.addEventListener('resize', measure);
  addEventListener('pageshow', measure);
  [100, 500, 1500].forEach(ms => setTimeout(measure, ms));
  // TEMPORARY (2026-11-08): what this page measured, shown in the launcher's Nastavení → "Údaje o obrazovce"
  setTimeout(() => { try {
    const p = document.createElement('div'); p.style.cssText = 'position:absolute;left:-50px;top:0;width:1px;height:100dvh;padding-bottom:env(safe-area-inset-bottom)';
    document.body.appendChild(p); const dvh = Math.round(p.getBoundingClientRect().height - parseFloat(getComputedStyle(p).paddingBottom)), sb = Math.round(parseFloat(getComputedStyle(p).paddingBottom)); p.remove();
    const vv = window.visualViewport;
    localStorage.setItem('games.launcher.diag', JSON.stringify({ page: location.pathname.split('/').slice(-2, -1)[0], vv: vv ? Math.round(vv.height) : null, inner: innerHeight, client: root.clientHeight, dvh, sb, appH: last, app: Math.round(document.getElementById('app').getBoundingClientRect().height) }));
  } catch (e) {} }, 2000);
})();

<script>
/* ---------- Engine ---------- */
// Lodě: the fleets, the shots and the computer's aim. No DOM here: the same function runs in Node (tools/lode-test.js).
function LodeEngine() {
'use strict';
/* The sea is 10 × 10 squares 0..99: i = row * 10 + col, row 0 is row 1 on the board, col 0 is column A.
   A ship is { r, c, len, v }: its first square (top or left) and v = it goes down (vertical).
   Ships are straight and never touch, not even at a corner. */
const N = 10, CELLS = 100;
const FLEETS = { classic: [5, 4, 3, 3, 2], big: [4, 3, 3, 2, 2, 2, 1, 1, 1, 1] };

/* ---------- Randomness from the game's seed: the same state gives the same shot (reload) ---------- */
function rng(seed) {
  let a = seed | 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// a seed for the n-th shot of a game (salt: another stream, e.g. the advice)
const mix = (seed, n, salt = 0) => (seed ^ Math.imul(n + 1, 0x9E3779B1) ^ salt) | 0;

/* ---------- Ships ---------- */
function cellsOf(s) {
  const out = [];
  for (let t = 0; t < s.len; t++) out.push((s.r + (s.v ? t : 0)) * N + s.c + (s.v ? 0 : t));
  return out;
}
const inside = s => s.r >= 0 && s.c >= 0 && (s.v ? s.r + s.len <= N && s.c < N : s.c + s.len <= N && s.r < N);
// the squares around a ship (also diagonally), inside the sea
function ring(s) {
  const out = [], r1 = s.r + (s.v ? s.len : 1), c1 = s.c + (s.v ? 1 : s.len);
  for (let r = s.r - 1; r <= r1; r++) for (let c = s.c - 1; c <= c1; c++) {
    if (r < 0 || c < 0 || r >= N || c >= N) continue;
    if (r >= s.r && r < r1 && c >= s.c && c < c1) continue;
    out.push(r * N + c);
  }
  return out;
}
// the squares the other ships take or touch (skip: the index of a ship that does not count, e.g. the one being moved)
function blocked(fleet, skip = -1) {
  const b = new Uint8Array(CELLS);
  fleet.forEach((o, j) => { if (j === skip) return; for (const i of cellsOf(o)) b[i] = 1; for (const i of ring(o)) b[i] = 1; });
  return b;
}
const fits = (fleet, s, skip = -1) => { if (!inside(s)) return false; const b = blocked(fleet, skip); return cellsOf(s).every(i => !b[i]); };
const validShip = s => !!s && typeof s === 'object' && [s.r, s.c, s.len].every(Number.isInteger) && s.len >= 1 && s.len <= 5 && typeof s.v === 'boolean' && inside(s);
function validFleet(fleet, lengths) {
  if (!Array.isArray(fleet) || fleet.length !== lengths.length || !fleet.every(validShip)) return false;
  if (fleet.map(s => s.len).sort((a, b) => a - b).join() !== [...lengths].sort((a, b) => a - b).join()) return false;
  return fleet.every((s, j) => fits(fleet, s, j));
}
// a random fleet: the longest ships first, each at a random free place; a dead end starts again
function randomFleet(lengths, rand) {
  for (let tries = 0; tries < 2000; tries++) {
    const fleet = [];
    for (const len of lengths) {
      let s = null;
      for (let t = 0; t < 400 && !s; t++) {
        const v = len > 1 && rand() < .5, r = Math.floor(rand() * (v ? N - len + 1 : N)), c = Math.floor(rand() * (v ? N : N - len + 1));
        const x = { r, c, len, v };
        if (fits(fleet, x)) s = x;
      }
      if (!s) break;
      fleet.push(s);
    }
    if (fleet.length === lengths.length) return fleet;
  }
  throw new Error('No fleet found');
}
function shipMap(fleet) {
  const m = new Int8Array(CELLS).fill(-1);
  fleet.forEach((s, j) => { for (const i of cellsOf(s)) m[i] = j; });
  return m;
}

/* ---------- Shots ----------
   A sea under fire: what the shooter knows, k[i] = 0 unknown, 1 water, 2 hit, 3 a square of a sunk ship;
   shot[i]: really shot there (water around a sunk ship is marked by itself, without a shot). */
function sea(fleet) {
  return { fleet, owner: shipMap(fleet), k: new Int8Array(CELLS), shot: new Uint8Array(CELLS), hits: fleet.map(() => 0), sunk: fleet.map(() => false), left: fleet.reduce((a, s) => a + s.len, 0) };
}
// one shot: 'miss' | 'hit' | 'sunk', or null for a square that is already known
function fire(b, i) {
  if (!(i >= 0 && i < CELLS) || b.k[i]) return null;
  b.shot[i] = 1;
  const j = b.owner[i];
  if (j < 0) { b.k[i] = 1; return 'miss'; }
  b.k[i] = 2; b.hits[j]++; b.left--;
  if (b.hits[j] < b.fleet[j].len) return 'hit';
  b.sunk[j] = true;
  for (const x of cellsOf(b.fleet[j])) b.k[x] = 3;
  for (const x of ring(b.fleet[j])) if (!b.k[x]) b.k[x] = 1; // no ship can touch it: water all around
  return 'sunk';
}
// the lengths of the ships still afloat (all the shooter may know about them)
const afloat = b => b.fleet.filter((s, j) => !b.sunk[j]).map(s => s.len);
// The whole battle from its shots [[who, square]] (who 0 = you at the computer's fleet, 1 = the computer at yours).
// The starter shoots first; with again, a hit (or a sunk ship) gives the shooter another shot. A shot out of turn or at a
// known square ends the list there (n = how many shots are valid).
function battle(mine, theirs, starter, again, shots) {
  const B = [sea(theirs), sea(mine)], res = [];
  let turn = starter, winner = -1, n = 0;
  for (const sh of shots) {
    if (winner >= 0 || !Array.isArray(sh) || sh[0] !== turn || !Number.isInteger(sh[1])) break;
    const r = fire(B[turn], sh[1]);
    if (!r) break;
    res.push(r); n++;
    if (!B[turn].left) winner = turn;
    else if (!(again && r !== 'miss')) turn = 1 - turn;
  }
  return { B, res, turn, winner, n };
}

/* ---------- The computer's aim ----------
   Fair play: it gets only what it learnt from its own shots (k) and the lengths of the ships still afloat, never where
   your ships are. level: 'easy' | 'normal' | 'master' (also the advice). Always an unknown square. */
const pick = (list, rand) => list[Math.floor(rand() * list.length)];
function orth(i) {
  const r = i / N | 0, c = i % N, out = [];
  if (r > 0) out.push(i - N); if (r < N - 1) out.push(i + N); if (c > 0) out.push(i - 1); if (c < N - 1) out.push(i + 1);
  return out;
}
function unknown(k) { const out = []; for (let i = 0; i < CELLS; i++) if (!k[i]) out.push(i); return out; }
// Začátečník: shoots at random; after a hit it mostly tries a square next to it, but sometimes forgets about it
function aimEasy(k, rand) {
  const hits = []; for (let i = 0; i < CELLS; i++) if (k[i] === 2) hits.push(i);
  if (hits.length && rand() < .7) {
    const nb = orth(pick(hits, rand)).filter(x => !k[x]);
    if (nb.length) return pick(nb, rand);
  }
  return pick(unknown(k), rand);
}
// how many squares in a row through i (across or down) could still hold a ship
function run(k, i, dr, dc) {
  let n = 1;
  const r = i / N | 0, c = i % N;
  for (const d of [1, -1]) {
    let rr = r + d * dr, cc = c + d * dc;
    while (rr >= 0 && rr < N && cc >= 0 && cc < N && (k[rr * N + cc] === 0 || k[rr * N + cc] === 2)) { n++; rr += d * dr; cc += d * dc; }
  }
  return n;
}
// Zkušený hráč: after a hit the squares next to it, after two hits in a row the ends of that row; otherwise a
// checkerboard of the smallest ship afloat (no ship can hide between its squares), only where a ship still fits
function aimNormal(k, left, rand) {
  const minLen = Math.min(...left);
  const seen = new Uint8Array(CELLS), groups = [];
  for (let i = 0; i < CELLS; i++) if (k[i] === 2 && !seen[i]) {
    const g = [i]; seen[i] = 1;
    for (let q = 0; q < g.length; q++) for (const x of orth(g[q])) if (k[x] === 2 && !seen[x]) { seen[x] = 1; g.push(x); }
    groups.push(g.sort((a, b) => a - b));
  }
  groups.sort((a, b) => b.length - a.length);
  for (const g of groups) {
    let cand;
    if (g.length >= 2) {
      const across = (g[0] / N | 0) === (g[1] / N | 0), a = g[0], b = g[g.length - 1];
      cand = across ? [a % N > 0 ? a - 1 : -1, b % N < N - 1 ? b + 1 : -1] : [a - N, b + N];
      cand = cand.filter(x => x >= 0 && x < CELLS && !k[x]);
    } else cand = orth(g[0]).filter(x => !k[x]);
    if (cand.length) return pick(cand, rand);
  }
  const room = unknown(k).filter(i => Math.max(run(k, i, 0, 1), run(k, i, 1, 0)) >= minLen);
  const chess = room.filter(i => ((i / N | 0) + i % N) % minLen === 0);
  return pick(chess.length ? chess : room.length ? room : unknown(k), rand);
}
// Mistr: counts every place where each ship afloat could lie (on unknown squares and its own hits, touching no other
// hit) and shoots at the square most of them cover; while a ship is hit, only places through its hits count
function aimMaster(k, left, rand) {
  let anyHit = false;
  for (let i = 0; i < CELLS; i++) if (k[i] === 2) { anyHit = true; break; }
  const lens = {};
  for (const l of left) lens[l] = (lens[l] || 0) + 1;
  const score = new Float64Array(CELLS);
  const count = target => {
    let places = 0;
    for (const key of Object.keys(lens)) {
      const len = +key, mult = lens[key];
      for (const v of len > 1 ? [false, true] : [false]) {
        for (let r = 0; r < (v ? N - len + 1 : N); r++) for (let c = 0; c < (v ? N : N - len + 1); c++) {
          let cover = 0, ok = true;
          for (let t = 0; t < len && ok; t++) { const x = k[(r + (v ? t : 0)) * N + c + (v ? 0 : t)]; if (x === 1 || x === 3) ok = false; else if (x === 2) cover++; }
          if (!ok || (target && !cover)) continue;
          if (anyHit) { // a hit next to the ship that it does not cover would be another ship touching it
            const s = { r, c, len, v };
            if (ring(s).some(x => k[x] === 2)) continue;
          }
          for (let t = 0; t < len; t++) { const i = (r + (v ? t : 0)) * N + c + (v ? 0 : t); if (!k[i]) score[i] += mult; }
          places++;
        }
      }
    }
    return places;
  };
  if (!(anyHit && count(true))) { score.fill(0); count(false); }
  let best = 0, list = [];
  for (let i = 0; i < CELLS; i++) if (!k[i]) { if (score[i] > best) { best = score[i]; list = [i]; } else if (score[i] === best && best > 0) list.push(i); }
  return list.length ? pick(list, rand) : pick(unknown(k), rand);
}
function aim(k, left, level, rand) {
  if (!left.length || !unknown(k).length) return -1;
  return level === 'easy' ? aimEasy(k, rand) : level === 'normal' ? aimNormal(k, left, rand) : aimMaster(k, left, rand);
}

return { N, CELLS, FLEETS, rng, mix, cellsOf, inside, ring, blocked, fits, validShip, validFleet, randomFleet, shipMap, sea, fire, afloat, battle, aim };
}
/* ---------- Engine end ---------- */
</script>

const coord = i => COLS[i % N] + ((i / N | 0) + 1);

      head = 'Výhra! 🎉';
      why = `Celé loďstvo soupeře je na dně. Stačilo ti <b>${plural(yourShots(), 'výstřel', 'výstřely', 'výstřelů')}</b>.`
        + (G.record ? '<br>To je tvůj nový rekord!' : G.helped ? '<br>Hra s radou se do rekordu nepočítá.' : '');
    } else {
      const left = B.B[0].left;
      head = `${O.past(G.foe, 'Vyhrál', 'Vyhrála')} ${nm()}`;
      why = `${nm()} ${O.past(G.foe, 'potopil', 'potopila')} všechny tvé lodě. Tobě ${left === 1 ? 'chyběl jen jeden zásah' : left <= 4 ? `chyběly ještě ${left} zásahy` : `chybělo ještě ${left} zásahů`}. Zbylé lodě soupeře jsou teď v moři vidět.`;
    }
    showModal(`<h2>${head}</h2><p>${why}</p>`, [{ text: 'Nová hra', fn: () => newGame() }, { text: 'Prohlédnout', cls: 'alt' }]);
  });
}

/* ---------- Settings (rule: a separate screen, applied at once, no Save button) ---------- */
const opt = (act, on, title, desc) => `<button class="opt" data-act="${act}" aria-pressed="${on}"><span class="radio"></span><span><b>${title}</b>${desc ? `<span class="d">${desc}</span>` : ''}</span></button>`;
const toggleRow = (key, label, note) => `<div class="field"><div class="trow"><div class="flabel">${label}</div><button class="sw" data-act="toggle:${key}" aria-pressed="${S[key]}">${S[key] ? 'Zapnuto' : 'Vypnuto'}</button></div>${note ? `<div class="fnote">${note}</div>` : ''}</div>`;
const swatch = id => `<span class="swatch" data-theme="${id}"><span class="cells"><i class="c s h f"></i><i class="c s h l x"></i><i class="c"></i><i class="c o"></i><i class="c"></i></span></span>`;
function renderSettings() {
  const changed = G && rulesChanged();
  const notice = !changed ? '' : changesHere() ? '<div class="notice">Platí hned, tvoje rozmístěné lodě zůstávají.</div>'
    : isFresh() ? `<div class="notice">Po návratu do hry začne <b>nová hra</b> s tímto nastavením${!G.started ? ' a lodě se rozmístí znovu' : ''}.</div>`
    : `<div class="notice">Změna platí od příští hry.${hasProgress() ? ' Rozehraná hra zůstává.' : ''}</div>`;
  const fl = FLEETS.find(f => f.id === S.fleet);
  $('#settingsIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Lodě<small>Nastavení</small></h2></div>
    <section class="card"><h3>Soupeř</h3>
      <div class="field">
        ${LEVELS.map((l, i) => opt('level:' + l.id, S.level === l.id, O.levelName(LEVELS, i), l.desc)).join('')}
        <div class="fnote">Soupeř má každou hru jiné jméno. Tvoje lodě nevidí, ví jen to, co se dozvěděl ze svých výstřelů. Kdo začíná, se každou hru střídá.</div>
      </div>
      <div class="field"><div class="flabel">Rychlost soupeře</div>
        ${SPEEDS.map(s => opt('speed:' + s.id, S.speed === s.id, s.name, s.desc)).join('')}
      </div>
    </section>
    <section class="card"><h3>Pravidla</h3>
      <div class="field"><div class="flabel">Loďstvo</div>
        ${FLEETS.map(f => opt('fleet:' + f.id, S.fleet === f.id, f.name, f.desc)).join('')}
      </div>
      ${toggleRow('again', 'Po zásahu střílíš znovu', 'Kdo zasáhne loď, střílí ještě jednou; platí pro oba. Vypnuté: střídáte se vždy po jedné ráně.')}
      ${notice}
    </section>
    <section class="card"><h3>Vzhled</h3>
      <div class="tiles">${THEMES.map(t => `<button class="tile" data-act="theme:${t.id}" aria-pressed="${S.theme === t.id}">${swatch(t.id)}${t.name}</button>`).join('')}</div>
      ${toggleRow('vibrate', 'Vibrace')}
    </section>
    <section class="card"><h3>Statistika</h3>
      <div class="fnote" style="margin:0 0 8px">${fl.name}. Nejméně výstřelů se počítá jen ve vyhrané hře bez rady.</div>
      ${LEVELS.map((l, i) => { const st = ST[stKey(l.id, S.fleet)]; return `<p class="stats"><b>${O.levelName(LEVELS, i)}</b><br>Odehráno ${plural(st.played, 'hra', 'hry', 'her')}, výher ${st.won}${st.best ? `, nejméně výstřelů ${st.best}` : ''}</p>`; }).join('')}
    </section>
    <button class="big" data-act="close">Zpět ke hře</button>
    <button class="link" data-act="reset">Obnovit výchozí nastavení</button>`;
}
$('#settingsIn').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, arg] = b.dataset.act.split(':');
  if (act === 'close') { closeSettings(); return; }
  if (act === 'level') S.level = arg;
  else if (act === 'speed') S.speed = arg;
  else if (act === 'fleet') S.fleet = arg;
  else if (act === 'theme') S.theme = arg;
  else if (act === 'toggle') S[arg] = !S[arg];
  else if (act === 'reset') { S = Object.assign({}, DEFAULTS); toast('Nastavení je zase výchozí'); }
  normalize(S); buzz(8); applyLook(); save();
  const y = $('#screenSettings').scrollTop; renderSettings(); $('#screenSettings').scrollTop = y;
});
function openSettings() { hideToast(); renderSettings(); $('#screenSettings').hidden = false; $('#screenSettings').scrollTop = 0; }
// the opponent and the rules apply from the next game; a game in which you have not shot yet is replaced at once
function closeSettings() {
  $('#screenSettings').hidden = true;
  if (rulesChanged() && changesHere()) { // same opponent face and name, same ships
    const msg = S.level !== G.level ? `Hraješ proti soupeři: ${O.levelName(LEVELS, lvIdx(S.level))}` : S.again ? 'Po zásahu se střílí znovu' : 'Střídáte se po jedné ráně';
    G.level = S.level; G.rules.again = S.again;
    sync(); save(); render(); toast(msg);
  }
  else if (rulesChanged() && isFresh()) newGame('Začala nová hra s novým nastavením'); // keeps the starter
  else if (rulesChanged()) { render(); toast(`Změna platí od příští hry${hasProgress() ? '. Rozehraná hra zůstává.' : ''}`); }
  else render();
  cpuTurn();
}
$('#btnSettings').addEventListener('click', openSettings);

/* ---------- Help (rule: only behind "?", never opens by itself) ---------- */
function renderHelp() {
  $('#helpIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Lodě<small>Jak hrát</small></h2></div>
    <section class="card help"><h3>Pravidla</h3><ul>
      <li>Ty i soupeř máte moře 10 × 10 polí: sloupce A až J, řádky 1 až 10. V něm je schované loďstvo: ${FLEETS.map(f => `<b>${f.name.toLowerCase()}</b> (${f.desc.charAt(0).toLowerCase() + f.desc.slice(1, -1)})`).join(', nebo ')}, podle Nastavení.</li>
      <li>Lodě jsou rovné, leží vodorovně nebo svisle a <b>nesmí se dotýkat</b>, ani rohem.</li>
      <li>Střílíte na střídačku, každý jednou. <b>Kdo zasáhne loď, střílí znovu</b> (dá se vypnout v Nastavení). Kdo začíná, se každou hru střídá.</li>
      <li><b>Voda</b>: vedle. <b>Zásah</b>: trefa do lodi. <b>Potopena</b>: loď má zasažená všechna pole. Kolem potopené lodi se voda označí sama, protože tam už žádná loď být nemůže.</li>
      <li><b>Vyhrává, kdo první potopí celé loďstvo soupeře.</b></li>
    </ul></section>
    <section class="card help"><h3>Ovládání</h3><ol>
      <li><b>Před bitvou</b> jsou tvoje lodě ve velkém moři rozmístěné náhodně. Loď přesuneš tažením prstem, ťuknutím ji otočíš. Zelená loď se tam vejde, červená ne. <b>Zamíchat</b> rozmístí všechny lodě znovu, <b>Zpět</b> vrátí poslední změnu. <b>Hrát</b> začne bitvu.</li>
      <li><b>V bitvě</b> je velké moře soupeřovo: ťukni na pole a vystřel. Tečka je voda, křížek zásah, tmavá loď potopená. Proužky pod soupeřovým jménem jsou jeho lodě; potopené jsou bledé.</li>
      <li>Malé moře pod ním (na širokém okně vedle něj) je tvoje: tvoje lodě a soupeřovy výstřely. Jeho poslední výstřel je orámovaný.</li>
      <li>Výstřel se vrátit nedá (to už by bylo vidět, co tam je). Zpět funguje jen při rozmisťování lodí.</li>
      <li><b>Poradit</b> orámuje pole, kam se nejvíc vyplatí střílet; ťukni na něj. Hra s radou se počítá, ale ne do rekordu nejméně výstřelů.</li>
    </ol></section>
    <section class="card help"><h3>Rady</h3><ul>
      <li>Po zásahu zkoušej pole nahoře, dole, vlevo a vpravo. Šikmo od zásahu loď být nemůže.</li>
      <li>Když hledáš, střílej ob jedno pole jako po šachovnici: žádná loď delší než jedno pole se mezi nimi neschová.</li>
    </ul></section>
    <section class="card help"><h3>Soupeř</h3>
      <p>${LEVELS.map((l, i) => `<b>${O.levelName(LEVELS, i)}</b>: ${l.desc}`).join('<br><br>')}</p>
      <p style="margin-top:12px">Soupeř hraje férově: tvoje lodě nevidí, ví jen to, co se dozvěděl ze svých výstřelů, stejně jako ty. Vybereš ho v Nastavení; každou hru má jiné jméno.</p>
    </section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
}
function openHelp() { hideToast(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; }
$('#helpIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenHelp').hidden = true; });
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
// rule: ask for persistent storage so the browser does not delete the saved game by itself
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const saved = load();
const savedSettings = saved && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
ST = validStats(saved && saved.stats);
// rule: a change made just before the app was closed (Settings still open) is applied now, as closing Settings would
if (saved && validGame(saved.game)) { G = saved.game; sync(); if (rulesChanged() && isFresh()) closeSettings(); else { render(); cpuTurn(); } }
else newGame();

window.addEventListener('resize', layout);
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
document.addEventListener('contextmenu', e => e.preventDefault());

// contract: opened from the launcher (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;

// For testing: the engine, start the battle, shoot at a square (0..99, A1 = 0, B1 = 1, A2 = 10), the computer's ship
// squares not hit yet, and skip(left, lose): plays on at once (your shots hit its ships, or with lose = true go into
// the water, the computer aims as usual) until only `left` squares of the losing fleet are afloat
window.Lode = {
  E, get state() { return { S, G, ST, B }; }, get busy() { return thinking; },
  start() { if (!G.started) $('#btnStart').click(); },
  shoot(i) { if (yourTurn() && !thinking && !B.B[0].k[i]) shoot(0, i); },
  targets: () => G.theirs.flatMap(s => E.cellsOf(s)).filter(i => B.B[0].k[i] < 2),
  skip(left = 1, lose = false) {
    if (G.status !== 'playing') return false;
    if (!G.started) { G.started = true; G.hist = []; drag = null; }
    stopThinking();
    const own = E.shipMap(G.theirs);
    for (let guard = 0; guard < 400 && G.status === 'playing' && (lose ? B.B[1] : B.B[0]).left > left; guard++) {
      if (turn() === 0) {
        const k = B.B[0].k;
        let cell = -1;
        for (let i = 0; i < E.CELLS && cell < 0; i++) if (!k[i] && (own[i] >= 0) !== lose) cell = i;
        for (let i = 0; i < E.CELLS && cell < 0; i++) if (!k[i]) cell = i;
        G.shots.push([0, cell]);
      } else G.shots.push([1, cpuAim()]);
      sync();
    }
    fresh = -1; hintCell = -1; count(); save(); render();
    if (G.status !== 'playing') endDialog(); else cpuTurn();
    return true;
  },
};
})();
</script>
</body>
