<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>

<style>
/* ---------- Themes: a solid colour; everything below reads these variables (rule) ---------- */
/* --hid/--hid2: hidden cells (a quiet checker), --open/--open2: opened cells, --n1…--n8: the numbers */
[data-theme="meadow"]{--page:#244a2c;--bar:rgba(0,0,0,.2);--line:rgba(255,255,255,.08);--ink:#eef6ea;--soft:#c5dcc0;--accent:#ffd54f;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--btn:#ffd54f;--btn-ink:#2a2200;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.22);
  --gapc:#1b3a22;--hid:#9ccc65;--hid2:#92c25b;--hid-hl:rgba(255,255,255,.35);--hid-sh:rgba(0,0,0,.16);--open:#eadbb9;--open2:#e2d1ac;--open-line:rgba(0,0,0,.05);
  --n1:#1a5fc4;--n2:#2a7a2e;--n3:#d02b2b;--n4:#7a1fa0;--n5:#a64d00;--n6:#00808c;--n7:#222;--n8:#6b6b6b;--flag:#e5372f;--pole:#3a2a1a;--mine:#1b1b1b;--boom:#ef5350;--wrong:#c62828;--hintc:#1a5fc4}
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.06);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--accent:#7a4520;--chip:#fff;--chip-line:#e6d8c6;--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--undo-bg:rgba(122,69,32,.1);
  --gapc:#e6d8c6;--hid:#d9c2a2;--hid2:#d9c2a2;--hid-hl:rgba(255,255,255,.45);--hid-sh:rgba(63,34,14,.16);--open:#fffaf3;--open2:#fffaf3;--open-line:rgba(0,0,0,0);
  --n1:#1d5bb8;--n2:#2a7a2e;--n3:#c62828;--n4:#6a1b9a;--n5:#9a4500;--n6:#00756b;--n7:#2b1a0e;--n8:#6f5a48;--flag:#c62828;--pole:#2b1a0e;--mine:#2b1a0e;--boom:#ef7f6f;--wrong:#c62828;--hintc:#1d5bb8}
[data-theme="classic"]{--page:#bdbdbd;--bar:rgba(0,0,0,.06);--line:#a3a3a3;--ink:#1a1a1a;--soft:#454545;--accent:#000080;--chip:#d4d4d4;--chip-line:#8c8c8c;--btn:#000080;--btn-ink:#fff;--btn-sh:#00004d;--undo-bg:#cfcfcf;
  --gapc:#8a8a8a;--hid:#c9c9c9;--hid2:#c9c9c9;--hid-hl:rgba(255,255,255,.95);--hid-sh:rgba(0,0,0,.4);--open:#e6e6e6;--open2:#e6e6e6;--open-line:rgba(0,0,0,0);
  --n1:#0000e0;--n2:#007a00;--n3:#e00000;--n4:#000080;--n5:#800000;--n6:#007b7b;--n7:#000;--n8:#555;--flag:#e00000;--pole:#000;--mine:#000;--boom:#ff3b30;--wrong:#e00000;--hintc:#0000e0}
[data-theme="night"]{--page:#10151c;--bar:rgba(0,0,0,.3);--line:rgba(255,255,255,.07);--ink:#e8edf3;--soft:#a9b4c2;--accent:#ffd166;--chip:rgba(255,255,255,.1);--chip-line:rgba(255,255,255,.18);--btn:#ffd166;--btn-ink:#2a2000;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.3);
  --gapc:#0a0e13;--hid:#3c4d66;--hid2:#38485f;--hid-hl:rgba(255,255,255,.14);--hid-sh:rgba(0,0,0,.3);--open:#1c2430;--open2:#1a222d;--open-line:rgba(255,255,255,.03);
  --n1:#6cb2ff;--n2:#7fd282;--n3:#ff7f76;--n4:#d59cf5;--n5:#ffb454;--n6:#4fd6d6;--n7:#f0f0f0;--n8:#a8b0bb;--flag:#ff6b62;--pole:#e8edf3;--mine:#e8edf3;--boom:#b3261e;--wrong:#ff6b62;--hintc:#ffd166}

/* ---------- Base ---------- */
:root{--gut:12px} /* one side margin: bar buttons, board and bottom buttons line up (the safe areas are on #app) */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
/* rule: 100dvh + safe areas, the board is sized from the room that is left (see layout()) */
#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Top bar (rule: home, Nová hra, <h1> name, ?, settings) ---------- */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;color:var(--ink);white-space:normal;overflow-wrap:normal;word-break:normal} /* a long name wraps to two lines between words, never inside a word and never cut (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);text-decoration:none}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:8px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:20px}
/* narrow phones (360 px): less room between the bar buttons, so the name fits whole at 18 px; the outer margin stays */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill{padding:0 8px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px;letter-spacing:0}
}

/* ---------- Info row: mines left and the clock (rule: info goes on its own row) ---------- */
.stats{flex:none;display:flex;justify-content:center;gap:28px;padding:8px var(--gut) 0;font-size:20px;font-weight:700;color:var(--soft)}
.stats span{display:flex;align-items:center;gap:7px}
.stats b{color:var(--ink);font-size:22px;font-variant-numeric:tabular-nums}
.stats svg{width:22px;height:22px}
.stats .clk{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.stats{--mine:var(--ink)} /* the mine icon in the info row is drawn in the ink colour, readable on the page */

/* ---------- Board: a grid of cells inside #view; it can be zoomed and moved ---------- */
#board{flex:1;min-height:0;display:grid;place-items:center;padding:12px var(--gut)} /* rule: at least 12 px between the board and the rows above and below, on every screen */
#view{position:relative;overflow:hidden;background:var(--gapc);border-radius:6px;touch-action:none;-webkit-touch-callout:none}
#grid{position:absolute;left:0;top:0;transform-origin:0 0;display:grid;grid-template-columns:repeat(var(--w),var(--cs));grid-auto-rows:var(--cs);gap:var(--gap)}
/* sizes inside a cell come from --cs (never a % padding or margin) */
.c{position:relative;display:grid;place-items:center;border-radius:calc(var(--cs)*.12);font:800 calc(var(--cs)*.62)/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.c.h{background:var(--hid);box-shadow:inset 0 calc(var(--cs)*.07) 0 var(--hid-hl),inset 0 calc(var(--cs)*-.09) 0 var(--hid-sh)}
.c.h.alt{background:var(--hid2)}
.c.o{background:var(--open);box-shadow:inset 0 0 0 1px var(--open-line)}
.c.o.alt{background:var(--open2)}
.c.press{filter:brightness(.82)}
.c svg{width:calc(var(--cs)*.74);height:calc(var(--cs)*.74);pointer-events:none}
.c svg + svg{position:absolute;inset:0;margin:auto}
.c.boom{background:var(--boom)}
.c.hint{outline:calc(var(--cs)*.1) solid var(--hintc);outline-offset:calc(var(--cs)*-.1);animation:blink 1.1s ease-in-out infinite}
@keyframes blink{50%{outline-color:color-mix(in srgb,var(--hintc) 50%,transparent)}} /* never fades out: always clearly seen */
.n1{color:var(--n1)}.n2{color:var(--n2)}.n3{color:var(--n3)}.n4{color:var(--n4)}.n5{color:var(--n5)}.n6{color:var(--n6)}.n7{color:var(--n7)}.n8{color:var(--n8)}
.c.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:none;opacity:1}}

/* ---------- Bottom buttons ---------- */
.tray{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px var(--gut) 12px;background:var(--bar);border-top:1px solid var(--line)}
#hint{text-align:center;font-size:19px;line-height:1.3;color:var(--soft);min-height:25px}
.row{display:flex;gap:8px}
.undo{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:64px;border-radius:16px;font-size:17px;font-weight:800;color:var(--ink);background:var(--undo-bg);box-shadow:inset 0 0 0 2px var(--chip-line)}
.undo svg{flex:none;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* the mode switch: what a tap does; in the flag mode it is filled, so it is never overlooked */
#btnMode{flex:1.25 1 0}
#btnMode.flag{background:var(--btn);color:var(--btn-ink);box-shadow:0 3px 0 var(--btn-sh)}
/* an unavailable action: dimmed, explains itself when tapped */
.undo.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */
@media (max-height:700px){
  .topbar{height:54px}
  .round{width:42px;height:42px}
  .pill{height:42px}
  .undo{height:56px}
  .tray{gap:6px;padding:6px var(--gut) 10px}
  #hint{font-size:17px;min-height:22px}
}

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
/* rule: the head with Zpět and the game name stays at the top while scrolling */
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);margin-top:16px}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{font-size:18px;color:var(--psoft);line-height:1.3}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{height:56px;border-radius:10px;background:var(--page);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.help p,.help li{font-size:20px;line-height:1.45}
.help ol{padding-left:26px}
.help li{margin:10px 0}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 160px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;line-height:1.35;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px Georgia,"Times New Roman",serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
/* the toast is placed over the bottom buttons by toast(): smaller, so two lines fit the height of the buttons */
#toast{font-size:17px;line-height:1.25;padding:9px 14px;max-width:calc(100vw - 24px)}
.srow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:20px}
.srow b{font-size:22px}
.swatch{display:flex;align-items:center;justify-content:center;gap:4px;background:var(--page)}
.swatch i{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;font:800 19px/1 system-ui,sans-serif;font-style:normal}
.swatch i.h{background:var(--hid);box-shadow:inset 0 3px 0 var(--hid-hl),inset 0 -3px 0 var(--hid-sh)}
.swatch i.o{background:var(--open)}
.swatch svg{width:22px;height:22px}
.help{--mine:#2b1a0e;--flag:#c62828;--pole:#2b1a0e} /* the icons in the help on the light paper, whatever the theme */
.help .ic{display:inline-block;vertical-align:-4px;width:22px;height:22px}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

/* ---------- Moves ---------- */

/* ---------- Taps ---------- */
function ended() { toast(G.status === 'won' ? 'Vyhráno! Ťukni na Nová hra' : 'Mina! Ťukni na Zpět nebo Nová hra'); }

  if (G.st[c] === 1) { chord(c); return; }

  if (G.st[c] === 2) { toast(S.longPress ? 'Je tu vlajka – odeber ji podržením' : 'Je tu vlajka – odeber ji v režimu Vlajka'); return; }

/* ---------- Helpers ---------- */

/* ---------- Rendering ---------- */
const ICON = id => `<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#${id}"/></svg>`;
const MODE_ICON = {

}
function cellHTML(i, fresh) {

// rule: the board size comes from the room that is left, so it fits without scrolling

let pitch = 0, gw = 0, gh = 0, roomW = 0, roomH = 0, vw = 0, vh = 0;
function layout() {

  roomW = b.clientWidth - 2 * GUT; roomH = b.clientHeight - 24; // inside #board's padding (GUT at the sides, 12 px above and below)
  let p = Math.floor(Math.min(roomW / G.w, roomH / G.h));

/* ---------- Zoom: the Zvětšit button or two fingers; one finger moves a zoomed board ---------- */
let zoom = 1, tx = 0, ty = 0;
// the window onto the board: as big as the board, zoomed up to all the free room (12 px side margins kept)

/* ---------- Settings (rule: a separate screen, applied at once, no Save button) ---------- */

const SW = '<i class="h"><svg viewBox="0 0 24 24"><use href="#sFlag"/></svg></i><i class="o n1">1</i><i class="o n2">2</i><i class="o n3">3</i><i class="h"></i>';
function renderSettings() {
  const st = stats[rulesKey(S)];
  const variant = `${SIZES[S.size].name} plocha, ${S.noGuess ? 'bez hádání' : 's hádáním'}`;
  $('#settingsIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Hledání min<small>Nastavení</small></h2></div>
    <section class="card"><h3>Hra</h3>
      <div class="field"><div class="flabel">Velikost plochy</div>
        ${Object.entries(SIZES).map(([id, z]) => opt('size:' + id, S.size === id, z.name, z.desc)).join('')}
      </div>
      ${toggleRow('noGuess', 'Bez hádání')}
      <div class="fnote" style="margin-top:-6px">Každé rozdání jde celé vyřešit úvahou, nikdy nemusíš hádat. Bez toho se občas hádat musí, jako v klasické hře.</div>
      ${rulesChanged() && !isFresh() ? (inProgress()
        ? '<div class="notice">Rozehraná hra se dohraje podle původního nastavení. Změna platí od příští hry.</div>'
        : '<div class="notice">Po návratu do hry začne <b>nová hra</b> s tímto nastavením.</div>') : ''}
    </section>
    <section class="card"><h3>Ovládání</h3>
      ${toggleRow('longPress', 'Podržením prstu to druhé')}
      <div class="fnote" style="margin-top:-6px">Podržíš-li prst na políčku, udělá se opak ťuknutí: v režimu Odkrýt vlajka, v režimu Vlajka odkrytí. Režim se přepíná tlačítkem dole.</div>
    </section>
    <section class="card"><h3>Vzhled</h3>
      <div class="tiles">${THEMES.map(t => `<button class="tile" data-act="theme:${t.id}" aria-pressed="${S.theme === t.id}"><span class="swatch" data-theme="${t.id}">${SW}</span>${t.name}</button>`).join('')}</div>
      ${toggleRow('vibrate', 'Vibrace')}
    </section>
    <section class="card"><h3>Statistika</h3>
      <div class="fnote" style="margin:0 0 6px">${variant}</div>
      <div class="srow"><span>Dohrané hry</span><b>${st ? st.played : 0}</b></div>
      <div class="srow"><span>Výhry</span><b>${st ? st.won : 0}</b></div>
      ${st && st.helped ? `<div class="srow"><span>Starší výhry s pomocí</span><b>${st.helped}</b></div>` : ''}
      <div class="srow"><span>Nejlepší čas</span><b>${st && st.best !== null ? fmtTime(st.best) : '–'}</b></div>
      <div class="fnote">Počítají se jen dohrané hry (výhra nebo mina) bez Poradit. Zpět po mině je taky pomoc: hra zůstane prohraná.</div>
      <button class="link" data-act="clearStats">Smazat statistiku</button>
    </section>
    <button class="big" data-act="close">Zpět ke hře</button>
    <button class="link" data-act="reset">Obnovit výchozí nastavení</button>`;
}
$('#settingsIn').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, arg] = b.dataset.act.split(':');
  if (act === 'close') { closeSettings(); return; }
  if (act === 'clearStats') {
    showModal('<h2>Smazat statistiku?</h2><p>Smažou se výsledky a nejlepší časy všech velikostí.</p>', [
      { text: 'Ano, smazat', fn: () => {
        stats = {}; G.record = false;
        // the game on the board was counted as played already: it stays counted, so its win can still be added
        if (G.counted && !G.wonCounted && !G.helped) stat().played = 1;
        save(); renderSettings(); toast('Statistika je smazaná'); } },
      { text: 'Ne, nechat', cls: 'alt' }]);
    return;
  }
  if (act === 'size') S.size = arg;
  else if (act === 'theme') S.theme = arg;
  else if (act === 'toggle') S[arg] = !S[arg];
  else if (act === 'reset') { S = Object.assign({}, DEFAULTS); toast('Nastavení je zase výchozí'); }
  normalize(S); buzz(8); applyLook(); save();
  const y = $('#screenSettings').scrollTop; renderSettings(); $('#screenSettings').scrollTop = y;
});
let rulesAtOpen = '';
const sameAtOpen = () => rulesAtOpen === S.size + '|' + S.noGuess; // a toast only for a change made now
function openSettings() { hideToast(); rulesAtOpen = S.size + '|' + S.noGuess; renderSettings(); $('#screenSettings').hidden = false; $('#screenSettings').scrollTop = 0; clockSync(); }
// a change that needs a new game starts it after returning and says so (rule); "Bez hádání" waits for the next
// game while one is in progress
function closeSettings() {
  $('#screenSettings').hidden = true;
  if (rulesChanged() && !inProgress()) newGame(!isFresh() ? 'Začala nová hra s novým nastavením' : '');
  else { clockSync(); render(); if (rulesChanged() && !sameAtOpen()) toast('Změna platí od příští hry. Rozehraná hra zůstává.'); }
}
$('#btnSettings').addEventListener('click', openSettings);

/* ---------- Help (rule: only behind "?", never opens by itself) ---------- */
function renderHelp() {
  const ic = id => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#${id}"/></svg>`;
  $('#helpIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Hledání min<small>Jak hrát</small></h2></div>
    <section class="card help"><ol>
      <li>Pod některými políčky jsou schované miny ${ic('sMine')}. Odkryj všechna políčka, pod kterými mina není.</li>
      <li>Číslo na odkrytém políčku říká, kolik min je v osmi políčkách kolem něj. Políčko bez čísla nemá kolem žádnou minu a samo odkryje sousedy.</li>
      <li><b>První ťuknutí je vždy bezpečné</b> a odkryje kus plochy.</li>
      <li>Tlačítko <b>Odkrýt / Vlajka</b> dole přepíná, co dělá ťuknutí. Vlajkou ${ic('sFlag')} si označíš, kde je podle tebe mina; políčko s vlajkou se omylem neodkryje. Vlajku sundáš dalším ťuknutím v režimu Vlajka${S.longPress ? ' nebo podržením prstu v režimu Odkrýt' : ''}.</li>
      ${S.longPress ? '<li><b>Podržením prstu</b> uděláš opak ťuknutí: v režimu Odkrýt dáš vlajku, v režimu Vlajka políčko odkryješ. Na počítači dělá totéž pravé tlačítko myši.</li>' : '<li>Podržení prstu jde zapnout v Nastavení: pak dělá opak ťuknutí.</li>'}
      <li>Ťukni na odkryté číslo, kolem kterého už je stejně vlajek, kolik ukazuje: odkryjí se všechna ostatní políčka kolem. Když je některá vlajka špatně, vybuchne mina.</li>
      <li>Nahoře je počet min, které zbývá označit (miny minus vlajky), a čas.</li>
      <li><b>Bez hádání</b> (v Nastavení, zapnuto): každé rozdání jde celé vyřešit úvahou. Program to před hrou ověří.</li>
      <li><b>Poradit</b> orámuje políčko, o kterém se dá s jistotou říct, co skrývá: bezpečné políčko, minu bez vlajky nebo špatnou vlajku. Ťuknutím na něj se tah udělá.</li>
      <li><b>Zpět</b> vrátí poslední tah, i šlápnutí na minu. Do statistik se počítají jen dohrané hry bez Poradit; hra se Zpět po mině zůstane prohraná, i když ji pak vyhraješ.</li>
      <li><b>Zvětšit</b> přiblíží plochu, přiblížit jde i dvěma prsty. Přiblíženou plochu posouváš jedním prstem.</li>
      <li>Statistika a nejlepší časy jsou v Nastavení, zvlášť pro každou velikost a pro hru s hádáním a bez.</li>
    </ol></section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
}
function openHelp() { hideToast(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; clockSync(); }
$('#helpIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) { $('#screenHelp').hidden = true; clockSync(); } });
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
// rule: ask for persistent storage so the browser does not delete the saved game by itself
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const saved = load();
const savedSettings = saved && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
if (saved && saved.stats && typeof saved.stats === 'object') {
  for (const [k, v] of Object.entries(saved.stats)) if (/^(small|medium|large)-[01]$/.test(k) && validStat(v)) stats[k] = { played: v.played, won: v.won, helped: v.helped, best: v.best };
}
if (saved && validGame(saved.game)) {
  G = saved.game;
  // rule: a setting chosen just before the app was closed (Settings still open) is applied now, as closing Settings would
  if (rulesChanged() && !inProgress()) closeSettings(); else { render(); clockSync(); } // as closing Settings would
}
else newGame();

window.addEventListener('resize', layout);
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
document.addEventListener('contextmenu', e => e.preventDefault());

// contract: opened from the launcher (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;

// For testing: tap(i) and hold(i) as a finger would; win() opens every safe cell, lose() steps on a mine
const mid = () => (G.h >> 1) * G.w + (G.w >> 1);
window.HledaniMin = {
  E, tap: c => onTap(c), hold: c => onHold(c),
  win() { if (!G.mine) onTap(mid()); for (let i = 0; i < G.w * G.h && G.status === 'playing'; i++) if (!G.mine[i] && G.st[i] !== 1) { if (G.st[i] === 2) toggleFlag(i); openCell(i); } },
  lose() { if (!G.mine) onTap(mid()); const c = G.mine.findIndex((m, i) => m && G.st[i] !== 1); if (G.status === 'playing' && c >= 0) { if (G.st[c] === 2) toggleFlag(c); openCell(c); } },
  get state() { return { S, G, stats }; },
};
})();
</script>
</body>
</html>
