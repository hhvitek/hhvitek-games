<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Hledání min: a 3 × 3 corner of the meadow board: numbers, a flag and a hidden mine shown -->
  <rect width="512" height="512" rx="96" fill="#244a2c"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-weight="800" font-size="104" text-anchor="middle">
    <!-- row 1: 1, 2, a flag -->
    <rect x="48" y="48" width="128" height="128" rx="16" fill="#eadbb9"/>
    <text x="112" y="149" fill="#1a5fc4">1</text>
    <rect x="192" y="48" width="128" height="128" rx="16" fill="#e2d1ac"/>
    <text x="256" y="149" fill="#2a7a2e">2</text>
    <rect x="336" y="48" width="128" height="128" rx="16" fill="#9ccc65"/>
    <rect x="336" y="48" width="128" height="10" rx="5" fill="#fff" opacity=".35"/>
    <path d="M384 72v80" stroke="#3a2a1a" stroke-width="11" stroke-linecap="round"/>
    <path d="M388 72l50 23-50 23z" fill="#e5372f"/>
    <path d="M362 156h46" stroke="#3a2a1a" stroke-width="12" stroke-linecap="round"/>
    <!-- row 2: empty, 1, 3 -->
    <rect x="48" y="192" width="128" height="128" rx="16" fill="#e2d1ac"/>
    <rect x="192" y="192" width="128" height="128" rx="16" fill="#eadbb9"/>
    <text x="256" y="293" fill="#1a5fc4">1</text>
    <rect x="336" y="192" width="128" height="128" rx="16" fill="#e2d1ac"/>
    <text x="400" y="293" fill="#d02b2b">3</text>
    <!-- row 3: 1, a mine, hidden -->
    <rect x="48" y="336" width="128" height="128" rx="16" fill="#eadbb9"/>
    <text x="112" y="437" fill="#1a5fc4">1</text>
    <rect x="192" y="336" width="128" height="128" rx="16" fill="#ef5350"/>
    <path d="M256 352v96M208 400h96M222 366l68 68M290 366l-68 68" stroke="#1b1b1b" stroke-width="12" stroke-linecap="round"/>
    <circle cx="256" cy="400" r="34" fill="#1b1b1b"/>
    <circle cx="244" cy="388" r="10" fill="#fff" opacity=".7"/>
    <rect x="336" y="336" width="128" height="128" rx="16" fill="#92c25b"/>
    <rect x="336" y="336" width="128" height="10" rx="5" fill="#fff" opacity=".35"/>
  </g>
</svg>
