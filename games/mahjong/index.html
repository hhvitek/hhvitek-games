<meta charset="utf-8">
<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mahjong</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23143a38'/%3E%3Crect x='16' y='12' width='34' height='44' rx='5' fill='%233f8f78'/%3E%3Crect x='13' y='9' width='34' height='44' rx='5' fill='%23fbf8ee'/%3E%3Ctext x='30' y='42' font-size='28' text-anchor='middle' fill='%23c62828' font-family='serif'%3E%E4%B8%AD%3C/text%3E%3C/svg%3E">
<style>
/* ---------- Themes ---------- */
[data-theme="night"]{--page:#143a38;--bar:rgba(0,0,0,.18);--line:rgba(255,255,255,.14);--ink:#eef6f2;--soft-ink:#b9cfc7;--act:rgba(255,255,255,.1);--accent:#ffd257;--accent-ink:#1d2a20;--face:#fbf8ee;--edge1:#ddd5bf;--edge2:#3f8f78;--shade:rgba(0,0,0,.45);--sel:#ffe27a;--selring:#e08a00;--hintbg:#c9f5d6;--hintring:#1f9d55;--dimf:brightness(.6) saturate(.55)}
[data-theme="blue"]{--page:#1b2b4a;--bar:rgba(0,0,0,.2);--line:rgba(255,255,255,.14);--ink:#eef2fa;--soft-ink:#b7c3dc;--act:rgba(255,255,255,.1);--accent:#ffd257;--accent-ink:#1b2440;--face:#fbf8ee;--edge1:#ddd5bf;--edge2:#4c78b8;--shade:rgba(0,0,0,.5);--sel:#ffe27a;--selring:#e08a00;--hintbg:#c9f5d6;--hintring:#1f9d55;--dimf:brightness(.6) saturate(.55)}
[data-theme="felt"]{--page:#1f6b45;--bar:rgba(0,0,0,.15);--line:rgba(255,255,255,.16);--ink:#f2f8f3;--soft-ink:#c3dccb;--act:rgba(255,255,255,.12);--accent:#ffd257;--accent-ink:#1d2a20;--face:#fbf8ee;--edge1:#e2d9c3;--edge2:#b0884e;--shade:rgba(0,0,0,.4);--sel:#ffe27a;--selring:#d97a00;--hintbg:#d3f0ff;--hintring:#1d6fd1;--dimf:brightness(.66) saturate(.55)}
[data-theme="wood"]{--page:#6e4a2c;--bar:rgba(0,0,0,.16);--line:rgba(255,255,255,.15);--ink:#fbf2e6;--soft-ink:#e2cdb4;--act:rgba(255,255,255,.12);--accent:#ffd257;--accent-ink:#3a2410;--face:#fbf8ee;--edge1:#e0d6bf;--edge2:#2f7a63;--shade:rgba(0,0,0,.45);--sel:#ffe27a;--selring:#e08a00;--hintbg:#c9f5d6;--hintring:#1f9d55;--dimf:brightness(.64) saturate(.55)}
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.08);--line:#e6d8c6;--ink:#2b1a0e;--soft-ink:#6f5a48;--act:#fff;--accent:#7a4520;--accent-ink:#fff;--face:#fff;--edge1:#e6d8c6;--edge2:#7a4520;--shade:rgba(60,30,10,.3);--sel:#ffe27a;--selring:#d97a00;--hintbg:#c9f5d6;--hintring:#1f9d55;--dimf:brightness(.8) saturate(.45)}

/* ---------- Base ---------- */
:root{--tw:50px;--th:65px;--e:5px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}

#app{--gut:12px;height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--page);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* Top bar */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;line-height:1.05;font-weight:800;font-size:27px;letter-spacing:.02em;color:var(--ink)} /* no nowrap/overflow: a long title wraps between words, never gets cut */
.pill{height:46px;padding:0 16px;border-radius:23px;background:var(--act);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.round{width:46px;height:46px;border-radius:50%;background:var(--act);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{display:flex;gap:8px}
a.round{text-decoration:none}
.topbar:has(#btnHome:not([hidden])){gap:6px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:21px;letter-spacing:0} /* "Mahjong" must fit next to four buttons at 393 px */

/* Board */
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px var(--gut);overflow:hidden} /* 12 px clear of the top bar and the hint line too */
.board{position:relative;flex:none;isolation:isolate}
.t{position:absolute;width:var(--tw);height:var(--th);cursor:pointer}
.fc{position:absolute;left:0;top:0;width:calc(var(--tw) - var(--e));height:calc(var(--th) - var(--e));border-radius:calc(var(--tw) * .11);background-color:var(--face);
  box-shadow:var(--tsh),inset 0 0 0 1px rgba(0,0,0,.1);display:grid;place-items:center;overflow:hidden;transition:background .12s}
.fc svg{width:100%;height:100%;display:block}
.fc .em{font-size:calc(var(--tw) * .56);line-height:1;font-family:"Noto Color Emoji","Segoe UI Emoji","Apple Color Emoji",sans-serif}
.fc.gf{box-shadow:var(--tsh),inset 0 0 0 3px #e46fa6}
.fc.gs{box-shadow:var(--tsh),inset 0 0 0 3px #4a86d8}
.fc.ph{background-position:center;background-repeat:no-repeat;background-size:cover}
.fc.ph.coat,.fc.ph.drawing{background-size:contain;background-origin:content-box;padding:7%} /* % ok: the face is as wide as its tile */
.fc.ph.gf{box-shadow:var(--tsh),inset 0 0 0 4px #e46fa6}
.fc.ph.gs{box-shadow:var(--tsh),inset 0 0 0 4px #4a86d8}
.dim .t.blk .fc{filter:var(--dimf)}
.t.sel .fc{background-color:var(--sel);box-shadow:var(--tsh),inset 0 0 0 3px var(--selring);transform:translate(-2px,-2px)}
.t.sel .fc.ph{box-shadow:var(--tsh),inset 0 0 0 4px var(--selring),inset 0 0 0 200px rgba(255,214,60,.38)}
.t.hl .fc.ph{box-shadow:var(--tsh),inset 0 0 0 4px var(--hintring),inset 0 0 0 200px rgba(60,200,120,.3)}
.t.hl .fc{background-color:var(--hintbg);box-shadow:var(--tsh),inset 0 0 0 3px var(--hintring);animation:pulse .6s ease-in-out 6 alternate}
@keyframes pulse{to{transform:translateY(-4px)}}
.t.shake .fc{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.t.gone{transition:opacity .22s,transform .22s;opacity:0;transform:scale(.6)}
@media (prefers-reduced-motion:reduce){.t.hl .fc,.t.shake .fc{animation:none}.t.gone{transition:none}}
.done{font-size:24px;font-weight:700;text-align:center;line-height:1.4;padding:20px}
.done button{margin-top:18px}

/* Bottom controls */
.tray{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px var(--gut) 10px;background:var(--bar);border-top:1px solid var(--line)}
.hint{height:26px;line-height:26px;text-align:center;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.acts{display:flex;gap:8px}
.act{flex:1 1 0;min-width:0;height:62px;border-radius:14px;background:var(--act);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;font-weight:700;box-shadow:inset 0 0 0 1px var(--line);transition:opacity .2s,transform .06s;white-space:nowrap}
.act:active{transform:scale(.97)}
.act svg{flex:none;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.act.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;font-family:Georgia,serif;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);transition:transform .06s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pbtn-sh)}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0;box-shadow:0 2px 6px rgba(60,30,10,.12)}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink);font-family:Georgia,serif}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{font-size:18px;color:var(--psoft);line-height:1.3}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.trow .flabel{margin:0;flex:1;min-width:0}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{height:70px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--page);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.mini{position:relative;width:38px;height:50px;flex:none}
.mini .fc{width:34px;height:46px;border-radius:5px}
.mini.sel .fc{background-color:var(--sel);box-shadow:var(--tsh),inset 0 0 0 3px var(--selring)}
.mini .em{font-size:24px}
.credits h3{margin-top:6px}.credits li{font-size:18px;line-height:1.35;margin:8px 0;word-break:break-word}.credits a{color:inherit;text-decoration:underline}
.credits ol{padding-left:22px}
.samples{display:flex;gap:6px;margin-top:10px}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}

.help p,.help li{font-size:20px;line-height:1.45}
.help ol{padding-left:26px}
.help li{margin:10px 0}
.legend{display:flex;align-items:center;gap:14px;margin:12px 0;font-size:20px;line-height:1.3}
.legend .ico{flex:none;width:46px;height:46px;border-radius:12px;background:var(--pcard);display:grid;place-items:center}
.legend .ico svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.demo{position:relative;margin:14px auto 6px;border-radius:14px;background:var(--page);padding:14px}
.demo .board{margin:0 auto}
.demo-cap{display:flex;justify-content:space-around;font-size:18px;color:var(--psoft);text-align:center;line-height:1.3}

.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.mcard h2{font-size:28px;font-family:Georgia,serif;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
.mbtns{display:flex;flex-direction:column;gap:14px;margin-top:8px}

/* Shorter screens (e.g. with the browser bar visible) */
@media (max-height:800px){
  .topbar{height:52px}
  .pill{height:42px}.round{width:42px;height:42px}
  .topbar h1{font-size:24px}
  .act{height:56px}
}
/* Narrow phones (360 px wide): smaller gaps and a slimmer "Nová hra", so the title fits next to the home button (the 12 px outer margin stays) */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill{padding:0 10px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px}
}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 130px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;line-height:1.35;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px Georgia,"Times New Roman",serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
</style>
</head>
<body>
<div id="rotate" class="paper" role="status"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="22" y="6" width="20" height="36" rx="4"/><path d="M29 36h6"/><path d="M12 46a22 22 0 0 0 40 0"/><path d="m52 46-1.5 7M52 46l-7 2"/></svg><b>Otoč telefon na výšku</b><span>Hra počká, nic se neztratí.</span></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<div id="app">
  <header class="topbar">
    <a id="btnHome" class="round" href="../../index.html" aria-label="Zpět na výběr her" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2V20a1 1 0 0 1-1 1H15v-5.5H9V21H4.5a1 1 0 0 1-1-1z"/></svg></a>
    <button id="btnNew" class="pill">Nová hra</button>
    <h1>Mahjong</h1>
    <div class="top-right">
      <button id="btnHelp" class="round" aria-label="Jak hrát">?</button>
      <button id="btnSettings" class="round" aria-label="Nastavení"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M9.79 5.57L10.31 3.06A9.1 9.1 0 0 1 13.69 3.06L14.21 5.57A6.8 6.8 0 0 1 16.46 6.87L18.9 6.07A9.1 9.1 0 0 1 20.59 8.99L18.67 10.7A6.8 6.8 0 0 1 18.67 13.3L20.59 15.01A9.1 9.1 0 0 1 18.9 17.93L16.46 17.13A6.8 6.8 0 0 1 14.21 18.43L13.69 20.94A9.1 9.1 0 0 1 10.31 20.94L9.79 18.43A6.8 6.8 0 0 1 7.54 17.13L5.1 17.93A9.1 9.1 0 0 1 3.41 15.01L5.33 13.3A6.8 6.8 0 0 1 5.33 10.7L3.41 8.99A9.1 9.1 0 0 1 5.1 6.07L7.54 6.87A6.8 6.8 0 0 1 9.79 5.57ZM12 8.9a3.1 3.1 0 1 0 0 6.2a3.1 3.1 0 1 0 0 -6.2z"/></svg></button>
    </div>
  </header>

// The game is exactly as tall as the part of the window that is really shown (--app-h on #app). 100dvh alone is not
// enough: some browsers report it taller than what is visible (the app installed by Brave on Android counted the
// status and navigation bars too and hid the bottom buttons). visualViewport follows what is shown; it is measured
// again on every change and shortly after loading (a browser bar that hides itself may change it without an event),
// and a changed height makes the game lay itself out again through a resize event.
(() => {
  const root = document.documentElement;
  let last = 0;
  const measure = () => {
    const vv = window.visualViewport;
    const h = Math.round(vv ? vv.height * vv.scale : innerHeight);
    if (!(h > 0) || h === last) return;
    const first = !last; last = h;
    root.style.setProperty('--app-h', h + 'px');
    if (!first) dispatchEvent(new Event('resize'));
  };
  measure();
  addEventListener('resize', measure);
  if (window.visualViewport) visualViewport.addEventListener('resize', measure);
  addEventListener('pageshow', measure);
  [100, 500, 1500].forEach(ms => setTimeout(measure, ms));

/* ---------- Board geometry ---------- */
const GEO = {};
function geo(id) {
  if (GEO[id]) return GEO[id];

  LAYOUTS[id][2].forEach(([dy, ...rows], z) => rows.forEach((row, r) => {
    for (let c = 0; c < row.length; c++) if (row[c] === '[') pos.push([c, dy + r * 2, z]);
  }));
  const n = pos.length, cover = [], left = [], right = [], rev = [];
  for (let i = 0; i < n; i++) { cover.push([]); left.push([]); right.push([]); rev.push([]); }
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (i !== j) {
    const [x, y, z] = pos[i], [u, v, w] = pos[j];
    if (w > z && Math.abs(u - x) < 2 && Math.abs(v - y) < 2) { cover[i].push(j); rev[j].push([i, 3]); }
    if (w === z && Math.abs(v - y) < 2) {
      if (u === x - 2) { left[i].push(j); rev[j].push([i, 1]); }
      if (u === x + 2) { right[i].push(j); rev[j].push([i, 1]); }
    }
  }
  // draw order: lower layers first, within a layer top to bottom and left to right
  const order = pos.map((_, i) => i).sort((a, b) => pos[a][2] - pos[b][2] || pos[a][1] - pos[b][1] || pos[a][0] - pos[b][0]);
  return (GEO[id] = { id, pos, n, cover, left, right, rev, order });

  for (const t in by) k += by[t] >> 1;

}

/* ---------- Dealing (always solvable) ---------- */
function rnd(n) {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }

  card.innerHTML = html + '<div class="mbtns">' + buttons.map((b, i) => `<button class="big ${b.cls || ''}" data-i="${i}">${b.text}</button>`).join('') + '</div>';
  $('#modal').hidden = false;
  card.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    $('#modal').hidden = true;
    const fn = buttons[+b.dataset.i].fn; if (fn) fn();
  };
}
$('#btnNew').addEventListener('click', () => {
  if (busy) { busyToast(); return; }
  if (hasProgress()) {
    showModal('<h2>Začít novou hru?</h2><p>Rozehraná hra se ztratí.</p>',
      [{ text: 'Nová hra', fn: () => newGame() }, { text: 'Začít tuto znovu', fn: restart }, { text: 'Hrát dál', cls: 'alt' }]);
  } else newGame();
});

/* ---------- Settings ---------- */
const opt = (act, on, title, desc, extra = '') => `<button class="opt" data-act="${act}" aria-pressed="${on}"><span class="radio"></span><span><b>${title}</b>${desc ? `<span class="d">${desc}</span>` : ''}${extra}</span></button>`;
const toggleRow = (key, label, note) => `<div class="field"><div class="trow"><div class="flabel">${label}</div><button class="sw" data-act="toggle:${key}" aria-pressed="${S[key]}">${S[key] ? 'Zapnuto' : 'Vypnuto'}</button></div>${note ? `<div class="fnote">${note}</div>` : ''}</div>`;
const mini = (f, set, sel) => `<span class="mini${sel ? ' sel' : ''}" style="--tw:38px;--e:4px;--tsh:${edgeShadow(4)}">${faceHTML(f, set)}</span>`;

function renderSettings() {
  let pending = '';
  if (S.size !== G.size) {
    pending = hasProgress()
      ? '<div class="notice">Jiná velikost potřebuje nový plán. Po návratu do hry začne <b>nová hra</b>.</div>'
      : '<div class="notice">Po návratu do hry začne nový plán.</div>';
  }
  const smp = set => `<span class="samples">${setOf(set).sample.map(f => mini(f, set)).join('')}</span>`;
  $('#settingsIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Mahjong<small>Nastavení</small></h2></div>
    <section class="card"><h3>Hra</h3>
      <div class="field"><div class="flabel">Velikost plánu</div>
        ${SIZES.map(x => opt('set:size:' + x.id, S.size === x.id, x.name, x.desc)).join('')}
        ${pending}
      </div>
      <div class="field"><div class="flabel">Obrázky na kamenech</div>
        ${SETS.map(x => opt('set:set:' + x.id, S.set === x.id, x.name, x.desc, smp(x.id))).join('')}
      </div>
      ${toggleRow('dim', 'Ztmavit kameny, které nejdou vzít', 'Volné kameny jsou světlé, ostatní ztmavlé. Když je to vypnuté, všechny kameny vypadají stejně a volné se hledají bez pomoci.')}
    </section>
    <section class="card"><h3>Vzhled</h3>
      <div class="tiles">${THEMES.map(t => `<button class="tile" data-act="theme:${t.id}" aria-pressed="${S.theme === t.id}"><span class="swatch" data-theme="${t.id}">${mini(31, S.set)}${mini(4, S.set, true)}</span>${t.name}</button>`).join('')}</div>
      ${toggleRow('vibrate', 'Vibrace')}
    </section>
    <button class="big" data-act="close">Zpět ke hře</button>
    ${Object.keys(IMG).length ? '<button class="link" data-act="credits">Autoři obrázků</button>' : ''}
    <button class="link" data-act="reset">Obnovit výchozí nastavení</button>`;
}
$('#settingsIn').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, key, val] = b.dataset.act.split(':');
  if (act === 'close') { closeSettings(); return; }
  if (act === 'credits') { openCredits(); return; }
  if (act === 'set') S[key] = val;
  else if (act === 'toggle') S[key] = !S[key];
  else if (act === 'theme') S.theme = key;
  else if (act === 'reset') { S = Object.assign({}, DEFAULTS); toast('Nastavení je zase výchozí'); }
  normalize(S);
  buzz(8); applyLook(); save(); renderSettings();
});
function openSettings() { if (busy) { busyToast(); return; } hideToast(); renderSettings(); $('#screenSettings').hidden = false; $('#screenSettings').scrollTop = 0; }
// Settings apply immediately; a different board size needs a new game.
function closeSettings() {
  $('#screenSettings').hidden = true;
  // also after a finished game (rule): only an untouched plan is replaced without a word
  if (S.size !== G.size) { newGame(G.hist.length ? 'Začala nová hra s novou velikostí plánu' : ''); return; }
  save(); render();
}
$('#btnSettings').addEventListener('click', openSettings);

/* ---------- Help ---------- */
function renderHelp() {
  const ico = id => `<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]}</svg></span>`;
  $('#helpIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Mahjong<small>Jak hrát</small></h2></div>
    <section class="card help">
      <ol>
        <li>Odeber všechny kameny z plánu. Bere se vždy <b>dvojice stejných kamenů</b>.</li>
        <li>Ťukni na kámen a potom na druhý stejný. Oba zmizí.</li>
        <li>Vzít jde jen <b>volný kámen</b>: nic na něm neleží a má volný <b>levý nebo pravý bok</b>.
          <div class="demo" id="demo"><div class="board" id="demoBoard"></div></div>
          <div class="demo-cap"><span>krajní jdou vzít,<br>prostřední ne</span><span>vrchní jde vzít,<br>spodní ne</span></div></li>
        <li>${S.dim ? 'Kameny, které teď nejdou vzít, jsou ztmavlé (dá se vypnout v nastavení).' : 'Ztmavení kamenů, které teď nejdou vzít, jde zapnout v nastavení.'}</li>
        <li>Ve velkém plánu jsou navíc dvě skupiny kamenů s rámečkem: <b>${setOf(S.set).groups[0]}</b> (růžový rámeček) a <b>${setOf(S.set).groups[1]}</b> (modrý rámeček). Jakékoli dva kameny ze stejné skupiny jdou k sobě.</li>
        ${setOf(S.set).img ? '<li>Název vybraného kamene se ukáže dole nad tlačítky.</li>' : ''}
      </ol>
    </section>
    <section class="card help"><h3>Tlačítka</h3>
      <div class="legend">${ico('undo')}<span><b>Zpět</b> vrátí poslední tah. Dá se ťukat opakovaně.</span></div>
      <div class="legend">${ico('hint')}<span><b>Poradit</b> ukáže dvojici, kterou jde vzít – když to jde, takovou, se kterou se dá hra dohrát.</span></div>
      <div class="legend">${ico('shuffle')}<span><b>Zamíchat</b> přeskládá zbylé kameny tak, aby se hra dala dohrát.</span></div>
      <p class="fnote">Na čas se nehraje. Když se hra zasekne, pomůže Zamíchat nebo Zpět.</p>
    </section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
  // demo: a row of three tiles and a tile lying on two others
  const dg = { pos: [[0, 0, 0], [2, 0, 0], [4, 0, 0], [8, 0, 0], [10, 0, 0], [9, 0, 1]], n: 6, order: [0, 1, 2, 3, 4, 5] };
  // the picture is six tiles wide: on a narrow phone the tiles get smaller so it stays inside its box (the help is
  // drawn while its screen is still hidden, so the room comes from the window: screen 16 + card 16 + list 26 + box 14)
  const room = Math.min(innerWidth - 32, 560) - 32 - 26 - 28;
  const L = place(dg, dg.order, Math.max(30, Math.min(46, Math.floor((room - 6) / 6)))), demo = $('#demoBoard'), faces = [4, 13, 22, 31, 27, 31];
  setTileVars(demo, L);
  let h = '';
  for (const i of dg.order) {
    const [l, t] = L.P[i], blk = i === 1 || i === 3 || i === 4;
    h += `<div class="t${blk ? ' blk' : ''}" style="left:${l - L.x0}px;top:${t - L.y0}px;z-index:${i}">${faceHTML(faces[i])}</div>`;
  }
  demo.innerHTML = h;
  $('#demo').classList.add('dim');
}
function openCredits() {
  $('#creditsIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Mahjong<small>Autoři obrázků</small></h2></div>
    <section class="card credits"><p class="fnote" style="margin-top:0">Fotografie a znaky pocházejí z Wikimedia Commons. Obrázky jsou zmenšené a oříznuté. Licence: CC BY / CC BY-SA (creativecommons.org), CC0 nebo volné dílo. Kreslené obrázky (houby, ptáci, ovoce a zelenina) jsou nakreslené pro tyto hry a jsou volným dílem (CC0).</p></section>
    ${SETS.filter(x => x.img).map(x => `<section class="card credits"><h3>${x.name}</h3><ol>${IMG[x.id].items.map(it => creditLine(it, x.img === 'drawing')).join('')}</ol></section>`).join('')}
    <button class="big" data-act="close">Zpět</button>`;
  $('#screenCredits').hidden = false; $('#screenCredits').scrollTop = 0;
}
// One line of the credits; the drawings are all by the same author, so they list only the name
const creditLine = ({ name: n, author: a, license: l, source: u }, drawn, pre = '') => drawn ? `<li><b>${pre}${esc(n)}</b></li>`
  : `<li><b>${pre}${esc(n)}</b>: ${esc(a)}, ${esc(l)}, <a href="${esc(u)}" target="_blank" rel="noopener">zdroj</a></li>`;
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
$('#creditsIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenCredits').hidden = true; });
function openHelp() { if (busy) { busyToast(); return; } hideToast(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; }
$('#helpIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenHelp').hidden = true; });
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
const saved = load();
// rule: only the known settings are taken over from the save
const savedSettings = saved && typeof saved === 'object' && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
if (saved && validGame(saved.game)) G = saved.game;
else { G = makeGame(S.size); save(); }
render();

let rT;
const relayout = () => { clearTimeout(rT); rT = setTimeout(() => { if (!busy) render(); }, 60); };
window.addEventListener('resize', relayout);
if (window.visualViewport) visualViewport.addEventListener('resize', relayout);
document.addEventListener('contextmenu', e => e.preventDefault());
// Persistent storage: the browser then won't delete the saved game on its own
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

// Launcher contract: opened from the menu (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;

// For testing
window.Mahjong = { LAYOUTS, geo, deal, solve, isFree, freeList, freePairs, kindOf, newPairs, render, save, tap, get state() { return { S, G }; } };
})();
</script>
