<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>

<style>
/* ---------- Themes ---------- */
[data-theme="sand"]{--page:#cbbd9f;--bg:#efe6d3;--bar:rgba(90,70,40,.08);--line:rgba(90,70,40,.14);--ink:#2b2418;--soft:#6b5b45;--frame:#bba98a;--cell:#ddd0b6;--accent:#b8460b;--btn:#6b4318;--btn-ink:#fff;--btn-sh:#3b2208;--undo-bg:rgba(90,70,40,.12);--chip:rgba(90,70,40,.1)}
[data-theme="paper"]{--page:#f4ebdf;--bg:#f4ebdf;--bar:rgba(122,69,32,.06);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--frame:#b9a68f;--cell:#e7d9c6;--accent:#b8460b;--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--undo-bg:rgba(122,69,32,.1);--chip:#fff}
[data-theme="night"]{--page:#0e1630;--bg:#1d2b52;--bar:rgba(0,0,0,.22);--line:rgba(255,255,255,.08);--ink:#eef3ff;--soft:#b9c6e8;--frame:#111a36;--cell:#2a3a68;--accent:#ffd34d;--btn:#ffd34d;--btn-ink:#2a2000;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.3);--chip:rgba(255,255,255,.14)}
[data-theme="forest"]{--page:#10291b;--bg:#2f6b47;--bar:rgba(0,0,0,.2);--line:rgba(255,255,255,.08);--ink:#eaf7ee;--soft:#c3e3cf;--frame:#1c4630;--cell:#3c7d57;--accent:#ffd66b;--btn:#ffd66b;--btn-ink:#2a2200;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.25);--chip:rgba(255,255,255,.14)}
[data-theme="slate"]{--page:#161b20;--bg:#3d4852;--bar:rgba(0,0,0,.22);--line:rgba(255,255,255,.07);--ink:#eef3f6;--soft:#c3cdd5;--frame:#242b33;--cell:#4e5a66;--accent:#ffcf6b;--btn:#e9eef2;--btn-ink:#1f262c;--btn-sh:#8c979f;--undo-bg:rgba(0,0,0,.28);--chip:rgba(255,255,255,.14)}
[data-theme="contrast"]{--page:#000;--bg:#000;--bar:#000;--line:#555;--ink:#fff;--soft:#fff;--frame:#555;--cell:#161616;--accent:#ffff00;--btn:#ffff00;--btn-ink:#000;--btn-sh:#8a8a00;--undo-bg:#222;--chip:#262626}

/* ---------- Base ---------- */
:root{--cs:80px;--gap:8px;--bpad:8px;--n:4;--ctl-h:64px;--gut:12px} /* --gut: one side margin, bar buttons, board and bottom buttons line up (safe areas are on #app) */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}

#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  box-shadow:0 0 40px rgba(0,0,0,.5)}

/* Top bar */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.round svg{width:28px;height:28px;fill:currentColor}
a.round{text-decoration:none}
.top-right{flex:none;display:flex;gap:8px}
.topbar h1{flex:1;min-width:0;text-align:center;white-space:normal;overflow-wrap:normal;word-break:normal;font-weight:800;font-size:23px;line-height:1.05;letter-spacing:.01em;color:var(--ink)}
.topbar:has(#btnHome:not([hidden])){gap:6px}
.topbar:has(#btnHome:not([hidden])) .pill{padding:0 11px}
.topbar:has(#btnHome:not([hidden])) .top-right{gap:6px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:18px;letter-spacing:0} /* the name wraps between words (two lines fit the bar), never cut */
/* narrow phones (360 px): less room between the bar buttons, so the name fits whole; the outer margin stays */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right,.topbar:has(#btnHome:not([hidden])) .top-right{gap:4px}
  .pill,.topbar:has(#btnHome:not([hidden])) .pill{padding:0 8px}
}

/* Score row */
.score{flex:none;display:flex;align-items:center;justify-content:center;gap:18px;padding:10px var(--gut) 0;line-height:1;white-space:nowrap}
.score b{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.score span{display:flex;align-items:center;gap:4px;font-size:18px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.score svg{width:17px;height:17px;fill:var(--accent)}
.score b.bump{animation:bump .3s ease-out}
@keyframes bump{40%{transform:scale(1.15)}}

/* Board */
.play{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px var(--gut) 8px} /* at least 12 px between the board and the score row / the buttons (8 + the 4 px on top of .controls), on every screen */
.swipe .play{touch-action:none}
.board{position:relative;display:grid;grid-template-columns:repeat(var(--n),var(--cs));grid-auto-rows:var(--cs);gap:var(--gap);padding:var(--bpad);background:var(--frame);border-radius:calc(var(--gap) * 1.6);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.cell{border-radius:calc(var(--cs) * .12);background:var(--cell);box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
.layer{position:absolute;left:var(--bpad);top:var(--bpad);width:0;height:0}
.tile{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);will-change:transform}
.tile.mv{transition:transform .12s ease-out}
.ti{position:absolute;inset:0;border-radius:calc(var(--cs) * .12);background:var(--tc);color:var(--tx);display:grid;place-items:center;
  font-weight:900;font-size:calc(var(--cs) * var(--f));letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  box-shadow:inset 0 calc(var(--cs) * -.06) 0 rgba(0,0,0,.16),inset 0 calc(var(--cs) * .04) 0 rgba(255,255,255,.25),0 2px 3px rgba(0,0,0,.15)}
.ti.hi{text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tile.pop .ti{animation:pop .2s ease-out}
.tile.new .ti{animation:appear .2s ease-out}
@keyframes pop{50%{transform:scale(1.14)}}
@keyframes appear{from{transform:scale(.3);opacity:0}}
/* Picture tiles */
.ti.pic{background-color:var(--tc);background-size:cover;background-position:center;box-shadow:inset 0 0 0 calc(var(--cs) * .05) var(--tc),0 2px 3px rgba(0,0,0,.2)}
.ti.pic.coat,.ti.pic.drawing{background-color:#fff;background-size:76% 76%;background-repeat:no-repeat}
.ti .num{position:absolute;right:calc(var(--cs) * .04);bottom:calc(var(--cs) * .04);padding:1px 6px;border-radius:8px;background:rgba(0,0,0,.78);color:#fff;font-size:max(15px,calc(var(--cs) * .2));line-height:1.2;font-weight:900;text-shadow:none;letter-spacing:0}
[data-theme="contrast"] .ti:not(.pic){background:#000;color:#fff;box-shadow:inset 0 0 0 calc(max(3px,var(--cs) * .06)) var(--tc);text-shadow:none}

/* Controls: Undo + arrows */
.controls{flex:none;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,var(--ctl-h));gap:8px;padding:4px var(--gut) 12px} /* as wide as a full-width board: both end GUT from the sides */
.arrow{border-radius:18px;background:var(--btn);color:var(--btn-ink);box-shadow:0 4px 0 var(--btn-sh);display:grid;place-items:center;transition:transform .06s,box-shadow .06s,opacity .2s}
.arrow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-sh)}
.arrow svg{width:40px;height:40px;fill:currentColor}
.arrow.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */
#mvUp{grid-area:1/2}#mvLeft{grid-area:2/1}#mvDown{grid-area:2/2}#mvRight{grid-area:2/3}
#mvDown svg{transform:rotate(180deg)}#mvLeft svg{transform:rotate(-90deg)}#mvRight svg{transform:rotate(90deg)}
.undo{grid-area:1/1;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:16px;font-size:20px;font-weight:800;color:var(--ink);background:var(--undo-bg);box-shadow:inset 0 2px 5px rgba(0,0,0,.25),inset 0 0 0 2px var(--line);transition:opacity .2s,transform .06s}
.undo svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.undo:active{transform:scale(.97)}
.undo.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px}
.goal{grid-area:1/3;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--soft);line-height:1.15;text-align:center}
.goal b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:64px;border-radius:18px;font-size:24px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);transition:transform .06s,box-shadow .06s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pbtn-sh)}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0;box-shadow:0 2px 6px rgba(60,30,10,.12)}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:10px}
.stepper{display:flex;align-items:center;gap:12px}
.sbtn{flex:none;width:60px;height:60px;border-radius:50%;background:var(--pbtn);color:var(--pbtn-ink);font-size:36px;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 3px 0 var(--pbtn-sh)}
.sbtn.off{background:var(--psw);box-shadow:none;color:var(--psoft)}
.sval{flex:1;text-align:center;font-size:25px;font-weight:800}
.fnote{font-size:18px;color:var(--psoft);margin-top:10px;line-height:1.35}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{font-size:18px;color:var(--psoft);line-height:1.3}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile-opt{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile-opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.swatch{height:100px;border-radius:10px;display:grid;place-items:center;background:var(--bg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.mini{--cs:26px;position:relative;display:grid;grid-template-columns:repeat(3,var(--cs));grid-auto-rows:var(--cs);gap:3px;padding:3px;border-radius:6px;background:var(--frame)}
.mini .ti,.demo .ti{position:relative;inset:auto}
.mini .ti .num{font-size:10px;padding:0 3px;border-radius:4px;right:1px;bottom:1px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.trow .flabel{margin:0}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.credits li{font-size:18px;line-height:1.35;margin:8px 0;word-break:break-word}.credits a{color:inherit;text-decoration:underline}
.credits ol{padding-left:22px}

.help p,.help li{font-size:20px;line-height:1.45}
.help ol{padding-left:26px}
.help li{margin:12px 0}
.demo{--cs:48px;display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px;font-size:26px;font-weight:800;color:var(--psoft)}
.demo .ti{width:var(--cs);height:var(--cs)}

.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:mpop .25s ease-out}
@keyframes mpop{from{transform:scale(.9);opacity:0}}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
.mcard .pts{font-size:44px;font-weight:900;margin:0 0 4px}
.mbtns{display:flex;flex-direction:column;gap:14px;margin-top:8px}

/* Shorter screens (e.g. with the browser bar visible) */
@media (max-height:800px){
  .topbar{height:52px}
  .pill{height:42px}.round{width:42px;height:42px}
  .score{padding-top:8px}
  .score b{font-size:26px}
  .score span{font-size:16px}
  :root{--ctl-h:58px}
  .controls{padding-bottom:10px}
}
/* Taller screens: bigger arrow buttons */
@media (min-height:860px){
  :root{--ctl-h:76px}
  .arrow svg{width:46px;height:46px}
  .controls{gap:10px;padding-bottom:16px}
}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);z-index:60;width:max-content;max-width:90vw;background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;padding:14px 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
</style>

<div id="screenSettings" class="screen paper" hidden><div class="screen-in" id="settingsIn"></div></div>
<div id="screenHelp" class="screen paper" hidden><div class="screen-in" id="helpIn"></div></div>
<div id="screenCredits" class="screen paper" hidden><div class="screen-in" id="creditsIn"></div></div>
<div id="modal" class="modal paper" hidden><div class="mcard" id="modalCard"></div></div>
<div id="toast" class="hide"></div>

<script>
/* ---------- Visible height ---------- */
// The game is exactly as tall as the part of the window that is really shown (--app-h on #app). 100dvh alone is not
// enough: some browsers report it taller than what is visible (the app installed by Brave on Android counted the
// status and navigation bars too and hid the bottom buttons). visualViewport follows what is shown; it is measured
// again on every change and shortly after loading (a browser bar that hides itself may change it without an event),
// and a changed height makes the game lay itself out again through a resize event.
(() => {
  const root = document.documentElement;
  let last = 0;
  const measure = () => {
    const vv = window.visualViewport;
    const h = Math.round(vv ? vv.height * vv.scale : innerHeight);
    if (!(h > 0) || h === last) return;
    const first = !last; last = h;
    root.style.setProperty('--app-h', h + 'px');
    if (!first) dispatchEvent(new Event('resize'));
  };
  measure();
  addEventListener('resize', measure);
  if (window.visualViewport) visualViewport.addEventListener('resize', measure);
  addEventListener('pageshow', measure);
  [100, 500, 1500].forEach(ms => setTimeout(measure, ms));
  // TEMPORARY (2026-11-08): what this page measured, shown in the launcher's Nastavení → "Údaje o obrazovce"
  setTimeout(() => { try {
    const p = document.createElement('div'); p.style.cssText = 'position:absolute;left:-50px;top:0;width:1px;height:100dvh;padding-bottom:env(safe-area-inset-bottom)';
    document.body.appendChild(p); const dvh = Math.round(p.getBoundingClientRect().height - parseFloat(getComputedStyle(p).paddingBottom)), sb = Math.round(parseFloat(getComputedStyle(p).paddingBottom)); p.remove();
    const vv = window.visualViewport;
    localStorage.setItem('games.launcher.diag', JSON.stringify({ page: location.pathname.split('/').slice(-2, -1)[0], vv: vv ? Math.round(vv.height) : null, inner: innerHeight, client: root.clientHeight, dvh, sb, appH: last, app: Math.round(document.getElementById('app').getBoundingClientRect().height) }));
  } catch (e) {} }, 2000);
})();

(() => {
'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;
const GUT = 12; // side margin in px, the same as --gut in the CSS

/* ---------- Constants ---------- */
// Tile colour by value: index = log2(value) - 1 (2, 4, 8, … ; the last one is for everything bigger)
const RAMP = ['#9fd4f0', '#7fd19a', '#f6d55c', '#f6a04d', '#ef6f5e', '#e2457a', '#b25bd6', '#6c6fe0', '#2f8fd8', '#1fa59a', '#e0a91b', '#5b3b8c', '#3b3b4f'];
const DARK_TEXT = 4; // the first 4 colours are light: dark digits, the rest white digits
const THEMES = [
  { id: 'sand',     name: 'Písek',           meta: '#efe6d3' },
  { id: 'paper',    name: 'Papír',           meta: '#f4ebdf' },
  { id: 'night',    name: 'Noc',             meta: '#1d2b52' },
  { id: 'forest',   name: 'Les',             meta: '#2f6b47' },
  { id: 'slate',    name: 'Břidlice',        meta: '#3d4852' },
  { id: 'contrast', name: 'Vysoký kontrast', meta: '#000000' },
];
const GOALS = [
  { id: 512,  name: '512',  desc: 'Kratší hra, cíl je brzy na dosah.' },
  { id: 1024, name: '1024', desc: 'Středně dlouhá hra.' },
  { id: 2048, name: '2048', desc: 'Klasický cíl, chce trpělivost.' },
];
const SIZES = [3, 4, 5, 6];
// On the 3 × 3 grid the goals are a quarter (128 / 256 / 512): nine cells can never hold the tiles 2048 needs
// (the largest tile possible there is 1024, and only with a perfect board)
const goalFor = size => size === 3 ? S.goal / 4 : S.goal;
const goal = () => goalFor(G ? G.n : S.size); // the goal of the game on the board
const IMG = globalThis.IMAGE_SETS || {}, IMG_BASE = '../../images/';
const PIC_LEVELS = 17; // pictures for 2 … 131072
const TILESETS = [{ id: 'numbers', name: 'Čísla' }].concat(Object.keys(IMG).map(id => ({ id, name: IMG[id].name })));
const DEFAULTS = { size: 4, goal: 2048, swipe: true, tiles: 'numbers', theme: 'sand', vibrate: true };
// Saved state under the launcher's games.<id>.* prefix; OLD_KEY is the name used before (read once, then removed)
const KEY = 'games.spojovani-cisel.state', OLD_KEY = 'spojovani-cisel.v1', BADGE = 'games.spojovani-cisel.inProgress';
const HISTORY = 50;
const DIR_NAMES = { up: 'nahoru', down: 'dolů', left: 'doleva', right: 'doprava' };

/* ---------- Game logic ---------- */
function rnd(n) {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  catch (e) { return Math.floor(Math.random() * n); }
}
// Lines of cell indices, each ordered from the edge the tiles move toward
function lines(N, dir) {
  const out = [];
  for (let a = 0; a < N; a++) {
    const l = [];
    for (let b = 0; b < N; b++) {
      let r, c;
      if (dir === 'left') { r = a; c = b; }
      else if (dir === 'right') { r = a; c = N - 1 - b; }
      else if (dir === 'up') { r = b; c = a; }
      else { r = N - 1 - b; c = a; }
      l.push(r * N + c);
    }
    out.push(l);
  }
  return out;
}
// One move: every tile merges at most once, merges start at the edge the tiles move toward
function slide(board, N, dir) {
  const nb = new Array(N * N).fill(0), moves = [], merges = [];
  let gained = 0, moved = false;
  for (const line of lines(N, dir)) {
    const tiles = line.filter(k => board[k] > 0);
    let p = 0;
    for (let i = 0; i < tiles.length; p++) {
      const to = line[p], a = tiles[i], b = tiles[i + 1];
      if (b !== undefined && board[a] === board[b]) {
        nb[to] = board[a] * 2; gained += nb[to];
        moves.push({ from: a, to }, { from: b, to }); merges.push(to);
        moved = true; i += 2;
      } else {
        nb[to] = board[a]; moves.push({ from: a, to });
        if (a !== to) moved = true;
        i += 1;
      }
    }
  }
  return { board: nb, gained, moved, moves, merges };
}
// The tile after a move comes from g.seed (saved with the game and with every Undo step):
// Undo and the same move again give the same new tile, so a bad tile cannot be rolled again
function rand01(g) {
  g.seed = (g.seed + 0x6D2B79F5) | 0;
  let t = g.seed; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
// New tile on a random empty cell: 2 (90 %) or 4 (10 %). Returns its index or -1.
// With a game g the randomness comes from its seed, without one (the first two tiles) from rnd().
function spawn(board, g) {
  const r = g ? n => Math.floor(rand01(g) * n) : rnd;
  const empty = []; board.forEach((v, k) => { if (!v) empty.push(k); });
  if (!empty.length) return -1;
  const k = empty[r(empty.length)];
  board[k] = r(10) === 0 ? 4 : 2;
  return k;
}
function canMove(board, N) {
  for (let k = 0; k < N * N; k++) {
    if (!board[k]) return true;
    const c = k % N;
    if (c < N - 1 && board[k] === board[k + 1]) return true;
    if (k + N < N * N && board[k] === board[k + N]) return true;
  }
  return false;
}
const maxTile = b => Math.max(0, ...b);

/* ---------- State and saving ---------- */
// best = the record of the current grid size; bests[size] = the records of all sizes (a smaller grid is harder)
let S, G, best = 0, bests = {};
const isFresh = () => G.score === 0 && G.history.length === 0;
function normalize(s) {
  s.size = SIZES.includes(+s.size) ? +s.size : DEFAULTS.size;
  s.goal = GOALS.some(g => g.id === +s.goal) ? +s.goal : DEFAULTS.goal;
  if (!THEMES.some(t => t.id === s.theme)) s.theme = DEFAULTS.theme;
  if (!TILESETS.some(t => t.id === s.tiles)) s.tiles = DEFAULTS.tiles;
  for (const k of ['swipe', 'vibrate']) s[k] = !!s[k];
}
function load() {
  try {
    let v = localStorage.getItem(KEY);
    // move the state from the older key at once
    if (v === null && (v = localStorage.getItem(OLD_KEY)) !== null) { localStorage.setItem(KEY, v); localStorage.removeItem(OLD_KEY); }
    return JSON.parse(v);
  } catch (e) { return null; }
}
function save() {
  try {
    if (G) bests[G.n] = best;
    localStorage.setItem(KEY, JSON.stringify({ settings: S, game: G, bests }));
    // Launcher contract: unfinished game = "in progress" badge on the tile
    if (G && G.status === 'playing' && !isFresh()) localStorage.setItem(BADGE, '1');
    else localStorage.removeItem(BADGE);
  } catch (e) {}
}
const okVal = v => v === 0 || (Number.isInteger(v) && v >= 2 && v <= 1 << 20 && (v & (v - 1)) === 0);
const okBoard = (b, N) => Array.isArray(b) && b.length === N * N && b.every(okVal);
function validGame(g) {
  try {
    const N = g.n;
    if (!SIZES.includes(N) || !okBoard(g.board, N)) return false;
    if (typeof g.score !== 'number' || !isFinite(g.score) || !Array.isArray(g.history)) return false;
    g.history = g.history.filter(h => h && okBoard(h.b, N) && typeof h.s === 'number').slice(-HISTORY);
    g.won = !!g.won;
    g.capped = !!g.capped;
    if (!Number.isInteger(g.seed)) g.seed = rnd(2 ** 31);
    delete g.bestAtStart; // not used any more (older saves have it)
    if (g.board.every(v => !v)) { spawn(g.board); spawn(g.board); }
    g.status = canMove(g.board, N) ? 'playing' : 'over'; // the end comes from the board, never from the save
    // counted: the record already took this game's first end; older saves updated the record during play,
    // so a game that is already over was counted then
    if (typeof g.counted !== 'boolean') g.counted = g.status === 'over';
    return true;
  } catch (e) { return false; }
}
function newGame() {
  finishAnim(); clearTimeout(modalT);
  const N = S.size, b = new Array(N * N).fill(0);
  spawn(b); spawn(b);
  best = bests[N] || 0;
  G = { n: N, board: b, score: 0, history: [], status: 'playing', won: false, counted: false, seed: rnd(2 ** 31) };
  $('#modal').hidden = true;
  save(); render();
}

/* ---------- Helpers ---------- */
function buzz(ms = 12) { if (S.vibrate && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }
let toastT;
function hideToast() { clearTimeout(toastT); $('#toast').classList.add('hide'); }
// rule: an end dialog belongs to the game that ended and never opens over Settings, Help or another dialog:
// whenFree waits until they are closed, then runs fn - if the game is still the same (not a new one meanwhile)
const nothingOpen = () => ['#modal', '#screenSettings', '#screenHelp', '#screenCredits'].every(s => { const el = document.querySelector(s); return !el || el.hidden; });
function whenFree(g0, ms, fn) {
  setTimeout(function wait() {
    if (G !== g0) return;
    if (nothingOpen()) fn(); else setTimeout(wait, 400);
  }, ms);
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hide');
  // just below the score row, never over it (the CSS top is the fallback)
  const row = document.querySelector('.score').getBoundingClientRect(); if (row.height) t.style.top = Math.round(row.bottom + 8) + 'px';
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hide'), 2600);
}
const fmt = n => n.toLocaleString('cs-CZ');
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const level = v => Math.round(Math.log2(v)); // 2 → 1, 4 → 2, …
function fontFactor(v) {
  const d = String(v).length;
  return d <= 2 ? .5 : d === 3 ? .4 : d === 4 ? .31 : .25;
}
// Inner tile HTML (number or picture with a number badge)
function tileInner(v, tiles, extra = '') {
  const lv = level(v), col = RAMP[Math.min(lv - 1, RAMP.length - 1)];
  const set = tiles !== 'numbers' && IMG[tiles];
  if (set && lv <= PIC_LEVELS && set.items[lv - 1]) {
    const it = set.items[lv - 1];
    return `<div class="ti pic${set.kind === 'coat' || set.kind === 'drawing' ? ' ' + set.kind : ''}${extra}" style="--tc:${col};background-image:url('${IMG_BASE + it.file}')"><span class="num">${v}</span></div>`;
  }
  return `<div class="ti${lv > DARK_TEXT ? ' hi' : ''}${extra}" style="--tc:${col};--tx:${lv > DARK_TEXT ? '#fff' : '#1e1e28'};--f:${fontFactor(v)}">${v}</div>`;
}

/* ---------- Rendering ---------- */
let CS = 80, GAP = 8, builtN = 0, layer = null;
const posOf = k => { const N = G.n; return `translate(${(k % N) * (CS + GAP)}px,${(k / N | 0) * (CS + GAP)}px)`; };
function applyLook() {
  root.dataset.theme = S.theme;
  root.classList.toggle('swipe', S.swipe);
  document.querySelector('meta[name="theme-color"]').content = THEMES.find(t => t.id === S.theme).meta;
}
function buildBoard() {
  if (builtN === G.n && layer) return;
  builtN = G.n;
  const bd = $('#board');
  bd.style.setProperty('--n', G.n);
  bd.innerHTML = '<div class="cell"></div>'.repeat(G.n * G.n) + '<div class="layer" id="layer"></div>';
  layer = $('#layer');
}
// fx: { merges: [k], spawned: k } for the effects after a move
function renderTiles(fx) {
  let html = '';
  G.board.forEach((v, k) => {
    if (!v) return;
    const cls = fx && fx.merges.includes(k) ? ' pop' : fx && fx.spawned === k ? ' new' : '';
    html += `<div class="tile${cls}" style="transform:${posOf(k)}">${tileInner(v, S.tiles)}</div>`;
  });
  layer.innerHTML = html;
}
function render(fx) {
  applyLook();
  buildBoard();
  layout();
  renderTiles(fx);
  $('#score').textContent = fmt(G.score);
  $('#best').textContent = fmt(best);
  $('#goal').textContent = goal();
  $('#btnUndo').classList.toggle('dim', !G.history.length);
  document.querySelectorAll('.arrow').forEach(b => b.classList.toggle('dim', G.status === 'over'));
}
function layout() {
  if (!G) return;
  const N = G.n, play = $('#play');
  // the room inside .play (flex:1, so its size does not depend on the board): GUT at the sides, 12 px above, 8 px below
  // (+ 4 px of .controls); a short window shrinks the board instead of letting it touch the score row or the buttons
  const avail = Math.max(60, Math.min(play.clientWidth - 2 * GUT, play.clientHeight - 20, 540));
  const gap = N >= 6 ? 6 : N === 5 ? 7 : 9;
  const cell = Math.floor((avail - 2 * gap - (N - 1) * gap) / N);
  // the frame (1 gap) also takes the rounding remainder, so a full-width board ends exactly GUT from the sides
  const bpad = (avail - N * cell - (N - 1) * gap) / 2;
  CS = cell; GAP = gap;
  root.style.setProperty('--cs', cell + 'px');
  root.style.setProperty('--gap', gap + 'px');
  root.style.setProperty('--bpad', bpad + 'px');
}

// rule: only a finished game counts. The record is taken once, at the first end of the game (no move left); Undo
// after the end does not take it back and a later end of the same game is not counted again (so playing and
// undoing cannot inflate it). A game left unfinished (Nová hra, closing the app) never touches the record.
let endCounted = true, endRec = false; // the end just reached: was it counted, and was it a new record
function recordEnd() {
  endCounted = !G.counted; endRec = false;
  if (G.counted) return;
  G.counted = true;
  if (G.score > best) { best = G.score; endRec = true; }
}

/* ---------- Moving ---------- */
let anim = null, modalT = null, winDue = null; // winDue: the game whose "Výborně!" dialog is still to come
function finishAnim() {
  if (!anim) return;
  clearTimeout(anim.t);
  const a = anim; anim = null;
  renderTiles(a.fx);
}
function move(dir) {
  if (!$('#screenSettings').hidden || !$('#screenHelp').hidden || !$('#screenCredits').hidden || !$('#modal').hidden) return;
  finishAnim();
  if (G.status === 'over') { toast('Už se nedá táhnout – ťukni na Zpět nebo Nová hra'); return; }
  const N = G.n, prev = G.board, res = slide(prev, N, dir);
  if (!res.moved) { toast('Směrem ' + DIR_NAMES[dir] + ' se nic nepohne'); return; }
  G.history.push({ b: prev.slice(), s: G.score, w: G.won, seed: G.seed });
  if (G.history.length > HISTORY) { G.history.shift(); G.capped = true; } // older moves can no longer be undone
  G.board = res.board;
  G.score += res.gained;
  const spawned = spawn(G.board, G);
  let win = false;
  if (!G.won && maxTile(G.board) >= goal()) { G.won = true; win = true; winDue = G; }
  if (!canMove(G.board, N)) { G.status = 'over'; recordEnd(); }
  save();

  // Animation: old tiles slide to their new places, then the final board is drawn
  let html = '';
  for (const m of res.moves) html += `<div class="tile mv" data-to="${m.to}" style="transform:${posOf(m.from)}">${tileInner(prev[m.from], S.tiles)}</div>`;
  layer.innerHTML = html;
  void layer.offsetWidth;
  for (const el of layer.children) el.style.transform = posOf(+el.dataset.to);
  anim = { fx: { merges: res.merges, spawned }, t: setTimeout(finishAnim, 125) };

  $('#score').textContent = fmt(G.score);
  $('#best').textContent = fmt(best);
  $('#btnUndo').classList.toggle('dim', false);
  document.querySelectorAll('.arrow').forEach(b => b.classList.toggle('dim', G.status === 'over'));
  if (res.gained) { const sc = $('#score'); sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump'); }
  buzz(res.merges.length ? 20 : 8);
  clearTimeout(modalT);
  const g0 = G, h0 = G.history.length; // an Undo meanwhile cancels the dialog (clearTimeout(modalT) and the history check)
  // winDue: the goal was reached and its dialog has not been shown yet; a quick next move (within the 0.45 s)
  // starts the wait again instead of losing the dialog for good
  if (winDue === G) modalT = setTimeout(() => whenFree(g0, 0, () => { if (winDue === g0 && G.won) { winDue = null; showWin(); } }), 450);
  else if (G.status === 'over') modalT = setTimeout(() => whenFree(g0, 0, () => { if (G.status === 'over' && G.history.length === h0) showOver(); }), 700);
}
function undo() {
  finishAnim(); clearTimeout(modalT);
  if (!G.history.length) { toast(G.capped ? 'Dál už se vrátit nedá' : 'Zatím není co vracet'); return; }
  const h = G.history.pop();
  // the goal may have been raised since that move: it is reached only when the board has it
  G.board = h.b; G.score = h.s; G.won = !!h.w && maxTile(h.b) >= goal(); G.status = 'playing';
  if (!G.won) winDue = null;
  if (Number.isInteger(h.seed)) G.seed = h.seed; // the same move again gives the same new tile
  $('#modal').hidden = true;
  buzz(); save(); render();
}

/* ---------- Controls ---------- */
$('.controls').addEventListener('click', e => {
  const b = e.target.closest('[data-dir]'); if (b) move(b.dataset.dir);
});
$('#btnUndo').addEventListener('click', undo);
// Swipe on the board (an extra; the arrows are always there)
let sw = null;
$('#play').addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  sw = { x: e.clientX, y: e.clientY, id: e.pointerId };
});
window.addEventListener('pointerup', e => {
  if (!sw || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if (Math.max(ax, ay) < 30) {
    if (G.status === 'over') { toast('Už se nedá táhnout – ťukni na Zpět nebo Nová hra'); return; }
    toast(S.swipe ? 'Posouvej šipkami dole nebo táhni prstem po desce' : 'Posouvej šipkami dole');
    return;
  }
  if (!S.swipe) { toast('Posouvej šipkami dole (tah prstem je vypnutý v nastavení)'); return; }
  move(ax > ay ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
window.addEventListener('pointercancel', () => { sw = null; });
document.addEventListener('keydown', e => {
  const dir = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[e.key];
  if (dir) { e.preventDefault(); move(dir); }
});

/* ---------- Dialogs ---------- */
function showModal(html, buttons) {
  hideToast();
  const card = $('#modalCard');
  card.innerHTML = html + '<div class="mbtns">' + buttons.map((b, i) => `<button class="big ${b.cls || ''}" data-i="${i}">${b.text}</button>`).join('') + '</div>';
  $('#modal').hidden = false;
  card.onclick = e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    $('#modal').hidden = true;
    const fn = buttons[+b.dataset.i].fn; if (fn) fn();
  };
}
function showWin() {
  if (!$('#modal').hidden) return;
  const over = G.status === 'over';
  showModal(
    `<h2>Výborně! 🎉</h2><p>Na desce je <b>${maxTile(G.board)}</b>.</p><p class="pts">${fmt(G.score)}</p>`
      + (over && endRec ? '<p><b>Nový rekord! 🎉</b></p>' : '<p>bodů</p>'),
    over ? [{ text: 'Nová hra', fn: newGame }, { text: 'Vrátit tah', cls: 'alt', fn: undo }, { text: 'Prohlédnout desku', cls: 'alt' }]
         : [{ text: 'Hrát dál', fn: () => toast('Hraj dál, jak dlouho to půjde') }, { text: 'Nová hra', cls: 'alt', fn: newGame }]
  );
}
function showOver() {
  if (!$('#modal').hidden) return;
  showModal(
    `<h2>Už se nedá táhnout</h2><p class="pts">${fmt(G.score)}</p><p>${endRec ? '<b>Nový rekord! 🎉</b>' : `bodů · rekord ${fmt(best)}`}</p>`
      + (endCounted ? '' : '<p>Tahle hra už jednou skončila, do rekordu se znovu nepočítá.</p>'),
    [{ text: 'Nová hra', fn: newGame }, { text: 'Vrátit tah', cls: 'alt', fn: undo }, { text: 'Prohlédnout desku', cls: 'alt' }]
  );
}
$('#btnNew').addEventListener('click', () => {
  if (G.status === 'playing' && !isFresh()) {
    showModal('<h2>Začít novou hru?</h2><p>Rozehraná hra se ztratí.</p>',
      [{ text: 'Ano, nová hra', fn: newGame }, { text: 'Ne, hrát dál', cls: 'alt' }]);
  } else newGame();
});

/* ---------- Settings ---------- */
function toggleRow(key, label) {
  return `<div class="field trow"><div class="flabel">${label}</div><button class="sw" data-act="toggle:${key}" aria-pressed="${S[key]}">${S[key] ? 'Zapnuto' : 'Vypnuto'}</button></div>`;
}
function mini(tiles, vals) {
  return `<span class="mini">${vals.map(v => v ? tileInner(v, tiles) : '<i class="cell"></i>').join('')}</span>`;
}
const SAMPLE = [2, 0, 4, 0, 8, 2, 16, 32, 64];
function renderSettings() {
  const si = SIZES.indexOf(S.size);
  const pending = S.size !== G.n && !isFresh()
    ? '<div class="notice">Jiná velikost mřížky potřebuje novou hru. Po návratu do hry začne <b>nová hra</b>.</div>' : '';
  const sets = TILESETS.length > 1 ? `<div class="field"><div class="flabel">Dlaždice</div>
        <div class="tiles">${TILESETS.map(t => `<button class="tile-opt" data-act="tiles:${t.id}" aria-pressed="${S.tiles === t.id}"><span class="swatch">${mini(t.id, [2, 4, 8, 16, 0, 32, 64, 128, 256])}</span>${esc(t.name)}</button>`).join('')}</div>
        <div class="fnote">U obrázků je číslo vždy v rohu dlaždice.</div></div>` : '';
  $('#settingsIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Spojování čísel<small>Nastavení</small></h2></div>
    <section class="card"><h3>Pravidla hry</h3>
      <div class="field"><div class="flabel">Velikost mřížky</div><div class="stepper">
        <button class="sbtn${si > 0 ? '' : ' off'}" data-act="size:-1" aria-label="Menší">−</button>
        <div class="sval">${S.size} × ${S.size}</div>
        <button class="sbtn${si < SIZES.length - 1 ? '' : ' off'}" data-act="size:1" aria-label="Větší">+</button>
      </div><div class="fnote">Větší mřížka je snazší (víc místa), menší je těžší. Každá velikost má svůj rekord. Počítají se jen dohrané hry.</div>${pending}</div>
      <div class="field"><div class="flabel">Cíl hry</div>${GOALS.map(g => `<button class="opt" data-act="goal:${g.id}" aria-pressed="${S.goal === g.id}"><span class="radio"></span><span><b>${S.size === 3 ? g.id / 4 : g.name}</b><span class="d">${g.desc}</span></span></button>`).join('')}
        <div class="fnote">Cíl platí hned. Po dosažení cíle se dá hrát dál.${S.size === 3 ? ' Na mřížce 3 × 3 jsou cíle menší, větší čísla se na ni nevejdou.' : ''}</div></div>
    </section>
    <section class="card"><h3>Ovládání</h3>
      ${toggleRow('swipe', 'Posouvat i tahem prstem po desce')}
      <div class="fnote" style="margin-top:-6px">Šipky pod deskou fungují vždy.</div>
    </section>
    <section class="card"><h3>Vzhled</h3>
      ${sets}
      <div class="field"><div class="flabel">Barvy</div>
        <div class="tiles">${THEMES.map(t => `<button class="tile-opt" data-act="theme:${t.id}" aria-pressed="${S.theme === t.id}"><span class="swatch" data-theme="${t.id}">${mini('numbers', SAMPLE)}</span>${t.name}</button>`).join('')}</div></div>
      ${toggleRow('vibrate', 'Vibrace')}
    </section>
    <button class="big" data-act="close">Zpět ke hře</button>
    ${TILESETS.length > 1 ? '<button class="link" data-act="credits">Autoři obrázků</button>' : ''}
    <button class="link" data-act="reset">Obnovit výchozí nastavení</button>`;
}
$('#settingsIn').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const [act, arg] = b.dataset.act.split(':');
  if (act === 'close') { closeSettings(); return; }
  if (act === 'credits') { openCredits(); return; }
  if (act === 'size') {
    const si = SIZES.indexOf(S.size) + +arg;
    if (si < 0) { toast('Menší mřížka už není'); return; }
    if (si >= SIZES.length) { toast('Větší mřížka už není'); return; }
    S.size = SIZES[si];
  } else if (act === 'toggle') S[arg] = !S[arg];
  else if (act === 'goal') S.goal = +arg;
  else if (act === 'tiles') S.tiles = arg;
  else if (act === 'theme') S.theme = arg;
  else if (act === 'reset') { S = Object.assign({}, DEFAULTS); toast('Nastavení je zase výchozí'); }
  buzz(8); applyLook(); save(); renderSettings();
});
function openSettings() { hideToast(); finishAnim(); renderSettings(); $('#screenSettings').hidden = false; $('#screenSettings').scrollTop = 0; }
// Settings apply immediately; a different grid size needs a new game.
function closeSettings() {
  $('#screenSettings').hidden = true;
  if (S.size !== G.n) {
    const had = !isFresh(); // also after a finished game: it could still be revived by Undo
    newGame();
    if (had) toast('Začala nová hra s mřížkou ' + S.size + ' × ' + S.size);
    return;
  }
  if (G.won && maxTile(G.board) < goal()) { G.won = false; winDue = null; save(); } // a higher goal: its win comes when it is reached
  render();
  // A lower goal may already be reached
  if (!G.won && G.status === 'playing' && maxTile(G.board) >= goal()) { G.won = true; save(); showWin(); }
}
$('#btnSettings').addEventListener('click', openSettings);

/* ---------- Credits ---------- */
// One line of the credits; the drawings are all by the same author, so they list only the name
const creditLine = ({ name: n, author: a, license: l, source: u }, drawn, pre = '') => drawn ? `<li><b>${pre}${esc(n)}</b></li>`
  : `<li><b>${pre}${esc(n)}</b> – ${esc(a)}, ${esc(l)}, <a href="${esc(u)}" target="_blank" rel="noopener">zdroj</a></li>`;
function openCredits() {
  $('#creditsIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Spojování čísel<small>Autoři obrázků</small></h2></div>
    <section class="card credits"><p class="fnote" style="margin-top:0">Fotografie a znaky pocházejí z Wikimedia Commons. Obrázky jsou zmenšené a oříznuté. Licence: CC BY / CC BY-SA (creativecommons.org), CC0 nebo volné dílo. Kreslené obrázky (houby, ptáci, ovoce a zelenina) jsou nakreslené pro tyto hry a jsou volným dílem (CC0).</p></section>
    ${Object.keys(IMG).map(id => `<section class="card credits"><h3>${esc(IMG[id].name)}</h3><ol>${IMG[id].items.slice(0, PIC_LEVELS).map((it, i) => creditLine(it, IMG[id].kind === 'drawing', `${2 ** (i + 1)}: `)).join('')}</ol></section>`).join('')}
    <button class="big" data-act="close">Zpět</button>`;
  $('#screenCredits').hidden = false; $('#screenCredits').scrollTop = 0;
}
$('#creditsIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenCredits').hidden = true; });

/* ---------- Help ---------- */
function renderHelp() {
  const t = v => tileInner(v, 'numbers');
  $('#helpIn').innerHTML = `
    <div class="screen-head"><button class="back" data-act="close">‹ Zpět</button><h2>Spojování čísel<small>Jak hrát</small></h2></div>
    <section class="card help">
      <ol>
        <li>Ťukni na <b>šipku</b> pod deskou${S.swipe ? ' nebo táhni prstem po desce' : ''}. Všechna čísla se posunou tím směrem až ke kraji.</li>
        <li>Když do sebe narazí <b>dvě stejná čísla</b>, spojí se do jednoho – jejich součtu.
          <div class="demo">${t(2)}${t(2)}<span>→</span>${t(4)}</div>
          <div class="demo">${t(8)}${t(8)}<span>→</span>${t(16)}</div></li>
        <li>Po každém tahu přibude na prázdném místě nová dvojka (občas čtyřka).</li>
        <li>Cílem je poskládat číslo <b>${goal()}</b>. Potom se dá hrát dál.</li>
        <li>Body přibývají za každé spojení. Nikam se nespěchá.</li>
        <li>Hra končí, když je deska plná a nic se nedá spojit. Tlačítko <b>Zpět</b> vrátí poslední tah – i na konci hry.</li>
        <li>Do rekordu se počítají jen dohrané hry: body se zapíšou, až se už nedá táhnout. Když hru po konci vrátíš tlačítkem Zpět a dohraješ znovu, rekord se už nezmění.</li>
        <li>Rada: drž největší číslo v jednom rohu a posouvej hlavně dvěma směry.</li>
      </ol>
    </section>
    <button class="big" data-act="close">Rozumím, hrát</button>`;
}
function openHelp() { hideToast(); finishAnim(); renderHelp(); $('#screenHelp').hidden = false; $('#screenHelp').scrollTop = 0; }
$('#helpIn').addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) $('#screenHelp').hidden = true; });
$('#btnHelp').addEventListener('click', openHelp);

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const saved = load();
// rule: only the known settings are taken over from the save
const savedSettings = saved && typeof saved === 'object' && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
const okRec = v => typeof v === 'number' && isFinite(v) && v >= 0;
if (saved && saved.bests && typeof saved.bests === 'object') for (const n of SIZES) if (okRec(saved.bests[n])) bests[n] = saved.bests[n];
const hasGame = saved && validGame(saved.game);
// an older save had one record for all sizes: it belongs to the size of the saved game (usually 4 × 4)
if (saved && okRec(saved.best) && !saved.bests) bests[hasGame ? saved.game.n : DEFAULTS.size] = saved.best;
if (hasGame) {
  G = saved.game; best = bests[G.n] || 0;
  if (G.status === 'over') recordEnd();
  // closed while Settings were open after the size was changed: the new game starts now, as closing Settings would
  if (S.size !== G.n) closeSettings(); else render();
}
else newGame();

const relayout = () => { finishAnim(); layout(); renderTiles(); };
window.addEventListener('resize', relayout);
if (window.visualViewport) visualViewport.addEventListener('resize', relayout);
document.addEventListener('contextmenu', e => e.preventDefault());

// Launcher contract: opened from the menu (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;

// For testing
window.SpojovaniCisel = {
  slide, spawn, canMove, move, undo,
  get state() { return { S, G, best, bests }; },
  setBoard(b) { finishAnim(); G.board = b.slice(); G.status = canMove(G.board, G.n) ? 'playing' : 'over'; save(); render(); },
};
})();
</script>
