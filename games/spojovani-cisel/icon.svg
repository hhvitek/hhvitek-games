<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".12"/>
    </linearGradient>
    <!-- one tile 124×124 -->
    <g id="t"><rect width="124" height="124" rx="18"/><rect width="124" height="124" rx="18" fill="url(#g)"/></g>
    <rect id="e" width="124" height="124" rx="18" fill="#ddd0b6"/>
  </defs>
  <!-- background and 3×3 board (step 140) -->
  <rect width="512" height="512" fill="#efe6d3"/>
  <rect x="38" y="38" width="436" height="436" rx="30" fill="#bba98a"/>
  <use href="#e" x="54" y="54"/><use href="#e" x="194" y="54"/><use href="#e" x="334" y="54"/>
  <use href="#e" x="54" y="194"/><use href="#e" x="194" y="194"/><use href="#e" x="334" y="194"/>
  <use href="#e" x="54" y="334"/><use href="#e" x="194" y="334"/><use href="#e" x="334" y="334"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <!-- top row: 2 . 8 -->
    <use href="#t" x="54" y="54" fill="#9fd4f0"/><text x="116" y="142" font-size="78" fill="#1e1e28">2</text>
    <use href="#t" x="334" y="54" fill="#f6d55c"/><text x="396" y="142" font-size="78" fill="#1e1e28">8</text>
    <!-- middle row: 4 ← 4 (merging) -->
    <use href="#t" x="54" y="194" fill="#7fd19a"/><text x="116" y="282" font-size="78" fill="#1e1e28">4</text>
    <path d="M300 256h-66m0 0 26-26m-26 26 26 26" fill="none" stroke="#b8460b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#t" x="334" y="194" fill="#7fd19a"/><text x="396" y="282" font-size="78" fill="#1e1e28">4</text>
    <!-- bottom row: 16 2 . -->
    <use href="#t" x="54" y="334" fill="#f6a04d"/><text x="116" y="420" font-size="66" fill="#1e1e28">16</text>
    <use href="#t" x="194" y="334" fill="#9fd4f0"/><text x="256" y="422" font-size="78" fill="#1e1e28">2</text>
  </g>
</svg>
