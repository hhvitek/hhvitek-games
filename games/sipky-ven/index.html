<script>
/* ---------- Error log ---------- */
(() => {
  const KEY = 'games.errors', KEEP_STATES = 3, MAX_STATE = 60000;
  const GAME = (location.pathname.match(/\/games\/([^/]+)\//) || [])[1] || 'launcher';
  const VERSION = (() => { try { const v = JSON.parse(localStorage.getItem('games.launcher.install')); return v && v.version || ''; } catch (e) { return ''; } })();
  const DEVICE = `${navigator.userAgent} (${navigator.platform || 'neznámá platforma'})`;
  // the game's last saved state (usually the one before the move that failed), so the error can be repeated
  function savedState() {
    if (GAME === 'launcher') return '';
    try { const s = localStorage.getItem(`games.${GAME}.state`) || ''; return s.length > MAX_STATE ? s.slice(0, MAX_STATE) + ' …(zkráceno)' : s; } catch (e) { return ''; }
  }
  let writes = 0;
  function log(type, message, where, stack) {
    if (writes >= 20) return;
    writes++;
    const entry = { game: GAME, v: VERSION, t: new Date().toISOString(), type, msg: String(message || 'Neznámá chyba').slice(0, 1000), where: String(where || '').slice(0, 500), stack: String(stack || '').slice(0, 3000), device: DEVICE };
    let list = [];
    try { const saved = JSON.parse(localStorage.getItem(KEY) || '[]'); if (Array.isArray(saved)) list = saved.filter(x => x && typeof x === 'object'); } catch (e) {}
    const last = list[list.length - 1];
    if (last && last.game === entry.game && last.type === entry.type && last.msg === entry.msg && last.where === entry.where) { last.n = (Number(last.n) || 1) + 1; last.t = entry.t; }
    else { const s = savedState(); if (s) entry.state = s; list.push(entry); }
    list = list.slice(-50);
    // only the newest few entries keep a state, so the log stays small next to the games' own saves
    let kept = 0;
    for (let i = list.length - 1; i >= 0; i--) if (list[i].state && ++kept > KEEP_STATES) delete list[i].state;
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch (e) { try { list.forEach(x => { delete x.state; }); localStorage.setItem(KEY, JSON.stringify(list)); } catch (e2) {} }
  }
  addEventListener('error', e => { if (e.message || e.error) log('error', e.message || (e.error && e.error.message), `${e.filename || location.href}:${e.lineno || 0}:${e.colno || 0}`, e.error && e.error.stack); });
  addEventListener('unhandledrejection', e => { const r = e.reason; log('unhandledrejection', r && (r.message || r.stack) || r, location.href, r && r.stack); });
  // test: open any game or the launcher with ?testError to record one test error
  if (/[?&]testError\b/.test(location.search)) setTimeout(() => { throw new Error('Testovací chyba (?testError)'); });
})();
</script>

<style>
/* ---------- Themes: a solid colour; everything below reads these variables (rule) ---------- */
[data-theme="paper"]{--page:#f4ebdf;--bar:rgba(122,69,32,.06);--line:#e6d8c6;--ink:#2b1a0e;--soft:#6f5a48;--chip:#fff;--chip-line:#e6d8c6;--btn:#7a4520;--btn-ink:#fff;--btn-sh:#3f220e;--undo-bg:rgba(122,69,32,.1);
  --field:#fbf6ee;--field-line:#e6d8c6;--dot:rgba(122,69,32,.3);--arrow:#4a2c17;--hintc:#1f5fd6;--bump:#c62828;--heart:#c62828}
[data-theme="night"]{--page:#131c2e;--bar:rgba(0,0,0,.25);--line:rgba(255,255,255,.08);--ink:#eef3fb;--soft:#b9c6dc;--chip:rgba(255,255,255,.12);--chip-line:rgba(255,255,255,.2);--btn:#ffd166;--btn-ink:#2a2000;--btn-sh:#a3842a;--undo-bg:rgba(0,0,0,.28);
  --field:#1c2842;--field-line:rgba(255,255,255,.1);--dot:rgba(255,255,255,.24);--arrow:#e9eefb;--hintc:#ffd166;--bump:#ff6b6b;--heart:#ff6b6b}
[data-theme="sky"]{--page:#d8e9f5;--bar:rgba(20,60,100,.06);--line:#bcd5e8;--ink:#12324a;--soft:#3f6580;--chip:#fff;--chip-line:#bcd5e8;--btn:#1d5f8f;--btn-ink:#fff;--btn-sh:#0f3a5a;--undo-bg:rgba(20,60,100,.08);
  --field:#f3f9fd;--field-line:#bcd5e8;--dot:rgba(20,60,100,.28);--arrow:#1d4f75;--hintc:#e07a00;--bump:#d32f2f;--heart:#d32f2f}

/* ---------- Base ---------- */
:root{--gut:12px} /* one side margin: bar buttons, board and bottom buttons line up (the safe areas are on #app) */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
html{background:var(--page)}
body{background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
/* rule: 100dvh + safe areas, the board is sized from the room that is left (see layout()) */
#app{height:100vh;height:100dvh;height:var(--app-h,100dvh);max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Top bar (rule: home, Nová hra, <h1> name, ?, settings) ---------- */
.topbar{flex:none;height:60px;display:flex;align-items:center;gap:10px;padding:0 var(--gut);background:var(--bar);border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;text-align:center;font-size:26px;font-weight:800;line-height:1.05;color:var(--ink);white-space:normal;overflow-wrap:normal;word-break:normal} /* a long name wraps to two lines between words, never inside a word and never cut (rule) */
.pill{flex:none;height:46px;padding:0 16px;border-radius:23px;background:var(--chip);font-size:18px;font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line)}
.round{flex:none;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--ink);box-shadow:inset 0 0 0 2px var(--chip-line);text-decoration:none}
.round svg{width:28px;height:28px;fill:currentColor}
.top-right{flex:none;display:flex;gap:8px}
.topbar:has(#btnHome:not([hidden])){gap:8px}
.topbar:has(#btnHome:not([hidden])) h1{font-size:20px}
/* narrow phones (360 px): less room between the bar buttons, so the name fits whole at 18 px; the outer margin stays */
@media (max-width:380px){
  .topbar,.topbar:has(#btnHome:not([hidden])){gap:4px}
  .top-right{gap:4px}
  .pill{padding:0 8px}
  .topbar:has(#btnHome:not([hidden])) h1{font-size:18px;letter-spacing:0}
  .stats{font-size:18px}
}

/* ---------- Score row (rule: info goes on its own row, not in place of the name) ---------- */
.stats{flex:none;text-align:center;padding:8px var(--gut) 0;font-size:20px;font-weight:700;line-height:1.3;color:var(--soft);white-space:nowrap}
.stats b{color:var(--ink)}
.hearts{display:inline-flex;gap:3px;vertical-align:-3px}
.hearts svg{width:20px;height:20px}
.hearts .full{fill:var(--heart)}
.hearts .empty{fill:none;stroke:var(--soft);stroke-width:2.2px}

/* ---------- GAME: the board ---------- */
#board{flex:1;min-height:0;display:grid;place-items:center;padding:12px var(--gut)} /* rule: at least 12 px between the board and the rows above and below, on every screen */
#field{width:var(--fw);height:var(--fh);display:grid;place-items:center;background:var(--field);border-radius:16px;box-shadow:inset 0 0 0 2px var(--field-line)}
#field.won{box-shadow:inset 0 0 0 4px var(--btn)}
#svg{display:block;width:var(--sw);height:var(--sh);overflow:hidden;cursor:pointer}

/* the dots and the arrows (SVG, 100 units per cell; px in SVG are its units) */
.fld{fill:var(--field);stroke:var(--field-line);stroke-width:6px}
.dot{fill:var(--dot)}
.pc{color:var(--arrow)}
.pc .sh{fill:none;stroke:currentColor;stroke-width:19px;stroke-linecap:round}
.pc .hd{fill:currentColor;stroke:currentColor;stroke-width:7px;stroke-linejoin:round}
.pc .halo{display:none;fill:color-mix(in srgb,var(--hintc) 16%,transparent);stroke:var(--hintc);stroke-width:7px}
.pc.hint{color:var(--hintc)}
.pc.hint .halo{display:inline;animation:blink 1.1s ease-in-out infinite}
.pc.bump{color:var(--bump)}
.pc.blk .halo{display:inline;fill:color-mix(in srgb,var(--bump) 14%,transparent);stroke:var(--bump)}
.pc.out{pointer-events:none}
@keyframes blink{50%{stroke-opacity:.3;fill-opacity:.4}}

/* ---------- Bottom buttons ---------- */
.tray{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px var(--gut) 12px;background:var(--bar);border-top:1px solid var(--line)}
#hint{text-align:center;font-size:19px;font-weight:600;line-height:1.3;color:var(--ink);min-height:25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:10px}
.undo{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;height:64px;border-radius:16px;font-size:21px;font-weight:800;color:var(--ink);background:var(--undo-bg);box-shadow:inset 0 0 0 2px var(--chip-line)}
.undo svg{flex:none;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.go{flex:1.4 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;height:64px;border-radius:16px;font-size:21px;font-weight:800;background:var(--btn);color:var(--btn-ink);box-shadow:0 4px 0 var(--btn-sh);white-space:nowrap}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-sh)}
.go svg{flex:none;width:26px;height:26px;fill:currentColor}
/* an unavailable action: dimmed, explains itself when tapped */
.undo.dim{opacity:1;filter:none;background:transparent;box-shadow:none;text-shadow:none;color:color-mix(in srgb,var(--ink) 85%,transparent);outline:2px dashed color-mix(in srgb,var(--ink) 45%,transparent);outline-offset:-2px} /* unavailable: readable text, no fill, a dashed outline (not only opacity) */

@media (max-height:800px){
  .topbar{height:54px}
  .stats{padding-top:6px}
  .tray{gap:6px;padding:6px var(--gut) 10px}
  .undo,.go{height:58px}
}
@media (prefers-reduced-motion:reduce){
  .pc.hint .halo{animation:none}
}

/* Settings, help and dialogs: one light look, the same in every game and in the launcher (not the game theme) */
.paper{--pp:#f4ebdf;--pink:#2b1a0e;--pcard:#faf4eb;--popt:#fcf8f2;--popt-on:#f6e9d7;--psoft:#6f5a48;--pline:#e6d8c6;--psw:#e7d9c6;--pbtn:#7a4520;--pbtn-ink:#fff;--pbtn-sh:#3f220e;--pon:#7a4520;--pon-ink:#fff}
.screen{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--pp);color:var(--pink);padding:0 16px calc(env(safe-area-inset-bottom) + 28px);overscroll-behavior:contain}
.screen-in{max-width:560px;margin:0 auto}
/* rule: the head with Zpět and the game name stays at the top while scrolling */
.screen-head{position:sticky;top:0;z-index:2;background:var(--pp);display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:2px solid var(--pline)}
.screen-head h2{font-size:26px;line-height:1.15;min-width:0}
.screen-head h2 small{display:block;font:700 18px system-ui,sans-serif;color:var(--psoft)}
.back{flex:none;height:52px;padding:0 20px;border-radius:26px;background:var(--pbtn);color:var(--pbtn-ink);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--pbtn-sh)}
.big{display:block;width:100%;height:62px;border-radius:18px;font-size:23px;font-weight:800;background:var(--pbtn);color:var(--pbtn-ink);box-shadow:0 4px 0 var(--pbtn-sh);margin-top:16px}
.big.alt{background:var(--psw);color:var(--pink);box-shadow:0 4px 0 var(--pline)}
.card{background:var(--pcard);border-radius:18px;padding:16px;margin:16px 0}
.card h3{font-size:23px;margin-bottom:4px;color:var(--pink)}
.field{padding:14px 0;border-top:2px solid var(--pline)}
.card h3 + .field{border-top:0}
.flabel{font-size:20px;font-weight:700;margin-bottom:6px}
.fnote{font-size:18px;color:var(--psoft);margin-top:8px;line-height:1.35}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:16px;border:3px solid var(--pline);margin-top:10px;background:var(--popt);color:var(--pink)}
.opt[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
.radio{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--pbtn);display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"] .radio::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--pbtn)}
.opt b{display:block;font-size:20px;margin-bottom:3px}
.opt .d{font-size:18px;color:var(--psoft);line-height:1.3}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw{flex:none;min-width:124px;height:54px;border-radius:27px;font-size:19px;font-weight:800;background:var(--psw);color:var(--pink)}
.sw[aria-pressed="true"]{background:var(--pon);color:var(--pon-ink)}
.stepper{display:flex;align-items:center;gap:12px}
.sbtn{flex:none;width:60px;height:60px;border-radius:50%;background:var(--pbtn);color:var(--pbtn-ink);font-size:36px;font-weight:700;line-height:1;display:grid;place-items:center;box-shadow:0 3px 0 var(--pbtn-sh)}
.sbtn.dim{background:var(--psw);box-shadow:none;color:var(--psoft)}
.sval{flex:1;text-align:center;font-size:25px;font-weight:800}
.sval small{display:block;font-size:20px;letter-spacing:2px;color:var(--pbtn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.tile{border-radius:16px;border:3px solid var(--pline);padding:8px;background:var(--popt);font-size:18px;font-weight:700;display:flex;flex-direction:column;gap:8px;color:var(--pink)}
.tile[aria-pressed="true"]{border-color:var(--pbtn);background:var(--popt-on)}
/* a small board in the theme tiles and the help pictures */
.mini{display:flex;justify-content:center;align-items:center;gap:10px;border-radius:12px;background:var(--page);padding:8px}
.mini svg{display:block;flex:none}
.tile .mini svg{width:92px;height:69px}
.help .mini{margin:10px 0 4px;flex-wrap:wrap}
.help .mini svg{width:120px;height:90px}
.help .mini .arrow{font-size:20px;font-weight:800;line-height:1.2;text-align:center;color:var(--ink)}
.stars{font-size:40px;letter-spacing:6px;color:var(--pbtn);margin:-4px 0 6px}
.notice{background:color-mix(in srgb,var(--pon) 18%,var(--pp));border:2px solid var(--pon);border-radius:14px;padding:14px;margin-top:12px;font-size:18px;line-height:1.35}
.link{display:block;margin:18px auto 0;padding:12px 16px;font-size:18px;color:var(--psoft);text-decoration:underline}
.help p,.help li{font-size:20px;line-height:1.45}
.help ol{padding-left:26px}
.help li{margin:10px 0}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.mcard{width:100%;max-width:380px;background:var(--pp);color:var(--pink);border-radius:22px;padding:24px 20px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mcard h2{font-size:28px;margin-bottom:10px}
.mcard p{font-size:20px;line-height:1.4;margin-bottom:12px}
/* the toast sits over the row of bottom buttons (toast()), never over the board: a big board fills the screen;
   one or two lines fit the row (keep the messages short) */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);z-index:60;width:max-content;max-width:min(90vw,520px);background:color-mix(in srgb,var(--ink) 94%,var(--page));color:var(--page);font-size:19px;font-weight:600;line-height:1.25;padding:10px 18px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center;transition:opacity .25s;pointer-events:none}
#toast.hide{opacity:0}
#toast{font-size:17px;padding:9px 14px;max-width:calc(100vw - 24px)}
/* Where supported, the toast text is pushed away from the ink colour, so it stays readable on every theme */
@supports (color: rgb(from red r g b)){
  #toast{background:var(--ink);color:color-mix(in srgb,var(--page) 35%,rgb(from var(--ink) calc(255 - r) calc(255 - g) calc(255 - b)))}
}
/* Rotate notice: the games are made for a phone held upright. Turned sideways (a short landscape window), a calm
   notice in the paper look covers the game until the phone is turned back; the game underneath stays as it was. */
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:1000;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:var(--pp);color:var(--pink)}
  #rotate svg{width:88px;height:88px;fill:none;stroke:var(--pbtn);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  #rotate b{font:700 26px Georgia,"Times New Roman",serif;color:#5a3214}
  #rotate span{font-size:20px;color:var(--psoft)}
}
</style>

<!-- Every layer is shown and hidden only through its hidden attribute; every screen has a [data-act="close"] button (Back button contract) -->
<div id="screenSettings" class="screen paper" hidden><div class="screen-in" id="settingsIn"></div></div>
<div id="screenHelp" class="screen paper" hidden><div class="screen-in" id="helpIn"></div></div>
<div id="modal" class="modal paper" hidden><div class="mcard" id="modalCard"></div></div>

<script>
/* ---------- Visible height ---------- */
// The game is exactly as tall as the part of the window that is really shown (--app-h on #app). 100dvh alone is not
// enough: some browsers report it taller than what is visible (the app installed by Brave on Android counted the
// status and navigation bars too and hid the bottom buttons). visualViewport follows what is shown; it is measured
// again on every change and shortly after loading (a browser bar that hides itself may change it without an event),
// and a changed height makes the game lay itself out again through a resize event.
(() => {
  const root = document.documentElement;
  let last = 0;
  const measure = () => {
    const vv = window.visualViewport;
    const h = Math.round(vv ? vv.height * vv.scale : innerHeight);
    if (!(h > 0) || h === last) return;
    const first = !last; last = h;

  const sv = $('#svg'), gone = goneOf(G);
  sv.setAttribute('viewBox', `0 0 ${G.cols * 100} ${G.rows * 100}`);
  sv.innerHTML = `<g>${dotsSVG(G.cols, G.rows, G.mask)}</g><g class="pcs">${G.pieces.map((p, i) => gone[i] ? '' : pieceSVG(p, i)).join('')}</g>`;
  pcsEl = sv.querySelector('.pcs');

}
const HEART = '<path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3 5 6.4 5c2.1 0 3.6 1.2 5.6 3.3C14 6.2 15.5 5 17.6 5 21 5 23 8.4 21.6 11.7 19.5 16.4 12 21 12 21z"/>';
function render() {
  applyLook();
  if (!G) return;
  const won = G.status === 'won', lost = G.status === 'lost';
  pcsEl.querySelectorAll('.pc.hint').forEach(el => el.classList.remove('hint'));
  if (G.hint !== null) { const el = pieceEl(G.hint); if (el) el.classList.add('hint'); }
  $('#field').classList.toggle('won', won);
  const left = G.lives ? Math.max(0, G.lives - G.bumps) : 0;
  const tail = G.lives
    ? `<span class="hearts" aria-label="Životy: ${left} z ${G.lives}">${Array.from({ length: G.lives }, (_, k) => `<svg viewBox="0 0 24 24" class="${k < left ? 'full' : 'empty'}">${HEART}</svg>`).join('')}</span>`
    : `Chyby: <b>${G.bumps}</b>`;
  $('#stats').innerHTML = `Úroveň <b>${G.level}</b> · Zbývá <b>${leftCount()}</b> · ${tail}`;
  $('#hint').textContent = won ? `Vyřešeno! ${starText(starsOf(G.bumps + G.hints))}`
    : lost ? 'Došly životy, zkus to znovu'
    : G.hint !== null ? 'Ťukni na šipku v rámečku'
    : 'Pusť ven šipku s volnou cestou';
  $('#btnUndo').classList.toggle('dim', won || lost || !G.history.length);
  $('#btnGo').innerHTML = won ? nextLabel() : lost ? 'Zkusit znovu'
    : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2zm-3 18h6v1a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1z"/></svg>Poradit';

// rule: the board size comes from the room that is left, so it fits without scrolling
const PAD = 10; // the field around the cells
function layout() {
  if (!G) return;
  const b = $('#board'), bs = getComputedStyle(b);
  const w = b.clientWidth - parseFloat(bs.paddingLeft) - parseFloat(bs.paddingRight);   // without the side margin (--gut)
  const h = b.clientHeight - parseFloat(bs.paddingTop) - parseFloat(bs.paddingBottom) - 2; // 12 px above and below
  // cells as big as the room allows (up to 84 px); a very short window (desktop) shrinks them down to 12 px rather than overflow
  const cs = Math.max(12, Math.min(84, Math.floor(Math.min((w - 2 * PAD) / G.cols, (h - 2 * PAD) / G.rows))));
  root.style.setProperty('--sw', G.cols * cs + 'px');
  root.style.setProperty('--sh', G.rows * cs + 'px');
  // the field reaches the side margin; it is only as tall as the cells need
  root.style.setProperty('--fw', Math.max(w, 0) + 'px');
  root.style.setProperty('--fh', Math.min(Math.max(h, 0), G.rows * cs + 2 * PAD) + 'px');
}

/* ---------- Animations ---------- */
const at = (d, u) => `translate(${DX[d] * u}px,${DY[d] * u}px)`;
// slides an arrow out over the edge (or, back = true, in from there)
function slide(el, p, back) {
  const far = (E.exitDist(G, p) + p[3]) * 100 + 60, ms = reducedMotion() ? 0 : Math.min(560, 170 + far * .28);
  if (!ms || !el.animate) return null;
  const frames = [{ transform: at(p[2], 0), opacity: 1 }, { transform: at(p[2], far * .7), opacity: 1, offset: .7 }, { transform: at(p[2], far), opacity: 0 }];
  return el.animate(back ? frames.reverse() : frames, { duration: ms, easing: back ? 'cubic-bezier(0,0,.4,1)' : 'cubic-bezier(.5,0,1,1)' });
}
// a bump: forward up to what is in the way and back
function bumpAnim(el, p, dist) {
  if (reducedMotion() || !el.animate) return;
  const u = dist * 100 + 34;
  el.animate([{ transform: at(p[2], 0) }, { transform: at(p[2], u), offset: .45 }, { transform: at(p[2], u - 12), offset: .6 }, { transform: at(p[2], 0) }],
    { duration: 300 + dist * 45, easing: 'ease-in-out' });
}
function flash(el, cls, ms) {
  if (!el) return;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms);
}

/* ---------- Playing ---------- */
const nextLabel = () => G.level < MAX_LEVEL ? 'Další úroveň' : 'Hrát znovu';
const wonToast = () => toast(`Vyřešeno – ťukni na ${nextLabel()}`);
const lostToast = () => toast('Došly životy – ťukni na Zkusit znovu');
function takeOut(i) {
  const p = G.pieces[i];
  G.history.push(i);
  if (G.hint === i) G.hint = null;   // another arrow out keeps the frame: the framed one stays free
  hideToast();                       // an older toast (a bump, the hint) no longer fits
  const el = pieceEl(i);
  if (el) {
    el.classList.remove('hint', 'bump', 'blk'); el.classList.add('out');
    pcsEl.appendChild(el);                          // above the others while it slides
    const a = slide(el, p, false);
    if (a) { leaving[i] = el; a.onfinish = () => { el.remove(); if (leaving[i] === el) delete leaving[i]; }; }
    else el.remove();

  if (G.status === 'won') { win(); return; }
  buzz(); save(); render();
}
function bump(i, b) {
  G.bumps++;

  if (el) { bumpAnim(el, G.pieces[i], b.dist); flash(el, 'bump', 650); }
  flash(pieceEl(b.by), 'blk', 650);
  buzz(70);
  G.status = statusOf(G);
  save(); render();
  if (G.status === 'lost') { lose(); return; }
  toast(G.lives ? `Náraz! ${G.lives - G.bumps === 1 ? 'Zbývá poslední život' : `Zbývají ${livesWord(G.lives - G.bumps)}`}` : 'Náraz! Té šipce stojí v cestě jiná', 1800);
}
// a tap on arrow i: out when its way is free, else it bumps and stays
function tapPiece(i) {

  if (G.status === 'won') { wonToast(); return; }
  if (G.status === 'lost') { lostToast(); return; }
  const gone = goneOf(G);
  if (gone[i]) return;

}
function win() {
  const slips = G.bumps + G.hints, prev = bests[G.level];

  top = Math.max(top, clampLevel(G.level + 1));
  level = clampLevel(G.level + 1);
  hideToast(); save(); render();
  buzz([40, 60, 40, 60, 80]);

  whenFree(G, reducedMotion() ? 400 : 900, () => showWin(prev));
}
function showWin(prev) {
  const slips = G.bumps + G.hints, st = starsOf(slips);
  const how = !slips ? 'bez jediné chyby a bez rady' : `Chyby: ${G.bumps}, rady: ${G.hints}`;
  showModal(`<h2>Výborně!</h2><div class="stars" aria-label="Hvězdy: ${st} ze 3">${starText(st)}</div><p>Úroveň ${G.level} je vyřešená${slips ? '.</p><p>' + how + '.' : ' ' + how + '.'}</p>`
    + (prev === undefined || slips >= prev ? '' : st > starsOf(prev) ? `<p>Víc hvězd než minule (${starText(starsOf(prev))}).</p>`
      : `<p>Lepší než minule: chyb a rad ${slips}, minule ${prev}.</p>`),
    [{ text: nextLabel(), fn: () => newGame(level) }, { text: 'Zavřít', cls: 'alt' }]);
}
function lose() {
  hideToast();

    [{ text: 'Zkusit znovu', fn: () => restart() }, { text: 'Prohlédnout', cls: 'alt' }]));

// the arrow under a tap: the one on the tapped cell, else the nearest one a little beside it (small cells)
function pieceAt(ux, uy) {

  // a tap on a cell: its arrow, or nothing on an empty cell (never the neighbour: a bump would count)
  if (cx >= 0 && cy >= 0 && cx < G.cols && cy < G.rows) return occ[cy * G.cols + cx] - 1;
  // just outside the cells (the field's edge): the nearest arrow close to it
  let best = -1, bd = 30;
  G.pieces.forEach((p, i) => {
    if (gone[i]) return;
    for (const [x, y] of E.cellsOf(p)) {
      const dx = Math.max(0, Math.abs(ux - (x * 100 + 50)) - 50), dy = Math.max(0, Math.abs(uy - (y * 100 + 50)) - 50), dd = Math.hypot(dx, dy);

// on the whole field, so a tap just beside the cells still finds the arrow next to it
$('#field').addEventListener('click', e => {

  const r = $('#svg').getBoundingClientRect();
  if (!r.width || !r.height) return;
  const i = pieceAt((e.clientX - r.left) / r.width * G.cols * 100, (e.clientY - r.top) / r.height * G.rows * 100);

// rule: Undo ("Zpět") puts the last arrow back; mistakes and hints stay counted
$('#btnUndo').addEventListener('click', () => {

  if (G.status === 'lost') { lostToast(); return; }
  if (!G.history.length) { toast('Zatím není co vrátit'); return; }
  const i = G.history.pop(); G.hint = null;   // the arrow put back may stand in the framed one's way
  hideToast();
  if (leaving[i]) { leaving[i].getAnimations().forEach(a => a.cancel()); leaving[i].remove(); delete leaving[i]; }
  pcsEl.insertAdjacentHTML('beforeend', pieceSVG(G.pieces[i], i));

// Poradit: an arrow that can go out now; a tap on it takes it out (frame, class hint)
function freeNow() { return E.freePieces(G, goneOf(G)); }

/* ---------- Back button ---------- */
// Android Back (gesture or button) closes the topmost open screen or dialog, like its own Zpět button,
// instead of leaving the game. Each open layer gets one history entry.
(() => {
  const LAYERS = ['#modal', '#screenCredits', '#screenHelp', '#screenSettings']; // topmost first
  const openLayers = () => LAYERS.map(s => document.querySelector(s)).filter(el => el && !el.hidden);
  let pushed = 0, skip = 0;
  const sync = () => {
    const n = openLayers().length;
    while (pushed < n) history.pushState({ layer: ++pushed }, '');
    if (pushed > n) { history.go(n - pushed); pushed = n; skip++; } // closed by its own button: drop our entries
  };
  new MutationObserver(sync).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['hidden'] });
  addEventListener('popstate', () => {
    if (skip) { skip--; return; }
    pushed = Math.max(0, pushed - 1);
    const top = openLayers()[0]; if (!top) return;
    const btn = top.querySelector('[data-act="close"]');
    if (btn) btn.click();     // a screen: same as tapping its Zpět (settings apply their changes)
    else top.hidden = true;   // a dialog: dismissed without choosing, like "Ne, hrát dál" / "Prohlédnout"
  });
  // reloaded while a screen was open: leftover entries of ours would swallow one Back press
  if (history.state && history.state.layer) { skip++; history.go(-history.state.layer); }
})();

/* ---------- Start ---------- */
// rule: ask for persistent storage so the browser does not delete the saved game by itself
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
const saved = load();
const savedSettings = saved && saved.settings && typeof saved.settings === 'object' ? saved.settings : {};
S = Object.assign({}, DEFAULTS);
for (const k of Object.keys(DEFAULTS)) if (k in savedSettings) S[k] = savedSettings[k];
normalize(S);
// records: only whole levels with a sensible number of slips
if (saved && saved.bests && typeof saved.bests === 'object') for (const [k, v] of Object.entries(saved.bests)) {
  const lv = +k;
  if (Number.isInteger(lv) && lv >= 1 && lv <= MAX_LEVEL && Number.isInteger(v) && v >= 0 && v < 10000) bests[lv] = v;
}
const solvedTop = Object.keys(bests).reduce((m, k) => Math.max(m, +k + 1), 1);
top = clampLevel(Math.max(solvedTop, saved && Number.isInteger(saved.top) ? saved.top : 1));
// the level to play: the saved one, else the one of the saved game (a broken game is made again from its number)
const savedLevel = !saved ? 1 : Number.isInteger(saved.level) ? saved.level : saved.game && Number.isInteger(saved.game.level) ? saved.game.level : 1;
level = Math.min(clampLevel(savedLevel), top);
// contract: opened from the launcher (?menu) = show the home button
if (/[?&]menu(=|&|$)/.test(location.search)) $('#btnHome').hidden = false;
applyLook();
if (saved && validGame(saved.game)) {
  G = saved.game;
  if (G.level > top) top = G.level;
  build();
  // the level was changed in Settings and the page closed before returning: apply it now, as closing Settings would
  // (after a win the expected level is the next one, so only a real change in Settings starts another level)
  if (level !== (G.status === 'won' ? clampLevel(G.level + 1) : G.level)) newGame(level, inProgress() ? `Začala úroveň ${level}, rozehraná se ztratila` : `Úroveň ${level}`);
  else { if (S.lives !== G.lives && isFresh() && G.status === 'playing') G.lives = S.lives; render(); }
}
else newGame(level);

window.addEventListener('resize', layout);
